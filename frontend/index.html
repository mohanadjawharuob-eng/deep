<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Stratum — Institute of Archaeology</title>

    <!--
      Three faces, all SIL Open Font Licence, served from this machine.

      They were loaded from Google until a site-house test showed what that
      costs: with no upstream internet, the stylesheet request does not fail
      quickly — it hangs, and the page is blank for as long as it takes to
      time out. A platform meant to run on a laptop in a dig house cannot
      depend on a third party being reachable, and an institution hosting its
      own records should not announce every page view to one either.

      `display=swap` still shows the fallback immediately, which matters on
      the first load before the files are cached.

      Regenerate the files with scripts/fetch-fonts.sh.
    -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
