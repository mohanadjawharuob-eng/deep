<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Stratum — Institute of Archaeology</title>

    <!--
      Three faces, all SIL Open Font Licence, so they can be self-hosted the
      day this runs somewhere without outbound internet — which a site house
      often is. Served from Google for now; swapping to local files is a
      change to this block alone, because nothing else names a font file.

      `display=swap` shows the fallback immediately: an interface that is
      blank until a webfont arrives is an interface that looks broken on a
      slow connection.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300..800;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
