    if (!r.pocketId) return balanceOf(a);
    var pk = pocketById(a, r.pocketId);
    return pk ? pocketBalance(a, pk) : num(g.saved);
  }
  /* What a goal needs every month to land on its date. goalsBody() worked this
     out and threw it away, which is why nothing else in the app knew a goal
     existed. Extracted so the goals screen and the afford tool cannot drift
     apart, and so a projection can treat a promise as a commitment. */
  function goalNeed(g) {
    var left = Math.max(num(g.target) - goalSaved(g), 0);
    if (left <= 0.005) return { left: 0, need: 0, months: 0, done: true, overdue: false };
    if (!g.due) return { left: left, need: 0, months: null, done: false, overdue: false };
    var dLeft = daysUntil(g.due);
    if (dLeft < 0) return { left: left, need: left, months: 0, done: false, overdue: true };
    var months = Math.max(dLeft / 30.44, 0.5);
    return { left: left, need: left / months, months: months, done: false, overdue: false };
  }
  // Everything already put aside toward a goal, capped at its target: money
  // past the target is spare again.
  function goalsHeld() {
    return state.goals.reduce(function (t, g) {
      return t + Math.min(goalSaved(g), num(g.target));
    }, 0);
  }
  function goalsMonthlyNeed() {
    return state.goals.reduce(function (t, g) { return t + goalNeed(g).need; }, 0);
  }

  function goalHolderLabel(g) {
    if (!g.holdsIn) return null;
    var r = parseRef(g.holdsIn);
    return accountName(r.accountId, r.pocketId);
  }

  function accountById(id) {
    for (var i = 0; i < state.accounts.length; i++) if (state.accounts[i].id === id) return state.accounts[i];
    return null;
  }
  function accountName(id, pocketId) {
    if (!memo.accName) {
      memo.accName = {};
      state.accounts.forEach(function (a) {
        memo.accName[a.id] = a.name;
        pocketsOf(a).forEach(function (p) { memo.accName[a.id + "|" + p.id] = a.name + " \u203a " + p.name; });
      });
    }
    if (pocketId && memo.accName[id + "|" + pocketId]) return memo.accName[id + "|" + pocketId];
    var n = memo.accName[id];
    return n == null ? "(removed account)" : n;
  }

  /* Effect of one transaction on one account. Both sides are added rather
     than returned early: a transfer between two pockets of the SAME account
     touches it twice, and returning on the first match made balanceOf() debit
     it and never credit it back — while totalAssets(), which adds both,
     disagreed. Same account, same currency now nets to zero; across
     currencies it nets to the spread, which is exactly what it cost. */
  function effectOn(t, accId) {
    if (t.type === "transfer") {
      var e = 0;
      if (t.accountId === accId) e -= txBase(t);
      if (t.toAccountId === accId) e += txBaseIn(t);
      return e;
    }
    if (t.accountId !== accId) return 0;
    return t.type === "income" ? txBase(t) : -txBase(t);
  }

  function balanceOf(acc, onOrBefore) {
    var key = acc.id + "|" + (onOrBefore || "");
    if (memo.bal[key] != null) return memo.bal[key];
    // opening is stored in the account's OWN currency at the rate it was
    // opened at, while every transaction effect is already in base. Adding the
    // two raw was mixing units: a EUR account read its opening figure as
    // dollars, and disagreed with the same account inside totalAssets().
    var b = acctOpeningBase(acc);
    for (var i = 0; i < state.transactions.length; i++) {
      var t = state.transactions[i];
      if (onOrBefore && t.date > onOrBefore) continue;
      b += effectOn(t, acc.id);
    }
    memo.bal[key] = b;
    return b;
  }
  function totalAssets(onOrBefore) {
    var key = onOrBefore || "";
    if (memo.assets[key] != null) return memo.assets[key];
    // one pass over the ledger for every account at once
    var totals = {};
    state.accounts.forEach(function (a) { totals[a.id] = acctOpeningBase(a); });
    for (var i = 0; i < state.transactions.length; i++) {
      var t = state.transactions[i];
      if (onOrBefore && t.date > onOrBefore) continue;
      if (t.type === "transfer") {
        if (totals[t.accountId] != null) totals[t.accountId] -= txBase(t);
        if (totals[t.toAccountId] != null) totals[t.toAccountId] += txBaseIn(t);
      } else if (totals[t.accountId] != null) {
        totals[t.accountId] += (t.type === "income" ? 1 : -1) * txBase(t);
      }
    }
    // A holding is worth what it is worth, not what was paid for it. Swap the
    // derived cost for the mark that was current on the date being asked about.
    state.accounts.forEach(function (a) {
      if (!isInvestment(a)) return;
      var m = markAt(a, onOrBefore);
      if (m) totals[a.id] = toBase(num(m.value), m.currency, m.rate);
    });
    var sum = 0;
    Object.keys(totals).forEach(function (k) { sum += totals[k]; });
    memo.assets[key] = sum;
    return sum;
  }
  function totalDebt() {
    return state.debts.reduce(function (s, d) { return s + num(d.balance); }, 0);
  }
  // Grant money sits in the account but is not yours to count.
  function netWorth() { return totalAssets() - totalDebt() - restrictedTotal(); }

  function monthTx(mk) {
    if (memo.mtx[mk]) return memo.mtx[mk];
    var out = state.transactions.filter(function (t) { return monthOf(t.date) === mk; });
    memo.mtx[mk] = out;
    return out;
  }
  function sumOf(list, type) {
    return list.reduce(function (s, t) { return t.type === type ? s + txBase(t) : s; }, 0);
  }

  /* Money you laid out and expect back — a trip ticket, a work transport
     advance — leaves your account, so it belongs in the balance. It is not
     spending, so it does not belong in a burn rate or a category chart; left
     in, one reimbursable flight dominates a month and makes the runway look
     shorter than it is. It counts again as normal only if it is never settled.

     `refundable` marks it; `settledOn` records the day the money came back. */
  function isPending(t) { return !!t.refundable && !t.settledOn; }
  function pendingRefunds() {
    return state.transactions.filter(function (t) { return t.type === "expense" && isPending(t); });
  }
  function pendingRefundTotal() {
    return pendingRefunds().reduce(function (s, t) { return s + txBase(t); }, 0);
  }

  /* ---------------- grants ----------------
     Money that is in your account and is not yours. Every default in a
     personal-finance app is wrong for it: it would inflate net worth, wreck
     the burn rate, and eat the budgets you set for your own spending.

     The whole model is three exclusions and one pot:

       the pot     a pocket, forced to `committed`, so freeAssets() already
                   leaves it out of the runway with no new code at all
       net worth   the unspent balance is subtracted. Holding twenty thousand
                   of someone else's money does not make you richer by twenty
                   thousand — and the arithmetic proves the model: the grant
                   arriving adds to assets and to restricted in the same
                   breath, so net worth does not move; spending a thousand of
                   it takes a thousand off both, so net worth does not move;
                   overspending past it with your own money takes off assets
                   alone, and net worth falls. Which is exactly right.
       true burn   grant spending is out. Five thousand of grant-funded
                   equipment would otherwise report your runway as two months.
       budgets     grant spending is out of spendByCategory(), so a
                   grant-funded trip does not blow your own travel budget.

     Lines are a total for the whole award, not a monthly cap, which is why
     they cannot live in state.budgets. */
  function grants() { return state.grants || []; }
  function grantById(id) {
    var g = grants().filter(function (x) { return x.id === id; })[0];
    return g || null;
  }
  function isGrantSpend(t) { return !!t.grantId; }

  // What is left of one grant: what was put in, less what has been spent
  // against it. Read from the ledger, never stored.
  function grantSpent(g, lineId, onOrBefore) {
    var t = 0;
    state.transactions.forEach(function (x) {
      if (x.grantId !== g.id) return;
      if (x.grantAward) return;          // the award landing is not a spend
      if (lineId && x.grantLineId !== lineId) return;
      if (onOrBefore && x.date > onOrBefore) return;
      // a refund back into the grant reduces what has been spent
      t += x.type === "income" ? -txBase(x) : txBase(x);
    });
    return t;
  }
  function grantTotal(g) { return toBase(num(g.total), g.currency, g.rate); }
  function grantLeft(g, onOrBefore) { return grantTotal(g) - grantSpent(g, null, onOrBefore); }
  function grantLineAmount(g, line) { return toBase(num(line.amount), g.currency, g.rate); }

  // Grant money you are still holding. Clamped per grant: an overspent grant
  // is your problem, not a negative liability that flatters your net worth.
  function restrictedTotal(onOrBefore) {
    return grants().reduce(function (t, g) {
      if (g.closed) return t;
      // before it was awarded it restricted nothing
      if (onOrBefore && g.awardedOn && g.awardedOn > onOrBefore) return t;
      return t + Math.max(0, grantLeft(g, onOrBefore));
    }, 0);
  }

  function monthSummary(mk) {
    if (memo.msum[mk]) return memo.msum[mk];
    var tx = monthTx(mk);
    var income = sumOf(tx, "income");
    var expense = sumOf(tx, "expense");
    var pending = tx.reduce(function (s, t) {
      return t.type === "expense" && isPending(t) ? s + txBase(t) : s;
    }, 0);
    // A grant landing is not a month where you earned twenty thousand, and a
    // grant being spent is not a month where you overspent. Both sides come
    // out together, or the pair stops describing the same month.
    var grantIn = 0, grantOut = 0;
    tx.forEach(function (t) {
      if (!t.grantId) return;
      if (t.type === "income") grantIn += txBase(t);
      else if (t.type === "expense") grantOut += txBase(t);
    });
    var ownIncome = income - grantIn;
    var ownSpend = expense - pending - grantOut;
    var out = {
      mk: mk, income: ownIncome, expense: expense - grantOut, net: ownIncome - (expense - grantOut),
      // what the month actually cost you, once money you are owed back is out
      spend: ownSpend,
      pending: pending,
      grantIn: grantIn, grantOut: grantOut,
      // everything that moved, grants included, for anything that has to
      // reconcile against the account itself
      grossIncome: income, grossExpense: expense,
      rate: ownIncome > 0 ? (ownIncome - (expense - grantOut)) / ownIncome : null,
      count: tx.length
    };
    memo.msum[mk] = out;
    return out;
  }
  function spendByCategory(mk) {
    if (memo.cats[mk]) return memo.cats[mk];
    var out = {};
    monthTx(mk).forEach(function (t) {
      if (t.type !== "expense" || isPending(t)) return;
      // a grant-funded trip is not you overspending on travel
      if (isGrantSpend(t)) return;
      txParts(t).forEach(function (pt) {
        out[pt.category] = (out[pt.category] || 0) + pt.base;
      });
    });
    memo.cats[mk] = out;
    return out;
  }
  function catColor(cat) {
    var i = state.categories.expense.indexOf(cat);
    if (i < 0) i = state.categories.income.indexOf(cat);
    if (i < 0) i = 7;
    return "var(" + CAT_VARS[i % CAT_VARS.length] + ")";
  }

  function recentMonths(n, endMk) {
    var out = [], end = endMk || thisMonth();
    for (var i = n - 1; i >= 0; i--) out.push(monthShift(end, -i));
    return out;
  }

  // months that actually contain data, most recent first
  function monthsWithData() {
    var seen = {};
    state.transactions.forEach(function (t) { seen[monthOf(t.date)] = true; });
    return Object.keys(seen).sort().reverse();
  }

  function monthsBetween(a, b) {
    return (parseInt(b.slice(0, 4), 10) - parseInt(a.slice(0, 4), 10)) * 12 +
      (parseInt(b.slice(5, 7), 10) - parseInt(a.slice(5, 7), 10));
  }

  // A trailing window that stops at the first month holding data, so a young
  // ledger doesn't render a long flat run of months that never existed.
  function dataWindow(maxN, endMk) {
    var end = endMk || thisMonth();
    var all = monthsWithData();
    var earliest = all.length ? all[all.length - 1] : end;
    var span = monthsBetween(earliest, end) + 1;
    return recentMonths(clamp(span, 2, maxN), end);
  }

  /* ---------------- burn and runway ----------------

     "How much do I spend a month" has two honest answers and Coffer used to
     give only the loose one.

       total outflow  everything that left, one-offs and reimbursables and all
       true burn      what it costs to keep living, month after month

     For a salary the two barely differ. For contract income they differ a lot:
     one reimbursable flight or one furniture purchase lands in a single month
     and, averaged in, makes the runway look months shorter than it is. Runway
     is the number that matters most here, so it is built from true burn — and
     from money you can actually reach, which is why committed pockets come out
     of the numerator.

     Averaged over up to six months rather than one, because lumpy spending
     makes any single month a bad estimate of the next one.
     ------------------------------------------------- */

  var BURN_LOOKBACK = 6;

  // One-offs are real money but not a recurring cost. A month's true burn is
  // its spending less anything that will not repeat: refundables still owed,
  // and expenses far above what that category normally costs.
  function trueBurnFor(mk) {
    var tx = monthTx(mk);
    var burn = 0;
    tx.forEach(function (t) {
      if (t.type !== "expense") return;
      if (isPending(t)) return;            // owed back: not a cost yet
      if (t.oneOff) return;                // marked as a one-off by hand
      if (isGrantSpend(t)) return;         // someone else's money, on their errand
      burn += txBase(t);
    });
    return burn;
  }

  // The rolling average, over however many months actually have data, capped
  // at six. Months with nothing logged are skipped rather than counted as zero
  // spending, which would drag the average down and overstate the runway.
  function burnRate(lookback) {
    var months = recentMonths(lookback || BURN_LOOKBACK, monthShift(thisMonth(), -1));
    var withData = months.filter(function (mk) { return monthTx(mk).length > 0; });
    if (!withData.length) {
      var cur = trueBurnFor(thisMonth());
      return { rate: cur, months: cur > 0 ? 1 : 0, partial: true };
    }
    var total = withData.reduce(function (s, mk) { return s + trueBurnFor(mk); }, 0);
    return { rate: total / withData.length, months: withData.length, partial: withData.length < 3 };
  }

  // Months of survival at the current burn, from money that is actually free.
  function runway() {
    var b = burnRate();
    if (!(b.rate > 0)) return { months: null, burn: 0, free: freeAssets(), basis: b };
    return { months: freeAssets() / b.rate, burn: b.rate, free: freeAssets(), basis: b };
  }

  /* ---------------- the forward projection ----------------
     runway() above is a single division: free money over burn. It answers
     "how long at today's rate", which quietly assumes today repeats forever.
     For contract income with a known end date that is exactly the wrong
     assumption — the interesting month is the one after the contract stops.

     So: walk forward a month at a time, the way simulatePayoff already walks
     debts, and let each recurring line start and stop on its own dates.

     Two rules that are easy to get wrong and expensive to get wrong:

     1. The outgoing baseline is TRUE BURN, not burn plus recurring bills.
        Rent is already inside trueBurnFor() because it gets logged every
        month. Adding the recurring record on top would charge it twice. Only
        *changes* inside the horizon are applied — a bill that ends, one that
        starts later, a one-off on its own month.

     2. Income is never averaged from history. Averaging past contract income
        is the lie that makes freelance work look like a salary; a projection
        built on it is confident about money nobody has promised. Only
        scheduled recurring income counts, weighted by its confidence.
     ------------------------------------------------- */

  var PROJECT_MONTHS = 18;

  // How long one cycle of a recurring record is, in days. Used to tell a bill
  // that is already in the rhythm from one that genuinely starts later:
  // nextDate is the NEXT due date, so an active monthly bill always has one in
  // the future. Within a cycle means it is already running — and therefore
  // already inside the logged burn.
  var FREQ_DAYS = { weekly: 7, monthly: 31, yearly: 366, once: 0 };
  function startsLater(startsOn, frequency) {
    if (!startsOn) return false;
    var span = FREQ_DAYS[frequency] != null ? FREQ_DAYS[frequency] : 31;
    return daysUntil(startsOn) > span;
  }

  // applyPlan writes the recurring record with planKey but without confidence;
  // confidence lives on state.plan.lines only. Reading state.recurring alone
  // would treat a 40%-likely grant as certain money, so the join goes through
  // planKey. No plan line, or none with a confidence, means "as certain as
  // anything else here" — 100%.
  function confidenceOf(r) {
    if (!r || !r.planKey || !state.plan) return 1;
    var lines = state.plan.lines || [];
    for (var i = 0; i < lines.length; i++) {
      if (lines[i].key === r.planKey && lines[i].confidence != null) {
        return clamp(num(lines[i].confidence) / 100, 0, 1);
      }
    }
    return 1;
  }

  // Every recurring line the projection will touch, resolved once so the
  // toggles and the walk agree about what exists.
  function projectionLines() {
    return state.recurring.map(function (r) {
      var base = toBase(r.amount, r.currency, r.rate);
      return {
        id: r.id,
        name: r.name,
        type: r.type === "income" ? "income" : "expense",
        frequency: r.frequency,
        once: r.frequency === "once",
        startsOn: r.nextDate || null,
        until: r.until || null,
        base: base,
        monthly: monthlyEquivalent(base, r.frequency),
        confidence: r.type === "income" ? confidenceOf(r) : 1,
        renews: r.type === "income" && r.renews != null ? clamp(num(r.renews), 0, 100) : null
      };
    });
  }

  /* Walk forward from free money now.

       months   how far to look; 18 by default
       opts.off        ids of income lines switched off ("what if it doesn't renew")
       opts.extra      [{ mk, amount }] outflows to insert — how "can I afford it" asks
       opts.burnDelta  a standing change to monthly burn, positive or negative
                       (trimming a budget is a negative one)
       opts.holdGoals  set aside what your goals need each month, so the line
                       shows money left AFTER promises are kept

     Returns a point per month plus the first month the balance goes under,
     which is the number the whole screen is built around. */
  function projectForward(months, opts) {
    var o = opts || {};
    var off = o.off || {};
    var horizon = months || PROJECT_MONTHS;
    var b = burnRate();
    var baseBurn = Math.max(0, b.rate + num(o.burnDelta));
    var goalHold = o.holdGoals ? goalsMonthlyNeed() : 0;
    var lines = projectionLines();
    var hasSchedule = lines.some(function (L) { return L.type === "income"; });
    var extra = {};
    (o.extra || []).forEach(function (x) { extra[x.mk] = (extra[x.mk] || 0) + num(x.amount); });

    // Only recurring EXPENSES that change inside the horizon adjust the
    // baseline; a bill already running and still running is inside the burn.
    var start = thisMonth();
    var startDay = today();
    var points = [];
    var balance = freeAssets();
    var hasIncome = false;
    var crossing = null;

    for (var i = 1; i <= horizon; i++) {
      var mk = monthShift(start, i);
      var mkStart = mk + "-01", mkEnd = lastDayOf(mk);
      var income = 0, out = baseBurn;
      var events = [];

      lines.forEach(function (L) {
        var live = (!L.startsOn || L.startsOn <= mkEnd) && (!L.until || L.until >= mkStart);

        if (L.once) {
          // a lump sum belongs to exactly one month; monthlyEquivalent returns
          // 0 for "once" precisely so it cannot leak into the monthly path
          if (!L.startsOn || monthOf(L.startsOn) !== mk) return;
          if (L.type === "income") {
            if (off[L.id]) return;
            hasIncome = true;
            income += L.base * L.confidence;
            events.push({ kind: "lump", name: L.name, amount: L.base * L.confidence });
          } else {
            out += L.base;
            events.push({ kind: "spend", name: L.name, amount: L.base });
          }
          return;
        }

        if (L.type === "income") {
          if (!live) {
            // the month a contract stops paying is the one worth marking
            if (L.until && monthOf(L.until) === monthShift(mk, -1)) {
              events.push({ kind: "ended", name: L.name, renews: L.renews });
            }
            /* A contract with a stated chance of carrying on keeps paying at
               that fraction past its end date. Unset means UNSAID, not nought:
               nothing softens the cliff unless you say it should. */
            if (L.renews != null && L.renews > 0 && !off[L.id]) {
              hasIncome = true;
              income += L.monthly * L.confidence * (L.renews / 100);
            }
            return;
          }
          if (off[L.id]) return;
          hasIncome = true;
          income += L.monthly * L.confidence;
          return;
        }

        // an expense already running today is inside trueBurnFor(); only a
        // change relative to that baseline is applied
        var runningNow = !startsLater(L.startsOn, L.frequency) && (!L.until || L.until >= startDay);
        if (runningNow && !live) {
          out -= L.monthly;                       // it stops inside the horizon
          if (L.until && monthOf(L.until) === monthShift(mk, -1)) {
            events.push({ kind: "billEnded", name: L.name, amount: L.monthly });
          }
        } else if (!runningNow && live) {
          out += L.monthly;                       // it starts inside the horizon
          if (L.startsOn && monthOf(L.startsOn) === mk) {
            events.push({ kind: "billStarts", name: L.name, amount: L.monthly });
          }
        }
      });

      if (goalHold > 0) out += goalHold;
      if (out < 0) out = 0;
      if (extra[mk]) {
        out += extra[mk];
        events.push({ kind: "buy", amount: extra[mk] });
      }

      balance += income - out;
      if (crossing == null && balance < 0) crossing = mk;
      points.push({ mk: mk, balance: balance, income: income, out: out, events: events });
    }

    return {
      points: points,
      crossing: crossing,
      hasIncome: hasIncome,
      hasSchedule: hasSchedule,
      burn: baseBurn,
      goalHold: goalHold,
      start: freeAssets(),
      basis: b,
      horizon: horizon
    };
  }

  // How many months the money lasts, read off the projection rather than
  // divided out of it. Null means it does not run out inside the horizon.
  function projectedMonths(pr) {
    if (!pr.crossing) return null;
    for (var i = 0; i < pr.points.length; i++) {
      if (pr.points[i].mk === pr.crossing) return i;   // last month still above nought
    }
    return null;
  }

  // #14 — an income line that ends with nothing scheduled to replace it. This
  // is the month the runway starts drawing down, and it is worth knowing about
  // before you reach it.
  function incomeGaps() {
    var out = [];
    var ending = state.recurring.filter(function (r) {
      return r.type === "income" && r.until && r.until >= today();
    }).sort(function (a, b) { return a.until.localeCompare(b.until); });
    if (!ending.length) return out;

    ending.forEach(function (r) {
      var after = monthOf(r.until);
      // anything still paying in the month after this one ends
      var replacement = state.recurring.filter(function (x) {
        if (x.id === r.id || x.type !== "income") return false;
        if (x.until && x.until <= r.until) return false;
        if (x.frequency === "once") return x.nextDate && x.nextDate > r.until;
        return true;
      });
      out.push({
        name: r.name,
        until: r.until,
        days: daysUntil(r.until),
        monthly: monthlyEquivalent(toBase(r.amount, r.currency, r.rate), r.frequency),
        replaced: replacement.length > 0,
        replacedBy: replacement.map(function (x) { return x.name; })
      });
    });
    return out;
  }

  function avgMonthlyExpense(lookback) {
    var months = recentMonths(lookback || 3, monthShift(thisMonth(), -1));
    var withData = months.filter(function (mk) { return monthTx(mk).length > 0; });
    if (!withData.length) {
      // fall back to the current month so a brand-new ledger still says something
      var cur = monthSummary(thisMonth());
      return cur.expense > 0 ? cur.expense : 0;
    }
    return withData.reduce(function (s, mk) { return s + monthSummary(mk).expense; }, 0) / withData.length;
  }
  function avgMonthlySaving(lookback) {
    var months = recentMonths(lookback || 3, monthShift(thisMonth(), -1));
    var withData = months.filter(function (mk) { return monthTx(mk).length > 0; });
    if (!withData.length) return monthSummary(thisMonth()).net;
    return withData.reduce(function (s, mk) { return s + monthSummary(mk).net; }, 0) / withData.length;
  }

  function recurringMonthlyLoad() {
    var out = { expense: 0, income: 0 };
    activeRecurring().forEach(function (r) {
      out[r.type === "income" ? "income" : "expense"] +=
        monthlyEquivalent(toBase(r.amount, r.currency, r.rate), r.frequency);
    });
    return out;
  }

  /* ---------------- allowances inside an income ----------------
     Not every lira of a salary is yours to spend. A travel allowance paid at
     so much a day is money FOR travel: paying a taxi should draw that down
     first and only reach your own budget once it is gone.

     It resets every month and whatever is left simply becomes ordinary money,
     so there is no balance to store — the pot is derived from the days you
     went in, the way a budget is derived from a figure you set. What IS stored
     is the days, and the rate they were converted at, because a $5/day
     allowance in an LBP month must not re-value itself later. */
  function allowanceSources() {
    return state.recurring.filter(function (r) {
      return r.type === "income" && r.allowance && r.allowance.category && num(r.allowance.rate) > 0;
    });
  }
  function allowanceKey(r, mk) { return r.id + "|" + mk; }
  function allowanceDays(r, mk) {
    var e = (state.allowanceDays || {})[allowanceKey(r, mk)];
    return e && num(e.days) > 0 ? e : null;
  }
  // What one source put toward its category in one month.
  function allowanceFor(r, mk) {
    var e = allowanceDays(r, mk);
    if (!e) return 0;
    var cur = r.allowance.currency || baseCode();
    // the rate stored with the days, so a later rate change cannot move it
    var rt = num(e.rate) > 0 ? num(e.rate) : rateFor(cur);
    return toBase(num(e.days) * num(r.allowance.rate), cur, rt);
  }
  // Everything prepaid toward one category in one month, across every source.
  function allowancePotFor(category, mk) {
    return allowanceSources().reduce(function (t, r) {
      return r.allowance.category === category ? t + allowanceFor(r, mk) : t;
    }, 0);
  }
  // Months where a source has an allowance but nobody has said how many days.
  function allowancesAwaiting() {
    var out = [];
    allowanceSources().forEach(function (r) {
      [monthShift(thisMonth(), -1), thisMonth()].forEach(function (mk) {
        if (allowanceDays(r, mk)) return;
        // the current month is only worth asking about once it has ended,
        // or once that month's pay has actually landed
        if (mk === thisMonth()) {
          var landed = monthTx(mk).some(function (t) {
            return t.type === "income" && t.recurId === r.id;
          });
          if (!landed) return;
        }
        out.push({ source: r, mk: mk });
      });
    });
    return out;
  }

  function budgetRows(mk) {
    var spend = spendByCategory(mk);
    // a category can have an allowance and no budget of its own; the pot is
    // still worth showing, so it earns a row either way
    var cats = Object.keys(state.budgets);
    allowanceSources().forEach(function (r) {
      var c = r.allowance.category;
      if (cats.indexOf(c) < 0 && allowancePotFor(c, mk) > 0) cats.push(c);
    });
    return cats.map(function (cat) {
      var limit = num(state.budgets[cat]);
      var raw = spend[cat] || 0;
      var prepaid = allowancePotFor(cat, mk);
      var prepaidUsed = Math.min(raw, prepaid);
      // allowance first, then your own money: the whole point of the thing
      var spent = Math.max(0, raw - prepaid);
      return {
        category: cat, limit: limit, spent: spent, raw: raw,
        prepaid: prepaid, prepaidUsed: prepaidUsed,
        pct: limit > 0 ? spent / limit : 0, left: limit - spent
      };
    }).sort(function (a, b) { return b.pct - a.pct; });
  }

  // how far through the month we are (1 for any month already past)
  function monthProgress(mk) {
    var cur = thisMonth();
    if (mk < cur) return 1;
    if (mk > cur) return 0;
    return new Date().getDate() / daysInMonth(mk);
  }

  function upcomingBills(days) {
    return activeRecurring()
      .filter(function (r) { return daysUntil(r.nextDate) <= days; })
      .sort(function (a, b) { return a.nextDate.localeCompare(b.nextDate); });
  }

  /* ---------------- debt payoff simulation ---------------- */

  // Simulates month by month. `strategy`:
  //   minimum  — each debt gets only its own minimum; freed money is not reused
  //   avalanche — highest APR first, with freed minimums rolling forward
  //   snowball  — smallest balance first, with freed minimums rolling forward
  function simulatePayoff(strategy, extra) {
    var debts = state.debts.map(function (d) {
      return { name: d.name, bal: num(d.balance), rate: num(d.rate) / 100 / 12, min: num(d.minPayment) };
    }).filter(function (d) { return d.bal > 0.005; });

    if (!debts.length) return { months: 0, interest: 0, order: [], priority: [], stalled: false };

    // Where spare money goes, in order. This is the strategy's actual
    // instruction, and is NOT the same as the order debts finish in — a small
    // debt can clear first on its minimum alone while the extra goes elsewhere.
    var priority = debts.slice().sort(strategy === "snowball"
      ? function (a, b) { return (a.bal - b.bal) || (b.rate - a.rate); }
      : function (a, b) { return (b.rate - a.rate) || (a.bal - b.bal); }
    ).map(function (d) { return d.name; });

    var baseBudget = debts.reduce(function (s, d) { return s + d.min; }, 0) + (strategy === "minimum" ? 0 : num(extra));
    var interest = 0, months = 0, order = [], LIMIT = 720;

    while (months < LIMIT) {
      var active = debts.filter(function (d) { return d.bal > 0.005; });
      if (!active.length) break;
      months++;

      active.forEach(function (d) {
        var i = d.bal * d.rate;
        d.bal += i;
        interest += i;
      });

      // minimum-only never reallocates a freed payment
      var budget = strategy === "minimum"
        ? active.reduce(function (s, d) { return s + d.min; }, 0)
        : baseBudget;

      active.forEach(function (d) {
        var pay = Math.min(d.min, d.bal, budget);
        if (pay > 0) { d.bal -= pay; budget -= pay; }
      });

      if (strategy !== "minimum" && budget > 0.005) {
        var queue = debts.filter(function (d) { return d.bal > 0.005; });
        queue.sort(strategy === "avalanche"
          ? function (a, b) { return (b.rate - a.rate) || (a.bal - b.bal); }
          : function (a, b) { return (a.bal - b.bal) || (b.rate - a.rate); });
        for (var i = 0; i < queue.length && budget > 0.005; i++) {
          var pay2 = Math.min(queue[i].bal, budget);
          queue[i].bal -= pay2;
          budget -= pay2;
        }
      }

      active.forEach(function (d) {
        if (d.bal <= 0.005 && order.indexOf(d.name) === -1) order.push(d.name);
      });
    }

    var stalled = debts.some(function (d) { return d.bal > 0.005; });
    return {
      months: stalled ? null : months,
      interest: stalled ? null : interest,
      order: order, priority: priority, stalled: stalled
    };
  }

  function humanMonths(m) {
    if (m == null) return "never";
    if (m === 0) return "paid off";
    var y = Math.floor(m / 12), r = m % 12;
    if (!y) return r + (r === 1 ? " month" : " months");
    if (!r) return y + (y === 1 ? " year" : " years");
    return y + "y " + r + "mo";
  }

  /* ============================================================
     Modal, confirm and toast — replacing the native dialogs,
     which are blocked in a sandboxed frame.
     ============================================================ */

  // Sentinel for the "add one" row in a category dropdown. Plain printable
  // text only — a NUL byte is invalid in an HTML attribute and the browser
  // mangles it, so the option would never match on the way back.
  var NEW_CAT = "::add-new-category::";

  var overlay = document.getElementById("overlay");
  var escHandler = null;

  function closeModal() {
    overlay.innerHTML = "";
    if (escHandler) { document.removeEventListener("keydown", escHandler); escHandler = null; }
  }

  // fields: [{key,label,type,value,options,placeholder,step,hint,span}]
  function openModal(opts) {
    closeModal();
    var fields = opts.fields || [];

    var html = '<div class="scrim" data-scrim="1"><div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(opts.title) + '">' +
      '<div class="modal-head"><h3>' + esc(opts.title) + "</h3>" +
      (opts.message ? "<p>" + opts.message + "</p>" : "") + "</div>";

    if (fields.length) {
      html += '<div class="modal-body"><div class="fields">' + fields.map(function (f) {
        var id = "mf_" + f.key;
        var inner;
        if (f.type === "select") {
          inner = '<select id="' + id + '">' + (f.options || []).map(function (o) {
            // a grouped entry: an account and the pockets inside it
            if (o && o.group) {
              return '<optgroup label="' + esc(o.group) + '">' + (o.options || []).map(function (g) {
                return '<option value="' + esc(g.value) + '"' +
                  (String(g.value) === String(f.value) ? " selected" : "") + ">" + esc(g.label) + "</option>";
              }).join("") + "</optgroup>";
            }
            var val = typeof o === "string" ? o : o.value;
            var lab = typeof o === "string" ? o : o.label;
            return '<option value="' + esc(val) + '"' + (String(val) === String(f.value) ? " selected" : "") + ">" + esc(lab) + "</option>";
          }).join("") +
            // let the list grow instead of being stuck with the ones I picked
            (f.catKind ? '<option value="' + NEW_CAT + '">\uFF0B ' + esc(f.newLabel || "New category\u2026") + "</option>" : "") +
            "</select>" +
            (f.catKind
              ? '<input id="' + id + '_new" type="text" placeholder="' + esc(f.newPlaceholder || "Name it, e.g. Childcare") + '" ' +
                'autocomplete="off" aria-label="' + esc(f.newLabel || "New category name") + '" style="display:none;margin-top:0.4rem" />'
              : "");
        } else if (f.type === "check") {
          return '<div class="field' + (f.span ? " wide" : "") + '">' +
            '<label class="checkline"><input id="' + id + '" type="checkbox"' + (f.value ? " checked" : "") + " />" +
            "<span>" + esc(f.label) + "</span></label>" +
            '<span class="hint" id="' + id + '_hint"' + (f.hint ? "" : ' hidden') + ">" +
            esc(f.hint || "") + "</span></div>";
        } else {
          inner = '<input id="' + id + '" type="' + (f.type || "text") + '"' +
            ' value="' + esc(f.value == null ? "" : f.value) + '"' +
            (f.placeholder ? ' placeholder="' + esc(f.placeholder) + '"' : "") +
            (f.type === "number" ? ' step="' + (f.step || "0.01") + '"' : "") +
            (f.type === "number" && f.min != null ? ' min="' + f.min + '"' : "") +
            ' autocomplete="off" />';
        }
        return '<div class="field' + (f.span ? " wide" : "") + '">' +
          '<label class="label" for="' + id + '">' + esc(f.label) + "</label>" + inner +
          '<span class="hint" id="' + id + '_hint"' + (f.hint ? "" : ' hidden') + ">" +
          esc(f.hint || "") + "</span></div>";
      }).join("") + "</div></div>";
    }

    html += '<div class="modal-foot">' +
      '<button class="btn quiet" data-mclose="1">' + esc(opts.cancelLabel || "Cancel") + "</button>" +
      '<button class="btn ' + (opts.danger ? "danger" : "primary") + '" data-mok="1">' + esc(opts.confirmLabel || "Save") + "</button>" +
      "</div></div></div>";

    overlay.innerHTML = html;

    function collect() {
      var out = {};
      out.__newCats = [];
      fields.forEach(function (f) {
        var el = document.getElementById("mf_" + f.key);
        if (f.catKind && el.value === NEW_CAT) {
          var box = document.getElementById("mf_" + f.key + "_new");
          var typed = (box ? box.value : "").trim();
          out[f.key] = typed;
          out.__newCats.push({ key: f.key, kind: f.catKind, name: typed });
        } else if (f.type === "check") {
          out[f.key] = !!el.checked;
        } else {
          out[f.key] = f.type === "number" ? num(el.value) : el.value;
        }
      });
      return out;
    }

    function accept() {
      var vals = collect();

      // Whether a new name belongs to expenses or income is only knowable
      // once the type field has been read, hence kind "auto".
      var i, nc;
      for (i = 0; i < vals.__newCats.length; i++) {
        nc = vals.__newCats[i];
        if (nc.kind === "free") {
          if (!nc.name) { toast("Type a name first."); return; }
          nc.added = false;   // nothing to register; the typed value is the value
          continue;
        }
        nc.kind = nc.kind === "auto" ? (vals.type === "income" ? "income" : "expense") : nc.kind;
        if (!nc.name) { toast("Type a name for the new category."); return; }
        // typing one that already exists just picks it, rather than duplicating
        var clash = state.categories[nc.kind].filter(function (c) {
          return c.toLowerCase() === nc.name.toLowerCase();
        })[0];
        if (clash) { vals[nc.key] = clash; nc.added = false; }
        else { nc.added = true; }
      }

      if (opts.validate) {
        var problem = opts.validate(vals);
        if (problem) { toast(problem); return; }
      }

      var addedAny = false;
      for (i = 0; i < vals.__newCats.length; i++) {
        nc = vals.__newCats[i];
        if (nc.added) { state.categories[nc.kind].push(nc.name); addedAny = true; }
      }
      if (addedAny) save();

      closeModal();
      if (opts.onConfirm) opts.onConfirm(vals);
      for (i = 0; i < vals.__newCats.length; i++) {
        nc = vals.__newCats[i];
        if (nc.added) toast("\u201C" + nc.name + "\u201D added to your " + nc.kind + " categories.");
      }
    }

    overlay.querySelector("[data-mok]").addEventListener("click", accept);
    overlay.querySelector("[data-mclose]").addEventListener("click", function () {
      closeModal();
      if (opts.onCancel) opts.onCancel();
    });
    overlay.querySelector("[data-scrim]").addEventListener("mousedown", function (e) {
      if (e.target === e.currentTarget) { closeModal(); if (opts.onCancel) opts.onCancel(); }
    });
    overlay.querySelectorAll(".modal input").forEach(function (inp) {
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); accept(); } });
    });
    fields.forEach(function (f) {
      if (!f.catKind) return;
      var sel = document.getElementById("mf_" + f.key);
      var box = document.getElementById("mf_" + f.key + "_new");
      if (!sel || !box) return;
      sel.addEventListener("change", function () {
        var isNew = sel.value === NEW_CAT;
        box.style.display = isNew ? "" : "none";
        if (isNew) box.focus();
      });
    });

    /* A field can react to another one changing. The rate dialog uses it to
       fill in a suggested rate the moment you pick a currency; the transfer
       dialog uses it to restate the rate you are actually getting as you type,
       which only works if it fires on every keystroke and not on blur. */
    function fieldEl(k) { return document.getElementById("mf_" + k); }
    function setHint(k, text) {
      var h = document.getElementById("mf_" + k + "_hint");
      if (!h) return;
      h.textContent = text || "";
      h.hidden = !text;
    }
    fields.forEach(function (f) {
      if (typeof f.onChange !== "function") return;
      var el = fieldEl(f.key);
      if (!el) return;
      var fire = function () { f.onChange(el.value, fieldEl, setHint); };
      el.addEventListener("change", fire);
      if (f.type !== "select") el.addEventListener("input", fire);
    });
    if (typeof opts.onReady === "function") opts.onReady(fieldEl, setHint);

    escHandler = function (e) {
      if (e.key === "Escape") { closeModal(); if (opts.onCancel) opts.onCancel(); }
    };
    document.addEventListener("keydown", escHandler);

    var first = overlay.querySelector(".modal input, .modal select");
    if (first) first.focus(); else overlay.querySelector("[data-mok]").focus();
  }

  function confirmAction(opts, onYes) {
    openModal({
      title: opts.title,
      message: opts.message,
      confirmLabel: opts.confirmLabel || "Delete",
      cancelLabel: "Keep it",
      danger: opts.danger !== false,
      onConfirm: onYes
    });
  }

  var toastTimers = [];
  function toast(msg, undo) {
    var box = document.getElementById("toasts");
    var el = document.createElement("div");
    el.className = "toast";
    el.innerHTML = "<span>" + esc(msg) + "</span>";
    if (undo) {
      var b = document.createElement("button");
      b.textContent = "Undo";
      b.addEventListener("click", function () {
        undo();
        remove();
        save();
        render();
      });
      el.appendChild(b);
    }
    function remove() {
      if (el.parentNode) el.parentNode.removeChild(el);
    }
    box.appendChild(el);
    // keep the stack short — more than three at once is just noise, and it
    // gets unclear which Undo belongs to what
    while (box.children.length > 3) box.removeChild(box.firstChild);
    var t = setTimeout(remove, undo ? 7000 : 3800);
    toastTimers.push(t);
    if (toastTimers.length > 6) clearTimeout(toastTimers.shift());
  }

  /* ============================================================
     Plain-text entry.

     Turns a line like "10$ potato" or "taxi 8 yesterday" into a
     transaction: amount, date, account, description and a guessed
     category. The guess is always shown before anything is saved, and
     every field stays editable — the parser proposes, you confirm.

     Category guessing has two sources, checked in this order:
       1. what YOU have filed similar wording under before
       2. a built-in keyword list
     So it gets more accurate the more you use it.
     ============================================================ */

  var CUR_SYMBOLS = "$€£¥₹₩₪₺";
  var STOPWORDS = {
    on: 1, at: 1, for: 1, the: 1, a: 1, an: 1, to: 1, from: 1, my: 1, and: 1,
    of: 1, in: 1, with: 1, paid: 1, pay: 1, payment: 1, bought: 1, buy: 1,
    got: 1, spent: 1, some: 1, new: 1, this: 1, that: 1, was: 1, were: 1
  };

  var EXPENSE_HINTS = [
    ["Groceries", ["grocer", "groceries", "supermarket", "market", "tesco", "aldi", "lidl", "sainsbury", "asda",
      "walmart", "kroger", "costco", "trader", "potato", "potatoes", "bread", "milk", "eggs", "cheese", "veg",
      "vegetables", "fruit", "apples", "bananas", "meat", "chicken", "rice", "pasta", "flour", "sugar", "onion",
      "tomato", "tomatoes", "shop", "shopping list", "bigshop"]],
    ["Transport", ["taxi", "cab", "uber", "lyft", "bolt", "grab", "didi", "ola", "ride", "fare", "bus", "train",
      "metro", "tube", "subway", "tram", "ferry", "fuel", "petrol", "diesel", "gasoline", "parking", "toll",
      "flight", "airline", "airfare", "mot", "tyres", "tires", "carwash", "scooter", "bike"]],
    ["Dining & Fun", ["coffee", "cafe", "café", "espresso", "latte", "restaurant", "dinner", "lunch", "brunch",
      "breakfast", "pizza", "burger", "sushi", "kebab", "noodles", "takeaway", "takeout", "deliveroo", "ubereats",
      "justeat", "doordash", "beer", "wine", "pub", "bar", "drinks", "cocktail", "cinema", "movie", "theatre",
      "concert", "netflix", "spotify", "disney", "hulu", "game", "games", "steam", "snack", "snacks", "dessert",
      "icecream", "cake", "chocolate", "bowling", "museum"]],
    ["Housing", ["rent", "mortgage", "council", "landlord", "deposit", "service charge", "furniture", "ikea",
      "repair", "plumber", "electrician", "cleaner", "mattress", "sofa", "paint"]],
    ["Utilities", ["electric", "electricity", "power bill", "water", "sewage", "internet", "broadband", "wifi",
      "phone", "mobile", "sim", "airtime", "data", "heating", "energy", "utility", "bill"]],
    ["Health", ["pharmacy", "chemist", "doctor", "dentist", "dental", "gym", "fitness", "medicine", "meds",
      "prescription", "optician", "glasses", "hospital", "clinic", "therapy", "vitamins", "physio", "insurance"]],
    ["Shopping", ["clothes", "clothing", "shirt", "tshirt", "jeans", "jacket", "coat", "dress", "shoes",
      "trainers", "sneakers", "amazon", "ebay", "electronics", "headphones", "charger", "laptop", "monitor",
      "keyboard", "phone case", "book", "books", "toy", "gift", "present", "flowers", "haircut", "salon"]]
  ];

  var INCOME_HINTS = [
    ["Salary", ["salary", "wage", "wages", "payroll", "paycheck", "payslip"]],
    ["Freelance", ["freelance", "invoice", "client", "contract", "gig", "commission"]],
    ["Investment", ["dividend", "dividends", "interest", "yield", "coupon"]],
    ["Gift", ["gift", "present", "birthday"]]
  ];

  var INCOME_MARKERS = ["salary", "wage", "wages", "payroll", "paycheck", "payslip", "refund", "refunded",
    "reimburse", "reimbursed", "income", "bonus", "dividend", "interest", "invoice", "freelance", "cashback",
    "rebate", "sold", "earned", "received"];

  var WEEKDAYS = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
  var MONTHS = ["january", "february", "march", "april", "may", "june", "july",
    "august", "september", "october", "november", "december"];

  // token -> category, learned from the user's own filing history
  function learnedCategories() {
    if (memo.learned) return memo.learned;
    var counts = {};
    state.transactions.forEach(function (t) {
      // a split entry has no one category to teach, so it teaches none
      if (t.type === "transfer" || !t.category || isSplit(t)) return;
      tokenize(t.desc).forEach(function (tok) {
        counts[tok] = counts[tok] || {};
        counts[tok][t.category] = (counts[tok][t.category] || 0) + 1;
      });
    });
    var best = {};
    Object.keys(counts).forEach(function (tok) {
      var top = null, topN = 0;
      Object.keys(counts[tok]).forEach(function (cat) {
        if (counts[tok][cat] > topN) { topN = counts[tok][cat]; top = cat; }
      });
      if (top) best[tok] = { category: top, hits: topN };
    });
    memo.learned = best;
    return best;
  }

  function tokenize(s) {
    return String(s || "").toLowerCase()
      .replace(/[^a-z0-9àâäéèêëîïôöùûüçñ\s]/g, " ")
      .split(/\s+/)
      .filter(function (w) { return w.length >= 3 && !STOPWORDS[w]; });
  }

  // Map a built-in canonical name onto whatever the user actually calls it.
  function resolveCategory(canonical, type) {
    var list = state.categories[type === "income" ? "income" : "expense"];
    for (var i = 0; i < list.length; i++) {
      if (list[i].toLowerCase() === String(canonical).toLowerCase()) return list[i];
    }
    // a renamed list still gets a sensible home
    for (var j = 0; j < list.length; j++) {
      if (/other/i.test(list[j])) return list[j];
    }
    return list[0];
  }

  function guessCategory(desc, type) {
    var toks = tokenize(desc);
    if (!toks.length) return { category: resolveCategory("Other", type), why: null };

    // 1. the user's own history wins
    var learned = learnedCategories();
    var valid = state.categories[type === "income" ? "income" : "expense"];
    var bestLearned = null;
    toks.forEach(function (tok) {
      var hit = learned[tok];
      if (!hit || valid.indexOf(hit.category) === -1) return;
      if (!bestLearned || hit.hits > bestLearned.hits) bestLearned = { category: hit.category, hits: hit.hits, tok: tok };
    });
    if (bestLearned) return { category: bestLearned.category, why: "you filed “" + bestLearned.tok + "” here before" };

    // 2. built-in keywords
    var hints = type === "income" ? INCOME_HINTS : EXPENSE_HINTS;
    var low = " " + String(desc).toLowerCase() + " ";
    for (var i = 0; i < hints.length; i++) {
      var words = hints[i][1];
      for (var j = 0; j < words.length; j++) {
        var w = words[j];
        if (toks.indexOf(w) >= 0 || (w.indexOf(" ") >= 0 && low.indexOf(w) >= 0) ||
            toks.some(function (t) { return t.length > 4 && t.indexOf(w) === 0; })) {
          return { category: resolveCategory(hints[i][0], type), why: "matched “" + w + "”" };
        }
      }
    }
    return { category: resolveCategory("Other", type), why: null };
  }

  // "1,234.56" / "1.234,56" / "12,50" / "10"
  function toNumber(raw) {
    var s = String(raw).replace(/\s/g, "");
    var hasDot = s.indexOf(".") >= 0, hasComma = s.indexOf(",") >= 0;
    if (hasDot && hasComma) {
      // whichever comes last is the decimal separator
      s = s.lastIndexOf(",") > s.lastIndexOf(".")
        ? s.replace(/\./g, "").replace(",", ".")
        : s.replace(/,/g, "");
    } else if (hasComma) {
      var after = s.split(",").pop();
      s = (s.split(",").length === 2 && after.length <= 2) ? s.replace(",", ".") : s.replace(/,/g, "");
    }
    var n = parseFloat(s);
    return isFinite(n) ? n : null;
  }

  function pad2(n) { return String(n).padStart(2, "0"); }

  // Pull a date phrase out of the text; returns {date, rest} (date may be null).
  function extractDate(text) {
    var t = " " + text + " ";
    var now = new Date();

    function found(d, re) {
      return { date: iso(d), rest: t.replace(re, " ").trim() };
    }

    var m;
    if ((m = t.match(/\s(today|tdy)\s/i))) return found(now, m[0].slice(0, -1));
    if ((m = t.match(/\s(yesterday|yest|ytd)\s/i))) {
      var y = new Date(); y.setDate(y.getDate() - 1);
      return found(y, m[0].slice(0, -1));
    }
    if ((m = t.match(/\s(\d{1,3})\s*(?:days?|d)\s+ago\s/i))) {
      var d1 = new Date(); d1.setDate(d1.getDate() - parseInt(m[1], 10));
      return found(d1, m[0].slice(0, -1));
    }
    if ((m = t.match(/\s(\d{4})-(\d{2})-(\d{2})\s/))) {
      return { date: m[1] + "-" + m[2] + "-" + m[3], rest: t.replace(m[0].slice(0, -1), " ").trim() };
    }
    // 3/8 or 3/8/26 (day first)
    if ((m = t.match(/\s(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{2,4}))?\s/))) {
      var dd = parseInt(m[1], 10), mm = parseInt(m[2], 10);
      var yy = m[3] ? parseInt(m[3].length === 2 ? "20" + m[3] : m[3], 10) : now.getFullYear();
      if (dd >= 1 && dd <= 31 && mm >= 1 && mm <= 12) {
        var cand = new Date(yy, mm - 1, dd);
        if (!m[3] && cand > now) cand.setFullYear(yy - 1);
        return found(cand, m[0].slice(0, -1));
      }
    }
    // "3 aug" / "aug 3"
    var monthNames = MONTHS.map(function (x) { return x.slice(0, 3); }).join("|");
    if ((m = t.match(new RegExp("\\s(\\d{1,2})\\s+(" + monthNames + ")[a-z]*\\s", "i"))) ||
        (m = t.match(new RegExp("\\s(" + monthNames + ")[a-z]*\\s+(\\d{1,2})\\s", "i")))) {
      var isDayFirst = /^\d/.test(m[1]);
      var day = parseInt(isDayFirst ? m[1] : m[2], 10);
      var mon = MONTHS.map(function (x) { return x.slice(0, 3); })
        .indexOf((isDayFirst ? m[2] : m[1]).slice(0, 3).toLowerCase());
      if (mon >= 0 && day >= 1 && day <= 31) {
        var c2 = new Date(now.getFullYear(), mon, day);
        if (c2 > now) c2.setFullYear(now.getFullYear() - 1);
        return found(c2, m[0].slice(0, -1));
      }
    }
    // "friday" / "last friday" -> most recent past occurrence
    for (var i = 0; i < WEEKDAYS.length; i++) {
      var re = new RegExp("\\s(?:last\\s+)?(" + WEEKDAYS[i] + "|" + WEEKDAYS[i].slice(0, 3) + ")\\s", "i");
      if ((m = t.match(re))) {
        var d2 = new Date();
        var delta = (d2.getDay() - i + 7) % 7 || 7;
        d2.setDate(d2.getDate() - delta);
        return found(d2, m[0].slice(0, -1));
      }
    }
    return { date: null, rest: text.trim() };
  }

  function extractAmount(text) {
    var reSym = new RegExp("(?:^|\\s)(?:([" + CUR_SYMBOLS + "])\\s?([0-9][0-9.,]*)|([0-9][0-9.,]*)\\s?([" + CUR_SYMBOLS + "]))(?=\\s|$)", "i");
    var m = text.match(reSym);
    if (m) {
      return { amount: toNumber(m[2] || m[3]), rest: text.replace(m[0], " ").trim(), explicit: true };
    }
    // no symbol: collect bare numbers and pick the most price-like
    var re = /(?:^|\s)([0-9][0-9.,]*)(?=\s|$)/g, all = [], mm;
    while ((mm = re.exec(text)) !== null) all.push({ raw: mm[1], full: mm[0], idx: mm.index });
    if (!all.length) return { amount: null, rest: text.trim(), explicit: false };
    var withDec = all.filter(function (x) { return /[.,]\d{1,2}$/.test(x.raw); });
    var pick = withDec.length ? withDec[withDec.length - 1] : all[all.length - 1];
    return { amount: toNumber(pick.raw), rest: text.replace(pick.full, " ").trim(), explicit: false };
  }

  function extractAccount(text) {
    var words = text.toLowerCase();
    var best = null;
    state.accounts.forEach(function (a) {
      var name = a.name.toLowerCase();
      var re = new RegExp("(?:^|\\s)" + name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?=\\s|$)", "i");
      if (re.test(" " + words + " ") && (!best || name.length > best.name.length)) {
        best = { id: a.id, name: name, re: re };
      }
    });
    if (best) return { accountId: best.id, rest: text.replace(best.re, " ").trim() };

    // common shorthand
    var shorthand = [["cash", /(?:^|\s)cash(?=\s|$)/i], ["credit card", /(?:^|\s)(?:card|credit)(?=\s|$)/i]];
    for (var i = 0; i < shorthand.length; i++) {
      if (shorthand[i][1].test(text)) {
        var match = null;
        state.accounts.forEach(function (a) {
          if (a.name.toLowerCase().indexOf(shorthand[i][0]) >= 0 || a.type.toLowerCase() === shorthand[i][0]) match = a;
        });
        if (match) return { accountId: match.id, rest: text.replace(shorthand[i][1], " ").trim() };
      }
    }
    return { accountId: null, rest: text.trim() };
  }

  function tidyDesc(s) {
    return s.replace(/\s+/g, " ")
      .replace(/^[\s\-+·,;:.]+|[\s\-+·,;:.]+$/g, "")
      .replace(/^(?:on|at|for|from|to|in|of|with)\s+/i, "")
      .replace(/\s+(?:on|at|for|from|to|in|of|with)$/i, "")
      .trim();
  }

  // The whole pipeline. Returns null when there's nothing usable yet.

  /* ============================================================
     Financial plans

     A plan is what you meant to do. The app already records what you
     actually did, so the only new idea here is keeping the intention
     next to the outcome and scoring one against the other.

     The parsing rule throughout: be strict wherever a mistake would
     cost money, and forgiving only where it cannot. A parser that
     guesses at a currency or an account and gets it wrong is worse
     than one that refuses and says why — so every guess is either
     shown in the preview before it is applied, or is not made.
     ============================================================ */

  var PLAN_VERSION = 1;

  var PLAN_SECTIONS = {
    budget: "budgets", budgets: "budgets",
    income: "income", incomes: "income", earnings: "income",
    commitment: "commitments", commitments: "commitments",
    bill: "commitments", bills: "commitments", expense: "commitments", expenses: "commitments",
    goal: "goals", goals: "goals",
    grant: "grants", grants: "grants", fund: "grants", funds: "grants"
  };
  var PLAN_SECTION_LABEL = {
    budgets: "Budgets", income: "Income", commitments: "Commitments", goals: "Goals",
    grants: "Grants"
  };
  // Everywhere the plan walks its own sections. Grants are last because a
  // grant's lines need the grant to exist first.
  var PLAN_SECTION_ORDER = ["budgets", "income", "commitments", "goals", "grants"];

  // Anything that is a real frequency but not one Coffer keeps. Naming them
  // beats "unknown frequency", because the user wrote something reasonable.
  var FREQ_ALIAS = { annually: "yearly", annual: "yearly", yearly: "yearly", monthly: "monthly", weekly: "weekly" };
  var FREQ_UNSUPPORTED = ["fortnightly", "biweekly", "quarterly", "daily", "hourly", "bimonthly"];

  function planSlug(s) {
    return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  }
  function planKeyFor(section, name) { return section + "|" + planSlug(name); }

  function isIsoDate(s) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    var d = new Date(s + "T00:00:00");
    return !isNaN(d.getTime()) && iso(d) === s;
  }

  /* ---- syntax: one written line to raw fields, no state consulted ---- */

  function planLineToRaw(text, lineNo) {
    var raw = { line: lineNo, text: text, section: null };
    var body = text.replace(/^\s*[-*•]\s*/, "").trim();

    var colon = body.indexOf(":");
    if (colon < 0) {
      raw.problem = "Write it as “Name: amount” — there is no colon on this line.";
      return raw;
    }
    raw.name = body.slice(0, colon).trim();
    var rest = " " + body.slice(colon + 1).trim() + " ";
    if (!raw.name) { raw.problem = "This line has no name before the colon."; return raw; }

    // 0. the terminal date, taken first so its date is gone before anything
    //    else runs. PLAN-FORMAT.md has documented "until 2027-03-31" since
    //    income end dates shipped and it never parsed: left in, the account
    //    matcher ran on " into Wallet until 2027-03-31 " and took the whole
    //    tail as the account name.
    var un = rest.match(/\s(?:until|till|thru|through|ending|ends)\s+(\d{4}-\d{2}-\d{2})(?=[\s,]|$)/i);
    if (un) { raw.until = un[1]; rest = rest.replace(un[0], " "); }
    else {
      var unWordy = rest.match(/\s(?:until|till|through|ending|ends)\s+([^,]+)/i);
      if (unWordy) {
        raw.problem = "\u201c" + unWordy[1].trim() + "\u201d is not an end date I can read. Write it as 2027-03-31.";
        return raw;
      }
    }

    /* 0b. renewal chance, taken BEFORE confidence: "renews 60%" and the
        confidence form "at 40%" are both a number and a percent sign, and
        whichever runs first wins. These mean different things — one is whether
        each payment lands, the other is whether the contract carries on — so
        reading one as the other would be silently wrong. */
    var rn = rest.match(/\srenews?\s+(?:at\s+)?(\d{1,3})\s*%/i);
    if (rn) { raw.renews = Math.min(100, parseInt(rn[1], 10)); rest = rest.replace(rn[0], " "); }

    // 0c. an allowance inside the pay: "plus 5 USD a day for Transport".
    //     Taken before the amount, or its figure would be read as the amount.
    var aw = rest.match(/\splus\s+([\d.,]+)\s*([A-Za-z]{3})?\s*(?:a|per|\/)\s*day\s+for\s+([^,]+?)\s*(?=,|$)/i);
    if (aw) {
      raw.allowRate = aw[1];
      raw.allowCur = aw[2] ? aw[2].toUpperCase() : null;
      raw.allowCat = aw[3].trim();
      rest = rest.replace(aw[0], " ");
    }

    // 1. date. "from" introduces both a date and an account, so it only counts
    //    as a date when an actual date follows it.
    var dm = rest.match(/\s(?:by|from|on|next|starting|due)\s+(\d{4}-\d{2}-\d{2})(?=[\s,]|$)/i);
    if (dm) { raw.date = dm[1]; rest = rest.replace(dm[0], " "); }
    else {
      var bare = rest.match(/\s(\d{4}-\d{2}-\d{2})(?=[\s,]|$)/);
      if (bare) { raw.date = bare[1]; rest = rest.replace(bare[0], " "); }
    }
    // A written-out date is the single most likely way to be silently wrong,
    // so it is caught and named rather than ignored as noise.
    var wordy = rest.match(/\s(?:by|due|starting)\s+((?:next\s+)?[A-Za-z]{3,}[^,]*)/i);
    if (!raw.date && wordy) {
      raw.problem = "“" + wordy[1].trim() + "” is not a date I can read. Write it as 2027-02-28.";
      return raw;
    }

    // 1b. confidence — "at 50%", "50% likely", "(50%)". Income you might get
    //     and income you will get can then live in one file instead of forcing
    //     a second near-identical plan kept in sync by hand.
    var pm = rest.match(/\s\(?(?:at\s+)?(\d{1,3})\s*%\s*(?:likely|confident|confidence|chance)?\)?\s/i);
    if (pm) { raw.confidence = Math.min(100, parseInt(pm[1], 10)); rest = rest.replace(pm[0], " "); }

    // 2. frequency
    var fm = rest.match(/\s(annually|annual|yearly|monthly|weekly|fortnightly|biweekly|quarterly|daily|hourly|bimonthly)\s/i);
    if (fm) {
      var word = fm[1].toLowerCase();
      if (FREQ_UNSUPPORTED.indexOf(word) >= 0) {
        raw.problem = "Coffer only keeps weekly, monthly and yearly — it cannot do " + word + ".";
        return raw;
      }
      raw.frequency = FREQ_ALIAS[word];
      rest = rest.replace(fm[0], " ");
    }

    // 3. account, bounded by a comma or the end of the line
    var am = rest.match(/\s(?:into|from|out of|in)\s+([^,]+?)\s*(?=,|$)/i);
    if (am) { raw.account = am[1].trim(); rest = rest.replace(am[0], " "); }

    // 4. the amount, taking the grouped form first so the commas inside
    //    "45,000,000" are never mistaken for the comma before a category
    var nm = rest.match(/(\d{1,3}(?:,\d{3})+(?:\.\d+)?|\d+(?:\.\d+)?)/);
    if (nm) { raw.amountText = nm[1]; rest = rest.replace(nm[1], " "); }
    else { raw.amountText = ""; raw.unreadable = rest.replace(/\s+/g, " ").trim(); }

    // 5. a currency code, then whatever survives is the category
    var cm = rest.match(/\b([A-Za-z]{3})\b/);
    if (cm && CURRENCIES.indexOf(cm[1].toUpperCase()) >= 0) {
      raw.currency = cm[1].toUpperCase();
      rest = rest.replace(cm[0], " ");
    }
    var leftover = rest.replace(/[,$€£¥₹₪₺]/g, " ").replace(/\s+/g, " ").trim();
    if (leftover) raw.category = leftover;
    return raw;
  }

  function planAmount(s) {
    var t = String(s || "").replace(/[^\d.,\-]/g, "");
    // thousands separators only; a decimal comma would be ambiguous next to
    // them, so it is not accepted and the number simply fails to parse
    t = t.replace(/,/g, "");
    if (!/^-?\d*\.?\d+$/.test(t)) return null;
    var n = parseFloat(t);
    return isFinite(n) ? n : null;
  }

  /* ---- the whole document ---- */

  function parsePlanText(input) {
    var out = { name: "", from: "", to: "", reviewBy: "", extends: "", raws: [], problems: [] };
    var lines = String(input || "").split(/\r?\n/);
    var section = null;

    lines.forEach(function (line, i) {
      var no = i + 1;
      var t = line.trim();
      if (!t || /^(\/\/|#{1,6}\s*$)/.test(t)) return;

      var h = t.match(/^#{1,6}\s*(.+)$/);
      if (h) {
        var title = h[1].trim();
        var named = title.match(/^plan\s*:\s*(.+)$/i);
        if (named) { out.name = named[1].trim(); section = null; return; }
        var key = PLAN_SECTIONS[title.toLowerCase().replace(/[^a-z]/g, "")];
        if (key) { section = key; return; }
        // a heading we do not recognise is a title, not an error
        if (!out.name) out.name = title;
        section = null;
        return;
      }

      var cov = t.match(/^covers?\s*:\s*(\d{4}-\d{2})\s*(?:to|–|-|until)\s*(\d{4}-\d{2})\s*$/i);
      if (cov) { out.from = cov[1]; out.to = cov[2]; return; }

      // #3 — a plan tied to a real decision point. A contract renewal is a
      // date, not something to remember.
      var rev = t.match(/^review[_ ]?by\s*:\s*(\S+)\s*$/i);
      if (rev) {
        if (isIsoDate(rev[1])) out.reviewBy = rev[1];
        else out.problems.push({ line: no, text: t, problem: "review_by must be a date like 2027-03-01." });
        return;
      }

      // #1 — a scenario: same plan, one section replaced. "extends: base"
      // followed by only a ## Income section keeps everything else as it was,
      // instead of two near-duplicate files drifting apart.
      var ext = t.match(/^extends\s*:\s*(.+)$/i);
      if (ext) { out["extends"] = ext[1].trim(); return; }
      if (/^(name|plan)\s*:/i.test(t) && !section) { out.name = t.split(":").slice(1).join(":").trim(); return; }

      if (!section) {
        out.problems.push({ line: no, text: t,
          problem: "This is not under a section. Put it below ## Budgets, ## Income, ## Commitments, " +
            "## Goals or ## Grants." });
        return;
      }
      var raw = planLineToRaw(t, no);
      raw.section = section;
      out.raws.push(raw);
    });

    if (!out.raws.length && !out.problems.length) {
      out.problems.push({ line: 0, text: "",
        problem: "Nothing found. A plan needs at least one ## section with a line under it." });
    }
    return out;
  }

  function parsePlanJson(obj) {
    var out = { name: obj.name || "", from: obj.from || "", to: obj.to || "",
                reviewBy: obj.review_by || obj.reviewBy || "", extends: obj["extends"] || "",
                raws: [], problems: [] };
    if (out.reviewBy && !isIsoDate(out.reviewBy)) {
      out.problems.push({ line: 0, text: "review_by", problem: "review_by must be a date like 2027-03-01." });
      out.reviewBy = "";
    }
    PLAN_SECTION_ORDER.forEach(function (sec) {
      var list = obj[sec];
      if (list == null) return;
      if (!Array.isArray(list)) {
        out.problems.push({ line: 0, text: sec, problem: "“" + sec + "” must be a list." });
        return;
      }
      list.forEach(function (e, i) {
        if (!e || typeof e !== "object") {
          out.problems.push({ line: 0, text: sec + "[" + i + "]", problem: "Each entry must be an object." });
          return;
        }
        out.raws.push({
          line: 0, section: sec,
          text: sec + "[" + i + "] " + (e.name || e.category || ""),
          name: e.name || e.category || "",
          amountText: e.amount == null ? "" : String(e.amount),
          confidence: e.confidence == null ? null : parseInt(String(e.confidence).replace("%", ""), 10),
          currency: e.currency ? String(e.currency).toUpperCase() : null,
          frequency: e.frequency ? String(e.frequency).toLowerCase() : null,
          account: e.account || null,
          // for a grant the comma slot carries the funder, so JSON reads it
          // from the same key the text form writes into
          category: e.category || e.funder || null,
          date: e.date || e.due || e.by || e.next || null,
          until: e.until || e.ends || e.endsOn || null,
          renews: e.renews == null ? null : parseInt(String(e.renews).replace("%", ""), 10),
          allowRate: e.allowance ? String(e.allowance.rate) : null,
          allowCur: e.allowance ? e.allowance.currency : null,
          allowCat: e.allowance ? e.allowance.category : null
        });
      });
    });
    if (!out.raws.length && !out.problems.length) {
      out.problems.push({ line: 0, text: "",
        problem: "No budgets, income, commitments, goals or grants in this file." });
    }
    return out;
  }

  /* #1 — a scenario inherits the plan already imported and replaces only the
     sections it mentions. "extends: current" plus a ## Income section gives you
     a branching future without a second copy of the budgets, bills and goals
     to keep in step by hand. Sections the scenario is silent about are taken
     from the parent as they stand. */
  function applyExtends(parsed) {
    if (!parsed["extends"]) return parsed;
    var base = state.plan;
    if (!base) {
      parsed.problems.push({ line: 0, text: "extends: " + parsed["extends"],
        problem: "There is no plan imported yet for this to build on. Import the base plan first." });
      return parsed;
    }
    var named = String(parsed["extends"]).toLowerCase();
    if (named !== "current" && planSlug(base.name) !== planSlug(parsed["extends"])) {
      parsed.problems.push({ line: 0, text: "extends: " + parsed["extends"],
        problem: "The plan currently imported is “" + base.name + "”. Write “extends: " + base.name +
          "” or “extends: current”." });
      return parsed;
    }

    var overridden = {};
    parsed.raws.forEach(function (r) { overridden[r.section] = true; });
    parsed.inherited = [];

    PLAN_SECTION_ORDER.forEach(function (sec) {
      if (overridden[sec]) return;
      var lines = (base.lines || []).filter(function (l) { return l.section === sec; });
      if (!lines.length) return;
      parsed.inherited.push(sec);
      lines.forEach(function (l) {
        parsed.raws.push({
          line: 0, section: sec, inherited: true,
          text: sec + " · " + l.name + " (inherited)",
          name: l.parent ? l.parent + " > " + l.name : l.name,
          amountText: String(l.amount),
          confidence: l.confidence == null ? null : l.confidence,
          currency: l.currency && l.currency !== baseCode() ? l.currency : null,
          frequency: l.frequency || null,
          account: l.accountLabel || null,
          category: l.section === "budgets" ? null : (l.section === "grants" ? l.funder : l.category),
          date: l.date || null,
          until: l.until || null,
          renews: l.renews == null ? null : l.renews,
          allowRate: l.allowance ? String(l.allowance.rate) : null,
          allowCur: l.allowance ? l.allowance.currency : null,
          allowCat: l.allowance ? l.allowance.category : null
        });
      });
    });
    if (!parsed.from && base.from) { parsed.from = base.from; parsed.to = base.to; }
    if (!parsed.reviewBy && base.reviewBy) parsed.reviewBy = base.reviewBy;
    return parsed;
  }

  function parsePlanInput(input) {
    var t = String(input || "").trim();
    if (!t) return { name: "", from: "", to: "", raws: [], problems: [] };
    if (t.charAt(0) === "{") {
      var obj;
      try { obj = JSON.parse(t); }
      catch (e) {
        return { name: "", from: "", to: "", raws: [],
          problems: [{ line: 0, text: "", problem: "That starts like JSON but is not valid JSON: " + e.message }] };
      }
      return applyExtends(parsePlanJson(obj));
    }
    return applyExtends(parsePlanText(t));
  }

  /* ---- meaning: raw fields resolved against this ledger ----------------
     Everything that could be silently wrong is decided here, with the
     ledger in front of it: does that account exist, is there a rate for
     that currency, does that category need creating.
     --------------------------------------------------------------------- */

  function matchAccountRef(nameRaw) {
    var want = String(nameRaw || "").toLowerCase().replace(/\s+/g, " ").trim();
    if (!want) return null;
    var hit = null;
    state.accounts.forEach(function (a) {
      if (hit) return;
      if (a.name.toLowerCase().trim() === want) { hit = { ref: a.id, label: a.name, closed: !!a.closed }; return; }
      pocketsOf(a).forEach(function (p) {
        if (hit) return;
        var full = (a.name + " › " + p.name).toLowerCase();
        var alt = (a.name + " > " + p.name).toLowerCase();
        var dash = (a.name + " - " + p.name).toLowerCase();
        if (want === full || want === alt || want === dash) {
          hit = { ref: acctRef(a.id, p.id), label: a.name + " › " + p.name, closed: !!a.closed };
        }
      });
    });
    return hit;
  }
  function accountNamesForHelp() {
    var names = openAccounts().map(function (a) { return a.name; });
    return names.length ? names.join(", ") : "none yet — add an account first";
  }

  function resolvePlanEntries(raws) {
    var known = planIndex();
    var openList = openAccounts();

    return raws.map(function (r) {
      var e = {
        line: r.line, text: r.text, section: r.section, name: (r.name || "").trim(),
        key: planKeyFor(r.section, r.name), problem: r.problem || null, notes: [], newCategory: null
      };
      if (e.problem) return e;
      if (!e.name) { e.problem = "This entry has no name."; return e; }

      // amount
      var amt = planAmount(r.amountText);
      if (amt == null) {
        e.problem = (r.amountText || r.unreadable)
          ? "“" + (r.amountText || r.unreadable) + "” is not a number I can read. Write it in digits, e.g. 400."
          : "No amount on this line.";
        return e;
      }
      if (!(amt > 0)) { e.problem = "The amount has to be above zero."; return e; }
      e.amount = Math.round(amt * 100) / 100;

      // currency, frozen at import exactly as a transaction freezes its own
      e.currency = r.currency || baseCode();
      if (e.currency !== baseCode() && !(rateNum(e.currency) > 0)) {
        e.problem = "No rate set for " + e.currency + ". Add one under Settings › Exchange rates first, " +
          "so this is converted at a rate you chose rather than one I invented.";
        return e;
      }
      e.rate = rateFor(e.currency);
      e.baseAmount = toBase(e.amount, e.currency, e.rate);

      // date
      if (r.date) {
        if (!isIsoDate(r.date)) { e.problem = "“" + r.date + "” is not a real date. Use YYYY-MM-DD."; return e; }
        e.date = r.date;
      }
      if (r.until) {
        if (!isIsoDate(r.until)) { e.problem = "“" + r.until + "” is not a real date. Use YYYY-MM-DD."; return e; }
        if (e.date && r.until < e.date) { e.problem = "It cannot end before it starts."; return e; }
        e.until = r.until;
      }
      if (r.renews != null) {
        if (r.section !== "income") { e.notes.push("only income can renew; ignored here"); }
        else if (!r.until) { e.problem = "“renews” needs an end date to renew past. Add “until YYYY-MM-DD”."; return e; }
        else e.renews = r.renews;
      }
      if (r.allowCat) {
        if (r.section !== "income") { e.notes.push("an allowance only makes sense inside income; ignored here"); }
        else {
          var arate = planAmount(r.allowRate);
          if (!(arate > 0)) { e.problem = "“" + r.allowRate + "” is not a day rate I can read."; return e; }
          var acur = r.allowCur || baseCode();
          if (acur !== baseCode() && !(rateNum(acur) > 0)) {
            e.problem = "No rate set for " + acur + ", so the allowance cannot be converted.";
            return e;
          }
          var acat = state.categories.expense.filter(function (c) {
            return c.toLowerCase() === r.allowCat.toLowerCase();
          })[0];
          if (!acat) {
            e.problem = "“" + r.allowCat + "” is not one of your expense categories, so an allowance " +
              "cannot be spent against it.";
            return e;
          }
          e.allowance = { category: acat, rate: arate, currency: acur, per: "day" };
          e.notes.push(fmtIn(arate, acur) + " a day of this is " + acat + " money");
        }
      }

      if (r.section === "grants") {
        /* Two shapes under one heading, the way sub-budgets already work:

             - Museum fellowship: 20000 into Wallet from 2026-09-01 until 2027-03-31, The Museum
             - Museum fellowship > Travel: 5000

           The second is an allocation inside the first. The comma slot, unused
           for a grant, carries who it is from. */
        if (e.name.indexOf(">") >= 0) {
          var gp = e.name.split(">");
          e.parent = gp[0].trim();
          e.name = gp.slice(1).join(">").trim();
          e.key = planKeyFor("grants", e.parent + "|" + e.name);
          if (!e.name || !e.parent) { e.problem = "Write a grant line as \u201cGrant > Heading: amount\u201d."; return e; }
          // the grant it belongs to has to be in this same plan, above it
          var owner = raws.filter(function (x) {
            return x.section === "grants" && x.name && x.name.indexOf(">") < 0 &&
              planSlug(x.name) === planSlug(e.parent);
          })[0];
          if (!owner) {
            e.problem = "\u201c" + e.parent + "\u201d is not a grant in this plan. Write the grant itself " +
              "on a line above, then its headings under it.";
            return e;
          }
          // A line is a share of the award, so it is held in the award's own
          // currency. Two currencies in one grant would need a second rate
          // nobody chose, so it is refused rather than converted.
          var ownerCur = owner.currency || baseCode();
          if (r.currency && r.currency !== ownerCur) {
            e.problem = e.parent + " is in " + ownerCur + ", so its headings have to be too.";
            return e;
          }
          e.currency = ownerCur;
          e.rate = rateFor(ownerCur);
          e.baseAmount = toBase(e.amount, e.currency, e.rate);
          e.notes.push("a heading inside " + e.parent);
          return finishEntry(e, known);
        }

        e.key = planKeyFor("grants", e.name);
        if (r.frequency) e.notes.push("a grant is one award, so the frequency is ignored");
        if (r.confidence != null) e.notes.push("confidence does not apply to a grant already awarded; ignored");
        if (r.category) { e.funder = String(r.category).trim(); }

        if (r.account) {
          var ghit = matchAccountRef(r.account);
          if (!ghit) {
            e.problem = "No account called \u201c" + r.account + "\u201d. You have: " + accountNamesForHelp() + ".";
            return e;
          }
          if (ghit.closed) { e.problem = "\u201c" + ghit.label + "\u201d is closed, so nothing new can be filed there."; return e; }
          if (parseRef(ghit.ref).pocketId) {
            e.problem = "Name the account, not a pocket \u2014 Coffer makes the grant its own pocket.";
            return e;
          }
          e.accountRef = ghit.ref; e.accountLabel = ghit.label;
        } else if (openList.length === 1) {
          e.accountRef = openList[0].id; e.accountLabel = openList[0].name;
          e.notes.push("no account named, so " + openList[0].name);
        } else if (!openList.length) {
          e.problem = "There are no open accounts for this to sit in.";
          return e;
        } else {
          e.problem = "Say which account it sits in, e.g. \u201cinto " + openList[0].name + "\u201d.";
          return e;
        }
        e.date = e.date || today();
        e.notes.push("held in its own pocket, marked as already spoken for");
        return finishEntry(e, known);
      }

      if (r.section === "budgets") {
        /* #4 — "Subscriptions > Spotify: 10" caps one charge inside a parent
           category. The parent is what transactions are actually filed under,
           so a sub-budget cannot be checked against spending on its own; it is
           kept as a breakdown of the parent, so that when Subscriptions runs
           over you can see which line to cut rather than only that it did. */
        var parts = String(e.name).split(/\s*[>›]\s*/);
        if (parts.length > 1) {
          e.parent = parts[0].trim();
          e.name = parts.slice(1).join(" › ").trim();
