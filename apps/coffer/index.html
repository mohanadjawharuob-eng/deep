        // is inside it — filtering on o.value left the whole group standing
        var v = o.group ? (o.options[0] || {}).value : o.value;
        return parseRef(v).accountId !== id;
      });

      var msg = "Its <b>" + kept + (kept === 1 ? " transaction stays" : " transactions stay") +
        "</b> in your history exactly as they are. The account just leaves the pickers, so nothing " +
        "new can be logged against it.";
      if (recur) {
        msg += " <b>" + recur + " recurring " + (recur === 1 ? "item is" : "items are") +
          "</b> still pointing at it \u2014 move " + (recur === 1 ? "it" : "them") + " to another account " +
          "or " + (recur === 1 ? "it" : "they") + " will have nowhere to post.";
      }
      if (held && !elsewhere.length) {
        msg += " It still holds " + fmt(bal) + ", and there is nowhere else to put it, so that stays " +
          "counted in your net worth.";
      }

      var fields = [];
      if (held && elsewhere.length) {
        fields.push({
          key: "moveTo",
          label: bal > 0 ? "Move the remaining " + fmt(bal) + " to" : "Settle the " + fmt(-bal) + " owed from",
          type: "select",
          options: [{ value: "", label: "\u2014 leave it where it is \u2014" }].concat(elsewhere),
          value: elsewhere[0].value,
          hint: "records a transfer dated today, so both balances stay right"
        });
      }

      openModal({
        title: "Close " + a.name + "?",
        message: msg,
        fields: fields,
        confirmLabel: "Close account",
        onConfirm: function (v) {
          var moved = null;
          if (v && v.moveTo) {
            var r = parseRef(v.moveTo);
            // a negative balance is a debt, so the money flows the other way:
            // the account being closed receives it and lands on zero either way
            moved = {
              id: uid(), date: today(), desc: "Closing " + a.name, type: "transfer", category: "Transfer",
              amount: Math.abs(bal),
              accountId: bal > 0 ? a.id : r.accountId, pocketId: bal > 0 ? null : (r.pocketId || null),
              toAccountId: bal > 0 ? r.accountId : a.id, toPocketId: bal > 0 ? (r.pocketId || null) : null,
              currency: baseCode(), rate: 1
            };
            state.transactions.push(moved);
          }
          a.closed = true;
          a.closedOn = today();
          save(); render();
          toast(a.name + " closed \u2014 its history is intact.", function () {
            a.closed = false;
            a.closedOn = null;
            if (moved) state.transactions = state.transactions.filter(function (t) { return t.id !== moved.id; });
          });
        }
      });
    },

    "account-open": function (id) {
      var a = accountById(id);
      if (!a) return;
      a.closed = false;
      a.closedOn = null;
      save(); render();
      toast(a.name + " is open again.", function () { a.closed = true; });
    },

    "account-del": function (id) {
      var a = accountById(id);
      if (!a) return;
      var linked = state.transactions.filter(function (t) {
        return t.accountId === id || t.toAccountId === id;
      });
      var linkedRecur = state.recurring.filter(function (r) { return r.accountId === id; });

      var msg = linked.length || linkedRecur.length
        ? "This will also remove <b>" + linked.length + (linked.length === 1 ? " transaction" : " transactions") + "</b>" +
          (linkedRecur.length ? " and <b>" + linkedRecur.length + " recurring " + (linkedRecur.length === 1 ? "item" : "items") + "</b>" : "") +
          " attached to it. You can undo this straight afterwards. " +
          (a.closed ? "" : "To keep all of that and just stop using the account, close it instead.")
        : "Nothing is attached to this account.";

      confirmAction({
        title: "Delete " + a.name + "?",
        message: msg,
        confirmLabel: "Delete account"
      }, function () {
        var snapAcc = state.accounts.slice();
        var snapTx = state.transactions.slice();
        var snapRec = state.recurring.slice();
        state.accounts = state.accounts.filter(function (x) { return x.id !== id; });
        state.transactions = state.transactions.filter(function (t) { return t.accountId !== id && t.toAccountId !== id; });
        state.recurring = state.recurring.filter(function (r) { return r.accountId !== id; });
        if (filters.account === id) filters.account = "all";
        save(); render();
        toast(a.name + " deleted.", function () {
          state.accounts = snapAcc; state.transactions = snapTx; state.recurring = snapRec;
        });
      });
    },

    /* ---- transactions ---- */
    /* Two things happen when a reimbursement comes back: the original expense
       stops being held out of your spending, and money arrives in an account.
       Marking it settled only did the first, which left the second as a chore
       to remember. It now offers to log the arrival too, prefilled — and it is
       only an offer, because a refund can land late, short, in another
       currency, or in a different account than it left from.

       A partial refund needs no special handling: the expense counts in full
       and the income entry carries whatever actually arrived, so the net cost
       comes out right on its own. */
    "tx-settle": function (id) {
      var t = state.transactions.filter(function (x) { return x.id === id; })[0];
      if (!t) return;

      if (t.settledOn) {
        var wasDate = t.settledOn;
        t.settledOn = null;
        save(); render();
        toast((t.desc || t.category) + " is outstanding again.",
          function () { t.settledOn = wasDate; });
        return;
      }

      var cur = t.currency || baseCode();
      var incomeCats = catOptions("income");
      var guess = incomeCats.filter(function (c) {
        return /refund|reimburse/i.test(c);
      })[0] || incomeCats[incomeCats.length - 1];

      openModal({
        title: "Money back for " + (t.desc || t.category),
        message: "You paid <b>" + fmtIn(t.amount, cur) + "</b> on " + esc(t.date) +
          ". Recording this stops it being held out of your spending.",
        fields: [
          { key: "date", label: "Date it came back", type: "date", value: today() },
          { key: "log", type: "check", span: true, value: true,
            label: "Also log the money arriving",
            hint: "leave this off if you have already entered the refund yourself" },
          { key: "amount", label: "Amount received", type: "number", value: t.amount, min: 0,
            hint: "less than you paid is fine \u2014 the difference stays as spending" },
          { key: "account", label: "Into", type: "select",
            options: accountOptions(acctRef(t.accountId, t.pocketId)),
            value: acctRef(t.accountId, t.pocketId) },
          { key: "category", label: "Category", type: "select", catKind: "income",
            options: incomeCats, value: guess }
        ].concat(currencyField(cur)),
        confirmLabel: "Mark refunded",
        validate: function (v) {
          if (v.log && !(v.amount > 0)) return "Enter what actually came back, or untick logging it.";
        },
        onConfirm: function (v) {
          var made = null;
          if (v.log) {
            var c = v.currency || baseCode();
            var ref = parseRef(v.account);
            made = {
              id: uid(), date: v.date || today(),
              desc: "Refund \u2014 " + (t.desc || t.category),
              type: "income", category: v.category,
              accountId: ref.accountId, pocketId: ref.pocketId || null,
              amount: v.amount, currency: c, rate: rateFor(c),
              refundFor: t.id
            };
            state.transactions.push(made);
          }
          t.settledOn = v.date || today();
          save(); render();
          toast(made
            ? fmt(txBase(made)) + " logged back into " + accountName(made.accountId, made.pocketId) + "."
            : (t.desc || t.category) + " marked refunded.",
            function () {
              t.settledOn = null;
              if (made) state.transactions = state.transactions.filter(function (x) { return x.id !== made.id; });
            });
        }
      });
    },

    "tx-add": function () {
      if (needAccount()) return;
      var kind = "expense";
      function fieldsFor(k) {
        return [
          { key: "type", label: "Type", type: "select", options: ["expense", "income"], value: k },
          { key: "date", label: "Date", type: "date", value: today() },
          { key: "desc", label: "Description", placeholder: "e.g. Weekly shop", span: true },
          { key: "category", label: "Category", type: "select", options: catOptions(k), catKind: "auto" },
          { key: "account", label: "Account", type: "select", options: accountOptions() },
          { key: "amount", label: "Amount", type: "number", min: 0 }
        ].concat(currencyField()).concat(k === "expense" ? [{
          key: "refundable", type: "check", span: true,
          label: "I expect this money back",
          hint: "a reimbursable ticket or advance \u2014 it still leaves your balance, but is kept out of " +
            "your spending and your burn rate until you mark it settled"
        }, {
          key: "oneOff", type: "check", span: true,
          label: "One-off, not a running cost",
          hint: "a laptop, a flight, a deposit \u2014 counted in the month, but left out of the burn rate " +
            "your runway is worked out from"
        }] : []);
      }
      function open(k) {
        openModal({
          title: "Add transaction",
          fields: fieldsFor(k),
          confirmLabel: "Add",
          validate: function (v) {
            if (v.amount <= 0) return "Enter an amount above zero.";
            // switching type needs the matching category list
            if (v.type !== k) { reopen(v.type); return " "; }
          },
          onConfirm: function (v) {
            var cur = v.currency || baseCode();
            warnIfOverAllocated(v.account, v.type, toBase(v.amount, cur, rateFor(cur)));
            state.transactions.push({
              id: uid(), date: v.date || today(), desc: v.desc.trim(),
              type: v.type, category: v.category,
              accountId: parseRef(v.account).accountId, pocketId: parseRef(v.account).pocketId,
              amount: v.amount,
              refundable: !!v.refundable, oneOff: !!v.oneOff,
              // the rate is frozen here, on purpose — see the currency block above
              currency: cur, rate: rateFor(cur)
            });
            save(); render();
            toast(isForeign(cur)
              ? "Added — " + fmtIn(v.amount, cur) + " is " + fmt(toBase(v.amount, cur, rateFor(cur))) + "."
              : "Transaction added.");
          }
        });
        // reflect a type change immediately by reopening with the right categories
        var sel = document.getElementById("mf_type");
        if (sel) sel.addEventListener("change", function () { reopen(sel.value); });
      }
      function reopen(k) {
        var keep = {};
        ["date", "desc", "amount", "account", "currency"].forEach(function (key) {
          var el = document.getElementById("mf_" + key);
          if (el) keep[key] = el.value;
        });
        closeModal();
        open(k);
        Object.keys(keep).forEach(function (key) {
          var el = document.getElementById("mf_" + key);
          if (el && keep[key]) el.value = keep[key];
        });
      }
      open(kind);
    },

    /* One payment, several costs. The parts are entered in the transaction's
       own currency and must add up to it exactly — a split that disagrees with
       its own entry is a number nobody can check, so it is refused rather than
       scaled to fit. */
    "tx-split": function (id) {
      var t = null;
      for (var i = 0; i < state.transactions.length; i++) if (state.transactions[i].id === id) t = state.transactions[i];
      if (!t) return;
      if (!canSplit(t)) { toast("A transfer has no category to split."); return; }
      var cur = t.currency || baseCode();
      var have = (t.splits || []).slice();
      var rowN = Math.min(6, Math.max(3, have.length + 1));
      var cats = catOptions(t.type);
      if (cats.indexOf(t.category) === -1) cats = cats.concat([t.category]);
      var lastKey = "a" + (rowN - 1);

      function restate(_v, el, setHint) {
        var typed = [];
        for (var i = 0; i < rowN; i++) { var e = el("a" + i); if (e) typed.push({ amount: e.value }); }
        var left = num(t.amount) - splitsTotal(typed);
        setHint(lastKey, Math.abs(left) < 0.005
          ? "adds up to " + fmtIn(t.amount, cur) + " exactly"
          : left > 0
            ? fmtIn(left, cur) + " of " + fmtIn(t.amount, cur) + " still to account for"
            : fmtIn(-left, cur) + " more than the entry is for");
      }

      var fields = [];
      for (var r = 0; r < rowN; r++) {
        var sp = have[r];
        fields.push({
          key: "c" + r, label: r === 0 ? "Part" : "and",
          type: "select", options: [""].concat(cats),
          value: sp ? sp.category : (r === 0 && !have.length ? t.category : "")
        });
        fields.push({
          key: "a" + r, label: "Amount", type: "number", min: 0,
          value: sp ? sp.amount : (r === 0 && !have.length ? t.amount : ""),
          onChange: restate
        });
      }

      openModal({
        title: "Split " + (t.desc || "this entry"),
        message: "One payment of <b>" + esc(fmtIn(t.amount, cur)) + "</b> filed under more than one category. " +
          "The parts must add up to it, and leaving one category is how you undo the split.",
        fields: fields,
        confirmLabel: "Split it",
        onReady: function (el, setHint) { restate(null, el, setHint); },
        validate: function (v) {
          var parts = [], i;
          for (i = 0; i < rowN; i++) {
            var c = (v["c" + i] || "").trim(), a = num(v["a" + i]);
            if (!c && a > 0) return "Row " + (i + 1) + " has an amount but no category.";
            if (c && !(a > 0)) return "\u201C" + c + "\u201D has no amount.";
            if (c && a > 0) parts.push({ category: c, amount: a });
          }
          if (!parts.length) return "Pick at least one category, or cancel to leave it as it is.";
          var sum = splitsTotal(parts);
          if (parts.length > 1 && Math.abs(sum - num(t.amount)) >= 0.005) {
            return "The parts come to " + fmtIn(sum, cur) + ", not " + fmtIn(t.amount, cur) + ".";
          }
        },
        onConfirm: function (v) {
          var before = { category: t.category, splits: t.splits ? t.splits.slice() : null };
          var merged = [], byCat = {}, i;
          for (i = 0; i < rowN; i++) {
            var c = (v["c" + i] || "").trim(), a = num(v["a" + i]);
            if (!c || !(a > 0)) continue;
            // picking one category twice is two lines of one receipt, and one
            // cost — adding them is what you meant, not an error
            if (byCat[c] != null) merged[byCat[c]].amount += a;
            else { byCat[c] = merged.length; merged.push({ category: c, amount: a }); }
          }
          if (merged.length < 2) {
            // one category is not a split; it is a recategorisation
            delete t.splits;
            t.category = merged[0].category;
          } else {
            t.splits = merged;
            // the biggest share stays the entry's own category, so anything
            // that reads t.category alone still reads something true
            t.category = merged.slice().sort(function (a, b) { return b.amount - a.amount; })[0].category;
          }
          save(); render();
          toast(merged.length < 2
            ? "Filed under " + t.category + "."
            : "Split across " + merged.length + " categories.", function () {
              t.category = before.category;
              if (before.splits) t.splits = before.splits; else delete t.splits;
            });
        }
      });
    },

    "tx-edit": function (id) {
      var t = null;
      for (var i = 0; i < state.transactions.length; i++) if (state.transactions[i].id === id) t = state.transactions[i];
      if (!t) return;

      if (t.type === "transfer") {
        var side = transferSideFields(t);
        openModal({
          title: "Edit transfer",
          fields: [
            { key: "date", label: "Date", type: "date", value: t.date },
            { key: "from", label: "From", type: "select", options: accountOptions(acctRef(t.accountId, t.pocketId)), value: acctRef(t.accountId, t.pocketId) },
            { key: "to", label: "To", type: "select", options: accountOptions(acctRef(t.toAccountId, t.toPocketId)), value: acctRef(t.toAccountId, t.toPocketId) },
            { key: "amount", label: "Amount sent", type: "number", value: t.amount, min: 0, onChange: side.restate }
          ].concat(currencyField(t.currency).map(function (f) { f.onChange = side.mirror; return f; }))
            .concat(side.fields)
            .concat([{ key: "desc", label: "Note", value: t.desc, span: true }]),
          // an exchange already recorded should read back as one the moment it opens
          onReady: function (el, setHint) { side.restate(null, el, setHint); },
          validate: function (v) {
            if (v.amount <= 0) return "Enter an amount above zero.";
            if (v.from === v.to) return "Pick two different accounts.";
            return transferSideProblem(v);
          },
          onConfirm: function (v) {
            var wasCur = t.currency || baseCode(), nowCur = v.currency || baseCode();
            t.currency = nowCur;
            if (nowCur !== wasCur || !(num(t.rate) > 0)) t.rate = rateFor(nowCur);
            t.date = v.date; t.amount = v.amount; t.desc = v.desc.trim();
            t.accountId = parseRef(v.from).accountId; t.pocketId = parseRef(v.from).pocketId;
            t.toAccountId = parseRef(v.to).accountId; t.toPocketId = parseRef(v.to).pocketId;
            setTransferSide(t, v.amount, nowCur, v.toAmount, v.toCurrency);
            save(); render(); toast("Transfer updated.");
          }
        });
        return;
      }

      openModal({
        title: "Edit transaction",
        fields: [
          { key: "type", label: "Type", type: "select", options: ["expense", "income"], value: t.type },
          { key: "date", label: "Date", type: "date", value: t.date },
          { key: "desc", label: "Description", value: t.desc, span: true },
          { key: "category", label: "Category", type: "select", catKind: "auto", options: catOptions(t.type).concat(
              catOptions(t.type).indexOf(t.category) === -1 ? [t.category] : []), value: t.category },
          { key: "account", label: "Account", type: "select", options: accountOptions(acctRef(t.accountId, t.pocketId)), value: acctRef(t.accountId, t.pocketId) },
          { key: "amount", label: "Amount", type: "number", value: t.amount, min: 0,
            // a split is a breakdown OF this figure, so say what changing it costs
            // before it is changed, the way the whole-account picker does
            hint: isSplit(t)
              ? "split across " + txParts(t).map(function (pt) { return pt.category; }).join(" and ") +
                " \u2014 changing the total, or the type, drops that split"
              : null }
        ].concat(currencyField(t.currency)).concat(t.type === "expense" ? [{
          key: "refundable", type: "check", span: true, value: !!t.refundable,
          label: "I expect this money back",
          hint: t.settledOn
            ? "already marked refunded on " + t.settledOn + " — unticking this clears that"
            : "kept out of your spending and your burn rate until you mark it settled"
        }, {
          key: "oneOff", type: "check", span: true, value: !!t.oneOff,
          label: "One-off, not a running cost",
          hint: "counted in the month, but left out of the burn rate your runway is worked out from"
        }] : []),
        validate: function (v) { if (v.amount <= 0) return "Enter an amount above zero."; },
        onConfirm: function (v) {
          /* A split is a breakdown OF an amount. Change the total and the parts
             describe a figure that no longer exists — 38 + 22 against an entry
             now worth 80 — and spendByCategory() would quietly disagree with
             monthSummary().expense with nothing said, which is the one thing
             splits were built not to do. Scaling the parts to fit would be
             guessing at money and refusing the edit would mean a typo in a
             total could never be corrected, so the parts go and it is said.
             The currency is deliberately NOT a trigger: the parts are stored in
             the entry's own currency, so they still sum to it.
             Turning an expense into income is the same problem wearing a
             different hat — planActuals() would file expense categories under
             income. */
          var splitParts = isSplit(t) ? txParts(t).length : 0;
          var splitLost = splitParts > 0 &&
            (Math.abs(num(v.amount) - num(t.amount)) >= 0.005 || v.type !== t.type);

          // Keep the rate this entry was logged at unless the currency itself
          // changed — editing a description must never silently re-value a
          // past transaction at today's rate.
          var wasCur = t.currency || baseCode(), nowCur = v.currency || baseCode();
          t.currency = nowCur;
          if (nowCur !== wasCur || !(num(t.rate) > 0)) t.rate = rateFor(nowCur);
          var wasType = t.type;
          t.type = v.type; t.date = v.date || t.date; t.desc = v.desc.trim();
          t.category = v.category; t.amount = v.amount;
          if (splitLost) delete t.splits;
          t.accountId = parseRef(v.account).accountId; t.pocketId = parseRef(v.account).pocketId;

          // The checkboxes are only shown for expenses, so an entry switched to
          // income must not keep flags that no longer mean anything.
          if (v.type === "expense") {
            t.refundable = !!v.refundable;
            t.oneOff = !!v.oneOff;
            // no longer refundable means there is nothing left to settle
            if (!t.refundable) t.settledOn = null;
          } else {
            t.refundable = false; t.oneOff = false; t.settledOn = null;
          }
          save(); render();
          toast(splitLost
            ? "Transaction updated \u2014 its split across " + splitParts +
              " categories was dropped, because the " +
              (v.type !== wasType ? "type" : "total") + " changed."
            : "Transaction updated.");
        }
      });
    },

    "tx-del": function (id) {
      var idx = -1;
      for (var i = 0; i < state.transactions.length; i++) if (state.transactions[i].id === id) idx = i;
      if (idx < 0) return;
      var removed = state.transactions[idx];
      var hadPhoto = hasPhoto(id);
      state.transactions.splice(idx, 1);
      // the receipt is left in place while undo is still on offer, and swept
      // by the storage tidy-up in Settings if the delete is allowed to stand
      if (hadPhoto) markPhoto(id, false);
      save(); render();
      toast("Deleted " + (removed.desc || removed.category || "transaction") + ".", function () {
        state.transactions.splice(idx, 0, removed);
      });
    },

    "grant-add": function () {
      if (needAccount()) return;
      openModal({
        title: "Add a grant",
        message: "Coffer will hold this in a pocket marked as already spoken for, so it stays out of " +
          "your net worth, your runway and your budgets.",
        fields: [
          { key: "name", label: "What it is", placeholder: "e.g. Museum fellowship", span: true },
          { key: "funder", label: "Who it is from", placeholder: "optional", span: true },
          { key: "total", label: "How much", type: "number", min: 0 }
        ].concat(currencyField()).concat([
          { key: "account", label: "Sitting in", type: "select", options: accountOptions(),
            value: openAccounts()[0].id, hint: "a pocket is made inside it to hold the money" },
          { key: "awardedOn", label: "Awarded", type: "date", value: today() },
          { key: "endsOn", label: "Spend it by", type: "date", value: "" }
        ]),
        confirmLabel: "Add",
        validate: function (v) {
          if (!v.name.trim()) return "Give it a name.";
          if (!(v.total > 0)) return "Enter the amount of the award.";
          if (v.endsOn && v.awardedOn && v.endsOn < v.awardedOn) return "It cannot end before it is awarded.";
        },
        onConfirm: function (v) {
          var cur = v.currency || baseCode(), rt = rateFor(cur);
          var acc = accountById(parseRef(v.account).accountId);
          if (!acc) { toast("That account has gone."); return; }
          if (!acc.pockets) acc.pockets = [];
          // Committed is not a preference here, it is the whole mechanism:
          // freeAssets() already drops committed pockets, which is what keeps
          // grant money out of the runway with no new arithmetic.
          var pk = { id: uid(), name: v.name.trim(), opening: 0, status: "committed" };
          acc.pockets.push(pk);
          var g = {
            id: uid(), name: v.name.trim(), funder: (v.funder || "").trim() || null,
            total: v.total, currency: cur, rate: rt,
            awardedOn: v.awardedOn || today(), endsOn: v.endsOn || null,
            ref: acctRef(acc.id, pk.id), lines: [], closed: false
          };
          if (!state.grants) state.grants = [];
          state.grants.push(g);
          // the award landing is real money arriving, so it is a real entry
          state.transactions.push({
            id: uid(), date: g.awardedOn, desc: g.name + " awarded",
            type: "income", category: state.categories.income.indexOf("Gift") > -1 ? "Gift" : state.categories.income[0],
            accountId: acc.id, pocketId: pk.id, amount: v.total,
            grantId: g.id, grantAward: true, currency: cur, rate: rt
          });
          planTab = "grants"; view = "plan";
          save(); render();
          toast(g.name + " added \u2014 held in " + acc.name + " \u203a " + pk.name + ".");
        }
      });
    },

    "force-update": function () {

      navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (r) { return r.unregister(); }));
      }).then(function () {
        // drop this app's caches too, or the reload just serves them again
        if (!window.caches) return null;
        return caches.keys().then(function (keys) {
          return Promise.all(keys.filter(function (k) { return k.indexOf("pwa-coffer-") === 0; })
            .map(function (k) { return caches.delete(k); }));
        });
      }).then(function () {
        location.reload();
      }).catch(function () { location.reload(); });

    "recur-pay": function (id) {
      var r = state.recurring.filter(function (x) { return x.id === id; })[0];
      if (!r) return;
      // Never file a future date. Logging early means it happened today;
      // logging late keeps the day it was actually due.

      function commit(amount, date, cur) {

        // another one, in which case today's rate is the honest one to freeze
        var sched = r.currency || baseCode();
        cur = cur || sched;
        var tx = {
          id: uid(), date: date, desc: r.name, type: r.type,
          category: r.category, accountId: r.accountId, pocketId: r.pocketId || null,
          amount: num(amount),
          // which schedule this came from, so a month can tell whether its pay
          // has actually landed
          recurId: r.id,
          currency: cur,
          rate: cur === sched && num(r.rate) > 0 ? num(r.rate) : rateFor(cur)
        };
        var prevDate = r.nextDate;
        state.transactions.push(tx);
        // a one-off has no next date: advance() returns null and the row retires
        r.nextDate = advance(r.nextDate, r.frequency);
        save(); render();
        toast(r.name + " logged" + (r.nextDate ? " — next due " + r.nextDate : " — that was the only one") + ".",
          function () {
            state.transactions = state.transactions.filter(function (t) { return t.id !== tx.id; });
            r.nextDate = prevDate;
          });
      }

      /* A bill is a bill: one tap logs it. Money arriving is different — the
         figure is rarely exactly what was scheduled, and if the pay carries an
         allowance this is the moment to ask how many days were worked, since
         "it arrived" and "how much of it was travel" are one question. */
      if (r.type !== "income") { commit(r.amount, loggedDate); return; }

      var al = r.allowance && r.allowance.category && num(r.allowance.rate) > 0 ? r.allowance : null;
      var mk = monthOf(loggedDate);
      openModal({
        title: r.name + " arrived",
        message: "Correct anything that came in differently. Nothing is assumed \u2014 the figures below " +
          "are only what was scheduled.",
        confirmLabel: "Log it",
        fields: [
          { key: "date", label: "Date", type: "date", value: loggedDate },
          { key: "amount", label: "How much came in", type: "number", min: 0, value: r.amount }
        ].concat(currencyField(r.currency)).concat(al ? [{
          key: "days", label: "Days you went in", type: "number", min: 0, step: "1",
          value: (allowanceDays(r, mk) || {}).days || "",
          hint: fmtIn(num(al.rate), al.currency || baseCode()) + " a day toward " + al.category +
            " \u2014 spent before your own " + al.category + " budget is"
        }] : []),
        validate: function (v) { if (!(v.amount > 0)) return "Enter what came in."; },
        onConfirm: function (v) {
          if (al && v.days > 0) {
            var cur = al.currency || baseCode();
            if (!state.allowanceDays) state.allowanceDays = {};
            // the rate is frozen here, so a later rate change cannot move a
            // pot that has already been spent against
            state.allowanceDays[allowanceKey(r, monthOf(v.date || loggedDate))] =
              { days: num(v.days), rate: rateFor(cur) };
          }
          commit(v.amount, v.date || loggedDate, v.currency);
        }
      });
    },

    "debt-pay": function (id) {
      var d = state.debts.filter(function (x) { return x.id === id; })[0];
      if (!d) return;
      var opts = accountOptions();
      var flat = accountOptionsFlat();
      var payFrom = defaultAccountRef() ||
        (flat.length ? flat[0].value : "");
      openModal({
        title: "Log a payment to " + d.name,
        message: "Reduces the balance by the amount you paid. Pick an account to also record it in your ledger.",
        fields: [
          { key: "amount", label: "Amount paid", type: "number", value: num(d.minPayment) || "", min: 0 },
          { key: "date", label: "Date", type: "date", value: today() },
          { key: "account", label: "Paid from", type: "select",
            options: [{ value: "", label: "— don't log a transaction —" }].concat(opts), value: payFrom }
        ].concat(currencyField()),
        confirmLabel: "Log payment",
        validate: function (v) { if (v.amount <= 0) return "Enter an amount above zero."; },
        onConfirm: function (v) {
          var cur = v.currency || baseCode();
          // the balance is carried in base, so a payment made in another
          // currency comes off it converted, at the rate frozen onto the entry
          var paid = toBase(v.amount, cur, rateFor(cur));
          var before = num(d.balance);
          d.balance = Math.max(before - paid, 0);
          var tx = null;
          if (v.account) {
            var pref = parseRef(v.account);
            tx = {
              id: uid(), date: v.date || today(), desc: d.name + " payment", type: "expense",
              category: state.categories.expense.indexOf("Other") >= 0 ? "Other" : state.categories.expense[0],
              accountId: pref.accountId, pocketId: pref.pocketId || null,
              amount: v.amount, currency: cur, rate: rateFor(cur)
            };
            state.transactions.push(tx);
          }
          save(); render();
          toast((isForeign(cur) ? fmtIn(v.amount, cur) + " = " : "") + fmt(paid) +
            " paid \u2014 " + d.name + " now " + fmt(d.balance) + ".", function () {
            d.balance = before;
            if (tx) state.transactions = state.transactions.filter(function (t) { return t.id !== tx.id; });
          });
        }
      });
    },

    /* #16 — a category name is written into every transaction that used it, so
       "renaming" it by deleting and re-adding orphans all of them: the history
       keeps a name that no longer exists anywhere in the app. This rewrites
       every place the old name appears, in one undoable step. */
    "cat-rename": function (id, el) {
      var kind = el.getAttribute("data-kind");
      var from = el.getAttribute("data-cat");
      var inTx = state.transactions.filter(function (t) {
      return txParts(t).some(function (pt) { return pt.category === from; });
    }).length;
      var inRec = state.recurring.filter(function (r) { return r.category === from; }).length;
      var hasBudget = state.budgets[from] != null;
      var inPlan = state.plan
        ? (state.plan.lines || []).filter(function (l) { return l.category === from; }).length : 0;

      openModal({
        title: "Rename " + from,
        message: inTx || inRec || hasBudget || inPlan
          ? "Everything filed under it comes with it: <b>" + inTx + "</b> " +
            (inTx === 1 ? "transaction" : "transactions") +
            (inRec ? ", <b>" + inRec + "</b> recurring " + (inRec === 1 ? "item" : "items") : "") +
            (hasBudget ? ", its budget" : "") +
            (inPlan ? ", <b>" + inPlan + "</b> plan " + (inPlan === 1 ? "line" : "lines") : "") +
            ". Nothing is orphaned and nothing is recategorised."
          : "Nothing is filed under it yet.",
        fields: [{ key: "name", label: "New name", value: from, span: true }],
        confirmLabel: "Rename",
        validate: function (v) {
          var name = v.name.trim();
          if (!name) return "Give it a name.";
          if (name === from) return " ";
          var clash = state.categories[kind].filter(function (c) {
            return c !== from && c.toLowerCase() === name.toLowerCase();
          })[0];
          // merging two categories is a different, lossier operation; refuse
          // rather than silently doing it
          if (clash) return "\u201C" + clash + "\u201D already exists. Pick another name.";
        },
        onConfirm: function (v) {
          var to = v.name.trim();
          var before = JSON.parse(JSON.stringify({
            categories: state.categories, budgets: state.budgets,
            tx: state.transactions.map(function (t) { return { c: t.category, s: t.splits || null }; }),
            rec: state.recurring.map(function (r) { return r.category; }),
            plan: state.plan ? (state.plan.lines || []).map(function (l) { return l.category; }) : null
          }));

          var idx = state.categories[kind].indexOf(from);
          if (idx >= 0) state.categories[kind][idx] = to;
          state.transactions.forEach(function (t) {
            if (t.category === from) t.category = to;
            (t.splits || []).forEach(function (sp) { if (sp.category === from) sp.category = to; });
          });
          state.recurring.forEach(function (r) { if (r.category === from) r.category = to; });
          if (state.budgets[from] != null) {
            state.budgets[to] = state.budgets[from];
            delete state.budgets[from];
          }
          if (state.plan) {
            (state.plan.lines || []).forEach(function (l) {
              if (l.category === from) l.category = to;
              if (l.section === "budgets" && l.name === from) l.name = to;
            });
          }
          state.quick.forEach(function (q) { if (q.category === from) q.category = to; });

          save(); render();
          toast(from + " is now " + to + ".", function () {
            state.categories = before.categories;
            state.budgets = before.budgets;
            state.transactions.forEach(function (t, i) {
              t.category = before.tx[i].c;
              if (before.tx[i].s) t.splits = before.tx[i].s; else delete t.splits;
            });
            state.recurring.forEach(function (r, i) { r.category = before.rec[i]; });
            if (before.plan && state.plan) {
              (state.plan.lines || []).forEach(function (l, i) { l.category = before.plan[i]; });
            }
          });
        }
      });
    },

    "cat-del": function (id, el) {
      var kind = el.getAttribute("data-kind");
      var cat = el.getAttribute("data-cat");
      if (state.categories[kind].length <= 1) { toast("Keep at least one category."); return; }
      var used = state.transactions.filter(function (t) { return t.category === cat; }).length;
      var idx = state.categories[kind].indexOf(cat);
      var hadBudget = state.budgets[cat];
      state.categories[kind].splice(idx, 1);
      delete state.budgets[cat];
      save(); render();
      toast(cat + " removed" + (used ? " — " + used + " past " + (used === 1 ? "transaction keeps" : "transactions keep") + " the name." : "."),
        function () {
          state.categories[kind].splice(idx, 0, cat);
          if (hadBudget != null) state.budgets[cat] = hadBudget;
        });
    },

    "export-csv": function () {
      var rows = [["Date", "Description", "Type", "Category", "Account", "To account",
                   "Amount (" + baseCode() + ")", "Currency", "Original amount", "Rate", "Part of"]];
      var lines = 0;
      // a split entry exports one line per share, so the category column still
      // sums correctly in a spreadsheet; the last column says they were one
      // payment, so the amount column does not look double-counted
      filteredTx().forEach(function (t) {
        lines++;
        var parts = t.splits && t.splits.length ? t.splits : null;
        if (!parts) {
          rows.push([t.date, t.desc, t.type, t.category, accountName(t.accountId),
            t.toAccountId ? accountName(t.toAccountId) : "",
            txBase(t).toFixed(2), t.currency || baseCode(), num(t.amount).toFixed(2),
            (num(t.rate) > 0 ? num(t.rate) : rateFor(t.currency)).toString(), ""]);
          return;
        }
        parts.forEach(function (sp) {
          rows.push([t.date, t.desc, t.type, sp.category, accountName(t.accountId), "",
            toBase(num(sp.amount), t.currency, t.rate).toFixed(2), t.currency || baseCode(),
            num(sp.amount).toFixed(2),
            (num(t.rate) > 0 ? num(t.rate) : rateFor(t.currency)).toString(),
            fmtIn(t.amount, t.currency || baseCode()) + " " + (t.desc || "")]);
        });
      });
      var csv = rows.map(function (r) {
        return r.map(function (c) {
          var s = String(c == null ? "" : c).replace(/"/g, '""');
          return /[",\n]/.test(s) ? '"' + s + '"' : s;
        }).join(",");
      }).join("\n");
      download("coffer-transactions-" + today() + ".csv", csv, "text/csv");
      toast(lines + " transactions exported" + (rows.length - 1 > lines
        ? " as " + (rows.length - 1) + " lines, splits broken out." : "."));
    },

  var pendingSuggestions = [];

  function download(name, content, mime) {
    try {
      var blob = new Blob([content], { type: mime });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = name;
      a.rel = "noopener";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    } catch (e) {
      toast("This browser blocked the download. Copy the text instead.");
    }
  }

  /* Saving a file is not always allowed. Inside an embedded frame the browser
     can ignore the download without raising anything at all, so a plain
     "saved!" message would be a lie. Always show the text as well, so there
     is a route out of the app that cannot silently fail. */
  function backupDialog(name, text) {
    closeModal();
    overlay.innerHTML = '<div class="scrim" data-scrim="1"><div class="modal" style="max-width:640px" role="dialog" aria-modal="true" aria-label="Your backup">' +
      '<div class="modal-head"><h3>Your backup</h3>' +
      "<p>Two ways to keep this. <b>Save as file</b> puts it in your downloads — but some browsers block that " +
      "silently, so if nothing shows up there, use <b>Copy</b> and paste it somewhere safe (a note to yourself, " +
      "an email, a message). Either one can be restored later.</p></div>" +
      '<div class="modal-body">' +
      '<textarea id="bkText" readonly rows="9" spellcheck="false" ' +
      'style="width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:0.76rem;padding:0.6rem;' +
      'border-radius:8px;border:1px solid var(--rule-mid);background:var(--raised);color:var(--ink);resize:vertical">' +
      esc(text) + "</textarea>" +
      '<p class="hint" style="margin-top:0.5rem">' + (text.length / 1024).toFixed(1) + " KB · " +
      state.transactions.length + " transactions · " + state.accounts.length + " accounts</p></div>" +
      '<div class="modal-foot">' +
      '<button class="btn quiet" data-mclose="1">Done</button>' +
      '<button class="btn" id="bkFile">Save as file</button>' +
      '<button class="btn primary" id="bkCopy">Copy</button>' +
      "</div></div></div>";

    var ta = document.getElementById("bkText");
    overlay.querySelector("[data-mclose]").addEventListener("click", closeModal);
    overlay.querySelector("[data-scrim]").addEventListener("mousedown", function (e) {
      if (e.target === e.currentTarget) closeModal();
    });
    document.getElementById("bkFile").addEventListener("click", function () {
      download(name, text, "application/json");
      toast("If nothing appears in your downloads, this browser blocked it — use Copy.");
    });
    document.getElementById("bkCopy").addEventListener("click", function () {
      function fallback() {
        ta.removeAttribute("readonly");
        ta.focus();
        ta.setSelectionRange(0, ta.value.length);
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) {}
        ta.setAttribute("readonly", "readonly");
        toast(ok ? "Backup copied — paste it somewhere safe."
                 : "Couldn't copy automatically. The text is selected — copy it by hand.");
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          toast("Backup copied — paste it somewhere safe.");
        }, fallback);
      } else { fallback(); }
    });
  }

  // Restoring has the same problem in reverse: a file picker can be awkward or
  // blocked, so pasting the text back in is always available.
  function restoreDialog(onJson) {
    closeModal();
    overlay.innerHTML = '<div class="scrim" data-scrim="1"><div class="modal" style="max-width:640px" role="dialog" aria-modal="true" aria-label="Restore a backup">' +
      '<div class="modal-head"><h3>Restore a backup</h3>' +
      "<p>Paste the backup text below, or pick the .json file if you saved one. Everything currently in this " +
      "browser will be replaced — you'll get one more chance to confirm.</p></div>" +
      '<div class="modal-body">' +
      '<textarea id="rsText" rows="9" spellcheck="false" placeholder=\'{ "version": 2, "accounts": [ … ] }\' ' +
      'style="width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:0.76rem;padding:0.6rem;' +
      'border-radius:8px;border:1px solid var(--rule-mid);background:var(--surface);color:var(--ink);resize:vertical"></textarea>' +
      '<div id="rsInfo" class="hint" style="margin-top:0.5rem">Nothing pasted yet.</div></div>' +
      '<div class="modal-foot">' +
      '<button class="btn quiet" data-mclose="1">Cancel</button>' +
      '<label class="btn" style="cursor:pointer">Choose a file' +
      '<input type="file" id="rsFile" accept="application/json,.json" style="display:none" /></label>' +
      '<button class="btn primary" id="rsGo">Restore</button>' +
      "</div></div></div>";

    var ta = document.getElementById("rsText");
    var info = document.getElementById("rsInfo");

    function peek() {
      var t = ta.value.trim();
      if (!t) { info.textContent = "Nothing pasted yet."; info.style.color = ""; return null; }
      var p;
      try { p = JSON.parse(t); }
      catch (e) { info.textContent = "That isn't valid JSON yet — make sure you pasted all of it."; info.style.color = "var(--warn)"; return null; }
      if (!p || (!p.accounts && !p.transactions)) {
        info.textContent = "Valid JSON, but it doesn't look like a Coffer backup.";
        info.style.color = "var(--warn)";
        return null;
      }
      info.textContent = "Looks good — " + (p.accounts || []).length + " accounts, " +
        (p.transactions || []).length + " transactions.";
      info.style.color = "var(--gain)";
      return p;
    }

    ta.addEventListener("input", peek);
    overlay.querySelector("[data-mclose]").addEventListener("click", closeModal);
    overlay.querySelector("[data-scrim]").addEventListener("mousedown", function (e) {
      if (e.target === e.currentTarget) closeModal();
    });
    document.getElementById("rsFile").addEventListener("change", function (e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var r = new FileReader();
      r.onload = function () { ta.value = r.result; peek(); };
      r.readAsText(file);
    });
    document.getElementById("rsGo").addEventListener("click", function () {
      var parsed = peek();
      if (!parsed) { toast("Paste a valid backup first."); return; }
      closeModal();
      onJson(parsed);
    });
    ta.focus();
  }

  /* ---------------- screen lock (obfuscation, not encryption) ---------------- */

  function hashPin(pin, salt) {
    // A deliberately simple iterated hash. This is a convenience lock; it is
    // NOT cryptography and the UI says so plainly.
    var h = 2166136261;
    var input = salt + "|" + pin;
    for (var round = 0; round < 5000; round++) {
      for (var i = 0; i < input.length; i++) {
        h ^= input.charCodeAt(i);
        h = (h * 16777619) >>> 0;
      }
      h = (h ^ round) >>> 0;
    }
    return h.toString(16);
  }
  function makeLock(pin) {
    var salt = uid() + uid();
    return { salt: salt, hash: hashPin(pin, salt) };
  }
  function checkLock(pin) {
    var l = state.settings.lock;
    return !!l && hashPin(pin, l.salt) === l.hash;
  }

  function showLockScreen(onPass) {
    var el = document.createElement("div");
    el.className = "lockscreen";
    el.innerHTML = '<div class="lockbox">' +
      '<div class="brand-mark">C</div>' +
      "<h2>Coffer is locked</h2>" +
      "<p>Enter your PIN to see your figures.</p>" +
      '<input id="lock_pin" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN" />' +
      '<div class="lock-err" id="lock_err" role="alert"></div>' +
      '<button class="btn primary" id="lock_go" style="width:100%;margin-top:0.5rem">Unlock</button>' +
      "</div>";
    document.body.appendChild(el);
    var inp = el.querySelector("#lock_pin");
    var err = el.querySelector("#lock_err");
    function attempt() {
      if (checkLock(inp.value)) {
        document.body.removeChild(el);
        onPass();
      } else {
        err.textContent = "That PIN is not right.";
        inp.value = "";
        inp.focus();
      }
    }
    el.querySelector("#lock_go").addEventListener("click", attempt);
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") attempt(); });
    inp.focus();
  }

      [-1, ["Winter coat", "expense", "Shopping", 145, 7, current.id]],

    ];

    function push(mk, row) {
      var day = Math.min(row[4], daysInMonth(mk));
      s.transactions.push({
        id: uid(),
        date: mk + "-" + String(day).padStart(2, "0"),
        desc: row[0], type: row[1], category: row[2],
        amount: row[3], accountId: row[5]
      });
    }

    [-2, -1, 0].forEach(function (offset) {
      var mk = monthShift(thisMonth(), offset);
      var elapsed = offset === 0 ? new Date().getDate() : 99;
      plan.forEach(function (row) {
        if (row[4] > elapsed) return; // don't log the current month's future
        push(mk, row);
      });
      // a monthly move into savings
      if (offset < 0 || elapsed >= 26) {
        s.transactions.push({
          id: uid(), date: mk + "-26", desc: "To savings", type: "transfer",
          category: "Transfer", accountId: current.id, toAccountId: savings.id, amount: 300
        });
      }
    });
    extras.forEach(function (pair) {
      var mk = monthShift(thisMonth(), pair[0]);
      var elapsed = pair[0] === 0 ? new Date().getDate() : 99;
      if (pair[1][4] <= elapsed) push(mk, pair[1]);
    });

    s.budgets = { Groceries: 400, "Dining & Fun": 160, Transport: 180, Shopping: 120, Health: 80 };
    s.goals = [
      { id: uid(), name: "Emergency fund", target: 7500, saved: 4200, due: null },
      { id: uid(), name: "Trip to Japan", target: 3200, saved: 640, due: monthShift(thisMonth(), 11) + "-01" }
    ];
    s.debts = [
      { id: uid(), name: "Credit card", balance: 1840, rate: 22.9, minPayment: 55 },
      { id: uid(), name: "Car loan", balance: 4600, rate: 6.4, minPayment: 155 }
    ];
    s.recurring = [
      { id: uid(), name: "Rent", type: "expense", category: "Housing", accountId: current.id, amount: 1250, frequency: "monthly", nextDate: nextRecur(1) },
      { id: uid(), name: "Broadband", type: "expense", category: "Utilities", accountId: current.id, amount: 34, frequency: "monthly", nextDate: nextRecur(8) },
      { id: uid(), name: "Gym", type: "expense", category: "Health", accountId: current.id, amount: 29, frequency: "monthly", nextDate: nextRecur(5) },
      { id: uid(), name: "Streaming", type: "expense", category: "Dining & Fun", accountId: current.id, amount: 16, frequency: "monthly", nextDate: nextRecur(11) },
      { id: uid(), name: "Salary", type: "income", category: "Salary", accountId: current.id, amount: 3450, frequency: "monthly", nextDate: nextRecur(25) },
      { id: uid(), name: "Car insurance", type: "expense", category: "Transport", accountId: current.id, amount: 420, frequency: "yearly", nextDate: nextRecur(14) }
    ];
    s.quick = [
      { id: uid(), label: "Taxi", category: "Transport", type: "expense", accountId: current.id, amount: 0 },
      { id: uid(), label: "Coffee", category: "Dining & Fun", type: "expense", accountId: cash.id, amount: 3.2 },
      { id: uid(), label: "Corner shop", category: "Groceries", type: "expense", accountId: cash.id, amount: 0 },
      { id: uid(), label: "Bus fare", category: "Transport", type: "expense", accountId: cash.id, amount: 2.4 }
    ];
    s.extraDebtPayment = 120;
    return s;
  }

  // next occurrence of a day-of-month, from today forward
  function nextRecur(day) {
    var mk = thisMonth();
    if (new Date().getDate() > day) mk = monthShift(mk, 1);
    return mk + "-" + String(Math.min(day, daysInMonth(mk))).padStart(2, "0");
  }

  /* ============================================================
     Render + wiring
     ============================================================ */

  var viewEl = document.getElementById("view");

  // A second, lighter level of navigation, used where one tab holds several
  // card groups that answer the same question. Scrolls sideways rather than
  // wrapping, so it stays one line on a narrow phone.
  function subNav(act, tabs, current) {
    return '<div class="subnav">' + tabs.map(function (t) {
      return '<button data-act="' + act + '" data-id="' + t.id + '"' +
        (t.id === current ? ' class="on" aria-current="page"' : "") + ">" + esc(t.label) + "</button>";
    }).join("") + "</div>";
  }

  function renderNav() {
    document.getElementById("nav").innerHTML = TABS.map(function (t) {
      return '<button class="tab" data-tab="' + t.id + '"' + (t.id === view ? ' aria-current="page"' : "") + ">" +
        '<span class="ico">' + t.ico + "</span><span>" + t.label + "</span></button>";
    }).join("");
  }

  function render() {
    resetMemo();
    renderNav();
    var html;
    if (view === "today") html = renderToday();
    else if (view === "ledger") html = renderLedger();
    else if (view === "plan") html = renderPlanTab();
    else if (view === "worth") html = renderWorth();
    else if (view === "insights") html = renderInsights();
    else html = renderSettings();
    viewEl.innerHTML = html;
    wireInputs();
    // A sub-nav that scrolls sideways can leave the tab you are actually on
    // off the right-hand edge — Plan now has seven, and Grants sat past the
    // fold while you were reading it.
    var onTab = viewEl.querySelector(".subnav button.on");
    if (onTab && onTab.scrollIntoView) {
      // only when it is genuinely out of view: scrolling on every render pushed
      // the earlier tabs off the left edge for no reason
      var nav = onTab.parentNode;
      var l = onTab.offsetLeft, r = l + onTab.offsetWidth;
      if (l < nav.scrollLeft || r > nav.scrollLeft + nav.clientWidth) {
        onTab.scrollIntoView({ block: "nearest", inline: "nearest" });
      }
    }
    // receipts live in IndexedDB, so their size can only be reported asynchronously
    var pstat = document.getElementById("photo_stat");
    if (pstat) {
      photoKeys(function (keys) {
        var el = document.getElementById("photo_stat");
        if (!el) return;
        if (!keys.length) { el.textContent = "none stored"; return; }
        var total = 0, seen = 0;
        keys.forEach(function (k) {
          photoGet(k, function (blob) {
            if (blob) total += blob.size;
            if (++seen === keys.length) {
              var e2 = document.getElementById("photo_stat");
              if (e2) e2.textContent = keys.length + " stored · " + (total / 1048576).toFixed(1) + " MB";
            }
          });
        });
      });
    }
    wireOmni();
    wireHovers();
  }

  var searchTimer = null;

  // Filters and the currency picker update state as you type/change.
  function wireInputs() {
    function bindChange(id, apply) {
      var el = document.getElementById(id);
      if (!el) return;
      el.addEventListener("change", function () {
        apply(el.value);
        ledgerLimit = LEDGER_PAGE;
        render();
      });
    }

    var search = document.getElementById("f_text");
    if (search) {
      // Debounced, and it refreshes only the rows — so typing stays smooth and
      // the caret never jumps, however long the ledger is.
      search.addEventListener("input", function () {
        filters.text = search.value;
        ledgerLimit = LEDGER_PAGE;
        clearTimeout(searchTimer);
        searchTimer = setTimeout(refreshLedgerTable, 130);
      });
    }

    // f_type is pills now, handled by the filter-type action
    var defacc = document.getElementById("defacc");
    if (defacc) defacc.addEventListener("change", function () {
      state.settings.defaultAccountRef = defacc.value || null;
      save(); render();
      toast(defacc.value
        ? "Quick logs will land in " +
          accountName(parseRef(defacc.value).accountId, parseRef(defacc.value).pocketId) + "."
        : "Back to whichever account you log to most.");
    });

    bindChange("f_cat", function (v) { filters.category = v; });
    bindChange("f_acc", function (v) { filters.account = v; });
    bindChange("f_from", function (v) { filters.from = v; });
    bindChange("f_to", function (v) { filters.to = v; });

    var cur = document.getElementById("cur_sel");
    if (cur) cur.addEventListener("change", function () {
      state.settings.currency = cur.value;
      save();
      render();
    });
  }

  // Swap in just the rows and the summary line.
  function refreshLedgerTable() {
    var host = document.getElementById("txTable");
    if (view !== "ledger" || !host) { render(); return; }
    resetMemo();
    host.innerHTML = ledgerTableHtml();
    var sum = document.getElementById("txSummary");
    if (sum) sum.textContent = ledgerSummaryHtml(filteredTx());
    wireHovers();
  }

  function wireHovers() {
    viewEl.querySelectorAll("[data-tip]").forEach(function (el) {
      el.addEventListener("mousemove", function (e) { showTip(el.getAttribute("data-tip"), e.clientX, e.clientY); });
      el.addEventListener("mouseleave", hideTip);
    });
  }

  document.addEventListener("click", function (e) {
    var tab = e.target.closest("[data-tab]");
    if (tab) {
      view = tab.getAttribute("data-tab");
      ledgerLimit = LEDGER_PAGE;
      omni = { text: "", touched: {} };
      hideTip();
      render();
      window.scrollTo({ top: 0, behavior: "auto" });
      return;
    }
    var act = e.target.closest("[data-act]");
    if (!act) return;
    var name = act.getAttribute("data-act");
    if (ACTIONS[name]) {
      hideTip();
      // A handler that throws used to leave the button looking simply dead —
      // which is exactly how a one-character typo hid the Set a rate button.
      // Fail loudly instead.
      try {
        ACTIONS[name](act.getAttribute("data-id"), act);
      } catch (err) {
        toast("Something went wrong with that button. " + (err && err.message ? err.message : ""));
        if (window.console && console.error) console.error(name, err);
      }
    }
  });

  /* The log bar is outside the rendered view, so it survives every render and
     keeps focus and caret while you type. Submitting parses the same shorthand
     the quick box does; anything it cannot read falls through to the full
     dialog rather than being guessed at. */
  function wireLogBar() {
    var form = document.getElementById("logbar");
    var input = document.getElementById("logInput");
    if (!form || !input) return;
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var text = input.value.trim();
      if (!text) { ACTIONS["tx-add"](); return; }
      if (!openAccounts().length) { needAccount(); return; }

      var parsed = parseEntry(text);
      if (!parsed || !parsed.ok) {
        /* Leave what was typed where it was typed. This used to clear the bar,
           jump to Today and toast the reason — so the toast faded, the text was
           gone, and you retyped it from memory. */
        toast(parsed && parsed.reason ? parsed.reason : "Type an amount and what it was for.");
        input.focus();
        input.setSelectionRange(text.length, text.length);
        return;
      }
      omni = { text: text, touched: {} };
      input.value = "";
      input.blur();
      openOmniSheet();
    });
  }

  function boot() {
    // the head script already set the attribute from storage; this keeps the
    // theme-color meta in step and covers a state restored from a backup
    applyTheme();
    wireLogBar();
    render();
    // roll any overdue recurring reminder into view rather than silently passing
    var overdue = activeRecurring().filter(function (r) { return r.nextDate && daysUntil(r.nextDate) < 0; });
    if (overdue.length) {
      toast(overdue.length === 1
        ? overdue[0].name + " is overdue — log it from Plan › Bills."
        : overdue.length + " recurring items are overdue.");
    }
  }

  if (state.settings.lock) showLockScreen(boot);
  else boot();
})();

</script>

<script>
  // Registers the offline worker, and — more importantly — makes the app able
  // to update itself. An installed app that is resumed rather than reopened
  // never navigates, so it can sit on a months-old build forever with no way
  // for its owner to tell. Now it asks for a new worker on every open, and
  // reloads itself once the moment a new one takes over.
  if ('serviceWorker' in navigator &&
      (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    var swReloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (swReloaded) return;      // guard: claiming can fire this more than once
      swReloaded = true;
      location.reload();
    });
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').then(function (reg) {
        reg.update();
        // and check again when the app is brought back to the foreground
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) reg.update();
        });
      }).catch(function () {});
    });
  }
</script>
