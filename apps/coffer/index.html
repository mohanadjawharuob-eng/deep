    { id: "budgets", label: "Budgets" },
    { id: "bills", label: "Bills" },
    { id: "income", label: "Income" },
    { id: "goals", label: "Goals" },
    { id: "grants", label: "Grants" },
    { id: "plan", label: "The plan" }
  ];

  /* #15 — projected against real, over the plan's own months. The point is
     not the score; it is that the next plan should be written against how you
     actually behave rather than how you meant to. */
  function planCloseOut(plan) {
    var months = [];
    var mk = plan.from;
    var guard = 0;
    while (mk <= plan.to && guard++ < 120) {
      months.push(mk);
      mk = monthShift(mk, 1);
    }
    var withData = months.filter(function (m) { return monthTx(m).length > 0; });
    var actualIn = withData.reduce(function (s, m) { return s + monthSummary(m).income; }, 0);
    var actualOut = withData.reduce(function (s, m) { return s + monthSummary(m).spend; }, 0);

    var perMonthIn = 0, perMonthOut = {};
    (plan.lines || []).forEach(function (l) {
      if (l.section === "income") {
        perMonthIn += l.confidence == null
          ? monthlyEquivalent(l.baseAmount, l.frequency)
          : monthlyEquivalent(l.baseAmount, l.frequency) * (l.confidence / 100);
      } else if (l.section === "budgets" && !l.parent) {
        perMonthOut[l.category] = Math.max(perMonthOut[l.category] || 0, l.baseAmount);
      } else if (l.section === "commitments") {
        perMonthOut[l.category] = Math.max(perMonthOut[l.category] || 0,
          monthlyEquivalent(l.baseAmount, l.frequency));
      }
    });
    var perMonthOutTotal = Object.keys(perMonthOut).reduce(function (s, c) { return s + perMonthOut[c]; }, 0);
    var span = Math.max(withData.length, 1);
    var plannedIn = perMonthIn * span;
    var plannedOut = perMonthOutTotal * span;

    var inPct = plannedIn > 0 ? actualIn / plannedIn : null;
    var outPct = plannedOut > 0 ? actualOut / plannedOut : null;
    var bits = [];
    if (inPct != null) {
      bits.push(inPct >= 0.98
        ? "Income landed where you expected"
        : "Income came in at <b>" + Math.round(inPct * 100) + "%</b> of what you projected");
    }
    if (outPct != null) {
      bits.push(outPct <= 1.02
        ? "spending held to the plan"
        : "spending ran <b>" + Math.round((outPct - 1) * 100) + "% over</b>");
    }
    var verdict = bits.length
      ? bits.join(", and ") + ". Worth carrying that into the next plan rather than projecting the same figures again."
      : "Not enough logged in this period to compare against.";

    return { months: withData.length, actualIn: actualIn, actualOut: actualOut,
             plannedIn: plannedIn, plannedOut: plannedOut, verdict: verdict };
  }

  function renderPlanTab() {
    var sub = currentPlanTab();
    var blurb = {
      budgets: "Monthly limits per category. The marker on each bar shows how far through the month you are — " +
        "a bar past its marker is running hot.",
      bills: "What you have committed to paying, and what it costs a month.",
      income: "Contracts that pay on a cycle, and money that arrives once. Both are what your " +
        "bills are measured against, and what every projection is built from.",
      goals: "What you're saving toward, and whether your current pace gets you there.",
      plan: "A written plan, scored against what actually happened.",
      outlook: "Where the money goes from here, month by month, with every contract " +
        "starting and stopping on its own date.",
      grants: "Money you are holding for someone else, split into what it has to be spent on."
    }[sub];

    var right = sub === "goals" ? '<button class="btn primary" data-act="goal-add">Add a goal</button>'
      : sub === "outlook" ? ""
      : sub === "grants" ? ""
      : sub === "plan" ? ""
      : !state.plan ? '<button class="btn sm" data-act="plan-tab" data-id="plan">Import a plan</button>'
      : monthStepper();

    var html = pageHead("Plan", blurb, right) +
      subNav("plan-tab", PLAN_TABS, sub);

    if (sub === "outlook") html += outlookBody();
    else if (sub === "grants") html += grantsBody();
    else if (sub === "budgets") html += budgetsBody();
    else if (sub === "bills") html += billsBody();
    else if (sub === "income") html += incomeBody();
    else if (sub === "goals") html += goalsBody();
    else html += planBody();
    return html;
  }

  /* ---------------- Plan > Outlook ----------------
     The runway number on Today says how long the money lasts if nothing
     changes. This screen is for when something does. */

  // which projected income lines the reader has switched off, to ask what
  // happens if a contract does not renew. Not saved: it is a question, not a
  // second plan.
  var outlookOff = {};

  function outlookSentence(pr) {
    var m = projectedMonths(pr);
    if (!pr.hasSchedule) {
      return "Nothing is scheduled to come in, so this is your money running down at " +
        fmt(pr.burn, { round: true }) + " a month and nothing replacing it.";
    }
    if (pr.crossing == null) {
      var last = pr.points[pr.points.length - 1];
      var cover = pr.burn > 0 ? last.balance / pr.burn : null;
      if (cover != null && cover < 3) {
        return "You do not run out inside " + pr.horizon + " months, but you end them on " +
          fmt(last.balance, { round: true }) + " \u2014 " +
          (cover < 1 ? "under a month" : "about " + Math.floor(cover) + " months") + " of cover left.";
      }
      return "You stay above water for the whole of the next " + pr.horizon + " months.";
    }
    // the last income to stop before the money did — however many months
    // earlier it was, that is the thing that set this date
    var idx = pr.points.map(function (x) { return x.mk; }).indexOf(pr.crossing);
    var cause = null;
    for (var i = 0; i <= idx && i < pr.points.length; i++) {
      pr.points[i].events.forEach(function (e) { if (e.kind === "ended") cause = e.name; });
    }
    var when = m == null ? ""
      : m <= 1 ? ", inside a month" 
      : ", " + (m < NUM_WORDS.length ? NUM_WORDS[m] : m) + " months from now";
    return "You run out in " + monthName(pr.crossing, true) + when +
      (cause ? " \u2014 after " + cause + " stops." : ".");
  }

  function outlookChart(pr, ghostPoints) {
    var pts = pr.points.map(function (x) {
      return {
        label: monthName(x.mk),
        value: x.balance,
        tip: monthName(x.mk, true) + "\n" + fmt(x.balance) +
          "\nin " + fmt(x.income, { round: true }) + " · out " + fmt(x.out, { round: true })
      };
    });
    var markIdx = pr.crossing == null ? null : pr.points.map(function (x) { return x.mk; }).indexOf(pr.crossing);
    return areaChart(pts, {
      cssHeight: 132, height: 42, baseZero: true,
      color: pr.crossing == null ? "var(--calm)" : "var(--alert)",
      mark: markIdx,
      ghost: ghostPoints || null,
      aria: "Projected balance over the next " + pr.horizon + " months"
    }) +
      '<div style="display:flex;justify-content:space-between;margin-top:0.4rem">' +
      '<span class="hint">' + esc(monthName(pr.points[0].mk, true)) + "</span>" +
      '<span class="hint">' + esc(monthName(pr.points[pr.points.length - 1].mk, true)) + "</span></div>";
  }

  // Contracts starting and stopping, bills ending, lump sums landing. Only the
  // months where something actually happens earn a line.
  function outlookEvents(pr) {
    var rows = [];
    pr.points.forEach(function (x) {
      x.events.forEach(function (e) {
        if (e.kind === "buy") return;      // the afford card explains itself
        var text =
          e.kind === "ended" ? esc(e.name) + " stops paying" +
            (e.renews != null && e.renews > 0 ? " \u2014 carried on at " + e.renews + "% from here" : "")
          : e.kind === "off" ? esc(e.name) + " switched off"
          : e.kind === "lump" ? esc(e.name) + " lands — " + fmt(e.amount, { round: true })
          : e.kind === "spend" ? esc(e.name) + " goes out — " + fmt(e.amount, { round: true })
          : e.kind === "billEnded" ? esc(e.name) + " ends — " + fmt(e.monthly || e.amount, { round: true }) + "/mo back"
          : e.kind === "billStarts" ? esc(e.name) + " starts — " + fmt(e.amount, { round: true }) + "/mo"
          : null;
        if (text) rows.push({ mk: x.mk, text: text, kind: e.kind });
      });
    });
    if (!rows.length) return "";
    return '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>What changes</h3>' +
      '<span class="sub">' + rows.length + (rows.length === 1 ? " thing" : " things") + "</span></div>" +
      '<div class="card-body flush"><div class="rows">' +
      rows.slice(0, 12).map(function (r) {
        var bad = r.kind === "ended" || r.kind === "off" || r.kind === "billStarts";
        return '<div class="row"><span class="row-title">' + r.text + "</span>" +
          '<span class="pill ' + (bad ? "warn" : "mute") + '">' + esc(monthName(r.mk, true)) + "</span></div>";
      }).join("") + "</div></div></div>";
  }

  // "What if the contract doesn't renew" — one switch per income line, rather
  // than a whole second plan to write and keep in step.
  function outlookIncomeCard() {
    var lines = projectionLines().filter(function (L) { return L.type === "income"; });
    if (!lines.length) {
      return '<div class="card pad" style="margin-top:1rem">' +
        '<span class="label">Income</span>' +
        '<p class="empty" style="margin:0.5rem 0 0.9rem">Nothing is scheduled to come in, so this projection is ' +
        'just your savings running down. Add what you are expecting and it will be worth reading.</p>' +
        '<button class="btn sm primary" data-act="plan-tab" data-id="income">Add income</button></div>';
    }
    return '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>What if this stops</h3>' +
      '<span class="sub">tap to leave one out</span></div>' +
      '<div class="card-body flush"><div class="rows">' +
      lines.map(function (L) {
        var isOff = !!outlookOff[L.id];
        var per = L.once ? fmt(L.base, { round: true }) + " once" : fmt(L.monthly, { round: true }) + "/mo";
        var bits = [per];
        if (L.confidence < 1) bits.push("counted at " + Math.round(L.confidence * 100) + "%");
        if (L.until) bits.push("until " + longDate(L.until));
        return '<div class="row stacked' + (isOff ? " muted" : "") + '">' +
          '<div class="stack-top"><span class="row-title">' + esc(L.name) + "</span>" +
          '<span class="row-fig">' + (isOff ? "—" : fmt(L.once ? L.base * L.confidence : L.monthly * L.confidence, { round: true })) + "</span></div>" +
          '<div class="stack-foot"><span class="row-sub">' + esc(bits.join(" · ")) + "</span>" +
          '<button class="btn sm' + (isOff ? " primary" : " quiet") + '" data-act="outlook-toggle" data-id="' + L.id + '">' +
          (isOff ? "Put it back" : "Leave it out") + "</button></div></div>";
      }).join("") + "</div></div></div>";
  }

  /* ---------------- can I afford it ----------------
     Never a yes or a no. "Yes" without saying what it costs you is the answer
     that gets people into trouble, and "no" is rarely true — the real question
     is which way of paying for it you can live with.

     So: run the projection once per funding route and put them side by side.
     Nothing here writes to the ledger; this is a question, not an entry. */

  // the reader's current question, held for as long as they are looking at it
  var afford = null;

  var AFFORD_FLOOR_MONTHS = 3;    // the default cushion, in months of true burn
  var AFFORD_MAX_HORIZON = 60;    // beyond five years it is not a purchase plan

  // The cushion you refuse to go under, in months of true burn. Settable,
  // because three months is my guess about someone else's nerve.
  function floorMonths() {
    var n = num(state.settings.floorMonths);
    return n > 0 ? n : AFFORD_FLOOR_MONTHS;
  }
  function savingsFloor() { return burnRate().rate * floorMonths(); }

  /* ---------------- money that is not already promised ----------------
     freeAssets() answers "what could I reach", which is the right numerator
     for a runway. It is the wrong one for "can I buy this": an EARMARKED
     pocket stays in it, and an earmarked pocket is exactly where a goal's
     savings sit. So the afford tool was offering up the Cyprus deposit as
     spending money for a car, and then reporting that the car was affordable
     because the deposit existed.

     Spare money is what is left once every promise is honoured. */
  function spareAssets() {
    return freeAssets() - goalsHeld() - savingsFloor();
  }

  /* What a month actually leaves you, if you keep to your plan.

     Outgoings use the BUDGET where a category has one and true burn where it
     does not, because "if I stick to my budgets, what is left" is the question
     being asked — and the two bases are reported separately, since a budget is
     aspiration and burn is behaviour and confusing them is how a surplus
     becomes a wish. */
  function plannedOutgoings() {
    var b = burnRate();
    var burn = b.rate;
    /* What the budgeted categories actually cost, averaged over the SAME
       months the burn rate is built from. Read from this month alone it is
       nothing on the 4th, and every budgeted category then got counted twice —
       once as its budget and again inside the burn. */
    var months = recentMonths(BURN_LOOKBACK, monthShift(thisMonth(), -1))
      .filter(function (mk) { return monthTx(mk).length > 0; });
    if (!months.length) months = [thisMonth()];
    var budgeted = 0, budgetedSpend = 0;
    Object.keys(state.budgets).forEach(function (cat) {
      budgeted += num(state.budgets[cat]);
      var t = 0;
      months.forEach(function (mk) { t += spendByCategory(mk)[cat] || 0; });
      budgetedSpend += t / months.length;
    });
    // whatever the budgets do not describe, taken from behaviour instead
    var unbudgeted = Math.max(0, burn - budgetedSpend);
    return { total: budgeted + unbudgeted, budgeted: budgeted, unbudgeted: unbudgeted, burn: burn };
  }

  function monthlyIncomeExpected() {
    var t = 0;
    projectionLines().forEach(function (L) {
      if (L.type !== "income" || L.once) return;
      if (L.until && L.until < today()) return;
      t += L.monthly * L.confidence;
    });
    return t;
  }

  // What is left every month once the plan is paid and the promises are kept.
  function monthlySurplus() {
    var income = monthlyIncomeExpected();
    var out = plannedOutgoings();
    var goals = goalsMonthlyNeed();
    return {
      income: income, out: out.total, goals: goals,
      surplus: income - out.total - goals,
      basis: out
    };
  }

  // Months of cover left at the end of a projection, which is what actually
  // decides whether a route is survivable.
  // Months of cover left at the end of a projection.
  function coverAfter(pr) {
    if (pr.crossing != null) return 0;
    var last = pr.points[pr.points.length - 1];
    return pr.burn > 0 ? last.balance / pr.burn : Infinity;
  }

  /* ---------------- what a purchase actually costs ----------------

     The first version of this asked "will it bankrupt me". Almost nothing
     does, so it said yes to everything — and worse, it answered out of
     freeAssets(), which contains the money already sitting in goal pockets.
     It was offering up the deposit to buy the car, then calling the car
     affordable because the deposit existed.

     What you want to know before a large purchase is what it COSTS: how much
     comes out of what you earn, how much has to be dug out of savings, and
     which promise moves as a result. Every route reports those, and the
     recommendation is the one that costs least rather than the one that
     survives longest. */

  // How far a goal slips if `taken` is pulled out of it, or if a monthly
  // amount is diverted away from it.
  function goalDelay(g, taken, divertedPerMonth) {
    var need = goalNeed(g);
    if (need.done || !g.due) return null;
    var pace = need.need;
    if (!(pace > 0)) return null;
    var after = Math.max(0, pace - num(divertedPerMonth));
    var left = need.left + num(taken);
    var nowMonths = after > 0 ? left / after : Infinity;
    var slip = nowMonths - need.months;
    if (!(slip > 0.25)) return null;            // under a week either way is noise
    return {
      name: g.name,
      slip: slip,
      broken: !isFinite(nowMonths),
      nowOn: isFinite(nowMonths) ? monthShift(thisMonth(), Math.ceil(nowMonths)) : null
    };
  }

  // Which goals a raid on savings lands on. The goal furthest from its date
  // gives way first, because it has the most room to recover.
  function goalsHitBy(fromSavings) {
    if (!(fromSavings > 0.005)) return [];
    var pool = state.goals.filter(function (g) { return !goalNeed(g).done; })
      .sort(function (x, y) {
        var a = goalNeed(x).months, b = goalNeed(y).months;
        return (b == null ? 1e9 : b) - (a == null ? 1e9 : a);
      });
    var out = [], left = fromSavings;
    pool.forEach(function (g) {
      if (left <= 0.005) return;
      var take = Math.min(Math.min(goalSaved(g), num(g.target)), left);
      if (take <= 0.005) return;
      left -= take;
      out.push({ goal: g, taken: take, delay: goalDelay(g, take, 0) });
    });
    return out;
  }

  /* How much surplus actually accumulates over the next `months`, walked month
     by month rather than multiplied, because income stops. Multiplying today's
     surplus promised twenty-six months of saving out of a contract with nine
     months left in it — and made two routes contradict each other, one saying
     the income covered it and the other saying it never would. Every route
     that talks about money over time reads this. */
  function surplusOver(months, flow) {
    var out = flow.out + flow.goals;
    var lines = projectionLines();
    var pot = 0, hit = null;
    for (var i = 1; i <= months; i++) {
      var mk = monthShift(thisMonth(), i);
      var mkStart = mk + "-01", mkEnd = lastDayOf(mk);
      var income = 0;
      lines.forEach(function (L) {
        if (L.type !== "income") return;
        if (L.once) {
          if (L.startsOn && monthOf(L.startsOn) === mk) income += L.base * L.confidence;
          return;
        }
        if (L.startsOn && L.startsOn > mkEnd) return;
        if (L.until && L.until < mkStart) return;
        income += L.monthly * L.confidence;
      });
      pot += income - out;
      if (hit == null && pot >= 0) hit = pot;
    }
    return Math.max(0, pot);
  }

  // The earliest month the whole thing is payable out of surplus alone.
  function firstMonthFromIncome(total, flow) {
    for (var i = 1; i <= AFFORD_MAX_HORIZON; i++) {
      if (surplusOver(i, flow) >= total) return i;
    }
    return null;
  }

  /* Every way of paying for it. `a` is
     { amount, currency, rate, base, months, markup, date, budgetCat,
       budgetCut }. */
  function affordRoutes(a) {
    var total = a.base;
    var spare = spareAssets();
    var flow = monthlySurplus();
    var surplus = flow.surplus;
    var n = Math.max(2, Math.round(num(a.months) || 6));
    var routes = [];

    function route(o) {
      o.fromIncome = num(o.fromIncome);
      o.fromSavings = num(o.fromSavings);
      // spare money is savings too, but nothing is waiting on it. Only what
      // goes beyond it lands on a promise.
      o.raid = Math.max(0, o.fromSavings - Math.max(0, spare));
      o.hits = o.blocked ? [] : goalsHitBy(o.raid);
      // a monthly commitment larger than the surplus eats into what the goals
      // were being fed, which slows all of them at once
      o.divertDelays = [];
      if (!o.blocked && o.monthly > 0) {
        var over = Math.max(0, o.monthly - Math.max(0, surplus));
        if (over > 0) {
          state.goals.forEach(function (g) {
            var d = goalDelay(g, 0, Math.min(over, goalNeed(g).need));
            if (d) o.divertDelays.push(d);
          });
        }
      }
      o.underFloor = !o.blocked && (spare - o.fromSavings) < 0;
      routes.push(o);
      return o;
    }

    // 1. straight out of money nothing is waiting on
    route({
      id: "spare", label: "Out of spare money",
      detail: spare >= total
        ? fmt(spare, { round: true }) + " is spare once your goals and your cushion are covered"
        : spare > 0
          ? "Only " + fmt(spare, { round: true }) + " is spare, so " +
            fmt(total - spare, { round: true }) + " of this digs into what you have put aside"
          : "Nothing is spare once your goals and your cushion are covered",
      monthly: 0, fromIncome: 0, fromSavings: total, paid: total, blocked: false
    });

    // 2. put the surplus aside until it covers the thing. This and "wait and
    //    pay outright" were the same act described twice: you cannot pay a
    //    seller monthly without their instalment plan, which is its own route.
    var monthsFromIncome = firstMonthFromIncome(total, flow);
    route({
      id: "income", label: "Save up and buy it",
      detail: surplus <= 0
        ? "You have no surplus once your plan and your goals are paid"
        : monthsFromIncome == null
          ? "Your income does not add up to it inside five years \u2014 at " +
            fmt(surplus, { round: true }) + " a month now, and less once your contracts end"
          : "Put by " + fmt(total / monthsFromIncome, { round: true }) + " a month of your " +
            fmt(surplus, { round: true }) + " surplus and buy it in " +
            monthName(monthShift(thisMonth(), monthsFromIncome), true) +
            ", touching nothing you have saved",
      monthly: monthsFromIncome ? total / monthsFromIncome : 0,
      months: monthsFromIncome,
      fromIncome: total, fromSavings: 0, paid: total,
      blocked: surplus <= 0 || monthsFromIncome == null
    });

    // 3. some now, the rest as you earn it — the bite, quantified both ways
    var earnedOverN = surplusOver(n, flow);
    var bite = Math.max(0, total - earnedOverN);
    route({
      id: "split", label: "Some now, the rest monthly",
      detail: bite <= 0.005
        ? "What you earn covers it over " + n + " months without touching savings"
        : fmt(bite, { round: true }) + " out of savings now, then " +
          fmt((total - bite) / n, { round: true }) + " a month for " + n,
      monthly: (total - bite) / n, months: n,
      fromIncome: total - bite, fromSavings: bite, paid: total, blocked: false
    });

    // 4. instalments, with whatever the plan charges on top
    var paid = total * (1 + (num(a.markup) || 0) / 100);
    route({
      id: "spread", label: n + " monthly payments",
      detail: fmt(paid / n, { round: true }) + " a month for " + n +
        (paid - total > 0.5
          ? " — " + fmt(paid, { round: true }) + " all in, " +
            fmt(paid - total, { round: true }) + " more than the price"
          : "") +
        (paid > earnedOverN
          ? ", which is " + fmt(paid - earnedOverN, { round: true }) + " more than you earn over those " + n
          : ""),
      monthly: paid / n, months: n,
      fromIncome: Math.min(paid, earnedOverN),
      fromSavings: Math.max(0, paid - earnedOverN),
      paid: paid, overpay: paid - total, blocked: false
    });

    // 5. spend less every month instead
    var cut = num(a.budgetCut);
    if (a.budgetCat && cut > 0) {
      var trimMonths = Math.ceil(total / cut);
      var tooSlow = trimMonths > AFFORD_MAX_HORIZON;
      route({
        id: "trim", label: "Trim " + a.budgetCat,
        detail: tooSlow
          ? fmt(cut, { round: true }) + " a month less on " + a.budgetCat + " would take " +
            trimMonths + " months — too far out to be a plan"
          : fmt(cut, { round: true }) + " a month less on " + a.budgetCat + " covers it in " +
            trimMonths + (trimMonths === 1 ? " month" : " months") + ", lifting your surplus to " +
            fmt(surplus + cut, { round: true }),
        // the cut pays for it, so nothing is diverted from anything else
        monthly: 0, months: trimMonths,
        fromIncome: total, fromSavings: 0, paid: total, blocked: tooSlow
      });
    }

    routes.spare = spare;
    routes.flow = flow;
    return routes;
  }

  // What a route costs, in the only two currencies that matter here.
  function routeCost(r) {
    var slips = r.hits.filter(function (h) { return h.delay; })
      .map(function (h) { return h.delay; })
      .concat(r.divertDelays || []);
    var worst = slips.slice().sort(function (x, y) { return y.slip - x.slip; })[0] || null;
    return {
      savings: r.fromSavings, slips: slips, worst: worst,
      broken: slips.some(function (d) { return d.broken; })
    };
  }

  function routeVerdict(r) {
    if (r.blocked) return { tone: "mute", text: "not open to you" };
    var c = routeCost(r);
    if (c.broken) return { tone: "bad", text: "breaks a goal" };
    // the pill always answers "what does it cost"; the cushion warning has
    // room to explain itself in the breakdown
    if (r.underFloor) return { tone: "bad", text: fmt(r.raid, { round: true }) + " out of promises" };
    if (c.worst) return { tone: "warn", text: c.worst.name + " slips " + Math.round(c.worst.slip) + "mo" };
    if (r.raid > 0.005) return { tone: "warn", text: fmt(r.raid, { round: true }) + " out of promises" };
    if (r.fromSavings > 0.005) return { tone: "ok", text: "out of spare money" };
    return { tone: "ok", text: "out of what you earn" };
  }

  // Cheapest first: nothing broken, then least out of savings, then least delay.
  function rankRoutes(routes) {
    return routes.filter(function (r) { return !r.blocked; }).slice().sort(function (x, y) {
      var cx = routeCost(x), cy = routeCost(y);
      if (cx.broken !== cy.broken) return cx.broken ? 1 : -1;
      if (x.underFloor !== y.underFloor) return x.underFloor ? 1 : -1;
      var sx = cx.worst ? cx.worst.slip : 0, sy = cy.worst ? cy.worst.slip : 0;
      if (Math.abs(sx - sy) > 0.25) return sx - sy;
      if (Math.abs(x.raid - y.raid) > 0.5) return x.raid - y.raid;
      if (Math.abs(x.fromSavings - y.fromSavings) > 0.5) return x.fromSavings - y.fromSavings;
      return x.paid - y.paid;
    });
  }

  function affordSentence(best) {
    if (!best) return "There is no way to pay for this that leaves your plans standing.";
    var c = routeCost(best);
    var lead = best.label.toLowerCase();
    if (c.broken) return "The kindest route is " + lead + ", and it still breaks " + c.worst.name + ".";
    if (best.fromSavings <= 0.005 && !c.worst) {
      return "Yes — " + lead +
        (best.months && best.monthly > 0
          ? ", " + fmt(best.monthly, { round: true }) + " a month for " + best.months
          : "") +
        ", and nothing you are saving for moves.";
    }
    if (best.fromSavings > 0.005 && c.worst) {
      return "Only by taking " + fmt(best.fromSavings, { round: true }) +
        " out of savings, which pushes " + c.worst.name + " back " + Math.round(c.worst.slip) +
        (Math.round(c.worst.slip) === 1 ? " month" : " months") + ".";
    }
    if (best.fromSavings > 0.005) {
      return "Yes, but " + fmt(best.fromSavings, { round: true }) +
        " of it comes out of savings rather than out of what you earn.";
    }
    return "Yes — " + lead + ", though it pushes " + c.worst.name + " back " +
      Math.round(c.worst.slip) + (Math.round(c.worst.slip) === 1 ? " month" : " months") + ".";
  }

  function affordCard() {
    if (!afford) return "";
    var a = afford;

    function shell(inner) {
      return '<div class="card pad" style="margin-top:1rem">' +
        '<div class="card-head" style="padding:0"><h3>' + esc(a.label || "That purchase") + "</h3>" +
        '<button class="ibtn" data-act="afford-clear" aria-label="Close">×</button></div>' + inner + "</div>";
    }

    // The money rules: no income means no honest answer, and a made-up date is
    // worse than an admitted gap.
    var probe = projectForward(PROJECT_MONTHS, { off: outlookOff });
    if (!probe.hasSchedule) {
      return shell('<p class="lead" style="color:var(--warn)">There is no income booked, so there is no ' +
        "honest answer to give.</p>" +
        '<p class="band-sub">Every route would just be your savings going down by ' +
        fmt(a.base, { round: true }) + ". Add what you are expecting under Plan › Income and ask again.</p>");
    }
    if (!(burnRate().rate > 0)) {
      return shell('<p class="lead" style="color:var(--warn)">Nothing is logged yet, so there is no running ' +
        "cost to measure this against.</p>" +
        '<p class="band-sub">Log a few weeks of spending and this becomes worth reading.</p>');
    }

    var routes = affordRoutes(a);
    var ranked = rankRoutes(routes);
    var best = ranked[0] || null;
    var chosen = a.route && routes.filter(function (r) { return r.id === a.route; })[0];
    var showing = (chosen && !chosen.blocked) ? chosen : best;
    var flow = routes.flow;

    var bc = best ? routeCost(best) : null;
    var tone = !best ? "alert"
      : (bc.broken || best.underFloor) ? "alert"
      : (best.fromSavings > 0.005 || bc.worst) ? "warn" : "calm";

    var html = '<div class="card" style="margin-top:1rem"><div class="card-head">' +
      "<h3>" + esc(a.label || "Can I afford it") + "</h3>" +
      '<span class="sub">' + fmt(a.base, { round: true }) +
      (isForeign(a.currency) ? " · " + esc(fmtIn(a.amount, a.currency)) : "") + "</span>" +
      '<button class="ibtn" data-act="afford-clear" aria-label="Clear this question">×</button></div>' +
      '<div class="card-body">';

    html += '<p class="lead" style="color:var(--' + tone + ')">' + esc(affordSentence(best)) + "</p>";

    // the two figures every route is judged against, stated once
    html += '<div class="split" style="margin-top:0.8rem">' +
      '<div class="split-row"><span>Spare after goals and cushion</span><span class="fig">' +
      fmt(routes.spare, { round: true }) + "</span></div>" +
      '<div class="split-row"><span>Left over each month</span><span class="fig">' +
      fmt(flow.surplus, { round: true }) + "</span></div></div>" +
      '<p class="hint">' + fmt(flow.income, { round: true }) + " expected in, less " +
      fmt(flow.out, { round: true }) +
      (flow.basis.budgeted > 0
        ? " of plan (" + fmt(flow.basis.budgeted, { round: true }) + " budgeted, " +
          fmt(flow.basis.unbudgeted, { round: true }) + " from how you actually spend)"
        : " from how you actually spend") +
      (flow.goals > 0 ? ", less " + fmt(flow.goals, { round: true }) + " your goals need" : "") + ".</p>";

    html += '<div class="afford-rows">' + routes.map(function (r) {
      var v = routeVerdict(r);
      var on = showing && r.id === showing.id;
      return '<button class="afford-row' + (on ? " on" : "") + (r.blocked ? " off" : "") + '" ' +
        'data-act="afford-route" data-id="' + r.id + '">' +
        '<span class="afford-name">' + esc(r.label) + "</span>" +
        '<span class="pill ' + v.tone + '">' + esc(v.text) + "</span>" +
        '<span class="afford-detail">' + esc(r.detail) + "</span>" +
        "</button>";
    }).join("") + "</div>";

    if (showing) html += affordBreakdown(showing);

    html += "</div></div>";
    return html;
  }

  // What the chosen route costs, spelled out rather than scored.
  function affordBreakdown(r) {
    var c = routeCost(r);
    var rows = [];
    if (r.fromIncome > 0.005) {
      rows.push(["Out of what you earn", fmt(r.fromIncome, { round: true }) +
        (r.months ? " over " + r.months + (r.months === 1 ? " month" : " months") : "")]);
    }
    if (r.fromSavings > 0.005) {
      rows.push(["Out of savings", fmt(r.fromSavings, { round: true }) +
        (r.raid > 0.005 && r.raid < r.fromSavings - 0.005
          ? " (" + fmt(r.raid, { round: true }) + " of it promised)" : "")]);
    }
    if (r.overpay > 0.5) rows.push(["Cost of spreading it", fmt(r.overpay, { round: true })]);

    var goalLines = c.slips.length
      ? c.slips.map(function (d) {
          return '<p class="notice warn" style="margin:0.3rem 0 0">' + esc(d.name) +
            (d.broken
              ? " <b>would not be reached at all</b>."
              : " slips about <b>" + Math.round(d.slip) +
                (Math.round(d.slip) === 1 ? " month" : " months") + "</b>" +
                (d.nowOn ? ", to " + esc(monthName(d.nowOn, true)) : "") + ".") + "</p>";
        }).join("")
      : '<p class="hint" style="margin:0.4rem 0 0">Nothing you are saving for moves.</p>';

    return '<p class="label" style="margin-top:1rem">What that costs</p>' +
      '<div class="split" style="margin-top:0.4rem">' +
      rows.map(function (x) {
        return '<div class="split-row"><span>' + esc(x[0]) + '</span><span class="fig">' + x[1] + "</span></div>";
      }).join("") + "</div>" +
      goalLines +
      (r.underFloor
        ? '<p class="notice warn" style="margin:0.3rem 0 0">This takes you under the ' + floorMonths() +
          "-month cushion you set.</p>"
        : "");
  }
  function outlookBody() {
    if (!state.accounts.length && !state.transactions.length) return firstRunCard();

    var pr = projectForward(PROJECT_MONTHS, { off: outlookOff });
    var anyOff = Object.keys(outlookOff).some(function (k) { return outlookOff[k]; });
    // when something is switched off, show where the line was as a ghost;
    // otherwise show where it goes once your goals are actually funded, which
    // is the gap between what you have and what is already promised
    var ghost = null, ghostIs = null;
    if (anyOff) {
      ghost = projectForward(PROJECT_MONTHS, {}).points.map(function (x) { return x.balance; });
      ghostIs = "where you were before leaving income out";
    } else if (goalsMonthlyNeed() > 0) {
      ghost = projectForward(PROJECT_MONTHS, { off: outlookOff, holdGoals: true })
        .points.map(function (x) { return x.balance; });
      ghostIs = "what is left once your goals are fed";
    }

    /* Green means a healthy state and nothing else. Not running out inside the
       horizon is not the same as being fine: a line that ends on under three
       months of cover is drift, and colouring it calm would be the reassuring
       half of a sentence that says otherwise. */
    var endCover = coverAfter(pr);
    var tone = pr.crossing != null
      ? (projectedMonths(pr) >= 6 ? "warn" : "alert")
      : (endCover >= floorMonths() ? "calm" : "warn");
    var html = '<div class="card pad">' +
      '<span class="label">The next ' + pr.horizon + ' months</span>' +
      '<p class="lead" style="color:var(--' + tone + ')">' + esc(outlookSentence(pr)) + "</p>" +
      '<p class="band-sub">Starting from ' + fmt(pr.start, { round: true }) + ' reachable, at ' +
      fmt(pr.burn, { round: true }) + " a month" +
      (pr.basis && pr.basis.partial
        ? " · burn from only " + pr.basis.months + " month" + (pr.basis.months === 1 ? "" : "s") + " of data"
        : "") + "</p>" +
      '<div style="margin-top:0.9rem">' + outlookChart(pr, ghost) + "</div>" +
      (ghostIs ? '<p class="band-sub" style="margin-top:0.5rem">The dashed line is ' + esc(ghostIs) +
        ".</p>" : "") +
      '<div class="btn-row" style="margin-top:0.9rem">' +
      '<button class="btn sm primary" data-act="afford-open">Can I afford something?</button></div>' +
      "</div>";

    html += affordCard();
    html += outlookEvents(pr);
    html += outlookIncomeCard();

    html += '<p class="hint" style="margin-top:1rem;padding:0 0.35rem">This is scheduled money only — nothing here is ' +
      "averaged from what you earned before. Work you have not written down does not appear.</p>";
    return html;
  }

  function accountsCard() {
    // A heading only earns its line when it actually collects something. One
    // account under its own "Whish \u2014 1 account" heading was three lines of
    // furniture wrapped around a single row, three times over; that is what
    // made this card read as clutter. So: places holding two or more accounts
    // get a heading and a subtotal, and everything else falls into one plain
    // list with its place written into the row instead.
    var live = openAccounts();
    var shut = state.accounts.filter(function (a) { return a.closed; });

    var byGroup = {}, seen = [];
    live.forEach(function (a) {
      var g = (a.group || "").trim();
      if (!g) return;
      if (!byGroup[g]) { byGroup[g] = []; seen.push(g); }
      byGroup[g].push(a);
    });
    var headed = seen.filter(function (g) { return byGroup[g].length > 1; }).sort(function (x, y) {
      return x.localeCompare(y);
    });
    var isHeaded = {};
    headed.forEach(function (g) { isHeaded[g] = true; });
    var loose = live.filter(function (a) { return !isHeaded[(a.group || "").trim()]; });

    function sumOfAccounts(list) {
      return list.reduce(function (t, a) { return t + balanceOf(a); }, 0);
    }
    function head(name, count, total) {
      return '<div class="grp-head"><span class="grp-name">' + esc(name) + "</span>" +
        '<span class="grp-sub">' + esc(count) + "</span>" +
        '<span class="grp-fig' + (total < 0 ? " loss" : "") + '">' + fmt(total) + "</span></div>";
    }

    function accountRow(a, showPlace) {
      var bal = balanceOf(a);
      var pockets = pocketsOf(a);
      var bits = [];
      // in the loose list nothing above the row says where it is held, so the
      // place goes in the row itself rather than being lost with the heading
      if (showPlace && (a.group || "").trim()) bits.push((a.group || "").trim());
      bits.push(a.type);
      if (pockets.length) bits.push(pockets.length + (pockets.length === 1 ? " pocket" : " pockets"));

      // An account carrying history offers Close, not Delete: deleting it
      // would take every transaction with it, which is exactly the trap this
      // is here to avoid. Delete stays on the ones with nothing to lose, and
      // on closed accounts, where the warning has already been read.
      var used = state.transactions.some(function (t) {
        return t.accountId === a.id || t.toAccountId === a.id;
      }) || state.recurring.some(function (r) { return r.accountId === a.id; });

      var html = '<div class="row"><div class="row-main">' +
        '<div class="row-title">' + esc(a.name) + "</div>" +
        '<div class="row-sub">' + esc(bits.join(" \u00b7 ")) + "</div></div>" +
        '<div class="row-end"><span class="row-fig' + (bal < 0 ? " loss" : "") + '">' + fmt(bal) + "</span>" +
        '<button class="ibtn" data-act="pocket-add" data-id="' + a.id + '" aria-label="Add a pocket to ' + esc(a.name) + '" title="Add a pocket">+</button>' +
        '<button class="ibtn" data-act="account-edit" data-id="' + a.id + '" aria-label="Edit ' + esc(a.name) + '" title="Edit">\u270e</button>' +
        (used
          ? '<button class="ibtn" data-act="account-close" data-id="' + a.id + '" aria-label="Close ' + esc(a.name) + '" title="Close, keeping its history">\u2298</button>'
          : '<button class="ibtn danger" data-act="account-del" data-id="' + a.id + '" aria-label="Delete ' + esc(a.name) + '" title="Delete">\u2715</button>') +
        "</div></div>";

      if (pockets.length) {
        var left = unallocatedOf(a);
        html += pockets.map(function (p) {
          var pb = pocketBalance(a, p);
          var st = pocketStatus(p);
          return '<div class="row pocket"><div class="row-main">' +
            '<div class="row-title">' + esc(p.name) + "</div>" +
            '<div class="row-sub">' + esc(POCKET_STATUS_LABEL[st]) +
            (st === "committed" ? " · not counted toward your runway" : "") + "</div></div>" +
            '<div class="row-end"><span class="row-fig' + (pb < 0 ? " loss" : "") + '">' + fmt(pb) + "</span>" +
            '<button class="ibtn" data-act="pocket-edit" data-id="' + a.id + "|" + p.id + '" aria-label="Edit ' + esc(p.name) + '" title="Edit">\u270e</button>' +
            '<button class="ibtn danger" data-act="pocket-del" data-id="' + a.id + "|" + p.id + '" aria-label="Remove ' + esc(p.name) + '" title="Remove">\u2715</button>' +
            "</div></div>";
        }).join("");
        // the leftover is shown rather than hidden, so the pockets always
        // visibly add up to the account
        if (Math.abs(left) > 0.005) {
          html += '<div class="row pocket"><div class="row-main">' +
            '<div class="row-title" style="color:var(--dim)">Unallocated</div></div>' +
            '<div class="row-end"><span class="row-fig' + (left < 0 ? " loss" : "") + '" style="color:var(--dim)">' + fmt(left) + "</span></div></div>";
        }
      }
      return html;
    }

    function closedRow(a) {
      var bal = balanceOf(a);
      var count = state.transactions.filter(function (t) {
        return t.accountId === a.id || t.toAccountId === a.id;
      }).length;
      var bits = [];
      if ((a.group || "").trim()) bits.push((a.group || "").trim());
      bits.push(count + (count === 1 ? " entry kept" : " entries kept"));
      if (a.closedOn) bits.push("closed " + a.closedOn);
      return '<div class="row"><div class="row-main">' +
        '<div class="row-title" style="color:var(--dim)">' + esc(a.name) + "</div>" +
        '<div class="row-sub">' + esc(bits.join(" \u00b7 ")) + "</div></div>" +
        '<div class="row-end"><span class="row-fig' + (bal < 0 ? " loss" : "") +
        '"' + (Math.abs(bal) < 0.005 ? ' style="color:var(--dim)"' : "") + ">" + fmt(bal) + "</span>" +
        '<button class="ibtn" data-act="account-open" data-id="' + a.id + '" aria-label="Reopen ' + esc(a.name) + '" title="Reopen">\u21ba</button>' +
        '<button class="ibtn danger" data-act="account-del" data-id="' + a.id + '" aria-label="Delete ' + esc(a.name) + '" title="Delete for good">\u2715</button>' +
        "</div></div>";
    }

    var rows = "";
    headed.forEach(function (g) {
      var list = byGroup[g];
      rows += head(g, list.length + " accounts", sumOfAccounts(list)) +
        '<div class="rows">' + list.map(function (a) { return accountRow(a, false); }).join("") + "</div>";
    });
    if (loose.length) {
      // a heading over the loose list is only worth it when something above it
      // is headed too; on its own it would be a label with nothing to contrast
      if (headed.length) {
        rows += head("Elsewhere", loose.length + (loose.length === 1 ? " account" : " accounts"), sumOfAccounts(loose));
      }
      rows += '<div class="rows">' + loose.map(function (a) { return accountRow(a, true); }).join("") + "</div>";
    }
    if (!live.length) rows = shut.length ? "" : '<p class="empty">No accounts yet.</p>';
    if (shut.length) {
      rows += head("Closed", shut.length + (shut.length === 1 ? " account" : " accounts"), sumOfAccounts(shut)) +
        '<div class="rows">' + shut.map(closedRow).join("") + "</div>";
    }

    return '<div class="card"><div class="card-head"><h3>Accounts</h3>' +
      '<div class="btn-row"><button class="btn sm" data-act="transfer-add">Transfer</button>' +
      '<button class="btn sm primary" data-act="account-add">Add</button></div></div>' +
      '<div class="card-body flush">' + rows + "</div></div>";
  }

  function billsCard() {
    var up = upcomingBills(14);
    var load = recurringMonthlyLoad();
    var body = up.length
      ? '<div class="rows">' + up.map(function (r) {
          var d = daysUntil(r.nextDate);
          var tone = d < 0 ? "bad" : d <= 3 ? "warn" : "mute";
          var when = d < 0 ? Math.abs(d) + "d overdue" : d === 0 ? "today" : "in " + d + "d";
          return '<div class="row"><div class="row-main">' +
            '<div class="row-title">' + esc(r.name) + "</div>" +
            '<div class="row-sub">' + esc(r.category) + " · " + esc(FREQ_LABEL[r.frequency] || r.frequency) + " · " + esc(accountName(r.accountId)) + "</div></div>" +
            '<div class="row-end"><span class="row-fig ' + (r.type === "income" ? "gain" : "") + '">' +
            (r.type === "income" ? "+" : "−") + fmt(toBase(r.amount, r.currency, r.rate)).replace("-", "") +
            (isForeign(r.currency) ? '<span class="fx">' + esc(fmtIn(r.amount, r.currency)) + "</span>" : "") + "</span>" +
            '<span class="pill ' + tone + '">' + when + "</span>" +
            '<button class="btn sm" data-act="recur-pay" data-id="' + r.id + '">Log</button>' +
            "</div></div>";
        }).join("") + "</div>"
      : '<p class="empty">Nothing due in the next two weeks.' +
        (state.recurring.length ? "" : " <strong>Add your rent, subscriptions and bills</strong> to see them tracked here.") + "</p>";

    // The two recurring cards live on Budgets, which is not where anyone looks
    // for their salary — give this card a way through to them.
    return '<div class="card"><div class="card-head"><h3>Due soon</h3>' +
      '<button class="btn sm" data-act="plan-tab" data-id="bills">Manage bills</button>' +
      '<span class="sub">' + (load.expense > 0 || load.income > 0
        ? [load.expense > 0 ? fmt(load.expense, { round: true }) + "/mo out" : "",
           load.income > 0 ? fmt(load.income, { round: true }) + "/mo in" : ""].filter(Boolean).join(" · ")
        : "next 14 days") + "</span></div>" +
      '<div class="card-body flush">' + body + "</div></div>";
  }

  /* ============================================================
     LEDGER
     ============================================================ */

  /* Typing a number searches the figures, not just the words. `400` found
     nothing at all before, which is the one thing everybody tries first. Half
     a unit of tolerance, because $399.99 is the number you think of as 400,
     and both sides of every figure are checked — the base one and the one you
     actually handed over, since with lira it is the second you remember. */
  var AMOUNT_TOL = 0.5;
  function queryAmount(text) {
    // a number is only a number when the whole query is one: "Room 400" is a
    // description, and matching it against amounts would be noise
    var q = String(text == null ? "" : text).trim().replace(/[,\s]/g, "").replace(/^[^\d.]+/, "");
    if (!/^\d+(\.\d+)?$/.test(q)) return null;
    var n = parseFloat(q);
    return isFinite(n) && n > 0 ? n : null;
  }
  function matchesAmount(t, text) {
    var q = queryAmount(text);
    if (q == null) return false;
    function near(v) { return Math.abs(num(v) - q) < AMOUNT_TOL; }
    if (near(txBase(t)) || near(t.amount)) return true;
    if (t.toAmount != null && (near(t.toAmount) || near(txBaseIn(t)))) return true;
    return (t.splits || []).some(function (sp) { return near(sp.amount); });
  }

  function filteredTx() {
    return state.transactions.filter(function (t) {
      if (filters.type !== "all" && t.type !== filters.type) return false;
      // a split entry belongs to every category it was split across
      if (filters.category !== "all" && txParts(t).every(function (pt) {
        return pt.category !== filters.category;
      })) return false;
      if (filters.account !== "all" && t.accountId !== filters.account && t.toAccountId !== filters.account) return false;
      if (filters.from && t.date < filters.from) return false;
      if (filters.to && t.date > filters.to) return false;
      if (filters.text) {
        var q = filters.text.toLowerCase();
        var inCat = txParts(t).some(function (pt) {
          return (pt.category || "").toLowerCase().indexOf(q) > -1;
        });
        if (!inCat && (t.desc || "").toLowerCase().indexOf(q) === -1 &&
            !matchesAmount(t, filters.text)) return false;
      }
      return true;
    }).sort(function (a, b) { return b.date.localeCompare(a.date) || b.id.localeCompare(a.id); });
  }

  // Summary line and table are separate so the search box can refresh just
  // the rows without rebuilding (and re-parsing) the whole screen.
  function ledgerSummaryHtml(rows) {
    var shownIn = rows.reduce(function (s, t) { return t.type === "income" ? s + txBase(t) : s; }, 0);
    var shownOut = rows.reduce(function (s, t) { return t.type === "expense" ? s + txBase(t) : s; }, 0);
    return "In " + fmt(shownIn, { round: true }) +
      " · Out " + fmt(shownOut, { round: true }) +
      " · Net " + fmt(shownIn - shownOut, { round: true, signed: true }) +
      " · " + rows.length + " of " + state.transactions.length + " shown";
  }

  /* The ledger was a five-column table in a horizontal scroller. On a 390px
     phone the description column — the one thing that says what an entry was —
     sat off the left edge, and you had to scroll sideways to read your own
     spending. It is now stacked rows in a card, the same shape Worth and
     "Owed back to you" already use: what and how much on top, where and when
     underneath. */
  function ledgerRowHtml(t) {
    var isTransfer = t.type === "transfer";
    var exchanged = isTransfer && t.toAmount != null;
    var base = txBase(t);
    var amt = isTransfer ? fmt(base) : (t.type === "income" ? "+" : "−") + fmt(base).replace("-", "");
    // a foreign entry shows the amount you actually handed over, small, under
    // the converted figure — otherwise the ledger stops matching the receipt.
    // An exchange shows both sides, because one figure cannot describe it.
    if (exchanged) {
      amt += '<span class="fx">' + esc(fmtIn(t.amount, t.currency) + " \u2192 " +
        fmtIn(t.toAmount, t.toCurrency || t.currency)) + "</span>";
    } else if (isForeign(t.currency)) {
      amt += '<span class="fx">' + esc(fmtIn(t.amount, t.currency)) + "</span>";
    }
    /* What the exchange cost, stated on the row. Not amber: a spread is a
       fact about a rate, not drift and not an error. */
    var spread = exchanged ? txSpread(t) : 0;
    var spreadPill = Math.abs(spread) < 0.005 ? "" :
      '<span class="pill mute">' + esc(spread > 0
        ? fmt(spread) + " to exchange"
        : fmt(-spread) + " better than stored") + "</span>";

    var where = isTransfer
      ? esc(accountName(t.accountId, t.pocketId)) + " → " + esc(accountName(t.toAccountId, t.toPocketId))
      : esc(accountName(t.accountId, t.pocketId));
    /* A split entry names every category it was filed under. Two fit on the
       sub line at 390px; past that the row would wrap into a paragraph, so the
       rest are counted and the dialog holds the detail. */
    function catTag(c) {
      return '<span class="cat-tag"><span class="cat-dot" style="background:' + catColor(c) +
        '"></span>' + esc(c) + "</span>";
    }
    var parts = txParts(t);
    var cat = isTransfer
      ? '<span class="pill mute">Transfer</span>'
      : parts.slice(0, 2).map(function (pt) { return catTag(pt.category); }).join(" + ") +
        (parts.length > 2 ? ' <span class="pill mute">+' + (parts.length - 2) + " more</span>" : "");

    return '<div class="row stacked">' +
      '<div class="stack-top">' +
      '<span class="row-title">' + esc(t.desc || "—") + "</span>" +
      '<span class="row-fig' + (t.type === "income" ? " gain" : "") + '">' + amt + "</span></div>" +
      '<div class="stack-foot">' +
      '<span class="row-sub">' + cat + " · " + where + "</span>" +
      spreadPill +
      (isPending(t) ? '<span class="pill warn">owed back</span>' : "") +
      (t.settledOn ? '<span class="pill ok">refunded</span>' : "") +
      (t.grantId && !t.grantAward ? '<span class="pill mute">grant</span>' : "") +
      (t.oneOff ? '<span class="pill mute">one-off</span>' : "") +
      '<span class="card-tools">' +
      '<button class="ibtn' + (hasPhoto(t.id) ? " on" : "") + '" data-act="tx-photo" data-id="' + t.id +
        '" aria-label="' + (hasPhoto(t.id) ? "View receipt" : "Attach a receipt") + '" title="' +
        (hasPhoto(t.id) ? "View receipt" : "Attach a receipt") + '">▣</button>' +
      (t.refundable
        ? '<button class="ibtn' + (t.settledOn ? " on" : "") + '" data-act="tx-settle" data-id="' + t.id +
          '" aria-label="' + (t.settledOn ? "Mark as still owed" : "Record the money coming back") + '" title="' +
          (t.settledOn ? "Refunded on " + t.settledOn + " — click to undo" : "Record the money coming back") +
          '">↩</button>'
        : "") +
      (canSplit(t)
        ? '<button class="ibtn' + (isSplit(t) ? " on" : "") + '" data-act="tx-split" data-id="' + t.id +
          '" aria-label="Split across categories" title="' +
          (isSplit(t) ? "Split across " + parts.length + " categories \u2014 click to change" : "Split across categories") +
          '">\u25E7</button>'
        : "") +
      '<button class="ibtn" data-act="tx-edit" data-id="' + t.id + '" aria-label="Edit" title="Edit">✎</button>' +
      '<button class="ibtn danger" data-act="tx-del" data-id="' + t.id + '" aria-label="Delete" title="Delete">✕</button>' +
      "</span></div></div>";
  }

  function ledgerTableHtml() {
    var rows = filteredTx();
    var page = rows.slice(0, ledgerLimit);

    if (!rows.length) {
      return '<div class="card pad"><p class="empty" style="margin:0">' +
        (state.transactions.length
          ? "Nothing matches these filters."
          : "No transactions yet — add your first one above.") + "</p></div>";
    }

    // Grouped by day rather than stacked flat: a date heading carries the
    // day's in and out, so scrolling gives you shape instead of a wall.
    var dayTotals = {};
    rows.forEach(function (t) {
      var d = dayTotals[t.date] || (dayTotals[t.date] = { inc: 0, out: 0, n: 0 });
      if (t.type === "income") d.inc += txBase(t);
      else if (t.type === "expense") d.out += txBase(t);
      d.n++;
    });

    // one card per day, so the day heading is the card's own head
    var days = [], seen = {};
    page.forEach(function (t) {
      if (!seen[t.date]) { seen[t.date] = []; days.push(t.date); }
      seen[t.date].push(t);
    });

    var html = days.map(function (date) {
      var d = dayTotals[date];
      var figs = [];
      if (d.out > 0) figs.push('<span class="day-out">−' + fmt(d.out, { round: true }).replace("-", "") + "</span>");
      if (d.inc > 0) figs.push('<span class="day-in">+' + fmt(d.inc, { round: true }) + "</span>");
      return '<div class="card" style="margin-bottom:0.75rem"><div class="card-head">' +
        "<h3>" + esc(dayLabel(date)) + "</h3>" +
        '<span class="sub">' + d.n + (d.n === 1 ? " entry" : " entries") + "</span>" +
        '<span class="day-figs">' + figs.join("") + "</span></div>" +
        '<div class="card-body flush"><div class="rows">' +
        seen[date].map(ledgerRowHtml).join("") + "</div></div></div>";
    }).join("");

    if (rows.length > page.length) {
      var more = Math.min(LEDGER_PAGE, rows.length - page.length);
      html += '<div class="btn-row" style="margin-top:0.85rem;justify-content:center">' +
        '<button class="btn sm" data-act="ledger-more">Show ' + more + " more</button>" +
        '<span class="hint" style="align-self:center">' + page.length + " of " + rows.length + "</span></div>";
    }
    return html;
  }


  function renderLedger() {
    var rows = filteredTx();
    var allCats = state.categories.expense.concat(state.categories.income);

    var html = pageHead("Ledger", "Every deposit, expense and transfer.",
      '<div class="btn-row">' +
      '<button class="btn" data-act="transfer-add">Transfer</button>' +
      '<button class="btn primary" data-act="tx-add">Add transaction</button></div>');

    if (!state.accounts.length) {
      return html + '<div class="card"><div class="card-body"><p class="empty">' +
        "You need an account before you can log anything. " +
        "<strong>Add one from the Overview screen.</strong></p>" +
        '<button class="btn primary" data-act="account-add">Add an account</button></div></div>';
    }

    html += quickAddCard() + '<div style="height:1rem"></div>';

    /* Six labelled full-width fields stacked into a wall of form. Type is the
       filter reached for most, so it becomes pills; the rest fold away behind
       a disclosure, because a filter you are not using should not cost six
       lines of screen. */
    var narrowed = filters.category !== "all" || filters.account !== "all" ||
      filters.from || filters.to;
    html += '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>Find something</h3>' +
      '<div class="btn-row">' +
      '<button class="btn sm quiet" data-act="export-csv">Export CSV</button>' +
      (filters.text || filters.type !== "all" || narrowed
        ? '<button class="btn sm quiet" data-act="filter-clear">Clear</button>' : "") +
      "</div></div>" +
      '<div class="card-body">' +
      '<input id="f_text" type="text" value="' + esc(filters.text) + '" ' +
      'placeholder="Search a description, category or amount…" autocomplete="off" aria-label="Search" />' +

      '<div class="chiprow" style="margin-top:0.7rem">' +
      [["all", "Everything"], ["expense", "Out"], ["income", "In"], ["transfer", "Transfers"]]
        .map(function (v) {
          return '<button class="chip' + (filters.type === v[0] ? " on" : "") +
            '" data-act="filter-type" data-v="' + v[0] + '">' + v[1] + "</button>";
        }).join("") + "</div>" +

      '<details class="fold"' + (narrowed ? " open" : "") + '>' +
      "<summary>Narrow it further" +
      (narrowed ? ' <span class="pill mute">on</span>' : "") + "</summary>" +
      '<div class="fields" style="margin-top:0.7rem">' +
      '<div class="field"><label class="label" for="f_cat">Category</label><select id="f_cat">' +
      '<option value="all">All categories</option>' + allCats.map(function (c) {
        return '<option value="' + esc(c) + '"' + (filters.category === c ? " selected" : "") + ">" + esc(c) + "</option>";
      }).join("") + "</select></div>" +
      '<div class="field"><label class="label" for="f_acc">Account</label><select id="f_acc">' +
      // closed accounts stay in this list on purpose: looking back at what
      // went through one is the whole reason for closing rather than deleting
      '<option value="all">All accounts</option>' + state.accounts.map(function (a) {
        return '<option value="' + a.id + '"' + (filters.account === a.id ? " selected" : "") + ">" +
          esc(a.name + (a.closed ? " (closed)" : "")) + "</option>";
      }).join("") + "</select></div>" +
      '<div class="field"><label class="label" for="f_from">From</label><input id="f_from" type="date" value="' + esc(filters.from) + '" /></div>' +
      '<div class="field"><label class="label" for="f_to">To</label><input id="f_to" type="date" value="' + esc(filters.to) + '" /></div>' +
      "</div></details>" +
      '<p class="hint" style="margin-top:0.7rem" id="txSummary">' + ledgerSummaryHtml(rows) + "</p>" +
      "</div></div>";

    /* the entries themselves — id lets the search box refresh only this block */
    html += '<div id="txTable" style="margin-top:1rem">' + ledgerTableHtml() + "</div>";

    return html;
  }

  /* ============================================================
     BUDGETS (+ recurring commitments)
     ============================================================ */

  /* Budgets, bills and regular income were one screen. They are three
     separate answers to "what do I intend", so each is now its own body that
     the Plan tab shows one at a time. The markup is unchanged — only who
     calls it. */

  function budgetsBody() {
    var rows = budgetRows(viewMonth);
    var progress = monthProgress(viewMonth);
    var totalLimit = rows.reduce(function (s, b) { return s + b.limit; }, 0);
    var totalSpent = rows.reduce(function (s, b) { return s + b.spent; }, 0);
    var pct = totalLimit > 0 ? totalSpent / totalLimit : 0;

    // fractions in words: the comparison that matters is how far through the
    // money you are against how far through the month, and that is a sentence
    function tenths(x) {
      var w = ["nothing", "a tenth", "two tenths", "three tenths", "four tenths", "half",
               "six tenths", "seven tenths", "eight tenths", "nine tenths", "all"];
      return w[clamp(Math.round(x * 10), 0, 10)];
    }
    var lead = !totalLimit
      ? "No budgets set yet."
      : "You are " + tenths(pct) + " of the way through what you meant to spend, and " +
        tenths(progress) + " of the way through the month.";

    var html = '<div class="band"><p class="lead" style="margin-top:0">' + esc(lead) + "</p>";
    if (totalLimit) {
      var ahead = pct > progress + 0.02;
      html += '<div style="display:flex;align-items:baseline;gap:0.5rem;margin-top:0.75rem">' +
        '<span class="pair-fig" style="margin-top:0">' + fmt(totalSpent, { round: true }) + "</span>" +
        '<span class="band-sub" style="margin:0">of ' + fmt(totalLimit, { round: true }) + " intended</span></div>" +
        '<div class="markbar" style="margin-top:0.8rem">' +
        '<div class="markbar-fill" style="width:' + (clamp(pct, 0, 1) * 100).toFixed(1) +
          '%;background:' + (ahead ? "var(--warn)" : "var(--calm)") + '"></div>' +
        '<div class="markbar-mark" style="left:' + (clamp(progress, 0, 1) * 100).toFixed(1) + '%"></div></div>' +
        '<p class="band-sub">the mark is today</p>';
    }
    html += "</div>";

    if (!rows.length) {
      return html + '<div class="card pad"><p class="empty" style="margin:0">No budgets yet. ' +
        "<strong>Pick a category and a monthly limit</strong> — Coffer tracks it against what you actually " +
        'log.</p><div class="btn-row" style="margin-top:0.75rem">' +
        '<button class="btn primary" data-act="budget-set">Set a budget</button></div></div>';
    }

    html += rows.map(function (b) {
      var over = b.pct >= 1;
      var hot = !over && b.pct > progress + 0.10;
      var colour = over ? "var(--alert)" : hot ? "var(--warn)" : "var(--calm)";
      var ownWord = b.prepaid > 0.005 ? " of your own" : "";
      var note = over
        ? "over by " + fmt(-b.left, { round: true }) + " of " + fmt(b.limit, { round: true }) + ownWord
        : hot
          ? "running ahead — " + fmt(b.left, { round: true }) + " left of " + fmt(b.limit, { round: true }) + ownWord
          : b.pct < progress - 0.10
            ? "well under — " + fmt(b.left, { round: true }) + " still there" + ownWord
            : "on pace — " + fmt(b.left, { round: true }) + " left of " + fmt(b.limit, { round: true }) + ownWord;
      var noteTone = over ? "var(--alert)" : hot ? "var(--warn)" : "var(--dim)";

      /* An allowance is drawn down first, so it gets its own bar above the
         budget rather than being folded into it. Two bars, because the money
         is two different things: theirs-for-a-purpose, then yours. */
      var prepaidBar = b.prepaid > 0.005
        ? '<div style="margin-top:0.7rem">' +
          '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:0.6rem">' +
          '<span class="hint">Prepaid</span><span class="hint">' +
          fmt(b.prepaidUsed, { round: true }) + " of " + fmt(b.prepaid, { round: true }) + " used</span></div>" +
          '<div class="thinbar" style="height:6px;margin-top:0.3rem">' +
          '<div class="thinbar-fill" style="width:' +
          (clamp(b.prepaid > 0 ? b.prepaidUsed / b.prepaid : 0, 0, 1) * 100).toFixed(1) +
          '%;background:var(--ac)"></div></div></div>'
        : "";

      return '<div class="card pad budget-card">' +
        '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:0.6rem">' +
        '<span style="font-size:0.88rem;font-weight:600">' + esc(b.category) + "</span>" +
        '<span class="due-amt">' + fmt(b.raw, { round: true }) + "</span></div>" +
        prepaidBar +
        (b.prepaid > 0.005 && b.limit > 0
          ? '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:0.6rem;margin-top:0.7rem">' +
            '<span class="hint">Your own</span><span class="hint">' +
            fmt(b.spent, { round: true }) + " of " + fmt(b.limit, { round: true }) + " used</span></div>"
          : "") +
        (b.limit > 0
          ? '<div class="thinbar" style="height:6px;margin-top:' +
            (b.prepaid > 0.005 ? "0.3rem" : "0.65rem") + '">' +
            '<div class="thinbar-fill" style="width:' + (clamp(b.pct, 0, 1) * 100).toFixed(1) +
            '%;background:' + colour + '"></div></div>'
          : "") +
        '<div class="budget-foot">' +
        '<p class="pair-sub" style="color:' + noteTone + ';font-size:0.72rem">' +
        (b.limit > 0 ? esc(note)
          : b.prepaidUsed >= b.prepaid - 0.005
            ? "the allowance is spent \u2014 anything more is your own money"
            : "covered by the allowance so far") + "</p>" +
        '<span class="card-tools">' +
        '<button class="ibtn" data-act="budget-edit" data-cat="' + esc(b.category) + '" aria-label="Edit budget" title="Edit">✎</button>' +
        '<button class="ibtn danger" data-act="budget-del" data-cat="' + esc(b.category) + '" aria-label="Remove budget" title="Remove">✕</button>' +
        "</span></div></div>";
    }).join("");

    // Spending with no budget behind it, shown with the design's striped bar:
    // the stripe means "no cap, and outside your burn if it was a one-off".
    var capped = {};
    rows.forEach(function (b) { capped[b.category] = true; });
    var loose = spendByCategory(viewMonth);
    var extras = Object.keys(loose).filter(function (c) { return !capped[c] && loose[c] > 0.005; });
    if (extras.length) {
      html += extras.sort(function (a, b) { return loose[b] - loose[a]; }).map(function (c) {
        return '<div class="card pad budget-card">' +
          '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:0.6rem">' +
          '<span style="font-size:0.88rem;font-weight:600">' + esc(c) + "</span>" +
          '<span class="due-amt">' + fmt(loose[c], { round: true }) + "</span></div>" +
          '<div class="stripebar" style="margin-top:0.65rem"></div>' +
          '<div class="budget-foot">' +
          '<p class="pair-sub" style="font-size:0.72rem">no budget on this yet</p>' +
          '<button class="btn sm quiet" data-act="budget-set">Set one</button></div></div>';
      }).join("");
    }

    return html;
  }

  function recurRow(r) {
    var done = !r.nextDate;
    var ended = recurEnded(r);
    var d = r.nextDate ? daysUntil(r.nextDate) : 0;
    var tone = done || ended ? "mute" : d < 0 ? "bad" : d <= 3 ? "warn" : "mute";
    var when = done ? "done" : ended ? "ended " + esc(r.until) :
      d < 0 ? Math.abs(d) + "d overdue" : d === 0 ? "due today" : "in " + d + "d";
    var permo = monthlyEquivalent(toBase(r.amount, r.currency, r.rate), r.frequency);
    return '<div class="row stacked">' +
      '<div class="stack-top">' +
      '<span class="row-title">' + esc(r.name) + "</span>" +
      '<span class="row-fig ' + (r.type === "income" ? "gain" : "") + '">' +
      (r.type === "income" ? "+" : "−") + fmt(toBase(r.amount, r.currency, r.rate)).replace("-", "") +
      (isForeign(r.currency) ? '<span class="fx">' + esc(fmtIn(r.amount, r.currency)) + "</span>" : "") + "</span>" +
      "</div>" +
      '<div class="stack-foot">' +
      '<span class="row-sub">' + esc(r.category) + " · " + esc(FREQ_LABEL[r.frequency] || r.frequency) +
      (r.frequency !== "monthly" && r.frequency !== "once" ? " (" + fmt(permo, { round: true }) + "/mo)" : "") +
      " · " + esc(accountName(r.accountId)) +
      (r.until && !ended ? " · until " + esc(r.until) : "") + "</span>" +
      '<span class="pill ' + tone + '">' + when + "</span>" +
      (done || ended ? "" : '<button class="btn sm" data-act="recur-pay" data-id="' + r.id + '">Log</button>') +
      '<button class="ibtn" data-act="recur-edit" data-id="' + r.id + '" aria-label="Edit" title="Edit">✎</button>' +
      '<button class="ibtn danger" data-act="recur-del" data-id="' + r.id + '" aria-label="Delete" title="Delete">✕</button>' +
      "</div></div>";
  }
  function byDate(a, b) { return a.nextDate.localeCompare(b.nextDate); }

  function recurCard(kind, title, blurb, figure, pillClass) {
    var list = state.recurring.filter(function (r) {
      return (kind === "income" ? r.type === "income" : r.type !== "income");
    }).sort(byDate);
    return '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>' + esc(title) + "</h3>" +
      '<div class="btn-row">' +
      (figure > 0 ? '<span class="pill ' + pillClass + '">' + fmt(figure, { round: true }) + "/mo</span>" : "") +
      '<button class="btn sm primary" data-act="recur-add" data-kind="' + kind + '">Add</button>' +
      "</div></div><div class=\"card-body flush\">" +
      (list.length
        ? '<div class="rows">' + list.map(recurRow).join("") + "</div>"
        : '<p class="empty">' + blurb + "</p>") +
      "</div></div>";
  }


  function billsBody() {
    var load = recurringMonthlyLoad();
    var html = recurCard("expense", "Bills and subscriptions",
      "Nothing scheduled. <strong>Add rent, subscriptions and bills</strong> — Coffer counts the monthly cost, " +
      "warns you before each is due, and logs it to the ledger when you mark it paid.", load.expense, "mute");

    if (load.expense > 0 && load.income > 0) {
      var share = load.expense / load.income;
      html += '<p class="hint" style="margin-top:0.6rem">' +
        "Your committed bills take <b>" + Math.round(share * 100) + "%</b> of your committed income — " +
        fmt(load.expense, { round: true }) + " out against " + fmt(load.income, { round: true }) + " in, " +
        "leaving " + fmt(load.income - load.expense, { round: true }) + " a month before anything else.</p>";
    }
    return html;
  }

  /* ---------------- income, split by what it actually is ----------------
     A two-year contract and a one-off grant were in the same list, which meant
     neither could show what mattered about it. A contract has a payer, a
     start, an end and a likelihood of carrying on; a lump sum has a date and a
     likelihood of arriving at all. */

  function isContract(r) { return r.type === "income" && r.frequency !== "once"; }
  function isOneOff(r) { return r.type === "income" && r.frequency === "once"; }

  // How much is left to be paid under a contract before its end date. Nothing
  // computed this, and it is the figure that says how much a contract is worth
  // to you from here.
  /* What is still owed under a contract before its end date.

     A contract pays in whole instalments, not continuously, so this counts the
     payment dates left rather than pro-rating a month. Pro-rated, a $600/month
     contract that had already paid for September and ended on the 30th read as
     "$512 left to be paid" — twenty-six days of a month that was already
     settled. The honest answer there is nothing. */
  function contractRemaining(r) {
    if (!r.until) return null;                    // open-ended: no total to give
    var each = toBase(r.amount, r.currency, r.rate);
    var d = r.nextDate, n = 0;
    // the same 720-month guard the payoff simulation uses
    while (d && d <= r.until && n < 720) { n++; d = advance(d, r.frequency); }
    return { payments: n, total: each * n, each: each };
  }

  function contractCard(r) {
    var permo = monthlyEquivalent(toBase(r.amount, r.currency, r.rate), r.frequency);
    var ended = recurEnded(r);
    var rem = contractRemaining(r);
    var d = r.nextDate ? daysUntil(r.nextDate) : null;
    var bits = [];
    if (r.payer) bits.push(esc(r.payer));
    bits.push(esc(FREQ_LABEL[r.frequency] || r.frequency));
    bits.push(esc(accountName(r.accountId, r.pocketId)));

    var conf = confidenceOf(r);
    var renews = r.renews == null ? null : clamp(num(r.renews), 0, 100);

    var when = ended ? "ended " + esc(longDate(r.until))
      : r.until ? "ends " + esc(longDate(r.until))
      : "no end date";
    var tone = ended ? "mute"
      : r.until && daysUntil(r.until) < 90 ? "warn" : "ok";

    // what of this month's pay is allowance rather than pay, if it is known
    var alNow = r.allowance ? allowanceFor(r, thisMonth()) : 0;

    return '<div class="card pad" style="margin-bottom:0.75rem' + (ended ? ";opacity:0.66" : "") + '">' +
      '<div class="card-head" style="padding:0"><h3>' + esc(r.name) + "</h3>" +
      '<span class="btn-row">' +
      '<button class="ibtn" data-act="recur-edit" data-id="' + r.id + '" aria-label="Edit">✎</button>' +
      '<button class="ibtn danger" data-act="recur-del" data-id="' + r.id + '" aria-label="Delete">✕</button>' +
      "</span></div>" +
      '<div style="display:flex;align-items:baseline;gap:0.6rem;flex-wrap:wrap;margin-top:0.4rem">' +
      '<span class="tile-fig">' + fmt(permo, { round: true }) +
      '<span class="hint" style="font-family:var(--sans)"> a month</span></span>' +
      '<span class="pill ' + tone + '" style="margin-left:auto">' + when + "</span></div>" +
      // the split they asked for: what of it is actually pay
      (alNow > 0.005
        ? '<p class="band-sub"><b>' + fmt(permo - alNow, { round: true }) + "</b> of it is pay, <b>" +
          fmt(alNow, { round: true }) + "</b> is " + esc(r.allowance.category) +
          " money this month</p>"
        : "") +
      '<p class="band-sub">' + bits.join(" · ") +
      (isForeign(r.currency) ? " · " + esc(fmtIn(r.amount, r.currency)) + " each time" : "") + "</p>" +

      '<div class="split" style="margin-top:0.75rem">' +
      (r.startedOn
        ? '<div class="split-row"><span>Running since</span><span>' + esc(longDate(r.startedOn)) + "</span></div>"
        : "") +
      (rem != null
        ? '<div class="split-row"><span>Left to be paid</span><span class="fig">' +
          (rem.payments === 0 ? "nothing more"
            : fmt(rem.total, { round: true }) +
              '<span class="fx">' + rem.payments +
              (rem.payments === 1 ? " payment" : " payments") + "</span>") + "</span></div>"
        : "") +
      (conf < 1
        ? '<div class="split-row"><span>Each payment</span><span>' +
          Math.round(conf * 100) + "% likely</span></div>"
        : "") +
      (r.until
        ? '<div class="split-row"><span>Carries on after that</span><span>' +
          (renews == null ? "not said" : renews + "% likely") + "</span></div>"
        : "") +
      (r.allowance && r.allowance.category
        ? '<div class="split-row"><span>Of which ' + esc(r.allowance.category) + "</span><span>" +
          esc(fmtIn(num(r.allowance.rate), r.allowance.currency || baseCode())) + " a day</span></div>"
        : "") + "</div>" +

      (!ended && d != null
        ? '<div class="btn-row" style="margin-top:0.8rem">' +
          '<button class="btn sm primary" data-act="recur-pay" data-id="' + r.id + '">' +
          (d < 0 ? "It arrived — " + Math.abs(d) + " days ago" : d === 0 ? "It arrived today"
            : "Due in " + d + " days") + "</button></div>"
        : "") + "</div>";
  }

  function oneOffRow(r) {
    var amt = toBase(r.amount, r.currency, r.rate);
    var conf = confidenceOf(r);
    var d = r.nextDate ? daysUntil(r.nextDate) : null;
    var gone = !r.nextDate;
    var bits = [];
    if (r.payer) bits.push(esc(r.payer));
    if (r.nextDate) bits.push("expected " + esc(longDate(r.nextDate)));
    if (conf < 1) bits.push(Math.round(conf * 100) + "% likely, counted at " + fmt(amt * conf, { round: true }));
    return '<div class="row stacked' + (gone ? " muted" : "") + '">' +
      '<div class="stack-top"><span class="row-title">' + esc(r.name) + "</span>" +
      '<span class="row-fig gain">+' + fmt(amt).replace("-", "") +
      (isForeign(r.currency) ? '<span class="fx">' + esc(fmtIn(r.amount, r.currency)) + "</span>" : "") +
      "</span></div>" +
      '<div class="stack-foot"><span class="row-sub">' + (bits.join(" · ") || "no date set") + "</span>" +
      (gone ? '<span class="pill mute">arrived</span>'
        : '<button class="btn sm primary" data-act="recur-pay" data-id="' + r.id + '">It arrived</button>') +
      '<button class="ibtn" data-act="recur-edit" data-id="' + r.id + '" aria-label="Edit">✎</button>' +
      '<button class="ibtn danger" data-act="recur-del" data-id="' + r.id + '" aria-label="Delete">✕</button>' +
      "</div></div>";
  }

  function incomeBody() {
    var all = state.recurring.filter(function (r) { return r.type === "income"; });
    var contracts = all.filter(isContract).filter(function (r) { return !recurEnded(r); }).sort(byDate);
    var ended = all.filter(isContract).filter(recurEnded)
      .sort(function (a, b) { return String(b.until).localeCompare(String(a.until)); });
    var oneOffs = all.filter(isOneOff).sort(function (a, b) {
      return String(a.nextDate || "9").localeCompare(String(b.nextDate || "9"));
    });

    if (!all.length) {
      return '<div class="card pad"><span class="label">Income</span>' +
        '<p class="empty" style="margin:0.5rem 0 0.9rem">Nothing scheduled. <strong>Add a contract or a ' +
        "one-off</strong> — it is what your bills are measured against, and what every projection is built " +
        "from.</p>" +
        '<div class="btn-row">' +
        '<button class="btn primary" data-act="recur-add" data-kind="income">Add a contract</button>' +
        '<button class="btn" data-act="recur-add" data-kind="once">Add a one-off</button></div></div>';
    }

    var monthly = contracts.reduce(function (t, r) {
      return t + monthlyEquivalent(toBase(r.amount, r.currency, r.rate), r.frequency) * confidenceOf(r);
    }, 0);
    var lumpTotal = oneOffs.filter(function (r) { return r.nextDate; })
      .reduce(function (t, r) { return t + toBase(r.amount, r.currency, r.rate) * confidenceOf(r); }, 0);

    var html = '<div class="sec-head"><span class="label">Contracts</span>' +
      '<span class="btn-row">' +
      (monthly > 0 ? '<span class="pill ok">' + fmt(monthly, { round: true }) + "/mo</span>" : "") +
      '<button class="btn sm primary" data-act="recur-add" data-kind="income">Add</button></span></div>';
    html += contracts.length
      ? contracts.map(contractCard).join("")
      : '<div class="card pad"><p class="empty" style="margin:0">No live contracts.</p></div>';

    html += '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>One-off income</h3>' +
      '<span class="btn-row">' +
      (lumpTotal > 0 ? '<span class="pill ok">' + fmt(lumpTotal, { round: true }) + " expected</span>" : "") +
      '<button class="btn sm primary" data-act="recur-add" data-kind="once">Add</button></span></div>' +
      '<div class="card-body flush">' +
      (oneOffs.length
        ? '<div class="rows">' + oneOffs.map(oneOffRow).join("") + "</div>"
        : '<p class="empty">Nothing expected. <strong>A grant, a bonus, a project fee</strong> — money that ' +
          "arrives once and should not be averaged into a monthly rate.</p>") +
      "</div></div>";

    if (ended.length) {
      html += '<div class="sec-head"><span class="label">Ended</span>' +
        '<span class="pair-sub" style="margin:0">' + ended.length +
        (ended.length === 1 ? " contract" : " contracts") + "</span></div>" +
        ended.map(contractCard).join("");
    }
    return html;
  }

  /* ============================================================
     GOALS
     ============================================================ */


  /* ---- the plan, scored against what actually happened ---- */

  // Income and commitments are matched to real transactions by category. There
  // is no link stamped on a transaction saying which plan line it came from,
  // and inventing one retroactively would only be right for entries logged
  // after this feature shipped. Category is a basis you can check by hand.
  function planActuals(mk) {
    var got = { income: {}, expense: {} };
