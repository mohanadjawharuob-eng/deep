          e.key = planKeyFor("budgets", e.parent + "|" + e.name);
          if (!e.name || !e.parent) { e.problem = "Write a sub-budget as “Parent > Name: amount”."; return e; }
          var pcat = state.categories.expense.filter(function (c) {
            return c.toLowerCase() === e.parent.toLowerCase();
          })[0];
          if (!pcat) {
            e.problem = "“" + e.parent + "” is not a category, so nothing can sit under it. " +
              "You have: " + state.categories.expense.join(", ") + ".";
            return e;
          }
          e.parent = pcat;
          e.category = pcat;
          e.notes.push("sits under " + pcat);
          return finishEntry(e, known);
        }
        // a plain budget line's name IS its category
        e.category = e.name;
        if (state.categories.expense.indexOf(e.category) < 0) {
          var near = state.categories.expense.filter(function (c) {
            return c.toLowerCase() === e.category.toLowerCase();
          })[0];
          if (near) { e.category = near; e.name = near; e.key = planKeyFor("budgets", near); }
          else { e.newCategory = { kind: "expense", name: e.category };
                 e.notes.push("“" + e.category + "” is a new category"); }
        }
        if (r.frequency && r.frequency !== "monthly") e.notes.push("budgets are monthly; the frequency was ignored");
      } else if (r.section === "goals") {
        if (e.date && e.date < today()) e.notes.push("that date has already passed");
      } else {
        // income and commitments both become recurring records
        e.type = r.section === "income" ? "income" : "expense";
        if (r.confidence != null) {
          if (!(r.confidence >= 0 && r.confidence <= 100)) {
            e.problem = "Confidence has to be between 0 and 100%.";
            return e;
          }
          e.confidence = r.confidence;
          if (r.section !== "income") e.notes.push("confidence only applies to income; ignored here");
        }
        e.frequency = r.frequency || "monthly";
        if (FREQ.indexOf(e.frequency) < 0) { e.problem = "Frequency must be weekly, monthly or yearly."; return e; }

        if (r.account) {
          var hit = matchAccountRef(r.account);
          if (!hit) {
            e.problem = "No account called “" + r.account + "”. You have: " + accountNamesForHelp() + ".";
            return e;
          }
          if (hit.closed) { e.problem = "“" + hit.label + "” is closed, so nothing new can be filed there."; return e; }
          e.accountRef = hit.ref; e.accountLabel = hit.label;
        } else if (openList.length === 1) {
          e.accountRef = openList[0].id; e.accountLabel = openList[0].name;
          e.notes.push("no account named, so " + openList[0].name);
        } else if (!openList.length) {
          e.problem = "There are no open accounts to attach this to.";
          return e;
        } else {
          e.problem = "Say which account, e.g. “" +
            (r.section === "income" ? "into " : "from ") + openList[0].name + "”.";
          return e;
        }

        var bucket = e.type === "income" ? "income" : "expense";
        var named = state.categories[bucket].filter(function (c) {
          return c.toLowerCase() === String(r.category || e.name).toLowerCase();
        })[0];

        if (r.category) {
          var match = state.categories[bucket].filter(function (c) {
            return c.toLowerCase() === r.category.toLowerCase();
          })[0];
          if (match) e.category = match;
          else {
            e.category = String(r.category).trim();
            e.newCategory = { kind: bucket, name: e.category };
            e.notes.push("“" + e.category + "” is a new category");
          }
        } else if (named) {
          e.category = named;
          e.notes.push("filed under " + named + ", from its name");
        } else {
          var g = guessCategory(e.name, e.type);
          e.category = g.category;
          e.notes.push("filed under " + g.category + (g.why ? " — " + g.why : " — a guess; add “, Category” to be sure"));
        }

        e.date = e.date || today();
      }

      return finishEntry(e, known);
    });
  }

  function finishEntry(e, known) {
    e.existing = known[e.key] || null;
    e.action = e.existing ? "update" : "create";
    return e;
  }

  // Every record this app has already created from a plan, by its plan key.
  function planIndex() {
    var out = {};
    state.goals.forEach(function (g) { if (g.planKey) out[g.planKey] = { kind: "goal", id: g.id }; });
    state.recurring.forEach(function (r) { if (r.planKey) out[r.planKey] = { kind: "recurring", id: r.id }; });
    grants().forEach(function (g) {
      if (g.planKey) out[g.planKey] = { kind: "grant", id: g.id };
      (g.lines || []).forEach(function (L) {
        if (L.planKey) out[L.planKey] = { kind: "grantline", id: L.id };
      });
    });
    Object.keys(state.budgets).forEach(function (cat) {
      out[planKeyFor("budgets", cat)] = { kind: "budget", id: cat };
    });
    if (state.plan) {
      (state.plan.lines || []).forEach(function (l) {
        if (l.section === "budgets" && l.parent) out[l.key] = { kind: "subbudget", id: l.key };
      });
    }
    return out;
  }

  /* ---- applying it, once, undoably ---- */

  function applyPlan(parsed, entries, opts) {
    var before = JSON.parse(JSON.stringify(state));
    var made = 0, changed = 0, skipped = 0;

    var usable = entries.filter(function (e) {
      if (e.problem) return false;
      // untick the category box and those lines drop out rather than
      // quietly landing in some other category
      if (e.newCategory && !opts.createCategories) { skipped++; return false; }
      return true;
    });

    usable.forEach(function (e) {
      if (e.newCategory && state.categories[e.newCategory.kind].indexOf(e.newCategory.name) < 0) {
        state.categories[e.newCategory.kind].push(e.newCategory.name);
      }
    });

    var lines = usable.map(function (e) {
      var recordId = null;

      if (e.section === "budgets") {
        if (e.parent) {
          // a sub-budget is a breakdown of its parent, not a budget of its own:
          // writing it to state.budgets would silently replace the parent's cap
          // with one line's share of it
          made++;
          recordId = null;
        } else {
          if (state.budgets[e.category] == null) made++; else changed++;
          state.budgets[e.category] = e.baseAmount;
          recordId = e.category;
        }

      } else if (e.section === "grants") {
        if (e.parent) {
          // an allocation inside a grant, written after the grant itself so
          // the grant is already there to hang it on
          var owner = state.grants.filter(function (x) {
            return x.planKey === planKeyFor("grants", e.parent);
          })[0];
          if (owner) {
            if (!owner.lines) owner.lines = [];
            var ln = owner.lines.filter(function (L) { return L.planKey === e.key; })[0];
            if (ln) { ln.name = e.name; ln.amount = e.amount; changed++; }
            else { owner.lines.push({ id: uid(), name: e.name, amount: e.amount, note: null, planKey: e.key });
                   made++; }
            recordId = owner.id;
          }
        } else {
          if (!state.grants) state.grants = [];
          var gr = state.grants.filter(function (x) { return x.planKey === e.key; })[0];
          if (gr) {
            // the pocket and everything already spent against it stay put; a
            // re-import corrects the terms, never the history
            gr.name = e.name; gr.funder = e.funder || gr.funder || null;
            gr.total = e.amount; gr.currency = e.currency; gr.rate = e.rate;
            gr.endsOn = e.until || null;
            changed++;
          } else {
            var gacc = accountById(parseRef(e.accountRef).accountId);
            if (gacc) {
              if (!gacc.pockets) gacc.pockets = [];
              var gpk = { id: uid(), name: e.name, opening: 0, status: "committed" };
              gacc.pockets.push(gpk);
              gr = {
                id: uid(), name: e.name, funder: e.funder || null,
                total: e.amount, currency: e.currency, rate: e.rate,
                awardedOn: e.date || today(), endsOn: e.until || null,
                ref: acctRef(gacc.id, gpk.id), lines: [], closed: false, planKey: e.key
              };
              state.grants.push(gr);
              state.transactions.push({
                id: uid(), date: gr.awardedOn, desc: gr.name + " awarded",
                type: "income",
                category: state.categories.income.indexOf("Gift") > -1 ? "Gift" : state.categories.income[0],
                accountId: gacc.id, pocketId: gpk.id, amount: e.amount,
                grantId: gr.id, grantAward: true, currency: e.currency, rate: e.rate
              });
              made++;
            }
          }
          recordId = gr ? gr.id : null;
        }

      } else if (e.section === "goals") {
        var g = state.goals.filter(function (x) { return x.planKey === e.key; })[0];
        if (g) {
          // never touch `saved` — that is real money already put aside
          g.name = e.name; g.target = e.baseAmount; g.due = e.date || null;
          changed++;
        } else {
          g = { id: uid(), name: e.name, target: e.baseAmount, saved: 0, due: e.date || null, planKey: e.key };
          state.goals.push(g);
          made++;
        }
        recordId = g.id;

      } else {
        var ref = parseRef(e.accountRef);
        var r = state.recurring.filter(function (x) { return x.planKey === e.key; })[0];
        if (r) {
          r.name = e.name; r.type = e.type; r.category = e.category;
          r.accountId = ref.accountId; r.pocketId = ref.pocketId || null;
          r.amount = e.amount; r.currency = e.currency; r.rate = e.rate;
          r.frequency = e.frequency;
          r.until = e.until || null;
          if (e.type === "income") {
            r.renews = e.renews == null ? null : e.renews;
            r.allowance = e.allowance || null;
          }
          // nextDate is left alone on an update: it has been advancing as the
          // item was logged, and resetting it would re-post things already paid
          changed++;
        } else {
          r = {
            id: uid(), name: e.name, type: e.type, category: e.category,
            accountId: ref.accountId, pocketId: ref.pocketId || null,
            amount: e.amount, currency: e.currency, rate: e.rate,
            frequency: e.frequency, nextDate: e.date || today(),
            until: e.until || null,
            renews: e.type === "income" && e.renews != null ? e.renews : null,
            allowance: e.type === "income" ? (e.allowance || null) : null,
            planKey: e.key
          };
          state.recurring.push(r);
          made++;
        }
        recordId = r.id;
      }

      return {
        key: e.key, section: e.section, name: e.name,
        amount: e.amount, currency: e.currency, rate: e.rate, baseAmount: e.baseAmount,
        frequency: e.frequency || null, accountRef: e.accountRef || null, accountLabel: e.accountLabel || null,
        category: e.category || null, date: e.date || null, recordId: recordId,
        parent: e.parent || null, until: e.until || null, funder: e.funder || null,
        renews: e.renews == null ? null : e.renews,
        allowance: e.allowance || null,
        confidence: e.confidence == null ? null : e.confidence
      };
    });

    state.plan = {
      version: PLAN_VERSION,
      id: (state.plan && state.plan.id) || uid(),
      name: parsed.name || "Plan",
      from: parsed.from || thisMonth(),
      to: parsed.to || "",
      reviewBy: parsed.reviewBy || null,
      base: baseCode(),
      importedAt: today(),
      lines: lines
    };

    save(); render();
    var msg = made + " added, " + changed + " updated" + (skipped ? ", " + skipped + " skipped" : "") + ".";
    toast(msg, function () { state = before; viewMonth = thisMonth(); });
  }

  function parseEntry(raw) {
    var text = String(raw || "").trim();
    if (!text) return null;

    var type = "expense";
    if (/^\+/.test(text)) { type = "income"; text = text.replace(/^\+\s*/, ""); }
    else if (/^-/.test(text)) { text = text.replace(/^-\s*/, ""); }
    else {
      var low = " " + text.toLowerCase() + " ";
      for (var i = 0; i < INCOME_MARKERS.length; i++) {
        if (low.indexOf(" " + INCOME_MARKERS[i]) >= 0) { type = "income"; break; }
      }
    }

    // a currency code anywhere in the line, e.g. "8900000 lbp salary"
    var cur = baseCode(), curRe = null;
    Object.keys(state.settings.rates || {}).forEach(function (code) {
      if (!(rateNum(code) > 0)) return;
      var re = new RegExp("(^|\\s)" + code + "(\\s|$)", "i");
      if (!curRe && re.test(text)) { cur = code; curRe = re; }
    });
    if (curRe) text = text.replace(curRe, " ").replace(/\s+/g, " ").trim();

    var d = extractDate(text);
    var a = extractAmount(d.rest);
    var ac = extractAccount(a.rest);
    var desc = tidyDesc(ac.rest);

    if (a.amount == null || a.amount <= 0) {
      return { ok: false, reason: desc ? "Add an amount, e.g. “" + desc + " 12”" : "Type an amount and what it was for.", desc: desc, type: type };
    }

    var g = guessCategory(desc || "", type);
    return {
      ok: true,
      type: type,
      amount: Math.round(a.amount * 100) / 100,
      date: d.date || today(),
      dateExplicit: !!d.date,
      desc: desc || g.category,
      category: g.category,
      why: g.why,
      accountId: ac.accountId || defaultAccountRef(),
      accountExplicit: !!ac.accountId,
      currency: cur,
      currencyExplicit: !!curRe
    };
  }

  /* ============================================================
     Charts — hand-built SVG. Every chart carries a hover layer,
     a recessive grid, and an emphasised final point.
     ============================================================ */

  var tipEl = document.getElementById("tip");
  function showTip(text, x, y) {
    tipEl.textContent = text;
    tipEl.style.left = x + "px";
    tipEl.style.top = y + "px";
    tipEl.classList.add("on");
  }
  function hideTip() { tipEl.classList.remove("on"); }

  // points: [{label, value, tip}]
  function areaChart(points, opts) {
    var o = opts || {};
    var W = 100, H = o.height || 34; // viewBox units; scales to the container
    var pad = 2;
    if (!points.length) return "";

    var vals = points.map(function (p) { return p.value; });
    // a comparison series shares the scale, or the two lines lie about their gap
    if (o.ghost && o.ghost.length === points.length) vals = vals.concat(o.ghost);
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    if (o.baseZero && lo > 0) lo = 0;
    if (lo === hi) { lo -= 1; hi += 1; }
    var span = hi - lo;

    function px(i) { return pad + (points.length === 1 ? (W - 2 * pad) / 2 : i * (W - 2 * pad) / (points.length - 1)); }
    function py(v) { return H - pad - ((v - lo) / span) * (H - 2 * pad); }

    var line = points.map(function (p, i) { return (i ? "L" : "M") + px(i).toFixed(2) + " " + py(p.value).toFixed(2); }).join(" ");
    var area = line + " L" + px(points.length - 1).toFixed(2) + " " + (H - pad) + " L" + px(0).toFixed(2) + " " + (H - pad) + " Z";
    var gid = "g" + Math.random().toString(36).slice(2, 8);
    var stroke = o.color || "var(--c1)";

    // zero line only when the series actually crosses zero
    var zeroLine = (lo < 0 && hi > 0)
      ? '<line x1="' + pad + '" y1="' + py(0).toFixed(2) + '" x2="' + (W - pad) + '" y2="' + py(0).toFixed(2) +
        '" stroke="var(--rule-strong)" stroke-width="0.25" vector-effect="non-scaling-stroke" />'
      : "";

    var hover = points.map(function (p, i) {
      var w = (W - 2 * pad) / points.length;
      return '<rect class="hit" data-tip="' + esc(p.tip || (p.label + ": " + p.value)) + '" x="' + (px(i) - w / 2).toFixed(2) +
        '" y="0" width="' + w.toFixed(2) + '" height="' + H + '" fill="transparent" />';
    }).join("");

    var dots = '<circle cx="' + px(points.length - 1).toFixed(2) + '" cy="' + py(points[points.length - 1].value).toFixed(2) +
      '" r="1.5" fill="' + stroke + '" stroke="var(--surface)" stroke-width="0.6" />';

    // where the series was before whatever is being tested against it
    var ghost = (o.ghost && o.ghost.length === points.length)
      ? '<path d="' + o.ghost.map(function (v, i) {
          return (i ? "L" : "M") + px(i).toFixed(2) + " " + py(v).toFixed(2);
        }).join(" ") + '" fill="none" stroke="var(--dim)" stroke-width="0.9" stroke-dasharray="2 2" ' +
        'stroke-linejoin="round" vector-effect="non-scaling-stroke" opacity="0.7" />'
      : "";

    // one moment worth pointing at — the month the money runs out
    var mark = "";
    if (o.mark != null && o.mark >= 0 && o.mark < points.length) {
      var mx = px(o.mark), mc = o.markColor || "var(--alert)";
      mark = '<line x1="' + mx.toFixed(2) + '" y1="' + pad + '" x2="' + mx.toFixed(2) + '" y2="' + (H - pad) +
        '" stroke="' + mc + '" stroke-width="0.7" stroke-dasharray="1.6 1.6" vector-effect="non-scaling-stroke" />' +
        '<circle cx="' + mx.toFixed(2) + '" cy="' + py(points[o.mark].value).toFixed(2) +
        '" r="1.6" fill="' + mc + '" stroke="var(--surface)" stroke-width="0.6" />';
    }

    return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" ' +
      'style="height:' + (o.cssHeight || 46) + 'px" role="img" aria-label="' + esc(o.aria || "trend") + '">' +
      '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="' + stroke + '" stop-opacity="0.26" />' +
      '<stop offset="100%" stop-color="' + stroke + '" stop-opacity="0.02" />' +
      "</linearGradient></defs>" +
      zeroLine +
      '<path d="' + area + '" fill="url(#' + gid + ')" />' +
      ghost +
      '<path d="' + line + '" fill="none" stroke="' + stroke + '" stroke-width="1.1" ' +
      'stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" />' +
      mark + dots + hover + "</svg>";
  }

  function axisRow(points) {
    return '<div class="legend" style="justify-content:space-between;gap:0;margin-top:0.3rem">' +
      points.map(function (p) {
        return '<span style="font-size:0.66rem;color:var(--faint);font-variant-numeric:tabular-nums">' + esc(p.label) + "</span>";
      }).join("") + "</div>";
  }

  // grouped income/expense bars
  function cashflowChart(rows) {
    var max = Math.max.apply(null, rows.map(function (r) { return Math.max(r.income, r.expense); }).concat([1]));
    var H = 118;
    var bars = rows.map(function (r) {
      var ih = Math.max(Math.round(r.income / max * H), r.income > 0 ? 2 : 0);
      var eh = Math.max(Math.round(r.expense / max * H), r.expense > 0 ? 2 : 0);
      return '<div style="flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px;height:' + H + 'px">' +
        '<div class="hitbar" data-tip="' + esc(monthName(r.mk, true) + "\nIn  " + fmt(r.income) + "\nOut " + fmt(r.expense)) +
        '" style="width:38%;max-width:22px;height:' + ih + 'px;background:var(--c1);border-radius:3px 3px 0 0"></div>' +
        '<div class="hitbar" data-tip="' + esc(monthName(r.mk, true) + "\nIn  " + fmt(r.income) + "\nOut " + fmt(r.expense)) +
        '" style="width:38%;max-width:22px;height:' + eh + 'px;background:var(--c8);border-radius:3px 3px 0 0"></div>' +
        "</div>";
    }).join("");

    return '<div style="display:flex;align-items:flex-end;gap:0.5rem;border-bottom:1px solid var(--rule-strong);padding-top:0.3rem">' + bars + "</div>" +
      '<div style="display:flex;gap:0.5rem;margin-top:0.35rem">' + rows.map(function (r) {
        return '<span style="flex:1;text-align:center;font-size:0.66rem;color:var(--faint)">' + monthName(r.mk) + "</span>";
      }).join("") + "</div>" +
      '<div class="legend">' +
      '<span class="legend-item"><span class="legend-dot" style="background:var(--c1)"></span>Money in</span>' +
      '<span class="legend-item"><span class="legend-dot" style="background:var(--c8)"></span>Money out</span>' +
      "</div>";
  }

  function donutChart(byCat, total) {
    var cats = Object.keys(byCat).filter(function (c) { return byCat[c] > 0; })
      .sort(function (a, b) { return byCat[b] - byCat[a]; });
    if (!total || !cats.length) return null;

    var R = 54, C = 70, sw = 17, circ = 2 * Math.PI * R, gap = 2.5, off = 0;
    var segs = cats.map(function (cat) {
      var frac = byCat[cat] / total;
      var len = Math.max(frac * circ - gap, 0.8);
      var s = '<circle class="hit" data-tip="' + esc(cat + "\n" + fmt(byCat[cat]) + "  ·  " + Math.round(frac * 100) + "%") +
        '" cx="' + C + '" cy="' + C + '" r="' + R + '" fill="none" stroke="' + catColor(cat) + '" stroke-width="' + sw +
        '" stroke-linecap="butt" stroke-dasharray="' + len.toFixed(2) + " " + (circ - len).toFixed(2) +
        '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 ' + C + " " + C + ')" />';
      off += frac * circ;
      return s;
    }).join("");

    var svg = '<svg viewBox="0 0 140 140" style="width:132px;height:132px;flex-shrink:0" role="img" aria-label="Spending by category">' +
      '<circle cx="' + C + '" cy="' + C + '" r="' + R + '" fill="none" stroke="var(--rule)" stroke-width="' + sw + '" />' +
      segs +
      '<text x="70" y="64" text-anchor="middle" font-size="9" fill="var(--faint)" letter-spacing="0.5">SPENT</text>' +
      '<text x="70" y="82" text-anchor="middle" font-size="17" font-weight="650" fill="var(--ink)" ' +
      'style="font-variant-numeric:tabular-nums">' + esc(fmtCompact(total)) + "</text></svg>";

    var legend = '<div class="donut-legend">' + cats.slice(0, 8).map(function (cat) {
      return '<div class="li"><span class="legend-dot" style="background:' + catColor(cat) + '"></span>' +
        '<span class="nm">' + esc(cat) + '</span><span class="vl">' + fmt(byCat[cat], { round: true }) + "</span>" +
        '<span class="pc">' + Math.round(byCat[cat] / total * 100) + "%</span></div>";
    }).join("") + "</div>";

    return '<div style="display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap">' + svg + legend + "</div>";
  }

  function sparkline(points, color) {
    if (points.length < 2) return "";
    return areaChart(points, { height: 26, cssHeight: 30, color: color || "var(--c1)", aria: "trend" });
  }

  function meter(pct, color, pacePct) {
    var w = clamp(pct, 0, 1) * 100;
    return '<div class="meter">' +
      (pacePct != null && pacePct > 0.02 && pacePct < 0.98
        ? '<div class="meter-pace" style="left:' + (pacePct * 100).toFixed(1) + '%"></div>' : "") +
      '<div class="meter-fill" style="width:' + w.toFixed(1) + "%;background:" + color + '"></div></div>';
  }

  function deltaBadge(cur, prev, opts) {
    var o = opts || {};
    if (prev == null || !isFinite(prev) || prev === 0) return '<span class="delta flat">—</span>';
    var diff = cur - prev;
    var pct = Math.abs(diff / prev) * 100;
    if (Math.abs(diff) < 0.005) return '<span class="delta flat">no change</span>';
    // for expenses, up is bad; for income and net worth, up is good
    var good = o.lowerIsBetter ? diff < 0 : diff > 0;
    return '<span class="delta ' + (good ? "up" : "down") + '">' + (diff > 0 ? "▲" : "▼") + " " +
      (o.asMoney ? fmt(Math.abs(diff), { round: true }) : pct.toFixed(0) + "%") + "</span>";
  }

  /* ============================================================
     Insight engine — every note is computed from the ledger.
     ============================================================ */

  function buildInsights(mk) {
    var notes = [];
    var cur = monthSummary(mk);
    var prev = monthSummary(monthShift(mk, -1));
    var isCurrent = mk === thisMonth();
    var progress = monthProgress(mk);

    // With an empty ledger most notes would be computed from nothing — but the
    // recurring ones are not derived from transactions at all, and someone who
    // has just set up their salary and rent deserves to see something.
    if (!state.transactions.length) {
      var load0 = recurringMonthlyLoad();
      if (load0.expense > 0) notes.push({
        tone: "info", mark: "↻",
        html: "<span class=\"fig\">" + fmt(load0.expense, { round: true }) + "/mo</span> of bills is scheduled. " +
          "Log one when it is paid and it starts appearing in your figures."
      });
      if (load0.income > 0) notes.push({
        tone: "info", mark: "↻",
        html: "<span class=\"fig\">" + fmt(load0.income, { round: true }) + "/mo</span> of income is scheduled."
      });
      return notes;
    }

    // pace projection
    if (isCurrent && cur.expense > 0 && progress > 0.12) {
      var projected = cur.expense / progress;
      var vs = prev.expense > 0 ? projected - prev.expense : null;
      notes.push({
        tone: vs != null && vs > 0 ? "warn" : "info", mark: "→",
        html: "At this pace you'll spend about <span class=\"fig\">" + fmt(projected, { round: true }) +
          "</span> by the end of " + monthName(mk, true) +
          (vs != null
            ? vs > 0
              ? ", <b>" + fmt(vs, { round: true }) + " more</b> than last month."
              : ", <b>" + fmt(-vs, { round: true }) + " less</b> than last month."
            : ".")
      });
    }

    // biggest category movement
    var curCats = spendByCategory(mk), prevCats = spendByCategory(monthShift(mk, -1));
    var allCats = {};
    Object.keys(curCats).concat(Object.keys(prevCats)).forEach(function (c) { allCats[c] = true; });
    var biggest = null;
    Object.keys(allCats).forEach(function (c) {
      var diff = (curCats[c] || 0) - (prevCats[c] || 0);
      if (!biggest || Math.abs(diff) > Math.abs(biggest.diff)) biggest = { cat: c, diff: diff };
    });
    if (biggest && Math.abs(biggest.diff) > 0.01 && Object.keys(prevCats).length) {
      notes.push({
        tone: biggest.diff > 0 ? "warn" : "ok",
        mark: biggest.diff > 0 ? "↑" : "↓",
        html: "<b>" + esc(biggest.cat) + "</b> " + (biggest.diff > 0 ? "rose" : "fell") + " by <span class=\"fig\">" +
          fmt(Math.abs(biggest.diff), { round: true }) + "</span> versus " + monthName(monthShift(mk, -1), true) + "."
      });
    }

    // savings rate
    if (cur.rate != null) {
      var pctRate = Math.round(cur.rate * 100);
      notes.push({
        tone: pctRate >= 20 ? "ok" : pctRate >= 0 ? "warn" : "bad",
        mark: pctRate >= 20 ? "✓" : pctRate >= 0 ? "!" : "✕",
        html: pctRate >= 0
          ? "You kept <b>" + pctRate + "%</b> of what came in this month" +
            (pctRate >= 20 ? " — a healthy margin." : ". Getting above 20% builds a buffer faster.")
          : "You spent <b>" + Math.abs(pctRate) + "% more</b> than you earned this month, drawing down savings."
      });
    }

    // runway
    var rw = runway();
    if (rw.months != null) {
      notes.push({
        tone: rw.months >= 6 ? "ok" : rw.months >= 3 ? "warn" : "bad",
        mark: rw.months >= 6 ? "✓" : "!",
        html: "What you can reach covers <b>" + rw.months.toFixed(1) + " months</b> at your running cost of " +
          fmt(rw.burn, { round: true }) + "/mo" +
          (rw.basis.partial ? ", though that is from only " + rw.basis.months + " month" +
            (rw.basis.months === 1 ? "" : "s") + " of data" : "") + "." +
          (rw.months < 3 ? " Three months is the usual first milestone." : "")
      });
    }

    // an income line about to end, with nothing scheduled after it: the month
    // the runway starts drawing down
    incomeGaps().forEach(function (g) {
      if (g.days > 120) return;
      notes.push({
        tone: g.replaced ? "mute" : g.days <= 60 ? "bad" : "warn",
        mark: g.replaced ? "✓" : "!",
        html: g.replaced
          ? "<b>" + esc(g.name) + "</b> ends " + esc(g.until) + ", but " +
            esc(g.replacedBy.join(" and ")) + " carries on after it."
          : "<b>" + esc(g.name) + "</b> ends " + esc(g.until) +
            (g.days >= 0 ? " — " + g.days + " days away" : "") +
            " and nothing is scheduled to replace it" +
            (g.monthly > 0 ? ", so " + fmt(g.monthly, { round: true }) + "/mo stops" : "") + "."
      });
    });

    // a rate old enough that today's entries are being converted on guesswork
    var staleNow = CURRENCIES.filter(function (c) { return c !== baseCode() && rateNum(c) > 0 && rateIsStale(c); });
    if (staleNow.length) {
      notes.push({
        tone: "warn", mark: "!",
        html: "Your <b>" + esc(staleNow.join(", ")) + "</b> rate" + (staleNow.length === 1 ? " is" : "s are") +
          " more than " + RATE_STALE_DAYS + " days old. Anything you log today converts at " +
          (staleNow.length === 1 ? "it" : "them") + "."
      });
    }

    // recurring commitments
    var load = recurringMonthlyLoad();
    if (load.expense > 0) {
      // Prefer committed income as the denominator: if the salary is itself a
      // recurring item, guessing from logged history is both unnecessary and
      // wrong on the first of the month.
      var incomeRef = load.income > 0 ? load.income
        : (cur.income > 0 ? cur.income : avgMonthlySaving(3) + burnRate().rate);
      var refName = load.income > 0 ? "your committed income" : "your income";
      var share = incomeRef > 0 ? load.expense / incomeRef : null;
      notes.push({
        tone: share != null && share > 0.6 ? "warn" : "info", mark: "↻",
        html: "<span class=\"fig\">" + fmt(load.expense, { round: true }) + "/mo</span> is already committed to recurring bills" +
          (share == null ? "."
            : share < 0.01 ? " — under <b>1%</b> of " + refName + "."
            : " — about <b>" + Math.round(share * 100) + "%</b> of " + refName + ".")
      });
    }
    if (load.income > 0) {
      notes.push({
        tone: "info", mark: "↻",
        html: "<span class=\"fig\">" + fmt(load.income, { round: true }) + "/mo</span> is scheduled to arrive. " +
          "It reaches your charts when you log it, not when it is due."
      });
    }

    // budgets projected to blow
    var risky = budgetRows(mk).filter(function (b) {
      if (b.limit <= 0) return false;
      if (b.pct >= 1) return true;
      return isCurrent && progress > 0.15 && (b.spent / progress) > b.limit;
    });
    if (risky.length) {
      notes.push({
        tone: "bad", mark: "!",
        html: risky.length === 1
          ? "<b>" + esc(risky[0].category) + "</b> is " + (risky[0].pct >= 1 ? "over" : "on track to pass") +
            " its " + fmt(risky[0].limit, { round: true }) + " budget."
          : "<b>" + risky.length + " budgets</b> are over or heading over: " +
            risky.slice(0, 3).map(function (b) { return esc(b.category); }).join(", ") + "."
      });
    }

    // largest single expense
    var big = monthTx(mk).filter(function (t) { return t.type === "expense"; })
      .sort(function (a, b) { return txBase(b) - txBase(a); })[0];
    var bigBase = big ? txBase(big) : 0;
    if (big && cur.expense > 0 && bigBase / cur.expense > 0.25) {
      notes.push({
        tone: "info", mark: "◆",
        html: "One expense — <b>" + esc(big.desc || big.category) + "</b> at <span class=\"fig\">" + fmt(bigBase, { round: true }) +
          "</span> — is <b>" + Math.round(bigBase / cur.expense * 100) + "%</b> of the month's spending."
      });
    }

    // no-spend days
    if (isCurrent && cur.expense > 0) {
      var spentDays = {};
      monthTx(mk).forEach(function (t) { if (t.type === "expense") spentDays[t.date] = true; });
      var elapsed = new Date().getDate();
      var quiet = elapsed - Object.keys(spentDays).length;
      if (quiet > 0) {
        notes.push({
          tone: "ok", mark: "○",
          html: "<b>" + quiet + " of " + elapsed + " days</b> this month had no spending at all."
        });
      }
    }

    // debt interest cost
    if (state.debts.length) {
      var monthlyInterest = state.debts.reduce(function (s, d) { return s + num(d.balance) * num(d.rate) / 100 / 12; }, 0);
      if (monthlyInterest > 0.5) {
        notes.push({
          tone: "bad", mark: "%",
          html: "Interest is costing you about <span class=\"fig\">" + fmt(monthlyInterest, { round: true }) +
            "/mo</span> before any progress on the balance."
        });
      }
    }

    return notes;
  }

  function notesHtml(notes, emptyMsg) {
    if (!notes.length) return '<p class="empty">' + esc(emptyMsg) + "</p>";
    return '<div class="notes">' + notes.map(function (n) {
      return '<div class="note"><span class="note-mark ' + n.tone + '">' + n.mark + "</span><div>" + n.html + "</div></div>";
    }).join("") + "</div>";
  }

  /* ============================================================
     Shared pieces
     ============================================================ */

  function monthStepper() {
    var atLatest = viewMonth >= thisMonth();
    return '<div class="stepper">' +
      '<button data-act="month-prev" aria-label="Previous month">‹</button>' +
      '<span class="m">' + monthName(viewMonth, true) + "</span>" +
      '<button data-act="month-next" aria-label="Next month"' + (atLatest ? " disabled" : "") + ">›</button>" +
      (viewMonth !== thisMonth() ? '<button class="btn sm quiet" data-act="month-today">Today</button>' : "") +
      "</div>";
  }

  function pageHead(title, sub, right) {
    return '<div class="page-head"><div><h2>' + esc(title) + "</h2>" +
      (sub ? "<p>" + sub + "</p>" : "") + "</div>" + (right || "") + "</div>";
  }

  function firstRunCard() {
    return '<div class="card"><div class="card-body">' +
      '<h3 style="font-size:1.15rem;margin-bottom:0.5rem">Set up your ledger</h3>' +
      '<p style="font-size:0.88rem;color:var(--dim);line-height:1.6;margin:0 0 1rem;max-width:56ch">' +
      "Add the accounts you actually use — a current account, savings, cash, a card. Coffer works out every balance " +
      "from your opening figure plus the transactions you log, so nothing can drift out of sync." +
      "</p><div class=\"btn-row\">" +
      '<button class="btn primary" data-act="account-add">Add an account</button>' +
      '<button class="btn" data-act="load-sample">Load sample data</button>' +
      "</div><p class=\"hint\" style=\"margin-top:0.8rem\">Sample data fills three months of a fictional budget so you can see " +
      "every screen working. You can erase it in one click from Settings.</p></div></div>";
  }

  /* ============================================================
     OVERVIEW
     ============================================================ */

  /* The old Overview held seven blocks at once — quick-add, net worth, today,
     four tiles, two charts, five insights, then accounts and bills — with the
     thing checked most often sitting last. It is broken up here into pieces
     the tabs compose, so each screen answers one question instead of all of
     them. The markup inside each piece is unchanged. */


  /* ---- the runway gauge ----------------------------------------------
     A semicircle spanning nought to twelve months. The design's brief was
     that three months should not look like twelve, and a number alone does
     not manage that — so the arc carries the length and the colour carries
     the state, and the sentence beside it says the figure in words, which
     is how you would say it out loud.
     -------------------------------------------------------------------- */

  var RUNWAY_SPAN = 12;

  function runwayTone(m) {
    if (m == null) return "dim";
    if (m >= 6) return "calm";
    if (m >= 3) return "warn";
    return "alert";
  }

  // months as words, because "nine months and a bit" reads like a person
  // talking and "9.4" reads like a spreadsheet
  var NUM_WORDS = ["nought", "one", "two", "three", "four", "five", "six",
                   "seven", "eight", "nine", "ten", "eleven", "twelve"];
  function monthsInWords(m) {
    if (m == null) return "No spending logged yet, so there is nothing to divide into.";
    if (m >= RUNWAY_SPAN) return "Over a year before the money runs out.";
    var whole = Math.floor(m);
    var frac = m - whole;
    var word = NUM_WORDS[whole] || String(whole);
    var tail = frac < 0.15 ? "" : frac < 0.4 ? " and a bit" : frac < 0.7 ? " and a half" : ", nearly " + (NUM_WORDS[whole + 1] || (whole + 1)) + ",";
    if (whole === 0) {
      return frac < 0.5 ? "Less than a fortnight before the money runs out."
                        : "Under a month before the money runs out.";
    }
    var noun = whole === 1 && !tail ? "month" : "months";
    return word.charAt(0).toUpperCase() + word.slice(1) + tail + " " + noun + " before the money runs out.";
  }

  function runwayGauge(months, size) {
    var w = size || 112, h = Math.round(w * 0.59);
    var cx = w / 2, cy = h * 0.91, r = w * 0.43;
    var tone = runwayTone(months);
    var colour = tone === "calm" ? "var(--calm)" : tone === "warn" ? "var(--warn)" : tone === "alert" ? "var(--alert)" : "var(--line)";
    var f = months == null ? 0 : clamp(months / RUNWAY_SPAN, 0, 1);
    // the endpoint of a sweep of pi*f radians from the left of the arc
    var th = Math.PI * f;
    var x = cx - r * Math.cos(th), y = cy - r * Math.sin(th);
    var x0 = cx - r, x1 = cx + r;
    var sw = Math.max(6, Math.round(w * 0.08));

    return '<svg viewBox="0 0 ' + w + " " + h + '" style="width:' + w + "px;height:" + h + 'px;flex:none" ' +
      'role="img" aria-label="' + (months == null ? "Runway unknown" : "Runway " + months.toFixed(1) + " months") + '">' +
      '<path d="M' + x0 + " " + cy + " A" + r + " " + r + " 0 0 1 " + x1 + " " + cy + '" fill="none" ' +
        'stroke="var(--line)" stroke-width="' + sw + '" stroke-linecap="round"></path>' +
      (f > 0.001
        ? '<path d="M' + x0 + " " + cy + " A" + r + " " + r + " 0 0 1 " + x.toFixed(1) + " " + y.toFixed(1) + '" fill="none" ' +
          'stroke="' + colour + '" stroke-width="' + sw + '" stroke-linecap="round"></path>'
        : "") +
      '<text x="' + cx + '" y="' + (cy - 4) + '" text-anchor="middle" ' +
        'style="font:400 ' + Math.round(w * 0.23) + 'px var(--serif);fill:var(--ink)">' +
        (months == null ? "—" : months >= RUNWAY_SPAN ? "12+" : months.toFixed(1)) + "</text>" +
      "</svg>";
  }

  function runwayBand() {
    var rw = runway();
    var m = rw.months;
    // the number, and the screen that says where it goes from here, one tap apart
    return '<div class="band runway-band tappable" data-act="plan-tab" data-id="outlook" ' +
      'role="button" tabindex="0" aria-label="See the months ahead">' +
      runwayGauge(m) +
      "<div>" +
      '<span class="label">Runway</span>' +
      '<p class="lead">' + esc(monthsInWords(m)) + "</p>" +
      '<p class="band-sub">' + (m == null
        ? "Log a few weeks and this fills in."
        : fmt(rw.free, { round: true }) + " reachable at " + fmt(rw.burn, { round: true }) + " a month") +
      (rw.basis && rw.basis.partial && m != null
        ? " · from only " + rw.basis.months + " month" + (rw.basis.months === 1 ? "" : "s") + " of data"
        : "") + "</p>" +
      '<div class="btn-row" style="margin-top:0.55rem">' +
      '<button class="btn sm quiet" data-act="plan-tab" data-id="outlook">See the months ahead</button>' +
      '<button class="btn sm" data-act="afford-open">Can I afford it?</button></div>' +
      "</div></div>";
  }

  function worthHero() {
    var assets = totalAssets(), debt = totalDebt(), net = netWorth();
    var histMonths = dataWindow(12, viewMonth);
    var histPoints = histMonths.map(function (mk) {
      var v = totalAssets(lastDayOf(mk));
      return { label: monthName(mk), value: v, tip: monthName(mk, true) + "\n" + fmt(v) };
    });
    var monthStartAssets = totalAssets(lastDayOf(monthShift(viewMonth, -1)));
    var assetsNow = totalAssets(viewMonth === thisMonth() ? null : lastDayOf(viewMonth));
    var html = "";

    html += '<div class="hero"><div class="hero-left">' +
      '<span class="label">Net worth</span>' +
      '<div class="hero-fig">' + fmt(net) + "</div>" +
      '<div class="hero-delta">' + deltaBadge(assetsNow, monthStartAssets, { asMoney: true }) +
      '<span style="color:var(--faint)">in ' + monthName(viewMonth, true) + "</span></div>" +
      '<div class="hero-split">' +
      '<div><span>Accounts</span><span class="fig">' + fmt(assets) + "</span></div>" +
      (debt > 0 ? '<div><span>Debts</span><span class="fig" style="color:var(--loss)">−' + fmt(debt) + "</span></div>" : "") +
      "</div></div>" +
      '<div class="hero-right">' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:0.2rem">' +
      '<span class="label">' + (histMonths.length >= 12
        ? "Balance, last 12 months"
        : "Balance since " + monthName(histMonths[0], true)) + "</span>" +
      '<span class="hint">' + esc(fmtCompact(histPoints[0].value)) + " → " + esc(fmtCompact(histPoints[histPoints.length - 1].value)) + "</span></div>" +
      areaChart(histPoints, { cssHeight: 132, height: 42, color: "var(--c3)", aria: "Balance over the last 12 months" }) +
      '<div style="display:flex;justify-content:space-between;margin-top:0.25rem">' +
      '<span class="hint">' + monthName(histMonths[0], true) + "</span>" +
      '<span class="hint">' + monthName(histMonths[histMonths.length - 1], true) + "</span></div>" +
      "</div></div>";

    return html;
  }

  function todayCard() {
    var t0 = today();
    var todayTx = state.transactions.filter(function (t) { return t.date === t0; });
    var todayOut = todayTx.reduce(function (n, t) { return t.type === "expense" ? n + txBase(t) : n; }, 0);
    var todayIn = todayTx.reduce(function (n, t) { return t.type === "income" ? n + txBase(t) : n; }, 0);

    /* A fair yardstick for a day.

       Three things were wrong with it. It divided by elapsed days but took the
       spending from monthSummary().expense — everything that left, so one
       reimbursable flight or one laptop set a "typical day" nothing like a
       typical day, and it disagreed with the burn pair directly above it.
       It took the summary from the CURRENT month and the day count from
       viewMonth, so stepping back to August divided September's spending by
       August's days. And it never said how many days were behind it, which is
       what makes the figure trustworthy rather than merely small.

       It stays an average over every elapsed day, not only the days something
       was spent: that is what makes it a PACE — avgDay times the days in the
       month is roughly the month's spend, so it predicts. Dividing by spending
       days answers a different question and predicts nothing. */
    var mkNow = monthOf(t0);
    var elapsedDays = Math.max(1, new Date().getDate());
    var avgDay = trueBurnFor(mkNow) / elapsedDays;

    // today measured the same way it is judged, or it is not a comparison
    var todayBurn = todayTx.reduce(function (n, t) {
      if (t.type !== "expense" || isPending(t) || t.oneOff || isGrantSpend(t)) return n;
      return n + txBase(t);
    }, 0);
    var stripped = todayOut - todayBurn;

    // distinct dates, not entries: two coffees on one day is one day
    var seenDays = {};
    monthTx(mkNow).forEach(function (t) {
      if (t.type !== "expense" || isPending(t) || t.oneOff || isGrantSpend(t)) return;
      seenDays[t.date] = 1;
    });
    var spendDays = Object.keys(seenDays).length;
    // under three days the average is one purchase, and a percentage off it is
    // noise dressed up as a finding
    var vsAvg = (avgDay > 0 && spendDays >= 3) ? todayBurn / avgDay : null;

    return '<div class="card pad"><div class="card-tophead">' +
      '<span class="label">Spent today</span>' +
      '<span class="pair-sub" style="margin:0">' + esc(dayLabel(t0)) + "</span></div>" +

      '<div class="pair" style="margin-top:0.5rem;align-items:baseline">' +
      '<div><div class="pair-fig" style="margin-top:0">' + fmt(todayOut) + "</div>" +
      '<div class="pair-sub">' + (
        !todayTx.length ? "nothing logged yet"
        : vsAvg == null ? todayTx.length + (todayTx.length === 1 ? " entry" : " entries")
        : vsAvg <= 1 ? Math.round((1 - vsAvg) * 100) + "% under a typical day"
                     : Math.round((vsAvg - 1) * 100) + "% over a typical day"
      ) + "</div></div>" +
      '<div class="pair-rule"></div>' +
      '<div style="text-align:right"><div class="pair-fig" style="margin-top:0;color:var(--dim)">' +
      fmt(avgDay, { round: true }) + "</div>" +
      '<div class="pair-sub">a typical day this month</div>' +
      '<div class="pair-sub" style="color:var(--faint)">' +
      (spendDays === 0 ? "nothing spent yet this month"
        : "you spent on " + spendDays + " of " + elapsedDays +
          (elapsedDays === 1 ? " day" : " days")) + "</div></div>" +
      "</div>" +
      (stripped > 0.005
        ? '<p class="pair-sub" style="margin-top:0.5rem">' + fmt(stripped, { round: true }) +
          " of today is a one-off or owed back, so it is not counted against a typical day.</p>"
        : "") +

      (todayIn > 0
        ? '<p class="pair-sub" style="margin-top:0.6rem">' + fmt(todayIn) + " came in today as well.</p>"
        : "") +

      (todayTx.length
        ? '<div class="rows" style="margin-top:0.7rem">' + todayTx.slice(0, 4).map(function (t) {
            return '<div class="row"><div class="row-main">' +
              '<div class="row-title">' + esc(t.desc || t.category) + "</div>" +
              '<div class="row-sub">' + esc(t.category) + "</div></div>" +
              '<span class="row-fig">' + (t.type === "income" ? "+" : "−") +
              fmt(txBase(t)).replace("-", "") + "</span></div>";
          }).join("") + "</div>" +
          (todayTx.length > 4
            ? '<div class="btn-row" style="margin-top:0.7rem"><button class="btn sm quiet" data-tab="ledger">' +
              "See all " + todayTx.length + "</button></div>"
            : "")
        : "") + "</div>";
  }

  function monthTilesCard() {
    var cur = monthSummary(viewMonth), prev = monthSummary(monthShift(viewMonth, -1));
    var rw = runway();
    var html = "";


    var sparkIn = dataWindow(6, viewMonth).map(function (mk) {
      var s = monthSummary(mk);
      return { label: monthName(mk), value: s.income, tip: monthName(mk, true) + "\n" + fmt(s.income) };
    });
    var sparkOut = dataWindow(6, viewMonth).map(function (mk) {
      var s = monthSummary(mk);
      return { label: monthName(mk), value: s.expense, tip: monthName(mk, true) + "\n" + fmt(s.expense) };
    });
    var sparkNet = dataWindow(6, viewMonth).map(function (mk) {
      var s = monthSummary(mk);
      return { label: monthName(mk), value: s.net, tip: monthName(mk, true) + "\n" + fmt(s.net) };
    });

    html += '<div class="tiles" style="margin-top:1rem">' +
      '<div class="tile"><span class="label">Money in</span><div class="tile-fig">' + fmt(cur.income, { round: true }) + "</div>" +
      '<div class="tile-foot">' + deltaBadge(cur.income, prev.income) + " vs last month</div>" +
      '<div class="spark">' + sparkline(sparkIn, "var(--c1)") + "</div></div>" +

      '<div class="tile"><span class="label">Money out</span><div class="tile-fig">' + fmt(cur.expense, { round: true }) + "</div>" +
      '<div class="tile-foot">' + (cur.pending > 0.005
        ? "incl. " + fmt(cur.pending, { round: true }) + " you're owed back"
        : deltaBadge(cur.expense, prev.expense, { lowerIsBetter: true }) + " vs last month") + "</div>" +
      '<div class="spark">' + sparkline(sparkOut, "var(--c8)") + "</div></div>" +

      '<div class="tile"><span class="label">Kept</span><div class="tile-fig" style="color:' +
      (cur.net >= 0 ? "var(--gain)" : "var(--loss)") + '">' + fmt(cur.net, { round: true, signed: true }) + "</div>" +
      '<div class="tile-foot">' + deltaBadge(cur.net, prev.net) + " vs last month</div>" +
      '<div class="spark">' + sparkline(sparkNet, "var(--c3)") + "</div></div>" +

      // Runway sits here rather than savings rate, which is a salary-shaped
      // measure. When income arrives in lumps, "how long can I survive" is the
      // question you actually open the app to answer.
      '<div class="tile"><span class="label">Runway</span><div class="tile-fig" style="color:' +
      (rw.months == null ? "var(--ink)" : rw.months >= 6 ? "var(--gain)" : rw.months >= 3 ? "var(--warn)" : "var(--loss)") +
      '">' + (rw.months == null ? "—" : rw.months.toFixed(1) + " mo") + "</div>" +
      '<div class="tile-foot">' + (rw.months == null
        ? "no spending logged yet"
        : fmt(rw.free, { round: true }) + " free ÷ " + fmt(rw.burn, { round: true }) + "/mo") + "</div>" +
      '<div class="spark">' + sparkline(dataWindow(6, viewMonth).map(function (mk) {
        var v = trueBurnFor(mk);
        return { label: monthName(mk), value: v, tip: monthName(mk, true) + "\n" + fmt(v, { round: true }) + " burn" };
      }), "var(--c4)") + "</div></div>" +
      "</div>";

    return html;
  }

  // Both of these used to render on Overview *and* on Insights. They belong to
  // Insights: they are about a pattern, not about right now.
  function whereItWentCard() {
    var cur = monthSummary(viewMonth);
    var donut = donutChart(spendByCategory(viewMonth), cur.expense);
    return '<div class="card"><div class="card-head"><h3>Where it went</h3><span class="sub">' +
      monthName(viewMonth, true) + "</span></div>" +
      '<div class="card-body">' + (donut || '<p class="empty">No spending logged for ' +
        monthName(viewMonth, true) + " yet.</p>") + "</div></div>";
  }

  /* ---- the six tabs ---- */

  function netWorthStrip() {
    var assets = totalAssets(), debt = totalDebt(), net = netWorth();
    var prevEnd = lastDayOf(monthShift(viewMonth, -1));
    var asOf = viewMonth === thisMonth() ? null : lastDayOf(viewMonth);
    var startOfMonth = totalAssets(prevEnd) - debt - restrictedTotal(prevEnd);
    var nowValue = totalAssets(asOf) - debt - restrictedTotal(asOf);
    var moved = nowValue - startOfMonth;
    // freeAssets() is about reach, not solvency — it does not net off debt. Put
    // beside net worth it read as larger than net worth, which is nonsense. Say
    // what is spoken for instead; that is unambiguous next to either figure.
    var spokenFor = committedTotal();

    return '<button class="worth-strip" data-tab="worth" aria-label="Net worth — open the Worth tab">' +
      '<span class="worth-label">Net worth</span>' +
      '<span class="worth-fig' + (net < 0 ? " loss" : "") + '">' + fmt(net) + "</span>" +
      '<span class="worth-meta">' +
      (Math.abs(moved) < 0.005
        ? "level in " + esc(monthName(viewMonth, true))
        : '<span class="' + (moved > 0 ? "gain" : "loss") + '">' + (moved > 0 ? "\u25b2 " : "\u25bc ") +
          fmt(Math.abs(moved), { round: true }) + "</span> in " + esc(monthName(viewMonth, true))) +
      (debt > 0 ? " \u00b7 after " + fmt(debt, { round: true }) + " owed" : "") +
      (spokenFor > 0.5 ? " \u00b7 " + fmt(spokenFor, { round: true }) + " already spoken for" : "") +
      "</span></button>";
  }

  function owedBackCard() {
    var owed = pendingRefunds();
    if (!owed.length) return "";
    var total = owed.reduce(function (t, x) { return t + txBase(x); }, 0);

    return '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>Owed back to you</h3>' +
      '<span class="sub">' + owed.length + (owed.length === 1 ? " thing" : " things") + " · " +
      fmt(total, { round: true }) + " out</span></div>" +
      '<div class="card-body flush"><div class="rows">' +
      owed.slice()
        .sort(function (a, b) { return a.date.localeCompare(b.date); })
        .map(function (t) {
          var age = Math.max(0, Math.round((parseISO(today()) - parseISO(t.date)) / 86400000));
          return '<div class="row stacked">' +
            '<div class="stack-top">' +
            '<span class="row-title">' + esc(t.desc || t.category) + "</span>" +
            '<span class="row-fig">' + fmt(txBase(t)) +
            (isForeign(t.currency) ? '<span class="fx">' + esc(fmtIn(t.amount, t.currency)) + "</span>" : "") +
            "</span></div>" +
            '<div class="stack-foot">' +
            '<span class="row-sub">' + esc(t.category) + " · " + esc(accountName(t.accountId, t.pocketId)) +
            " · paid " + esc(t.date) + "</span>" +
            (age >= 30 ? '<span class="pill warn">' + age + " days</span>" : "") +
            '<button class="btn sm primary" data-act="tx-settle" data-id="' + t.id + '">Money came back</button>' +
            "</div></div>";
        }).join("") + "</div>" +
      '<p class="hint" style="padding:0.75rem">This is money that has left your accounts but is not counted ' +
      "as spending, so it is out of your burn rate and your runway. Mark each one when it comes back.</p>" +
      "</div></div>";
  }

  /* ---- Today, to the design ------------------------------------------
     Date line · net worth · runway · the burn pair · three small tiles ·
     what is due · what is worth noticing. One idea per band, in the order
     you would ask the questions.
     -------------------------------------------------------------------- */

  function burnCard() {
    var out = monthSummary(viewMonth).expense;
    var burn = trueBurnFor(viewMonth);
    var stripped = out - burn;
    var share = out > 0 ? clamp(burn / out, 0, 1) : 0;
    var mn = monthName(viewMonth, true);

    return '<div class="card pad"><div class="pair">' +
      '<div><span class="label">Total out</span>' +
      '<div class="pair-fig">' + fmt(out, { round: true }) + "</div>" +
      '<div class="pair-sub">everything that left in ' + esc(mn) + "</div></div>" +
      '<div class="pair-rule"></div>' +
      '<div><span class="label">True burn</span>' +
      '<div class="pair-fig emph">' + fmt(burn, { round: true }) + "</div>" +
      '<div class="pair-sub">one-offs stripped out</div></div>' +
      "</div>" +
      (stripped > 0.5
        ? '<div class="thinbar" style="margin-top:0.85rem">' +
          '<div class="thinbar-fill" style="width:' + (share * 100).toFixed(1) + '%"></div></div>'
        : "") +
      '<p class="pair-sub" style="margin-top:0.45rem">' +
      (stripped > 0.5
        ? fmt(stripped, { round: true }) + " of it was a one-off or money you are owed back"
        : "all of it was running cost this month") + "</p></div>";
  }

  function threeTiles() {
    var cur = monthSummary(viewMonth);
    function tile(lab, val) {
      return '<div class="card tile-sm"><span class="label">' + esc(lab) + "</span>" +
        '<div class="tile-fig">' + fmt(val, { round: true }) + "</div></div>";
    }
    return '<div class="triple">' + tile("In", cur.income) + tile("Kept", cur.net) +
      tile("Reachable", freeAssets()) + "</div>";
  }

  // The one-tap buttons: things paid often at no fixed time. They belong on the
  // screen you open, next to the day they affect.
  function quickCard() {
    if (!state.quick.length) return "";
    return '<div class="card pad"><div class="card-tophead">' +
      '<span class="label">One tap</span>' +
      '<button class="btn sm quiet" data-act="quick-manage">Manage</button></div>' +
      '<div style="margin-top:0.7rem">' + quickChipsHtml() + "</div></div>";
  }

  function upcomingCard() {
    var up = upcomingBills(14);
    if (!up.length) return "";
    var free = freeAssets();
    var running = 0;
    return '<div class="card pad"><span class="label">Due in the next fortnight</span>' +
      '<div class="due-list">' + up.slice(0, 5).map(function (r) {
        var amt = toBase(r.amount, r.currency, r.rate);
        running += r.type === "income" ? 0 : amt;
        // the rule from the design: a date the current balance cannot
        // comfortably cover is the one that gets marked
        var tight = r.type !== "income" && running > free;
        return '<div class="due-row"><span class="due-name">' + esc(r.name) +
          ' <span class="due-when' + (tight ? " warn" : "") + '">' + esc(shortDate(r.nextDate)) + "</span></span>" +
          '<span class="due-amt">' + fmt(amt, { round: true }) + "</span></div>";
      }).join("") + "</div>" +
      '<div class="btn-row" style="margin-top:0.9rem">' +
      '<button class="btn sm quiet" data-act="plan-tab" data-id="bills">Manage bills</button></div></div>';
  }

  // shortDate drops the year, which is fine for a bill due next week and not
  // fine for a contract ending in a year and a half
  function longDate(d) {
    try {
      var dt = parseISO(d);
      var sameYear = dt.getFullYear() === new Date().getFullYear();
      return dt.toLocaleDateString(undefined,
        sameYear ? { day: "numeric", month: "short" } : { day: "numeric", month: "short", year: "numeric" });
    } catch (e) { return d; }
  }

  function shortDate(d) {
    try {
      return parseISO(d).toLocaleDateString(undefined, { day: "numeric", month: "short" });
    } catch (e) { return d; }
  }

  // These used to sit loose on the page background between two cards, which
  // read as leftover text rather than as a block worth reading. Same shell as
  // everything else on Today.
  function noticesBlock() {
    var notes = buildInsights(viewMonth).slice(0, 3);
    var asking = allowancesAwaiting();
    if (!notes.length && !asking.length) return "";
    return '<div class="card" style="margin-top:1rem"><div class="card-head">' +
      "<h3>Everything worth noting</h3>" +
      '<button class="btn sm quiet" data-act="go-insights">All insights \u2192</button></div>' +
      '<div class="card-body"><div class="notices">' +
      asking.map(function (a) {
        return '<p class="notice warn">How many days did you go in to <b>' + esc(a.source.name) +
          "</b> in " + esc(monthName(a.mk, true)) + "? Until you say, none of the " +
          esc(a.source.allowance.category) + " allowance is counted. " +
          '<button class="btn sm" data-act="allowance-days" data-id="' + a.source.id +
          '" data-mk="' + a.mk + '" style="margin-left:0.3rem">Say how many</button></p>';
      }).join("") +
      notes.map(function (nt) {
        return '<p class="notice' + (nt.tone === "warn" || nt.tone === "bad" ? " warn" : "") + '">' + nt.html + "</p>";
      }).join("") + "</div></div></div>";
  }

  function renderToday() {
    if (!state.accounts.length && !state.transactions.length) {
      return pageHead("Today", "Log what you spend, and see where the month is going.") + firstRunCard();
    }

    var assets = totalAssets(), debt = totalDebt(), net = netWorth();
    var prevEnd = lastDayOf(monthShift(viewMonth, -1));
    var asOf = viewMonth === thisMonth() ? null : lastDayOf(viewMonth);
    var startOfMonth = totalAssets(prevEnd) - debt - restrictedTotal(prevEnd);
    var nowValue = totalAssets(asOf) - debt - restrictedTotal(asOf);
    var moved = nowValue - startOfMonth;

    var html = '<div class="dateline">' +
      '<span>' + esc(new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" })) + "</span>" +
      monthStepper() + "</div>";

    // net worth, plainly, first — it is what people open the app to see
    html += '<div class="hero-plain">' +
      '<span class="label">Net worth</span>' +
      '<div class="hero-fig' + (net < 0 ? " loss" : "") + '">' + fmt(net) + "</div>" +
      '<p class="band-sub">' +
      (Math.abs(moved) < 0.005
        ? "level so far in " + esc(monthName(viewMonth, true))
        : (moved > 0 ? "up " : "down ") + fmt(Math.abs(moved), { round: true }) + " in " + esc(monthName(viewMonth, true))) +
      (debt > 0 ? " · after " + fmt(debt, { round: true }) + " owed" : "") + "</p></div>";

    html += runwayBand();
    html += burnCard();
    html += threeTiles();
    html += todayCard();
    html += quickCard();
    html += upcomingCard();
    html += noticesBlock();
    // last, because it is a list of things to chase rather than something to
    // read every time you open the app
    html += owedBackCard();
    return html;
  }

  /* Worth, in the Press idiom: one card per account, the three-way split
     spelled out inside it, and debts as cards of the same shape. The old
     hairline-row treatment is gone — it was the last screen still speaking
     the previous vocabulary. */

  function assetCard(a) {
    var bal = balanceOf(a);
    var pockets = pocketsOf(a);
    var left = unallocatedOf(a);
    var bits = [];
    if ((a.group || "").trim()) bits.push((a.group || "").trim());
    bits.push(a.type);

    var html = '<div class="card pad asset-card">' +
      '<div class="card-tophead">' +
      '<div style="min-width:0"><div class="asset-name">' + esc(a.name) + "</div>" +
      '<div class="pair-sub" style="margin-top:0.2rem">' + esc(bits.join(" · ")) + "</div></div>" +
      '<span class="due-amt"' + (bal < 0 ? ' style="color:var(--alert)"' : "") + ">" + fmt(bal) + "</span></div>";

    if (pockets.length) {
      html += '<div class="split">' + pockets.map(function (pk) {
        var st = pocketStatus(pk);
        var pb = pocketBalance(a, pk);
        var held = grants().filter(function (g) {
          return !g.closed && parseRef(g.ref || "").pocketId === pk.id;
        })[0];
        return '<div class="split-row' + (st === "committed" ? " muted" : "") + '">' +
          '<span>' + esc(pk.name) + ' <span class="split-tag">' +
          esc(held ? "held for " + held.funder || "a grant" : POCKET_STATUS_LABEL[st]) + "</span></span>" +
          '<span class="split-fig">' + fmt(pb) +
          '<button class="ibtn tiny" data-act="pocket-edit" data-id="' + a.id + "|" + pk.id +
          '" aria-label="Edit ' + esc(pk.name) + '" title="Edit">\u270e</button>' +
          "</span></div>";
      }).join("") +
      (Math.abs(left) > 0.005
        ? '<div class="split-row muted"><span>' + (left < 0 ? "Over-allocated" : "Not allocated") +
          "</span>" + '<span class="split-fig"' + (left < 0 ? ' style="color:var(--warn)"' : "") + ">" +
          fmt(Math.abs(left)) + "</span></div>"
        : "") + "</div>";
    }

    var used = state.transactions.some(function (t) {
      return t.accountId === a.id || t.toAccountId === a.id;
    }) || state.recurring.some(function (r) { return r.accountId === a.id; });

    html += '<div class="budget-foot">' +
      '<p class="pair-sub">' + (pockets.length
        ? pockets.length + (pockets.length === 1 ? " pocket" : " pockets")
        : "no pockets — all of it is available") + "</p>" +
      '<span class="card-tools">' +
      '<button class="ibtn" data-act="pocket-add" data-id="' + a.id + '" aria-label="Add a pocket to ' + esc(a.name) + '" title="Add a pocket">+</button>' +
      '<button class="ibtn" data-act="account-edit" data-id="' + a.id + '" aria-label="Edit ' + esc(a.name) + '" title="Edit">✎</button>' +
      (used
        ? '<button class="ibtn" data-act="account-close" data-id="' + a.id + '" aria-label="Close ' + esc(a.name) + '" title="Close, keeping its history">⊘</button>'
        : '<button class="ibtn danger" data-act="account-del" data-id="' + a.id + '" aria-label="Delete ' + esc(a.name) + '" title="Delete">✕</button>') +
      "</span></div></div>";
    return html;
  }

  function closedAssetCard(a) {
    var bal = balanceOf(a);
    var count = state.transactions.filter(function (t) {
      return t.accountId === a.id || t.toAccountId === a.id;
    }).length;
    return '<div class="card pad asset-card closed">' +
      '<div class="card-tophead">' +
      '<div style="min-width:0"><div class="asset-name" style="color:var(--dim)">' + esc(a.name) + "</div>" +
      '<div class="pair-sub" style="margin-top:0.2rem">closed' + (a.closedOn ? " " + esc(a.closedOn) : "") +
      " · " + count + (count === 1 ? " entry kept" : " entries kept") + "</div></div>" +
      '<span class="due-amt" style="color:var(--dim)">' + fmt(bal) + "</span></div>" +
      '<div class="budget-foot"><p class="pair-sub"></p><span class="card-tools">' +
      '<button class="ibtn" data-act="account-open" data-id="' + a.id + '" aria-label="Reopen ' + esc(a.name) + '" title="Reopen">↺</button>' +
      '<button class="ibtn danger" data-act="account-del" data-id="' + a.id + '" aria-label="Delete ' + esc(a.name) + '" title="Delete for good">✕</button>' +
      "</span></div></div>";
  }

  var WORTH_TABS = [
    { id: "accounts", label: "Accounts" },
    { id: "invest", label: "Investments" },
    { id: "debts", label: "Debts" }
  ];
  var worthTab = "accounts";

  function renderWorth() {
    if (!state.accounts.length && !state.debts.length) {
      return pageHead("Worth", "Everything you hold, and everything you owe.") + firstRunCard();
    }
    var assets = totalAssets(), debt = totalDebt(), net = netWorth();
    var free = freeAssets();
    var live = openAccounts(), shut = state.accounts.filter(function (a) { return a.closed; });
    var histMonths = dataWindow(12, viewMonth);
    var pts = histMonths.map(function (mk) {
      var end = lastDayOf(mk);
      var v = totalAssets(end) - debt - restrictedTotal(end);
      return { label: monthName(mk), value: v, tip: monthName(mk, true) + "\n" + fmt(v) };
    });
    var first = pts[0].value, last = pts[pts.length - 1].value;

    var html = '<div class="dateline"><span>Worth</span>' + monthStepper() + "</div>" +
      '<div class="hero-plain">' +
      '<div class="hero-fig' + (net < 0 ? " loss" : "") + '">' + fmt(net) + "</div>" +
      '<p class="band-sub">' +
      (Math.abs(last - first) < 0.005
        ? "level over " + pts.length + " months"
        : (last > first ? "up " : "down ") + fmt(Math.abs(last - first), { round: true }) +
          " over " + pts.length + " months") + "</p></div>";

    html += '<div class="band" style="padding:0.9rem 1rem 0.7rem">' +
      areaChart(pts, { cssHeight: 96, height: 40, color: "var(--calm)", aria: "Net worth over " + pts.length + " months" }) +
      '<div style="display:flex;justify-content:space-between;margin-top:0.5rem">' +
      '<span class="band-sub" style="margin:0">' + esc(monthName(histMonths[0], true)) + "</span>" +
      '<span class="band-sub" style="margin:0">' + esc(monthName(histMonths[histMonths.length - 1], true)) + "</span>" +
      "</div></div>";

    html += '<div class="triple">' +
      '<div class="card tile-sm"><span class="label">Assets</span><div class="tile-fig">' + fmt(assets, { round: true }) + "</div></div>" +
      '<div class="card tile-sm"><span class="label">Debts</span><div class="tile-fig"' +
        (debt > 0 ? ' style="color:var(--alert)"' : "") + ">" + fmt(debt, { round: true }) + "</div></div>" +
      '<div class="card tile-sm"><span class="label">Reachable</span><div class="tile-fig">' + fmt(free, { round: true }) + "</div></div>" +
      "</div>";

    var held = investedTotal(), spoken = committedTotal();
    if (Math.abs(assets - free) > 0.5) {
      var why = [];
      if (held > 0.5) why.push(fmt(held, { round: true }) + " is invested");
      if (spoken > 0.5) why.push(fmt(spoken, { round: true }) + " sits in pockets you marked as spoken for");
      html += '<p class="band-sub" style="padding:0 0.35rem;margin:0 0 0.9rem">' +
        "The gap is why reachable is lower: " + why.join(", and ") +
        ". It is all yours \u2014 it is just not this month\u2019s money.</p>";
    }

    html += subNav("worth-tab", WORTH_TABS, worthTab);

    if (worthTab === "invest") { html += investBody(); return html; }
    if (worthTab === "debts") { html += debtsBody(); return html; }

    var cash = live.filter(function (a) { return !isInvestment(a); });
    html += '<div class="sec-head"><span class="label">Accounts</span>' +
      '<span class="btn-row"><button class="btn sm" data-act="transfer-add">Transfer</button>' +
      '<button class="btn sm primary" data-act="account-add">Add</button></span></div>';
    html += cash.length
      ? cash.map(assetCard).join("")
      : '<div class="card pad"><p class="empty" style="margin:0">No open accounts.</p></div>';

    if (shut.length) {
      html += '<div class="sec-head"><span class="label">Closed</span>' +
        '<span class="pair-sub" style="margin:0">' + shut.length +
        (shut.length === 1 ? " account" : " accounts") + "</span></div>" +
        shut.map(closedAssetCard).join("");
    }
    return html;
  }

  /* ---------------- Worth > Investments ---------------- */

  function investCard(a) {
    var cost = investCost(a), worth = investValue(a), got = investReturns(a);
    var gain = worth + got - cost;
    var mk = latestMark(a), age = markAge(a);
    var stale = age != null && age > RATE_STALE_DAYS;
    var pct = cost > 0.005 ? gain / cost : null;

    // the value line, wherever there is more than one mark to draw
    var ms = marksOf(a);
    var spark = ms.length > 1
      ? areaChart(ms.map(function (m) {
          var v = toBase(num(m.value), m.currency, m.rate);
          return { label: m.on, value: v, tip: m.on + "\n" + fmt(v) };
        }), { cssHeight: 54, height: 26, color: gain >= 0 ? "var(--calm)" : "var(--alert)",
              aria: "Value of " + a.name })
      : "";

    return '<div class="card pad" style="margin-bottom:0.75rem">' +
      '<div class="card-head" style="padding:0"><h3>' + esc(a.name) + "</h3>" +
      '<span class="sub">' + esc(a.type || "Investment") + "</span>" +
      '<button class="ibtn" data-act="account-edit" data-id="' + a.id + '" aria-label="Edit">\u22ef</button>' +
      "</div>" +
      '<div class="tile-fig" style="margin-top:0.4rem">' + fmt(worth) + "</div>" +
      // Never valued means the gain is unknown, not nought. "Up $0 (+0.0%)"
      // states a return nobody has measured.
      '<p class="band-sub">' + (mk
        ? (gain >= 0 ? "up " : "down ") + fmt(Math.abs(gain), { round: true }) +
          (pct != null ? " (" + (gain >= 0 ? "+" : "\u2212") + Math.abs(pct * 100).toFixed(1) + "%)" : "") +
          " on " + fmt(cost, { round: true }) + " put in" +
          (got > 0.005 ? ", including " + fmt(got, { round: true }) + " paid out to you" : "")
        : "what you have put in \u2014 no valuation yet" +
          (got > 0.005 ? ", though it has paid you " + fmt(got, { round: true }) : "")) + "</p>" +
      (spark ? '<div style="margin-top:0.6rem">' + spark + "</div>" : "") +
      '<div class="split" style="margin-top:0.75rem">' +
      '<div class="split-row"><span>Put in</span><span class="fig">' + fmt(cost) + "</span></div>" +
      '<div class="split-row"><span>Paid back to you</span><span class="fig">' + fmt(got) + "</span></div>" +
      '<div class="split-row"><span>Worth now</span><span class="fig">' + fmt(worth) +
      (mk ? "" : ' <span class="split-tag">not valued</span>') + "</span></div></div>" +
      '<p class="hint" style="margin-top:0.5rem">' +
      (mk
        ? "Valued " + esc(longDate(mk.on)) +
          (stale ? " \u2014 " + age + " days ago, worth checking" : "")
        : "A ledger cannot know what a holding is worth. Say so and this becomes a real figure.") + "</p>" +
      '<div class="btn-row" style="margin-top:0.7rem">' +
      '<button class="btn sm' + (mk ? "" : " primary") + '" data-act="invest-mark" data-id="' + a.id +
      '">' + (mk ? "Update its value" : "Say what it is worth") + "</button>" +
      '<button class="btn sm" data-act="invest-add-in" data-id="' + a.id + '">Put money in</button>' +
      '<button class="btn sm" data-act="invest-return" data-id="' + a.id + '">Log a payout</button>' +
      "</div></div>";
  }

  function investBody() {
    var list = investments().filter(function (a) { return !a.closed; });
    if (!list.length) {
      return '<div class="card pad"><span class="label">Investments</span>' +
        '<p class="empty" style="margin:0.5rem 0 0.9rem">Nothing here yet. An investment is an account ' +
        "with a value you set by hand \u2014 shares, gold, a stake in something. Money you put in is a " +
        "transfer, so it never shows up as spending, and what it pays you back is income.</p>" +
        '<button class="btn primary" data-act="invest-add">Add an investment</button></div>';
    }
    var cost = 0, worth = 0, got = 0;
    list.forEach(function (a) { cost += investCost(a); worth += investValue(a); got += investReturns(a); });
    var gain = worth + got - cost;

    var html = '<div class="card pad">' +
      '<span class="label">Held in investments</span>' +
      '<div class="hero-fig' + (gain < 0 ? " loss" : "") + '" style="font-size:2rem">' + fmt(worth) + "</div>" +
      '<p class="band-sub">' + fmt(cost, { round: true }) + " put in \u00b7 " +
      (gain >= 0 ? "up " : "down ") + fmt(Math.abs(gain), { round: true }) +
      (got > 0.005 ? " \u00b7 " + fmt(got, { round: true }) + " paid out so far" : "") + "</p>" +
      '<p class="hint" style="margin-top:0.5rem">None of this counts toward your runway \u2014 it is ' +
      "worth something, but not this month\u2019s rent.</p></div>";

    html += '<div class="sec-head"><span class="label">Holdings</span>' +
      '<button class="btn sm primary" data-act="invest-add">Add</button></div>';
    html += list.map(investCard).join("");

    var shut = investments().filter(function (a) { return a.closed; });
    if (shut.length) {
      html += '<div class="sec-head"><span class="label">Closed</span></div>' +
        shut.map(closedAssetCard).join("");
    }
    return html;
  }

  /* ---------------- Plan > Grants ---------------- */

  function grantCard(g) {
    var total = grantTotal(g), spent = grantSpent(g), left = total - spent;
    var pct = total > 0 ? spent / total : 0;
    var days = g.endsOn ? daysUntil(g.endsOn) : null;
    var acc = g.ref ? state.accounts.filter(function (a) { return a.id === parseRef(g.ref).accountId; })[0] : null;
    var pk = acc ? pocketById(acc, parseRef(g.ref).pocketId) : null;
    var held = (acc && pk) ? pocketBalance(acc, pk) : null;

    // amber for drift, red for genuinely wrong: overspent is wrong, a deadline
    // with money still sitting there is drift
    var over = spent > total + 0.005;
    var idle = days != null && days >= 0 && days <= 60 && left > total * 0.15;
    var tone = over ? "alert" : (idle || (days != null && days < 0 && left > 0.5)) ? "warn" : "calm";

    var lines = (g.lines || []).map(function (L) {
      var amt = grantLineAmount(g, L), used = grantSpent(g, L.id);
      var lp = amt > 0 ? used / amt : 0;
      var lover = used > amt + 0.005;
      return '<div class="grant-line">' +
        '<div class="grant-line-top"><span>' + esc(L.name) + "</span>" +
        '<span class="fig">' + fmt(used, { round: true }) + " / " + fmt(amt, { round: true }) + "</span></div>" +
        meter(lp, lover ? "var(--alert)" : lp > 0.9 ? "var(--warn)" : "var(--ac)") +
        '<div class="grant-line-foot">' +
        (lover ? '<span class="pill bad">' + fmt(used - amt, { round: true }) + " over</span>"
               : '<span>' + fmt(amt - used, { round: true }) + " left</span>") + "</div></div>";
    }).join("");

    var allocated = (g.lines || []).reduce(function (t, L) { return t + grantLineAmount(g, L); }, 0);
    var unallocated = total - allocated;

    return '<div class="card pad" style="margin-bottom:0.75rem">' +
      '<div class="card-head" style="padding:0"><h3>' + esc(g.name) + "</h3>" +
      (g.funder ? '<span class="sub">' + esc(g.funder) + "</span>" : "") +
      '<button class="ibtn" data-act="grant-edit" data-id="' + g.id + '" aria-label="Edit">\u22ef</button></div>' +
      '<div class="tile-fig" style="margin-top:0.4rem;color:var(--' + tone + ')">' +
      fmt(left, { round: true }) + "</div>" +
      '<p class="band-sub">left of ' + fmt(total, { round: true }) +
      (g.endsOn
        ? (days == null ? "" : days < 0 ? " \u00b7 ended " + esc(longDate(g.endsOn))
           : " \u00b7 " + days + (days === 1 ? " day" : " days") + " to spend it")
        : "") + "</p>" +
      '<div style="margin-top:0.7rem">' + meter(pct, over ? "var(--alert)" : "var(--ac)") + "</div>" +
      '<div class="grant-foot"><span>' + fmt(spent, { round: true }) + " spent</span>" +
      "<span>" + Math.round(pct * 100) + "%</span></div>" +

      (over
        ? '<p class="notice warn" style="margin-top:0.6rem">Spent <b>' + fmt(spent - total, { round: true }) +
          "</b> more than the award. That difference came out of your own money.</p>"
        : idle
        ? '<p class="notice warn" style="margin-top:0.6rem">Still <b>' + fmt(left, { round: true }) +
          "</b> unspent with " + days + " days to go.</p>"
        : days != null && days < 0 && left > 0.5
        ? '<p class="notice warn" style="margin-top:0.6rem"><b>' + fmt(left, { round: true }) +
          "</b> was left unspent when it ended \u2014 usually money that has to go back.</p>"
        : "") +

      (held != null && Math.abs(held - left) > 0.5
        ? '<p class="hint" style="margin-top:0.5rem">' + esc(pk.name) + " holds " +
          fmt(held, { round: true }) + ", which is " +
          (held > left ? fmt(held - left, { round: true }) + " more" : fmt(left - held, { round: true }) + " less") +
          " than the grant has left. Worth reconciling.</p>"
        : "") +

      (lines
        ? '<div class="grant-lines">' + lines + "</div>" +
          (Math.abs(unallocated) > 0.5
            ? '<p class="hint">' + (unallocated > 0
                ? fmt(unallocated, { round: true }) + " of the award is not split into a line yet."
                : fmt(-unallocated, { round: true }) + " more is allocated across lines than the award holds.") + "</p>"
            : "")
        : '<p class="empty" style="margin:0.7rem 0 0">No lines yet. Split it into the headings you have to ' +
          "report against.</p>") +

      '<div class="btn-row" style="margin-top:0.8rem">' +
      '<button class="btn sm primary" data-act="grant-spend" data-id="' + g.id + '">Spend from it</button>' +
      '<button class="btn sm" data-act="grant-line-add" data-id="' + g.id + '">Add a line</button>' +
      "</div></div>";
  }

  function grantsBody() {
    var live = grants().filter(function (g) { return !g.closed; });
    var shut = grants().filter(function (g) { return g.closed; });
    if (!live.length && !shut.length) {
      return '<div class="card pad"><span class="label">Grants</span>' +
        '<p class="empty" style="margin:0.5rem 0 0.9rem">Money you are holding for someone else \u2014 ' +
        "a grant, a fund, a budget you administer. Coffer keeps it out of your net worth, out of your " +
        "burn rate and out of your own budgets, and tracks what is left against the headings you have " +
        "to report on.</p>" +
        '<button class="btn primary" data-act="grant-add">Add a grant</button></div>';
    }

    var restricted = restrictedTotal();
    var html = '<div class="card pad">' +
      '<span class="label">Held for someone else</span>' +
      '<div class="hero-fig" style="font-size:2rem">' + fmt(restricted) + "</div>" +
      '<p class="band-sub">across ' + live.length + (live.length === 1 ? " grant" : " grants") + "</p>" +
      '<p class="hint" style="margin-top:0.5rem">This is out of your net worth, out of your burn rate ' +
      "and out of your budgets. It is in your account; it is not your money.</p></div>";

    html += '<div class="sec-head"><span class="label">Grants</span>' +
      '<button class="btn sm primary" data-act="grant-add">Add</button></div>';
    html += live.map(grantCard).join("");
    if (shut.length) {
      html += '<div class="sec-head"><span class="label">Closed</span></div>' + shut.map(grantCard).join("");
    }
    return html;
  }

  var PLAN_TABS = [
    { id: "outlook", label: "Outlook" },
