<meta charset="utf-8" />
<title>Coffer — Personal Finance, Fully Local</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#101312" media="(prefers-color-scheme: dark)" />
<script>
  /* Read the saved theme before anything paints. Doing this from the main
     script, which runs at the end of the body, means a visible flash of the
     wrong colours on every launch. */
  (function () {
    try {
      var raw = localStorage.getItem("coffer.v2");
      var t = raw && JSON.parse(raw).settings && JSON.parse(raw).settings.theme;
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) { /* no preference stored, or storage blocked: follow the system */ }
  })();
</script>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Coffer" />
<link rel="apple-touch-icon" sizes="192x192" href="../icons/coffer-192.png" />
<link rel="icon" type="image/png" href="../icons/coffer-192.png" />
<link rel="manifest" href="./manifest.webmanifest" />
<style>
  /* ============================================================
     Coffer — the Press visual system

     Warm bone paper in light, near-black with a sage accent in dark.
     Three rules carried from the design, and worth keeping:

       · Cards are separated by fill, not elevation. One shadow exists,
         on the log bar, because it floats over scrolling content.
       · Green means healthy state and nothing else — the runway arc, an
         on-pace budget bar, the net-worth trend. It is never decoration,
         so income rows are NOT green: direction is carried by the sign
         and by position. Amber marks drift and staleness. Red is kept
         for genuinely wrong (over budget, overdue, negative worth).
       · Every monetary figure is set in the serif. That is what makes
         this read as a ledger rather than a dashboard.

     Both token vocabularies live here: the original names, which most
     of the app still uses, and the design's names, so new work can be
     written straight from the handoff.
     ============================================================ */
  :root {
    /* design names */
    --bg: #f7f4ee;
    --surface: #ffffff;
    --tint: #efe9dc;
    --ink: #1b1a17;
    --dim: #6f6a60;
    --line: #e3ded2;
    --ac: #b0472c;
    --onac: #ffffff;
    --calm: #4a6b4f;
    --warn: #a5701a;
    --emph: #b0472c;
    /* the design has no alert role; runway under three months needs one.
       Derived from the accent hue at higher chroma, as the handoff says. */
    --alert: #9c3218;

    /* original names, re-pointed */
    --page: var(--bg);
    --raised: var(--tint);
    --faint: #9a958b;
    --rule: var(--line);
    --rule-mid: #d5cec0;
    --rule-strong: #b9b1a1;
    --brass: var(--ac);
    --brass-soft: rgba(176, 71, 44, 0.10);
    --on-brass: var(--onac);
    --gain: var(--calm);
    --loss: var(--alert);
    --warn-bg: rgba(165, 112, 26, 0.14);
    --gain-bg: rgba(74, 107, 79, 0.12);
    --loss-bg: rgba(156, 50, 24, 0.10);

    --shadow: none;
    --lift: 0 2px 10px rgba(27, 26, 23, 0.08);
    --scrim: rgba(27, 26, 23, 0.40);
    /* Categorical, for the spending donut and the category table only.
       Earth tones, so nothing here competes with the state colours. */
    --c1: #8a6a3f; --c2: #b0472c; --c3: #4a6b4f; --c4: #a5701a;
    --c5: #7a5c78; --c6: #3f6b6b; --c7: #6b6f4a; --c8: #99553d;
    --grid: rgba(27, 26, 23, 0.08);

    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color-scheme: light;
    font-variant-numeric: tabular-nums;
  }

  /* The dark theme is the design's "dark sage": near-black with a sage
     accent, chosen over the warm persimmon dark because green then does
     the state work on its own. */
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      --bg: #101312;
      --surface: #191d1b;
      --tint: #1f2422;
      --ink: #e8ece9;
      --dim: #8d9793;
      --line: #2a302d;
      --ac: #7fb08a;
      --onac: #0f1a13;
      --calm: #7fb08a;
      --warn: #cfa055;
      /* deliberately not the accent here: on sage, letting true burn take
         the accent would put it in competition with the runway arc */
      --emph: #e8ece9;
      --alert: #e0765a;

      --faint: #67716d;
      --rule-mid: #38403c;
      --rule-strong: #4b544f;
      --brass-soft: rgba(127, 176, 138, 0.14);
      --warn-bg: rgba(207, 160, 85, 0.15);
      --gain-bg: rgba(127, 176, 138, 0.13);
      --loss-bg: rgba(224, 118, 90, 0.13);
      --shadow: none;
      --lift: 0 2px 12px rgba(0, 0, 0, 0.45);
      --scrim: rgba(4, 8, 7, 0.62);
      --c1: #c0a071; --c2: #e0765a; --c3: #7fb08a; --c4: #cfa055;
      --c5: #b394b1; --c6: #6fa3a3; --c7: #a3a878; --c8: #d08b70;
      --grid: rgba(232, 236, 233, 0.09);
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #101312;
    --surface: #191d1b;
    --tint: #1f2422;
    --ink: #e8ece9;
    --dim: #8d9793;
    --line: #2a302d;
    --ac: #7fb08a;
    --onac: #0f1a13;
    --calm: #7fb08a;
    --warn: #cfa055;
    --emph: #e8ece9;
    --alert: #e0765a;

    --faint: #67716d;
    --rule-mid: #38403c;
    --rule-strong: #4b544f;
    --brass-soft: rgba(127, 176, 138, 0.14);
    --warn-bg: rgba(207, 160, 85, 0.15);
    --gain-bg: rgba(127, 176, 138, 0.13);
    --loss-bg: rgba(224, 118, 90, 0.13);
    --shadow: none;
    --lift: 0 2px 12px rgba(0, 0, 0, 0.45);
    --scrim: rgba(4, 8, 7, 0.62);
    --c1: #c0a071; --c2: #e0765a; --c3: #7fb08a; --c4: #cfa055;
    --c5: #b394b1; --c6: #6fa3a3; --c7: #a3a878; --c8: #d08b70;
    --grid: rgba(232, 236, 233, 0.09);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }

  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; text-wrap: balance; }

  /* every figure aligns in its column */
  .fig, td.num, th.num, input, .hero-fig, .tile-fig { font-variant-numeric: tabular-nums; }
  /* the design's kicker: a small, wide, quiet label above every figure */
  .label, .tile .label, .hero .label {
    font-size: 0.62rem; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--dim);
  }
  td.num, th.num { font-family: var(--serif); font-weight: 400; letter-spacing: -0.01em; }

  .label {
    font-size: 0.66rem;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    font-weight: 600;
    color: var(--faint);
  }

  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  a { color: var(--brass); }

  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 4px; }

  /* ---------------- shell ---------------- */
  .shell { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100vh; }

  .rail {
    background: var(--surface);
    border-right: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    gap: 1.4rem;
    padding: 1.3rem 0.85rem;
  }

  .brand { display: flex; align-items: center; gap: 0.5rem; padding: 0 0.5rem; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--brass); color: var(--on-brass);
    display: grid; place-items: center;
    font-family: var(--serif); font-weight: 700; font-size: 0.9rem;
    flex-shrink: 0;
  }
  .brand h1 { font-size: 1.1rem; letter-spacing: -0.01em; }

  .rail nav { display: flex; flex-direction: column; gap: 0.1rem; }
  .tab {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.55rem 0.65rem;
    border-radius: 7px;
    color: var(--dim);
    font-size: 0.885rem;
    text-align: left;
  }
  .tab:hover { background: var(--raised); color: var(--ink); }
  .tab .ico { width: 1.1rem; text-align: center; font-size: 0.95rem; opacity: 0.85; }
  .tab[aria-current="page"] { background: var(--brass); color: var(--on-brass); font-weight: 600; }
  .tab[aria-current="page"] .ico { opacity: 1; }

  .rail-foot {
    margin-top: auto;
    display: flex; flex-direction: column; gap: 0.55rem;
    padding: 0 0.5rem;
  }
  .lock-note { font-size: 0.7rem; color: var(--faint); line-height: 1.45; }

  main.view { padding: 1.5rem 1.75rem 3.5rem; max-width: 1120px; min-width: 0; }

  /* ---------------- page head ---------------- */
  .page-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 0.75rem; flex-wrap: wrap;
    margin-bottom: 1rem;
  }
  .page-head > div { min-width: 0; }
  .page-head h2 {
    font-family: var(--sans);
    font-size: 0.62rem; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--dim);
  }
  .page-head p {
    margin: 0.45rem 0 0; font-size: 0.8rem; color: var(--dim);
    max-width: 46ch; line-height: 1.45;
  }

  /* month stepper */
  /* Second-level navigation inside one tab. Scrolls sideways instead of
     wrapping, so a narrow phone keeps it on one line. */
  /* A row whose detail line is too long to sit beside its buttons: name and
     figure on one line, everything else on the next, so the text gets the
     full width instead of a two-word column. */
  .row.stacked { flex-direction: column; align-items: stretch; gap: 0.35rem; }
  .row.stacked .stack-top { display: flex; align-items: baseline; gap: 0.6rem; }
  .row.stacked .stack-top .row-title { flex: 1; min-width: 0; }
  .row.stacked .stack-foot { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
  .row.stacked .stack-foot .row-sub { flex: 1 0 100%; }
  .row.stacked .stack-foot .pill { margin-left: auto; }
  .row.stacked .stack-foot .pill ~ .btn,
  .row.stacked .stack-foot .pill ~ .ibtn { margin-left: 0; }
  /* no pill on this row: the first button takes over pushing the group right */
  .row.stacked .stack-foot > .btn:first-of-type { margin-left: auto; }
  .row.stacked .stack-foot > .pill ~ .btn:first-of-type { margin-left: 0; }

  .checkline {
    display: flex; align-items: center; gap: 0.5rem; cursor: pointer;
    font-size: 0.88rem; color: var(--ink); padding: 0.3rem 0;
  }
  .checkline input { width: 16px; height: 16px; accent-color: var(--brass); flex: none; }

  .subnav {
    display: flex; gap: 0.25rem; margin: 0.9rem 0 0;
    overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    border-bottom: 1px solid var(--rule); padding-bottom: 0.5rem;
  }
  .subnav::-webkit-scrollbar { display: none; }
  .subnav button {
    flex: none; padding: 0.45rem 0.85rem; border-radius: 999px;
    font-size: 0.8rem; font-weight: 600; color: var(--dim);
    white-space: nowrap; border: 0; background: var(--surface);
  }
  .subnav button:hover { color: var(--ink); }
  .subnav button.on { color: var(--onac); background: var(--ac); font-weight: 700; }

  .stepper { display: flex; align-items: center; gap: 0.15rem; }
  .stepper button {
    width: 32px; height: 32px; border-radius: 999px;
    color: var(--dim); display: grid; place-items: center; font-size: 1rem;
  }
  .stepper button:hover:not(:disabled) { background: var(--tint); color: var(--ink); }
  .stepper button:disabled { opacity: 0.3; cursor: default; }
  .stepper .m {
    min-width: 8.5rem; text-align: center;
    font-size: 0.8rem; font-weight: 700; letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }

  /* ---------------- generic surfaces ---------------- */
  .card {
    border: 0;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 18px;
    box-shadow: var(--shadow);
  }
  .card > .card-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 0.75rem; flex-wrap: wrap;
    padding: 1rem 1.15rem 0.2rem;
  }
  .card > .card-head h3 {
    font-family: var(--sans);
    font-size: 0.62rem; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--dim);
  }
  .card > .card-head .sub { font-size: 0.72rem; color: var(--dim); }
  .card > .card-body { padding: 0.7rem 1.15rem 1.15rem; }
  .card > .card-body.flush { padding: 0.35rem 1.15rem 0.8rem; }

  .stack { display: flex; flex-direction: column; gap: 1rem; }
  .cols-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
  .cols-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
  @media (max-width: 900px) { .cols-2, .cols-3 { grid-template-columns: minmax(0, 1fr); } }

  /* ---------------- hero (net worth) ---------------- */
  /* One line of the thing people open the app to see. The full picture —
     the 12-month curve and the accounts behind it — is a tap away on Worth. */
  .worth-strip {
    display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap;
    width: 100%; text-align: left; cursor: pointer;
    padding: 0.85rem 1.1rem; margin-bottom: 1rem;
    background: var(--surface); border: 1px solid var(--rule);
    border-radius: 18px; box-shadow: var(--shadow);
  }
  .worth-strip:hover { border-color: var(--rule-mid); }
  .worth-label {
    font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--faint); flex: none;
  }
  .worth-fig {
    font-family: var(--serif); font-size: 1.9rem; font-weight: 400;
    color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.1;
  }
  .worth-fig.loss { color: var(--loss); }
  .worth-meta { font-size: 0.78rem; color: var(--dim); margin-left: auto; }
  .worth-meta .gain { color: var(--gain); font-weight: 600; }
  .worth-meta .loss { color: var(--loss); font-weight: 600; }
  @media (max-width: 460px) {
    .worth-meta { margin-left: 0; flex-basis: 100%; }
  }

  .hero {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 18px;
    box-shadow: var(--shadow);
    display: grid;
    grid-template-columns: minmax(210px, 0.85fr) minmax(0, 1.7fr);
    overflow: hidden;
  }
  @media (max-width: 760px) { .hero { grid-template-columns: minmax(0, 1fr); } }

  .hero-left {
    padding: 1.15rem 1.3rem 1.3rem;
    border-right: 1px solid var(--rule);
    display: flex; flex-direction: column; gap: 0.1rem;
  }
  @media (max-width: 760px) { .hero-left { border-right: none; border-bottom: 1px solid var(--rule); } }

  .hero-fig {
    font-family: var(--serif);
    font-size: clamp(2.9rem, 12vw, 3.6rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.05;
    margin-top: 0.3rem;
  }
  .hero-delta { display: flex; align-items: center; gap: 0.4rem; margin-top: 0.5rem; font-size: 0.8rem; }
  .hero-split { margin-top: 0.9rem; padding-top: 0.75rem; border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: 0.3rem; }
  .hero-split div { display: flex; justify-content: space-between; gap: 0.6rem; font-size: 0.8rem; color: var(--dim); }
  .hero-split .fig { color: var(--ink); font-weight: 600; }

  .hero-right { padding: 0.9rem 1.1rem 0.7rem; min-width: 0; }

  /* ---------------- stat tiles ---------------- */
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; }
  @media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  .tile {
    border-radius: 16px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 0.85rem 1rem 0.9rem;
    display: flex; flex-direction: column; gap: 0.1rem;
    min-width: 0;
  }
  .tile-fig {
    font-family: var(--serif); font-size: 1.45rem; font-weight: 400;
    letter-spacing: -0.02em; margin-top: 0.35rem; line-height: 1;
  }
  .tile-foot { font-size: 0.72rem; color: var(--faint); margin-top: 0.15rem; display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap; }
  .tile .spark { margin-top: 0.5rem; }

  .delta { display: inline-flex; align-items: center; gap: 0.2rem; font-weight: 650; font-variant-numeric: tabular-nums; }
  .delta.up { color: var(--gain); }
  .delta.down { color: var(--loss); }
  .delta.flat { color: var(--faint); }

  /* ---------------- rows / ruled lists ---------------- */
  .rows { display: flex; flex-direction: column; }
  .row {
    display: flex; align-items: center; gap: 0.7rem;
    padding: 0.8rem 0;
    border-bottom: 1px solid var(--line);
    min-width: 0;
  }
  .row:last-child { border-bottom: none; }
  .row-main { flex: 1; min-width: 0; }
  .row-title { font-size: 0.88rem; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
  .row-sub { font-size: 0.72rem; color: var(--dim); margin-top: 0.2rem; line-height: 1.35; }
  .row-end { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
  .fx { display:block; font-size:0.72rem; color:var(--faint); font-variant-numeric:tabular-nums; }
  .row-fig {
    font-family: var(--serif); font-size: 1.05rem; font-weight: 400;
    font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -0.01em;
  }
  .row-fig.gain { color: var(--ink); }
  .row-fig.loss { color: var(--alert); }

  .empty {
    padding: 0.3rem 0 0.2rem;
    color: var(--faint);
    font-size: 0.86rem;
    line-height: 1.55;
  }
  .empty strong { color: var(--dim); font-weight: 600; }

  /* ---------------- buttons ---------------- */
  /* Everything actionable is a pill and everything that reports state is a
     pill, at the same radius and the same height, so a "Log" button and an
     "in 14d" tag beside it read as one family instead of two. */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem;
    padding: 0.55rem 1rem;
    border-radius: 999px;
    font-size: 0.82rem;
    font-weight: 700;
    background: var(--tint);
    border: 0;
    color: var(--ink);
    white-space: nowrap;
  }
  .btn:hover { filter: brightness(0.97); }
  .btn.primary { background: var(--ac); color: var(--onac); }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.quiet { background: transparent; color: var(--dim); font-weight: 600; }
  .btn.quiet:hover { background: var(--tint); color: var(--ink); }
  .btn.danger { color: var(--alert); background: var(--loss-bg); }
  .btn.sm { padding: 0.4rem 0.75rem; font-size: 0.75rem; font-weight: 700; }
  .btn-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }

  .today-row { display:flex; gap:1.2rem; align-items:flex-start; flex-wrap:wrap; }
  .today-main { flex:1 1 140px; }
  .today-side { flex:0 0 auto; }
  .today-fig { font-size:1.9rem; font-weight:650; letter-spacing:-0.02em; font-variant-numeric:tabular-nums;
    line-height:1.1; margin-top:0.1rem; }
  .today-side .today-fig { font-size:1.15rem; }
  .today-fig.quiet { color:var(--dim); }
  .today-fig.gain { color:var(--ink); }
  .dayrow td { background:var(--raised); border-top:1px solid var(--rule-mid);
    padding:0.45rem 0.65rem; }
  .dayrow td > span { display:inline-block; vertical-align:baseline; }
  .day-name { font-weight:650; font-size:0.82rem; }
  .day-n { font-size:0.7rem; color:var(--faint); margin-left:0.5rem; }
  /* Not float:right — the table is wider than a phone, so a right-floated
     total lands off the edge of the horizontal scroll where it is never seen.
     Keep it beside the count, at the left where the eye already is. */
  .day-figs { font-variant-numeric:tabular-nums; font-size:0.8rem; }
  .day-out { color:var(--loss); margin-left:0.7rem; font-weight:600; }
  .day-in { color:var(--gain); margin-left:0.7rem; font-weight:600; }
  .dayrow td { position:sticky; left:0; }
  .row.pocket { padding-left:1.6rem; background:var(--raised); }
  .row.pocket .row-title { font-size:0.86rem; font-weight:500; }
  /* CSS escapes are hex and carry no "u": "\u203a" is read as the letter u
     followed by the text 203a, which is what was printing over every pocket
     name. The hex form is also pure ASCII, so no encoding can mangle it. */
  .row.pocket::before { content:"\203A"; position:absolute; left:0.8rem; top:0.55rem;
    color:var(--faint); font-size:0.9rem; line-height:1; pointer-events:none; }
  .row.pocket { position:relative; }
  .grp-head { display:flex; align-items:baseline; gap:0.5rem; padding:0.55rem 1rem 0.3rem;
    background:var(--raised); border-top:1px solid var(--rule); }
  .grp-name { font-weight:650; font-size:0.86rem; letter-spacing:0.01em; }
  .grp-sub { font-size:0.72rem; color:var(--faint); }
  .grp-fig { margin-left:auto; font-variant-numeric:tabular-nums; font-weight:600; font-size:0.88rem; }
  .grp-fig.loss { color:var(--loss); }
  .ibtn.on { color: var(--brass); border-color: var(--brass); }
  .ibtn {
    width: 32px; height: 32px; border-radius: 999px;
    display: grid; place-items: center;
    color: var(--dim); font-size: 0.88rem;
    flex-shrink: 0;
  }
  .ibtn:hover { background: var(--tint); color: var(--ink); }
  .ibtn.danger:hover { background: var(--loss-bg); color: var(--alert); }

  /* ---------------- forms ---------------- */
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.7rem 0.75rem; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 0.28rem; min-width: 0; }
  .field.wide { grid-column: span 2; }
  @media (max-width: 620px) { .field.wide { grid-column: span 1; } }
  .field > .label { color: var(--faint); }

  input, select {
    font: inherit;
    font-size: 0.875rem;
    width: 100%;
    padding: 0.48rem 0.6rem;
    border-radius: 7px;
    border: 1px solid var(--rule-mid);
    background: var(--surface);
    color: var(--ink);
    min-width: 0;
  }
  input::placeholder { color: var(--faint); }
  input:hover, select:hover { border-color: var(--rule-strong); }
  .seg { display: flex; gap: 0.25rem; }
  .seg button {
    flex: 1; padding: 0.45rem 0.6rem; border-radius: 999px;
    font-size: 0.78rem; font-weight: 600; color: var(--dim);
    background: var(--tint); white-space: nowrap;
  }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--ac); color: var(--onac); font-weight: 700; }

  /* ---------------- table ---------------- */
  .tscroll { overflow-x: auto; margin: 0 -1.15rem; padding: 0 1.15rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.855rem; }
  th {
    text-align: left; white-space: nowrap;
    font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.08em;
    font-weight: 600; color: var(--faint);
    padding: 0.45rem 0.55rem;
    border-bottom: 1px solid var(--rule-mid);
  }
  th.num, td.num { text-align: right; }
  td { padding: 0.55rem 0.55rem; border-bottom: 1px solid var(--rule); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--raised); }
  td.num { white-space: nowrap; font-weight: 600; }
  td.num.gain { color: var(--ink); }
  .cat-tag { display: inline-flex; align-items: center; gap: 0.35rem; white-space: nowrap; }
  .cat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* ---------------- pills / meters ---------------- */
  .pill {
    display: inline-flex; align-items: center; gap: 0.28rem;
    font-size: 0.72rem; font-weight: 700;
    padding: 0.4rem 0.7rem; border-radius: 999px;
    white-space: nowrap;
    background: var(--tint); color: var(--dim); border: 0;
  }
  .pill.ok { background: var(--gain-bg); color: var(--calm); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: var(--loss-bg); color: var(--alert); }
  .pill.mute { background: var(--tint); color: var(--dim); }

  .meter { height: 7px; border-radius: 999px; background: var(--rule); overflow: hidden; position: relative; }
  .meter-fill { height: 100%; border-radius: 999px; }
  .meter-pace { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: 0.5; }

  /* ---------------- charts ---------------- */
  .chart { width: 100%; display: block; overflow: visible; }
  .legend { display: flex; flex-wrap: wrap; gap: 0.35rem 1rem; margin-top: 0.7rem; }
  .legend-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.76rem; color: var(--dim); }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .donut-legend { display: flex; flex-direction: column; gap: 0.32rem; min-width: 0; flex: 1; }
  .donut-legend .li { display: flex; align-items: center; gap: 0.5rem; font-size: 0.79rem; }
  .donut-legend .li .nm { flex: 1; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .donut-legend .li .vl { font-weight: 650; font-variant-numeric: tabular-nums; }
  .donut-legend .li .pc { color: var(--faint); font-variant-numeric: tabular-nums; width: 2.6rem; text-align: right; }

  .tip {
    position: fixed; z-index: 90; pointer-events: none;
    background: var(--ink); color: var(--page);
    font-size: 0.73rem; font-weight: 500;
    padding: 0.36rem 0.55rem; border-radius: 6px;
    transform: translate(-50%, -128%);
    white-space: pre; opacity: 0; transition: opacity 0.1s ease;
    font-variant-numeric: tabular-nums;
    box-shadow: 0 6px 18px -8px rgba(0,0,0,0.5);
  }
  .tip.on { opacity: 1; }

  /* ---------------- insight notes ---------------- */
  .notes { display: flex; flex-direction: column; }
  .note {
    display: flex; gap: 0.7rem; align-items: flex-start;
    padding: 0.7rem 0; border-bottom: 1px solid var(--rule);
    font-size: 0.855rem; line-height: 1.5;
  }
  .note:last-child { border-bottom: none; }
  .note-mark {
    width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
    display: grid; place-items: center; font-size: 0.75rem; font-weight: 700;
    margin-top: 0.05rem;
  }
  .note-mark.ok { background: var(--gain-bg); color: var(--gain); }
  .note-mark.warn { background: var(--warn-bg); color: var(--warn); }
  .note-mark.bad { background: var(--loss-bg); color: var(--loss); }
  .note-mark.info { background: var(--brass-soft); color: var(--brass); }
  .note b { font-weight: 650; }
  .note .fig { font-weight: 650; }

  /* ---------------- modal ---------------- */
  .scrim {
    position: fixed; inset: 0; z-index: 100;
    background: var(--scrim);
    display: grid; place-items: center;
    padding: 1rem;
    overflow-y: auto;
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--rule-mid);
    border-radius: 14px;
    box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.5);
    width: 100%; max-width: 440px;
    margin: auto;
  }
  .modal-head { padding: 1.1rem 1.25rem 0.6rem; }
  .modal-head h3 { font-size: 1.1rem; }
  .modal-head p { margin: 0.35rem 0 0; font-size: 0.85rem; color: var(--dim); line-height: 1.5; }
  .modal-body { padding: 0.5rem 1.25rem 0.3rem; }
  .modal-foot {
    display: flex; justify-content: flex-end; gap: 0.5rem;
    padding: 1rem 1.25rem 1.15rem;
    flex-wrap: wrap;
  }

  /* ---------------- a save that is not happening ----------------
     The one message in the app that must not go away on its own. It sits
     above everything, including the log bar, because logging into a browser
     that is refusing to store anything is the failure it exists to stop. */
  .savefail {
    position: fixed; z-index: 200; left: 0; right: 0;
    top: 0; padding: calc(0.7rem + env(safe-area-inset-top)) 1rem 0.8rem;
    background: var(--loss-bg); color: var(--alert);
    border-bottom: 1px solid var(--alert);
    font-size: 0.8rem; line-height: 1.45;
  }
  .savefail b { color: inherit; }
  .savefail .btn-row { margin-top: 0.6rem; }
  .savefail .btn { background: var(--surface); color: var(--ink); }
  .savefail .btn.primary { background: var(--alert); color: #fff; }

  /* ---------------- toast ---------------- */
  .toasts {
    position: fixed; z-index: 120;
    left: 50%; transform: translateX(-50%);
    bottom: calc(1.1rem + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 0.5rem;
    width: min(420px, calc(100vw - 2rem));
  }
  .toast {
    display: flex; align-items: center; gap: 0.75rem;
    background: var(--ink); color: var(--page);
    padding: 0.65rem 0.75rem 0.65rem 0.95rem;
    border-radius: 9px;
    font-size: 0.84rem;
    box-shadow: 0 14px 34px -14px rgba(0, 0, 0, 0.6);
  }
  .toast span { flex: 1; }
  .toast button {
    color: var(--page); font-weight: 700; font-size: 0.8rem;
    padding: 0.3rem 0.55rem; border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.28);
  }
  .toast button:hover { background: rgba(255, 255, 255, 0.14); }

  /* ---------------- lock screen ---------------- */
  .lockscreen {
    position: fixed; inset: 0; z-index: 200;
    background: var(--page);
    display: grid; place-items: center;
    padding: 1.5rem;
  }
  .lockbox { width: 100%; max-width: 300px; text-align: center; }
  .lockbox .brand-mark { width: 44px; height: 44px; font-size: 1.3rem; margin: 0 auto 0.9rem; }
  .lockbox h2 { font-size: 1.2rem; }
  .lockbox p { font-size: 0.82rem; color: var(--dim); margin: 0.4rem 0 1.1rem; line-height: 1.5; }
  .lockbox input { text-align: center; letter-spacing: 0.3em; font-size: 1.1rem; padding: 0.6rem; }
  .lock-err { color: var(--loss); font-size: 0.8rem; margin-top: 0.6rem; min-height: 1.2em; }

  .privacy {
    display: flex; gap: 0.8rem; align-items: flex-start;
    background: var(--gain-bg);
    border: 1px solid rgba(10, 127, 54, 0.22);
    border-radius: 18px;
    padding: 0.95rem 1.15rem;
    font-size: 0.855rem; line-height: 1.55;
  }
  .privacy .g { font-size: 1.15rem; line-height: 1; }
  .privacy b { font-weight: 650; }

  .hint { font-size: 0.76rem; color: var(--faint); line-height: 1.5; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .chip {
    display: inline-flex; align-items: center; gap: 0.4rem;
    background: var(--raised); border: 1px solid var(--rule-mid);
    padding: 0.28rem 0.4rem 0.28rem 0.6rem;
    border-radius: 999px; font-size: 0.79rem;
  }
  .chip button { color: var(--faint); font-size: 0.85rem; line-height: 1; padding: 0 0.15rem; }
  .chip button:hover { color: var(--loss); }

  .chip.quick {
    padding: 0.42rem 0.7rem;
    gap: 0.45rem;
    cursor: pointer;
    font-size: 0.83rem;
  }
  .chip.quick:hover { border-color: var(--brass); background: var(--brass-soft); }
  .chip.quick b { font-weight: 600; }

  #omniBox { font-variant-numeric: normal; }

  @media (max-width: 620px) {
    .chip.quick { min-height: 40px; font-size: 0.86rem; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .meter-fill { transition: width 0.25s ease; }
    .tab, .btn, .ibtn { transition: background-color 0.12s ease, color 0.12s ease; }
  }

  /* ============================================================
     Phone: the rail becomes a bottom tab bar.
     Placed last so it wins the cascade over the base rules.
     ============================================================ */
  /* ---------------- Today, in the Press shape ---------------- */
  .dateline {
    display: flex; align-items: center; justify-content: space-between;
    gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.1rem;
  }
  .dateline > span {
    font-size: 0.62rem; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--dim);
  }

  .hero-plain { padding: 0 0.25rem; margin-bottom: 1.1rem; }
  .hero-plain .hero-fig { margin-top: 0.45rem; }
  .hero-plain .hero-fig.loss { color: var(--alert); }

  .band {
    background: var(--tint); border-radius: 18px;
    padding: 1.1rem 1.15rem 1rem; margin-bottom: 0.75rem;
  }
  .runway-band { display: flex; gap: 1rem; align-items: center; }
  .lead { font-size: 0.88rem; font-weight: 600; line-height: 1.35; margin: 0.45rem 0 0; }
  .band-sub { font-size: 0.72rem; color: var(--dim); margin: 0.4rem 0 0; line-height: 1.4; }

  .card.pad { padding: 1rem 1.15rem; margin-bottom: 0.75rem; }
  .card-tophead { display: flex; align-items: baseline; justify-content: space-between; gap: 0.6rem; }
  .card-tophead .sub { font-size: 0.72rem; color: var(--dim); }
  /* a .card.pad already carries its own padding; an inner body must not add
     a second helping of it */
  .card.pad > .card-body,
  .card.pad > .card-body.flush { padding: 0.7rem 0 0; }
  .card.pad > .card-body > .tscroll { margin: 0 -1.15rem; padding: 0 1.15rem; }

  /* a heading between groups of cards, at kicker weight so it organises
     without competing with the cards themselves */
  .sec-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 0.6rem; margin: 1.2rem 0.35rem 0.6rem;
  }

  .asset-name { font-size: 0.95rem; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
  .asset-card.closed { opacity: 0.75; }
  /* the three-way split, indented under the account it belongs to */
  .split {
    margin-top: 0.8rem; padding-left: 0.75rem;
    border-left: 2px solid var(--line);
    display: flex; flex-direction: column; gap: 0.45rem;
  }
  .split-row {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 0.6rem; font-size: 0.78rem;
  }
  .split-row.muted { color: var(--dim); }
  /* One row per way of paying. The verdict pill is the column the eye runs
     down, so it sits on the same line as the name and the detail hangs under
     both rather than pushing them apart. */
  /* the pencil beside a pocket figure: present, but never louder than the money */
  .ibtn.tiny { width: 24px; height: 24px; font-size: 0.72rem; margin-left: 0.35rem; vertical-align: middle; }
  .split-fig { white-space: nowrap; }

  .grant-foot, .grant-line-foot {
    display: flex; justify-content: space-between; margin-top: 0.35rem;
    font-size: 0.72rem; color: var(--dim);
  }
  .grant-lines { margin-top: 0.9rem; display: flex; flex-direction: column; gap: 0.8rem; }
  .grant-line-top {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 0.6rem; margin-bottom: 0.35rem; font-size: 0.82rem;
  }
  .grant-line-top .fig { font-family: var(--serif); font-weight: 400; white-space: nowrap; }

  .afford-rows { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.9rem; }
  .afford-row {
    display: grid; grid-template-columns: 1fr auto; gap: 0.3rem 0.6rem;
    align-items: center; text-align: left; width: 100%;
    padding: 0.7rem 0.85rem; border: 1px solid var(--rule); border-radius: 14px;
    background: transparent; color: inherit; cursor: pointer; font: inherit;
  }
  .afford-row.on { background: var(--tint); border-color: var(--rule-strong); }
  .afford-row.off { opacity: 0.55; cursor: default; }
  .afford-name { font-size: 0.86rem; font-weight: 600; min-width: 0; }
  .afford-detail { grid-column: 1 / -1; font-size: 0.74rem; color: var(--dim); line-height: 1.45; }
  /* A filter you reach for constantly should be one tap, not a select. Same
     pill vocabulary as the sub-nav, scrolling sideways rather than wrapping. */
  .chiprow {
    display: flex; gap: 0.35rem; overflow-x: auto;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .chiprow::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; padding: 0.42rem 0.8rem; border-radius: 999px;
    font-size: 0.78rem; font-weight: 600; color: var(--dim);
    background: var(--tint); border: 1px solid transparent; cursor: pointer;
  }
  .chip.on { background: var(--ac); color: var(--onac); }

  /* the rest of the filters, folded away until wanted */
  .fold { margin-top: 0.8rem; }
  .fold > summary {
    cursor: pointer; list-style: none; font-size: 0.78rem; font-weight: 600;
    color: var(--dim); padding: 0.2rem 0; display: flex; align-items: center; gap: 0.4rem;
  }
  .fold > summary::-webkit-details-marker { display: none; }
  .fold > summary::after {
    content: "\203A"; margin-left: auto; transform: rotate(90deg);
    transition: transform 0.15s ease; color: var(--faint);
  }
  .fold[open] > summary::after { transform: rotate(-90deg); }

  .tappable { cursor: pointer; }
  .tappable:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }
  /* a row deliberately left out of a calculation, not a disabled one */
  .row.muted .row-title, .row.muted .row-fig { color: var(--faint); }
  .row.muted .row-fig { font-variant-numeric: tabular-nums; }
  .split-tag { font-size: 0.68rem; color: var(--dim); }
  .split-fig { font-family: var(--serif); font-size: 0.95rem; font-weight: 400; white-space: nowrap; }
  .pair { display: flex; align-items: stretch; justify-content: space-between; gap: 1rem; }
  .pair > div:first-child, .pair > div:last-child { flex: 1; min-width: 0; }
  .pair-rule { width: 1px; background: var(--line); flex: none; }
  .pair-fig {
    font-family: var(--serif); font-size: 1.6rem; font-weight: 400;
    letter-spacing: -0.01em; line-height: 1; margin-top: 0.45rem;
  }
  .pair-fig.emph { color: var(--emph); }
  .pair-sub { font-size: 0.66rem; color: var(--dim); margin: 0.35rem 0 0; line-height: 1.35; }
  .thinbar { height: 7px; border-radius: 4px; background: var(--tint); overflow: hidden; }
  .thinbar-fill { height: 100%; background: var(--ac); border-radius: 4px; }

  /* the bar with today's mark on it: the point is the gap between how far
     through the money you are and how far through the month */
  .markbar { height: 8px; border-radius: 999px; background: var(--line); position: relative; }
  .markbar-fill { height: 100%; border-radius: 999px; }
  .markbar-mark {
    position: absolute; top: -4px; bottom: -4px; width: 2px;
    border-radius: 2px; background: var(--ink);
  }
  /* no cap on this, and outside your burn if it was a one-off */
  .stripebar {
    height: 6px; border-radius: 999px;
    background: repeating-linear-gradient(90deg, var(--line) 0 5px, transparent 5px 10px);
  }
  .budget-foot {
    display: flex; align-items: center; gap: 0.5rem;
    margin-top: 0.5rem;
  }
  .budget-foot .pair-sub { flex: 1; min-width: 0; margin: 0; }
  /* A tool cluster is a row of buttons wherever it appears. Scoped to
     .budget-foot alone, every other use stacked them one per line and turned a
     ledger entry into six lines of icons. */
  .card-tools { display: flex; gap: 0.1rem; flex: none; align-items: center; }
  .row.stacked .stack-foot .card-tools { margin-left: auto; }
  /* pills sit beside the tools on that second line, not pushed past them */
  .row.stacked .stack-foot .card-tools ~ .pill { margin-left: 0; }

  .triple { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.6rem; margin-bottom: 0.75rem; }
  .card.tile-sm { padding: 0.85rem 0.95rem; border-radius: 16px; }
  /* a tile whose value is a phrase rather than a figure: the display serif is
     for numbers, and prose at that size just breaks */
  .tile-fig.words {
    font-family: var(--sans); font-size: 0.95rem; font-weight: 600;
    letter-spacing: 0; line-height: 1.25;
  }

  .due-list { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.75rem; }
  .due-row { display: flex; align-items: baseline; gap: 0.6rem; }
  .due-name { flex: 1; min-width: 0; font-size: 0.82rem; font-weight: 500; }
  .due-when { font-size: 0.7rem; color: var(--dim); }
  .due-when.warn { color: var(--warn); }
  .due-amt { font-family: var(--serif); font-size: 1rem; font-weight: 400; }

  .notices { padding: 0; margin: 0; }
  .notice { font-size: 0.78rem; line-height: 1.5; color: var(--dim); margin: 0 0 0.55rem; }
  .notice:last-child { margin-bottom: 0; }
  .notice.warn { color: var(--warn); }
  .notice b { color: var(--ink); font-weight: 600; }
  .notice.warn b { color: inherit; }

  /* ---------------- the bottom assembly ----------------
     Logging is the thing done many times a day, so it sits under the thumb
     on every screen rather than at the top of two of them. The bar and the
     tabs travel together; this is the only part of the app that floats, and
     the only surviving shadow. */
  .logbar { display: flex; gap: 0.55rem; align-items: center; padding: 0 0.2rem 0.55rem; }
  .logbar-field {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 0.5rem;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 0.1rem 0.9rem;
    box-shadow: var(--lift);
  }
  .logbar-field:focus-within { border-color: var(--ac); }
  .logbar-plus { color: var(--ac); font-weight: 600; font-size: 0.9rem; flex: none; }
  .logbar input {
    flex: 1; min-width: 0; border: 0; background: none; padding: 0.72rem 0;
    font: 500 0.9rem/1 var(--sans); color: var(--ink);
  }
  .logbar input::placeholder { color: var(--dim); }
  .logbar input:focus { outline: none; }
  .logbar-go {
    flex: none; padding: 0.8rem 1.1rem; border-radius: 999px;
    background: var(--ac); color: var(--onac);
    font: 700 0.82rem/1 var(--sans);
  }
  .logbar-go:hover { filter: brightness(1.06); }

  .tab .ico svg { display: block; }

  @media (max-width: 880px) {
    .shell { grid-template-columns: minmax(0, 1fr); }
    .rail {
      position: fixed; left: 0; right: 0; bottom: 0; top: auto;
      z-index: 40;
      flex-direction: row;
      gap: 0;
      padding: 0.3rem 0.25rem calc(0.3rem + env(safe-area-inset-bottom));
      border-right: none;
      border-top: 1px solid var(--rule-mid);
      box-shadow: 0 -8px 24px -16px rgba(0, 0, 0, 0.4);
    }
    .rail .brand, .rail .rail-foot { display: none; }
    .rail { flex-direction: column; padding: 0.5rem 0.5rem calc(0.2rem + env(safe-area-inset-bottom)); }
    .rail nav { flex-direction: row; gap: 0.1rem; width: 100%; }
    .logbar { width: 100%; padding: 0 0.15rem 0.5rem; }
    .tab {
      flex: 1; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.3rem; padding: 0.3rem 0.1rem;
      font-size: 0.56rem; font-weight: 600; letter-spacing: 0.06em;

<div class="savefail" id="savefail" role="alert" hidden></div>

<div class="tip" id="tip" role="status" aria-live="polite"></div>
<div id="overlay"></div>

<script>
(function () {
  "use strict";

  /* ============================================================
     Coffer — a local-only personal finance ledger.

     Two environment constraints shape this file:
       1. Native confirm()/alert() are unreliable inside a sandboxed
          iframe (confirm() silently returns false), so every
          confirmation goes through the in-page modal below.
       2. <form> submit events never fire without the allow-forms
          sandbox permission, so nothing here relies on form
          submission — actions are explicit button clicks, with
          Enter wired up manually via submitOn().
     ============================================================ */

  var BUILD = "2026-09-04h";   // shown in Settings, so "did it update?" is answerable
  var KEY = "coffer.v2";
  var LEGACY_KEY = "coffer.v1";
  var CAT_VARS = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6", "--c7", "--c8"];
  var ACCOUNT_TYPES = ["Checking", "Savings", "Cash", "Credit Card", "Investment"];
  // "once" is a lump sum on a date — project work, a grant, a bonus. Forcing
  // it into a monthly rhythm was misreporting the actual cash flow.
  var FREQ = ["weekly", "monthly", "yearly", "once"];
  var FREQ_LABEL = { weekly: "weekly", monthly: "monthly", yearly: "yearly", once: "one-off" };

  var DEFAULT_CATS = {
    expense: ["Housing", "Groceries", "Transport", "Utilities", "Dining & Fun", "Health", "Shopping", "Other"],
    income: ["Salary", "Freelance", "Investment", "Gift", "Other income"]
  };

  // Six tabs, one question each: what is happening now, what happened, what I
  // intend, what I hold and owe, what I keep missing, and how it is set up.
  //
  // Drawn inline rather than set as glyphs — still no icon font and no
  // library, but a sunrise and a ruled page say more than ◈ and ≡ did.
  function ico(d) {
    return '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" ' +
      'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + "</svg>";
  }
  var TABS = [
    { id: "today", label: "Today",
      ico: ico('<path d="M3 14.6h14"/><path d="M6.2 14.6a3.8 3.8 0 0 1 7.6 0"/><path d="M10 4.4v1.7"/><path d="M4.9 6.5 6 7.6"/><path d="M15.1 6.5 14 7.6"/>') },
    { id: "ledger", label: "Ledger",
      ico: ico('<rect x="4.8" y="3.2" width="10.4" height="13.6" rx="2.4"/><path d="M7.7 3.2v13.6"/><path d="M9.9 7.1h3.3"/><path d="M9.9 10h3.3"/><path d="M9.9 12.9h2.1"/>') },
    { id: "plan", label: "Plan",
      ico: ico('<path d="M3.6 7.2 10 3.6l6.4 3.6v6.6a2 2 0 0 1-2 2H5.6a2 2 0 0 1-2-2z"/><path d="M3.6 7.2 10 10.8l6.4-3.6"/>') },
    { id: "worth", label: "Worth",
      ico: ico('<ellipse cx="10" cy="6" rx="5.6" ry="2.4"/><path d="M4.4 6v4c0 1.33 2.51 2.4 5.6 2.4s5.6-1.07 5.6-2.4V6"/><path d="M4.4 10v3.2c0 1.33 2.51 2.4 5.6 2.4s5.6-1.07 5.6-2.4V10"/>') },
    { id: "insights", label: "Insights",
      ico: ico('<circle cx="8.9" cy="8.9" r="4.9"/><path d="M12.6 12.6 16.4 16.4"/>') },
    { id: "settings", label: "Settings",
      ico: ico('<path d="M3.4 7h13"/><path d="M3.4 13h13"/><circle cx="7.6" cy="7" r="2"/><circle cx="12.4" cy="13" r="2"/>') }
  ];

  /* ---------------- small utilities ---------------- */

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function iso(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function today() { return iso(new Date()); }
  function parseISO(s) { return new Date(s + "T00:00:00"); }
  function dayLabel(dateStr) {
    var t = today();
    if (dateStr === t) return "Today";
    var y = new Date(); y.setDate(y.getDate() - 1);
    if (dateStr === iso(y)) return "Yesterday";
    var d = parseISO(dateStr);
    var opts = { weekday: "short", day: "numeric", month: "short" };
    if (dateStr.slice(0, 4) !== t.slice(0, 4)) opts.year = "numeric";
    return d.toLocaleDateString(undefined, opts);
  }
  function monthOf(dateStr) { return dateStr.slice(0, 7); }
  function thisMonth() { return today().slice(0, 7); }

  function monthShift(mk, n) {
    var y = parseInt(mk.slice(0, 4), 10);
    var m = parseInt(mk.slice(5, 7), 10) - 1 + n;
    var d = new Date(y, m, 1);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  }
  function monthName(mk, long) {
    var d = new Date(parseInt(mk.slice(0, 4), 10), parseInt(mk.slice(5, 7), 10) - 1, 1);
    return d.toLocaleDateString(undefined, long ? { month: "long", year: "numeric" } : { month: "short" });
  }
  function daysInMonth(mk) {
    return new Date(parseInt(mk.slice(0, 4), 10), parseInt(mk.slice(5, 7), 10), 0).getDate();
  }
  function lastDayOf(mk) { return mk + "-" + String(daysInMonth(mk)).padStart(2, "0"); }

  function daysUntil(dateStr) {
    return Math.round((parseISO(dateStr) - parseISO(today())) / 86400000);
  }
  // null means "there is no next one" — a lump sum happens once.
  function advance(dateStr, freq) {
    if (freq === "once") return null;
    var d = parseISO(dateStr);
    if (freq === "weekly") d.setDate(d.getDate() + 7);
    else if (freq === "yearly") d.setFullYear(d.getFullYear() + 1);
    else d.setMonth(d.getMonth() + 1);
    return iso(d);
  }
  // A one-off has no monthly rate. Averaging it into one is exactly the lie
  // that makes contract income look like a salary.
  function monthlyEquivalent(amount, freq) {
    if (freq === "once") return 0;
    if (freq === "weekly") return amount * 52 / 12;
    if (freq === "yearly") return amount / 12;
    return amount;
  }
  // A contract has a terminal date; a projection that runs past it is fiction.
  function recurEnded(r, onDate) {
    var d = onDate || today();
    if (!r.nextDate) return true;              // a spent one-off
    if (r.until && r.until < d) return true;
    return false;
  }
  function activeRecurring(onDate) {
    return state.recurring.filter(function (r) { return !recurEnded(r, onDate); });
  }
  function num(v) { var n = parseFloat(v); return isFinite(n) ? n : 0; }
  function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }

  /* ---------------- state ---------------- */

  function blank() {
    return {
      version: 2,
      settings: { theme: "system", currency: "$", lock: null, base: "USD", rates: {} },
      photoIndex: {},
      categories: { expense: DEFAULT_CATS.expense.slice(), income: DEFAULT_CATS.income.slice() },
      accounts: [],
      transactions: [],
      budgets: {},
      goals: [],
      debts: [],
      recurring: [],
      quick: [],
      // What you meant to do, kept next to what you actually did. null until a
      // plan is imported; see parsePlanText for its shape.
      plan: null,
      // money held on someone else's behalf; see the grants block above
      grants: [],
      // how many days were worked in a month, per income source with an
      // allowance — an input, not a balance
      allowanceDays: {},
      extraDebtPayment: 0
    };
  }

  // v1 stored a running `balance` per account. v2 derives balances from an
  // opening figure plus every transaction, so edits and deletes can never
  // leave a balance out of sync. Recover the opening figure by unwinding.
  function migrateV1(old) {
    var s = blank();
    s.settings.currency = (old.settings && old.settings.currency) || "$";
    s.transactions = (old.transactions || []).map(function (t) {
      return {
        id: t.id || uid(), date: t.date || today(), desc: t.desc || "",
        type: t.type === "income" ? "income" : "expense",
        category: t.category || "Other", accountId: t.accountId, amount: num(t.amount)
      };
    });
    s.accounts = (old.accounts || []).map(function (a) {
      var effects = 0;
      s.transactions.forEach(function (t) {
        if (t.accountId !== a.id) return;
        effects += t.type === "income" ? num(t.amount) : -num(t.amount);
      });
      return { id: a.id || uid(), name: a.name || "Account", type: a.type || "Checking", opening: num(a.balance) - effects };
    });
    s.budgets = old.budgets && typeof old.budgets === "object" ? old.budgets : {};
    s.goals = (old.goals || []).map(function (g) {
      return { id: g.id || uid(), name: g.name, target: num(g.target), saved: num(g.saved), due: g.due || null };
    });
    s.debts = (old.debts || []).map(function (d) {
      return { id: d.id || uid(), name: d.name, balance: num(d.balance), rate: num(d.rate), minPayment: num(d.minPayment) };
    });
    s.recurring = (old.recurring || []).map(function (r) {
      return {
        id: r.id || uid(), name: r.name, type: r.type === "income" ? "income" : "expense",
        category: r.category || "Other", accountId: r.accountId, amount: num(r.amount),
        frequency: FREQ.indexOf(r.frequency) >= 0 ? r.frequency : "monthly",
        nextDate: r.nextDate || today()
      };
    });
    // keep any categories the migrated records actually use
    var used = {};
    s.transactions.concat(s.recurring).forEach(function (t) {
      if (!t.category) return;
      var bucket = t.type === "income" ? "income" : "expense";
      if (s.categories[bucket].indexOf(t.category) === -1) used[bucket + "|" + t.category] = true;
    });
    Object.keys(used).forEach(function (k) {
      var parts = k.split("|");
      s.categories[parts[0]].push(parts[1]);
    });
    return s;
  }

  /* Turning a parsed object into state. This exists as ONE function because
     it used to exist as two — load() and the restore each hand-copied the same
     key list, and only load() was updated when grants and allowances shipped.
     Restoring a backup therefore dropped every grant and every recorded
     allowance day, silently. Anything added to the state shape goes here once. */
  var STATE_LISTS = ["accounts", "transactions", "goals", "debts", "recurring", "quick", "grants"];
  var STATE_MAPS = ["budgets", "allowanceDays", "photoIndex"];

  function adoptState(p) {
    var s = blank();
    if (!p || typeof p !== "object") return s;
    if (p.settings) {
      s.settings.currency = p.settings.currency || "$";
      s.settings.theme = p.settings.theme || "system";
      s.settings.lock = p.settings.lock || null;
      // absent in every backup written before multi-currency: default to a
      // single-currency book, which is exactly what those files describe
      s.settings.base = p.settings.base || "USD";
      s.settings.rates = (p.settings.rates && typeof p.settings.rates === "object") ? p.settings.rates : {};
      // absent from every backup written before the afford rebuild, which is
      // fine: floorMonths() falls back to the default on its own
      s.settings.floorMonths = num(p.settings.floorMonths) || null;
      s.settings.defaultAccountRef = p.settings.defaultAccountRef || null;
    }
    if (p.categories) {
      if (Array.isArray(p.categories.expense) && p.categories.expense.length) s.categories.expense = p.categories.expense;
      if (Array.isArray(p.categories.income) && p.categories.income.length) s.categories.income = p.categories.income;
    }
    STATE_LISTS.forEach(function (k) { if (Array.isArray(p[k])) s[k] = p[k]; });
    STATE_MAPS.forEach(function (k) { if (p[k] && typeof p[k] === "object") s[k] = p[k]; });
    // absent from every backup written before plans existed, which is fine:
    // no plan is a valid state, so there is nothing to migrate
    if (p.plan && typeof p.plan === "object") s.plan = p.plan;
    s.extraDebtPayment = num(p.extraDebtPayment);
    return s;
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) return adoptState(JSON.parse(raw));
      var legacy = localStorage.getItem(LEGACY_KEY);
      if (legacy) {
        var migrated = migrateV1(JSON.parse(legacy));
        localStorage.setItem(KEY, JSON.stringify(migrated));
        return migrated;
      }
    } catch (e) { /* fall through to a blank ledger */ }
    return blank();
  }

  var state = load();
  var view = "today";
  var viewMonth = thisMonth();
  var filters = { text: "", type: "all", category: "all", account: "all", from: "", to: "" };
  var debtStrategy = "avalanche";
  // which group of the Plan tab is showing; an imported plan opens on its own
  // scoring, otherwise the budgets you are most likely to be setting up
  var planTab = null;
  function currentPlanTab() {
    if (planTab) return planTab;
    return state.plan ? "plan" : "budgets";
  }
  var LEDGER_PAGE = 60;
  var ledgerLimit = LEDGER_PAGE;

  /* A save that fails used to show one toast and let you carry on. The toast
     faded, the app looked perfectly healthy, and everything logged after it
     went nowhere — in a private tab, on a full quota, or with site data
     blocked, you found out when you closed it. For an app whose whole premise
     is that your data lives in this browser, that is the worst way to fail.

     So the failure latches: a banner that stays until a save actually works,
     and an export that needs no storage to produce. */
  var lastSaveAt = null, saveBroken = false;

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
      lastSaveAt = new Date();
      if (saveBroken) { saveBroken = false; paintSaveFail(); toast("Saved — storage is working again."); }
      return true;
    } catch (e) {
      if (!saveBroken) { saveBroken = true; paintSaveFail(); }
      return false;
    }
  }

  /* Asked at the moment it is needed rather than remembered from boot: a
     `var hadStoredState = false` declared below `var state = load()` is reset
     by its own initialiser after load() has already set it. */
  function storedStateExists() {
    try { return localStorage.getItem(KEY) != null; } catch (e) { return false; }
  }

  function paintSaveFail() {
    var el = document.getElementById("savefail");
    if (!el) return;
    if (!saveBroken) { el.hidden = true; el.innerHTML = ""; return; }
    var when = lastSaveAt
      ? "Nothing has saved since " +
        lastSaveAt.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }) + "."
      : storedStateExists()
        ? "Nothing has saved since you opened Coffer."
        : "Nothing has been saved at all.";
    el.innerHTML = "<b>" + esc(when) + "</b> This browser is refusing to store data \u2014 it may be " +
      "full, or set to block site data, or this may be a private tab. Anything you log now will be " +
      "gone when you close it." +
      '<div class="btn-row">' +
      '<button class="btn sm primary" data-act="export-json">Export a backup now</button>' +
      '<button class="btn sm" data-act="save-retry">Try again</button></div>';
    el.hidden = false;
  }

  /* ---------------- receipt photos ----------------
     Photos live in IndexedDB, not in the state object. A single phone photo
     is larger than this app's entire ledger, and localStorage caps out around
     5 MB — putting them in `state` would break saving for everything else.
     They are therefore also NOT in a normal backup unless you ask for it; see
     the backup card, which says so plainly rather than losing them quietly.
     ------------------------------------------------- */
  var PHOTO_DB = "coffer-photos", PHOTO_STORE = "receipts", photoDb = null;

  function withPhotos(fn, onFail) {
    if (photoDb) { fn(photoDb); return; }
    if (!window.indexedDB) { if (onFail) onFail(); return; }
    var req;
    try { req = indexedDB.open(PHOTO_DB, 1); }
    catch (e) { if (onFail) onFail(); return; }
    req.onupgradeneeded = function () {
      var db = req.result;
      if (!db.objectStoreNames.contains(PHOTO_STORE)) db.createObjectStore(PHOTO_STORE);
    };
    req.onsuccess = function () { photoDb = req.result; fn(photoDb); };
    req.onerror = function () { if (onFail) onFail(); };
  }
  function photoPut(id, blob, done) {
    withPhotos(function (db) {
      var tx = db.transaction(PHOTO_STORE, "readwrite");
      tx.objectStore(PHOTO_STORE).put(blob, id);
      tx.oncomplete = function () { done && done(true); };
      tx.onerror = function () { done && done(false); };
    }, function () { done && done(false); });
  }
  function photoGet(id, done) {
    withPhotos(function (db) {
      var r = db.transaction(PHOTO_STORE, "readonly").objectStore(PHOTO_STORE).get(id);
      r.onsuccess = function () { done(r.result || null); };
      r.onerror = function () { done(null); };
    }, function () { done(null); });
  }
  function photoDel(id, done) {
    withPhotos(function (db) {
      var tx = db.transaction(PHOTO_STORE, "readwrite");
      tx.objectStore(PHOTO_STORE).delete(id);
      tx.oncomplete = function () { done && done(); };
    }, function () { done && done(); });
  }
  function photoKeys(done) {
    withPhotos(function (db) {
      var r = db.transaction(PHOTO_STORE, "readonly").objectStore(PHOTO_STORE).getAllKeys();
      r.onsuccess = function () { done(r.result || []); };
      r.onerror = function () { done([]); };
    }, function () { done([]); });
  }

  // Downscale before storing. A modern phone photo is 3-6 MB; a receipt is
  // perfectly readable at 1400px and about 200 KB.
  function shrinkImage(file, done) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var MAX = 1400;
      var sc = Math.min(1, MAX / Math.max(img.width, img.height));
      var w = Math.round(img.width * sc), h = Math.round(img.height * sc);
      var cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      cv.toBlob(function (blob) { done(blob || file); }, "image/jpeg", 0.72);
    };
    img.onerror = function () { URL.revokeObjectURL(url); done(null); };
    img.src = url;
  }

  // which transactions have a receipt — kept in state so the ledger can show a
  // marker without hitting the database on every render
  function hasPhoto(id) { return !!(state.photoIndex && state.photoIndex[id]); }
  function markPhoto(id, on) {
    if (!state.photoIndex) state.photoIndex = {};
    if (on) state.photoIndex[id] = 1; else delete state.photoIndex[id];
  }

  function pickReceipt(id, t) {
    var inp = document.createElement("input");
    inp.type = "file";
    inp.accept = "image/*";
    inp.setAttribute("capture", "environment");   // opens the camera on a phone
    inp.style.display = "none";
    document.body.appendChild(inp);
    inp.addEventListener("change", function () {
      var f = inp.files && inp.files[0];
      document.body.removeChild(inp);
      if (!f) return;
      toast("Saving receipt…");
      shrinkImage(f, function (blob) {
        if (!blob) { toast("That image could not be read."); return; }
        photoPut(id, blob, function (ok) {
          if (!ok) { toast("Could not store the receipt — this browser may be blocking storage."); return; }
          markPhoto(id, true); save(); render();
          toast("Receipt attached to " + esc0(t.desc || t.category) + ".");
        });
      });
    });
    inp.click();
  }

  function viewReceipt(t) {
    photoGet(t.id, function (blob) {
      if (!blob) {
        markPhoto(t.id, false); save(); render();
        toast("That receipt is no longer stored.");
        return;
      }
      // a data URL rather than an object URL: openModal has no close hook to
      // revoke one, and a leaked handle would hold the image forever
      var fr = new FileReader();
      fr.onload = function () {
        openModal({
          title: t.desc || t.category,
          message: '<img src="' + fr.result + '" alt="Receipt for ' + esc(t.desc || t.category) +
            '" style="width:100%;height:auto;display:block;margin-top:0.5rem;border:1px solid var(--rule-mid)" />' +
            '<span class="hint" style="display:block;margin-top:0.6rem">' + esc(t.date) + " · " + fmt(txBase(t)) +
            (isForeign(t.currency) ? " · " + esc(fmtIn(t.amount, t.currency)) : "") + "</span>",
          cancelLabel: "Done",
          confirmLabel: "Remove receipt",
          danger: true,
          onConfirm: function () {
            photoDel(t.id, function () {
              markPhoto(t.id, false); save(); render(); toast("Receipt removed.");
            });
          }
        });
      };
      fr.onerror = function () { toast("That receipt could not be opened."); };
      fr.readAsDataURL(blob);
    });
  }

  /* ---------------- money ---------------- */

  /* ---------------- currency ----------------
     Amounts are stored in the currency they happened in, together with the
     rate that was true at that moment. Converting at display time with
     today's rate would silently rewrite history — with the lira that is not
     a rounding error, it is the difference between 30,000 LBP meaning $20
     and meaning $0.33. So the rate travels with the transaction.

     A rate is "units of this currency per 1 unit of base". Base is 1.
     ------------------------------------------------- */
  var CURRENCIES = ["USD", "EUR", "LBP", "GBP", "JOD", "AED", "SAR", "TRY", "EGP"];

  // Rough starting points, so a rate is never typed into a blank box. They are
  // deliberately only a first guess: what an exchange or an employer actually
  // gives you is rarely the published rate, and the LBP one in particular
  // moves. Every one of these is offered pre-filled and meant to be corrected.
  var DEFAULT_RATES = { EUR: 0.92, GBP: 0.79, LBP: 89500, JOD: 0.709, AED: 3.6725, SAR: 3.75, TRY: 41, EGP: 48 };
  // The table is quoted per 1 USD, so it means nothing if the book totals in
  // something else. Better to offer no suggestion than a wrong one.
  function suggestedRate(code) {
    if (baseCode() !== "USD") return 0;
    var r = num(DEFAULT_RATES[code]);
    return r > 0 ? r : 0;
  }
  var SYMBOLS = { USD: "$", EUR: "\u20ac", LBP: "LL", GBP: "\u00a3", JOD: "JD",
                  AED: "AED", SAR: "SAR", TRY: "\u20ba", EGP: "E\u00a3" };

  var THEMES = ["system", "light", "dark"];
  var THEME_LABEL = { system: "Match my phone", light: "Light", dark: "Dark" };
  var THEME_BG = { light: "#f7f4ee", dark: "#101312" };

  function currentTheme() {
    var t = state.settings && state.settings.theme;
    return THEMES.indexOf(t) >= 0 ? t : "system";
  }
  function applyTheme() {
    var t = currentTheme();
    var root = document.documentElement;
    if (t === "system") root.removeAttribute("data-theme");
    else root.setAttribute("data-theme", t);

    // The two media-query theme-colors in the head cannot know about a manual
    // override, so a forced theme gets a single plain one instead. Without
    // this the phone's status bar keeps the system colour and clashes.
    var olds = document.querySelectorAll('meta[name="theme-color"]');
    for (var i = 0; i < olds.length; i++) olds[i].parentNode.removeChild(olds[i]);
    function addMeta(color, media) {
      var m = document.createElement("meta");
      m.setAttribute("name", "theme-color");
      m.setAttribute("content", color);
      if (media) m.setAttribute("media", media);
      document.head.appendChild(m);
    }
    if (t === "system") {
      addMeta(THEME_BG.light, "(prefers-color-scheme: light)");
      addMeta(THEME_BG.dark, "(prefers-color-scheme: dark)");
    } else {
      addMeta(THEME_BG[t]);
    }
  }

  function baseCode() { return (state.settings && state.settings.base) || "USD"; }

  // A rate is stored either as a bare number (every backup written before this)
  // or as { rate, setOn }. Both are read here so no file needs migrating, and
  // a rate with no date is simply one whose age is unknown.
  function rateEntry(code) {
    var r = (state.settings.rates || {})[code];
    if (r == null) return null;
    if (typeof r === "object") return { rate: num(r.rate), setOn: r.setOn || null };
    return { rate: num(r), setOn: null };
  }
  function rateNum(code) { var e = rateEntry(code); return e ? e.rate : 0; }
  // In a currency that moves weekly, a rate you set in March is not a rate.
  var RATE_STALE_DAYS = 30;
  function rateAge(code) {
    var e = rateEntry(code);
    if (!e || !e.setOn) return null;
    return Math.floor((parseISO(today()) - parseISO(e.setOn)) / 86400000);
  }
  function rateIsStale(code) {
    var age = rateAge(code);
    return age != null && age > RATE_STALE_DAYS;
  }

  function rateFor(code) {
    if (!code || code === baseCode()) return 1;
    var r = rateNum(code);
    return r > 0 ? r : 1;   // an unset rate must not silently zero the figure
  }
  function symbolFor(code) {
    if (!code || code === baseCode()) return state.settings.currency;
    return SYMBOLS[code] || (code + "\u00a0");
  }
  // what this record is worth in base currency, using the rate it carries
  function toBase(amount, code, rate) {
    var a = num(amount);
    if (!code || code === baseCode()) return a;
    var r = num(rate) > 0 ? num(rate) : rateFor(code);
    return r > 0 ? a / r : a;
  }
  function txBase(t) { return toBase(t.amount, t.currency, t.rate); }

  /* What LANDED, as opposed to what left. A transfer used to carry one amount
     and use it for both sides, so changing 30,000,000 LBP into dollars
     credited the same base value it debited, at your STORED rate — the rate
     you actually got at the changer, and the spread you paid, existed
     nowhere. A transfer between accounts holding the same currency is
     unchanged: toAmount is absent and this is txBase. */
  function txBaseIn(t) {
    if (t.toAmount == null) return txBase(t);
    return toBase(t.toAmount, t.toCurrency || t.currency, t.toRate);
  }
  // what the exchange cost: out, less what arrived
  function txSpread(t) {
    return t.toAmount == null ? 0 : txBase(t) - txBaseIn(t);
  }
  /* ---- one payment, several costs -----------------------------------------
     A shop trip that was half groceries and half household was two entries or
     one wrong category. `t.splits` holds the parts in the transaction's OWN
     currency, so the single frozen rate covers the whole entry and no part can
     be re-valued on its own. Everything that files money under a category
     walks txParts(); a transaction with no splits — which is every one written
     before this — comes back as a single part with its own category, so no
     caller needs to know whether it was split. */
  function txParts(t) {
    if (!t.splits || !t.splits.length) return [{ category: t.category, base: txBase(t) }];
    return t.splits.map(function (sp) {
      return { category: sp.category, base: toBase(num(sp.amount), t.currency, t.rate) };
    });
  }
  function splitsTotal(list) {
    return (list || []).reduce(function (n, sp) { return n + num(sp.amount); }, 0);
  }
  function isSplit(t) { return !!(t.splits && t.splits.length > 1); }
  function canSplit(t) { return t && (t.type === "expense" || t.type === "income"); }

  function acctOpeningBase(a) { return toBase(a.opening, a.currency, a.rate); }
  /* A pocket's opening figure is in the pocket's own currency, at the rate it
     was opened at, exactly like the account it sits in. pocketBalance() used
     the raw number while balanceOf() converted the account's — so in a lira
     account a pocket opened with a lira figure was counted as dollars, and
     unallocatedOf(), which subtracts one from the other, became meaningless.
     A pocket saved before this carries no currency, so toBase() hands the raw
     figure straight back and nothing already stored moves. */
  function pocketOpeningBase(p) { return toBase(p.opening, p.currency, p.rate); }
  // an amount shown in its own currency, for the ledger row
  function fmtIn(n, code) {
    n = num(n);
    var digits = (code === "LBP" || code === "TRY") ? 0 : 2;
    var body = Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits });
    return (n < 0 ? "-" : "") + symbolFor(code) + body;
  }
  function isForeign(code) { return !!code && code !== baseCode(); }

  function fmt(n, opts) {
    n = num(n);
    var o = opts || {};
    var abs = Math.abs(n);
    var digits = o.round ? 0 : 2;
    var body = abs.toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits });
    var sign = n < 0 ? "-" : (o.signed && n > 0 ? "+" : "");
    return sign + state.settings.currency + body;
  }
  function fmtCompact(n) {
    var abs = Math.abs(num(n));
    if (abs >= 1000000) return (n < 0 ? "-" : "") + state.settings.currency + (abs / 1000000).toFixed(1) + "M";
    if (abs >= 1000) return (n < 0 ? "-" : "") + state.settings.currency + (abs / 1000).toFixed(abs >= 10000 ? 0 : 1) + "k";
    return fmt(n, { round: true });
  }

  /* ---------------- derived figures ----------------
     Everything here is recomputed from the transaction list rather than
     stored, so a balance can never drift. That means the same figures get
     asked for many times in one render, so results are memoised and the
     cache is dropped at the start of every render.
     ------------------------------------------------- */

  var memo = {};
  function resetMemo() {
    memo = { bal: {}, assets: {}, mtx: {}, msum: {}, cats: {}, accName: null, learned: null };
  }
  resetMemo();

  /* ---------------- pockets ----------------
     A pocket is a named subdivision INSIDE one account — "Cyprus" and
     "Savings" living in the same bank balance. Pockets are a view of that
     one balance, never a separate pot: the account total is always its
     opening plus its transactions, and each pocket holds whatever share of
     it has been assigned. Whatever is left over is Unallocated. That way the
     pockets can never quietly stop adding up to the account.

     An account choice is passed around as a reference string: "a1" for the
     account itself, "a1|p2" for a pocket inside it.
     ------------------------------------------------- */
  function pocketsOf(acc) { return (acc && acc.pockets) || []; }

  /* ---------------- investments ----------------
     An investment is an account with a kind, not a second kind of record.
     That buys transfers, every account picker, closing, and net worth for
     nothing — and, more to the point, means putting money in is a TRANSFER.
     Logged as an expense it would land in the burn rate and report a saver as
     someone bleeding money.

       paid in     transfers into it. Derived, like every other balance.
       worth now   a mark you type. Value is not derivable from a ledger; this
                   is the one figure in the app, besides a debt balance, that
                   is stated rather than computed.
       returns     income transactions tagged investId, landing in a CASH
                   account — a dividend raises your worth and the holding is
                   still there.
       capital out a transfer back out. Recording a sale as income would count
                   the same money twice.

     Accounts written before this have no kind, which reads as cash. */
  function accountKind(a) { return a && a.kind === "investment" ? "investment" : "cash"; }
  function isInvestment(a) { return accountKind(a) === "investment"; }
  function investments() { return state.accounts.filter(isInvestment); }

  // Marks are kept dated and in order, so a valuation in March stays a March
  // valuation. Using today's mark for a past date would redraw your whole
  // history as though the holding had always been worth what it is worth now.
  function marksOf(a) {
    return ((a && a.marks) || []).slice().sort(function (x, y) {
      return String(x.on).localeCompare(String(y.on));
    });
  }
  function markAt(a, onOrBefore) {
    var ms = marksOf(a), found = null;
    for (var i = 0; i < ms.length; i++) {
      if (onOrBefore && ms[i].on > onOrBefore) break;
      found = ms[i];
    }
    return found;
  }
  // What the holding is worth on a date: the latest mark up to then, and
  // before the first mark, what was put in — which is the only figure anyone
  // can honestly claim about an unvalued holding.
  function investValue(a, onOrBefore) {
    var m = markAt(a, onOrBefore);
    return m ? toBase(num(m.value), m.currency, m.rate) : balanceOf(a, onOrBefore);
  }
  function latestMark(a) { var ms = marksOf(a); return ms.length ? ms[ms.length - 1] : null; }
  function markAge(a) {
    var m = latestMark(a);
    return m && m.on ? Math.max(0, -daysUntil(m.on)) : null;
  }
  // Money this holding has actually handed back: income tagged to it.
  function investReturns(a, onOrBefore) {
    var t = 0;
    state.transactions.forEach(function (x) {
      if (x.investId !== a.id || x.type !== "income") return;
      if (onOrBefore && x.date > onOrBefore) return;
      t += txBase(x);
    });
    return t;
  }
  // What it has cost you: everything transferred in, less anything taken back
  // out. The account's own derived balance is exactly that.
  function investCost(a, onOrBefore) { return balanceOf(a, onOrBefore); }

  /* Not every balance is money you can actually reach for. A savings pocket
     and a not-yet-refunded trip pocket are the same number and nothing like
     the same thing, and treating them alike is what makes a net-worth figure
     — and any runway built on it — quietly optimistic.

       free       yours, available now
       earmarked  set aside for something, still yours
       committed  already owed to someone else; only nominally yours

     Pockets written before this have no status, which reads as free. */
  var POCKET_STATUS = ["free", "earmarked", "committed"];
  var POCKET_STATUS_LABEL = {
    free: "available",
    earmarked: "set aside",
    committed: "already spoken for"
  };
  function pocketStatus(p) {
    return POCKET_STATUS.indexOf(p && p.status) >= 0 ? p.status : "free";
  }

  // What you could actually spend: every balance, less anything sitting in a
  // pocket marked committed, less every investment. You cannot pay rent out of
  // a pension this month, and a runway that says you can is worse than no
  // runway. This also means moving money into a holding correctly shortens it.
  function freeAssets(onOrBefore) {
    var total = totalAssets(onOrBefore);
    state.accounts.forEach(function (a) {
      if (isInvestment(a)) { total -= investValue(a, onOrBefore); return; }
      pocketsOf(a).forEach(function (pk) {
        if (pocketStatus(pk) === "committed") total -= pocketBalance(a, pk, onOrBefore);
      });
    });
    return total;
  }
  function investedTotal(onOrBefore) {
    return investments().reduce(function (t, a) { return t + investValue(a, onOrBefore); }, 0);
  }
  function committedTotal() {
    var t = 0;
    state.accounts.forEach(function (a) {
      pocketsOf(a).forEach(function (pk) {
        if (pocketStatus(pk) === "committed") t += pocketBalance(a, pk);
      });
    });
    return t;
  }
  function pocketById(acc, pid) {
    var ps = pocketsOf(acc);
    for (var i = 0; i < ps.length; i++) if (ps[i].id === pid) return ps[i];
    return null;
  }
  function acctRef(accountId, pocketId) { return pocketId ? accountId + "|" + pocketId : accountId; }
  function parseRef(ref) {
    var bits = String(ref || "").split("|");
    return { accountId: bits[0] || null, pocketId: bits[1] || null };
  }
  /* What one pocket holds: its own opening plus everything filed to it. The
     destination of a transfer is `toPocketId`, and this used to filter on
     `t.pocketId` before looking at anything — so money moved INTO a pocket was
     never credited to it, and a move between two pockets of one account
     debited the source and then immediately credited it back. Savings never
     went down and Cyprus never went up. Each side is now matched on its own
     account and its own pocket. */
  function pocketBalance(acc, p, onOrBefore) {
    var b = pocketOpeningBase(p);
    for (var i = 0; i < state.transactions.length; i++) {
      var t = state.transactions[i];
      if (onOrBefore && t.date > onOrBefore) continue;
      if (t.type === "transfer") {
        if (t.accountId === acc.id && t.pocketId === p.id) b -= txBase(t);
        if (t.toAccountId === acc.id && t.toPocketId === p.id) b += txBaseIn(t);
      } else if (t.accountId === acc.id && t.pocketId === p.id) {
        b += t.type === "income" ? txBase(t) : -txBase(t);
      }
    }
    return b;
  }
  function unallocatedOf(acc) {
    return balanceOf(acc) - pocketsOf(acc).reduce(function (n, p) { return n + pocketBalance(acc, p); }, 0);
  }

  // A closed account is one you have stopped using: it keeps every
  // transaction it ever carried, so the history stays whole, but it is out of
  // every picker and out of the way. Nothing else in the app special-cases it,
  // which is deliberate — a closed account with money still in it is still
  // money, and still counts towards net worth.
  function openAccounts() {
    return state.accounts.filter(function (a) { return !a.closed; });
  }

  /* A goal can either be a number you top up by hand, or it can point at the
     pocket that actually holds the money. The second is the honest one: a
     "diving fund" goal and a "Diving" pocket were two records of one thing,
     and they drifted apart the moment you spent from the pocket without
     remembering to adjust the goal. When `holdsIn` is set, `saved` is read
     from the pocket and the manual top-up buttons go away. */
  function goalSaved(g) {
    if (!g.holdsIn) return num(g.saved);
    var r = parseRef(g.holdsIn);
    var a = accountById(r.accountId);
    if (!a) return num(g.saved);
