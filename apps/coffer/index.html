    monthTx(mk).forEach(function (t) {
      if (t.type === "transfer") return;
      var bucket = t.type === "income" ? "income" : "expense";
      txParts(t).forEach(function (pt) {
        got[bucket][pt.category] = (got[bucket][pt.category] || 0) + pt.base;
      });
    });
    return got;
  }

  function planSection(plan, sec) {
    return (plan.lines || []).filter(function (l) { return l.section === sec; });
  }

  function planBody() {
    var plan = state.plan;

    if (!plan) {
      return '<div class="card" style="margin-top:1rem"><div class="card-body"><p class="empty">' +
        "No plan yet. <strong>Write your year down once</strong> — the budgets you want to hold to, the income you " +
        "expect, the commitments you have to cover and what you are saving toward — and Coffer will set it all up " +
        "and then show you, month by month, where reality parted from it." +
        "</p><button class=\"btn primary\" data-act=\"plan-import\">Import a plan</button></div></div>" +
        '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>How to write one</h3></div>' +
        '<div class="card-body">' + PLAN_FORMAT_HELP +
        '<pre style="margin-top:0.6rem;padding:0.7rem;border:1px solid var(--rule);border-radius:8px;overflow-x:auto;' +
        'font-family:ui-monospace,Menlo,Consolas,monospace;font-size:0.74rem;line-height:1.6;color:var(--dim)">' +
        esc(planTemplate()) + "</pre></div></div>";
    }

    var mk = viewMonth;
    var progress = monthProgress(mk);
    var actual = planActuals(mk);
    var budgets = planSection(plan, "budgets");
    var income = planSection(plan, "income");
    var commitments = planSection(plan, "commitments");
    var goals = planSection(plan, "goals");

    // #2 — income you might get should not be added up as though you will.
    // A line at 50% contributes half to the headline, and says so.
    function weighted(l) {
      var m = monthlyEquivalent(l.baseAmount, l.frequency);
      return l.confidence == null ? m : m * (l.confidence / 100);
    }
    var plannedIn = income.reduce(function (s, l) { return s + weighted(l); }, 0);
    var plannedInFull = income.reduce(function (s, l) { return s + monthlyEquivalent(l.baseAmount, l.frequency); }, 0);
    var hasConfidence = income.some(function (l) { return l.confidence != null; });

    // Budgets and commitments can name the same category — a £700 Housing cap
    // and a £700 rent are one claim on the month, not two. Taking the larger
    // per category keeps the headline from double-counting them.
    var outBy = {};
    budgets.forEach(function (l) {
      // a sub-budget is part of its parent's cap, not an extra claim
      if (l.parent) return;
      outBy[l.category] = Math.max(outBy[l.category] || 0, l.baseAmount);
    });
    commitments.forEach(function (l) {
      var m = monthlyEquivalent(l.baseAmount, l.frequency);
      outBy[l.category] = Math.max(outBy[l.category] || 0, m);
    });
    var plannedOut = Object.keys(outBy).reduce(function (s, c) { return s + outBy[c]; }, 0);

    var sum = monthSummary(mk);
    var plannedKeep = plannedIn - plannedOut;
    var reallyKept = sum.net;
    var gap = reallyKept - plannedKeep;

    var verdict;
    if (!plannedIn && !plannedOut) verdict = "This plan has nothing that applies to a month yet.";
    else if (progress === 0) verdict = "Nothing logged for this month yet.";
    else if (Math.abs(gap) < 0.005) verdict = "Exactly on plan.";
    else if (gap > 0) verdict = "<b>" + fmt(gap, { round: true }) + " better than planned</b> so far this month.";
    else verdict = "<b>" + fmt(-gap, { round: true }) + " behind plan</b> so far this month.";

    var html = '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>' + esc(plan.name) + "</h3>" +
      '<span class="sub">' + (plan.from ? "covers " + esc(plan.from) + (plan.to ? " to " + esc(plan.to) : "") + " · " : "") +
      "imported " + esc(plan.importedAt) + "</span>" + monthStepper() + "</div>" +
      '<div class="card-body"><p class="hint">Figures were converted at the rates set on the day the plan was ' +
      "imported and do not move.</p></div></div>";

    html += '<div class="tiles" style="margin-top:1rem" style="grid-template-columns:repeat(3,minmax(0,1fr))">' +
      '<div class="tile"><span class="label">Planned to keep</span><div class="tile-fig">' +
      fmt(plannedKeep, { round: true }) + "</div>" +
      '<div class="tile-foot">' + fmt(plannedIn, { round: true }) + " in, " + fmt(plannedOut, { round: true }) + " out" +
      (hasConfidence ? " · " + fmt(plannedInFull, { round: true }) + " if everything lands" : "") + "</div></div>" +
      '<div class="tile"><span class="label">Actually kept</span><div class="tile-fig' + (reallyKept < 0 ? " loss" : "") + '">' +
      fmt(reallyKept, { round: true }) + "</div>" +
      '<div class="tile-foot">' + fmt(sum.income, { round: true }) + " in, " + fmt(sum.expense, { round: true }) + " out</div></div>" +
      '<div class="tile"><span class="label">Against plan</span><div class="tile-fig' + (gap < 0 ? " loss" : "") + '">' +
      fmt(gap, { round: true, signed: true }) + "</div>" +
      '<div class="tile-foot">' + Math.round(progress * 100) + "% through the month</div></div></div>";

    html += '<p class="hint" style="margin-top:0.6rem">' + verdict + "</p>";

    // #3 — a plan tied to a real decision point says so, loudly, once the date
    // is close, so regenerating it is not left to memory.
    if (plan.reviewBy) {
      var revDays = daysUntil(plan.reviewBy);
      if (revDays <= 45) {
        html += '<div class="card" style="margin-top:1rem;border-color:var(--warn)"><div class="card-body">' +
          '<p class="hint" style="color:var(--warn);margin:0">' +
          (revDays < 0
            ? "<b>This plan was due for review on " + esc(plan.reviewBy) + "</b>, " + Math.abs(revDays) +
              " days ago. Whatever it was waiting on has happened by now."
            : revDays === 0
              ? "<b>This plan is due for review today.</b>"
              : "<b>Review this plan by " + esc(plan.reviewBy) + "</b> — " + revDays + " days away.") +
          " Rewrite it against what you now know and re-import; it will update in place." +
          '</p><div class="btn-row" style="margin-top:0.6rem">' +
          '<button class="btn sm primary" data-act="plan-import">Re-import</button></div></div></div>';
      }
    }

    // #15 — once the period is over, the plan stops being a target and becomes
    // a record to calibrate the next one against.
    if (plan.to && plan.to < thisMonth()) {
      var closed = planCloseOut(plan);
      html += '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>How this plan actually went</h3>' +
        '<span class="sub">' + esc(plan.from) + " to " + esc(plan.to) + ", now closed</span></div>" +
        '<div class="card-body flush"><div class="rows">' +
        '<div class="row"><div class="row-main"><div class="row-title">Income</div>' +
        '<div class="row-sub">' + esc(closed.months) + " months of record</div></div>" +
        '<span class="row-fig">' + fmt(closed.actualIn) + " / " + fmt(closed.plannedIn) + "</span></div>" +
        '<div class="row"><div class="row-main"><div class="row-title">Spending</div>' +
        '<div class="row-sub">against everything planned out</div></div>' +
        '<span class="row-fig">' + fmt(closed.actualOut) + " / " + fmt(closed.plannedOut) + "</span></div>" +
        "</div>" +
        '<p class="hint" style="padding:0.75rem">' + closed.verdict + "</p></div></div>";
    }

    function line(name, plannedAmt, actualAmt, sub, invert, quiet) {
      var pct = plannedAmt > 0 ? actualAmt / plannedAmt : 0;
      // for money going out, past the line is bad; for money coming in it is good
      var bad = invert ? pct < 0.999 && progress > 0.5 : pct > 1.001;
      var color = bad ? "var(--loss)" : (invert ? "var(--gain)" : (pct / Math.max(progress, 0.01) > 1.15 ? "var(--warn)" : "var(--gain)"));
      var diff = actualAmt - plannedAmt;
      return '<div class="row" style="align-items:stretch;flex-direction:column;gap:0.45rem">' +
        '<div style="display:flex;align-items:center;gap:0.6rem">' +
        '<span class="row-title" style="flex:1">' + esc(name) + "</span>" +
        '<span class="row-fig">' + fmt(actualAmt, { round: true }) + " / " + fmt(plannedAmt, { round: true }) + "</span></div>" +
        meter(pct, color, invert ? null : progress) +
        '<div class="row-sub">' + esc(sub) +
        (!quiet && Math.abs(diff) >= 0.5
          ? " · " + (diff > 0 ? "+" : "−") + fmt(Math.abs(diff), { round: true }).replace("-", "") +
            (invert ? (diff > 0 ? " more than expected" : " short") : (diff > 0 ? " over" : " under"))
          : "") +
        "</div></div>";
    }

    function card(title, sub, rowsHtml, empty) {
      return '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>' + esc(title) + "</h3>" +
        '<span class="sub">' + esc(sub) + "</span></div><div class=\"card-body flush\">" +
        (rowsHtml ? '<div class="rows">' + rowsHtml + "</div>" : '<p class="empty">' + empty + "</p>") + "</div></div>";
    }

    if (budgets.length) {
      var tops = budgets.filter(function (l) { return !l.parent; });
      var subs = budgets.filter(function (l) { return l.parent; });
      html += card("Budgets", "spent against the planned cap", tops.map(function (l) {
        var mine = subs.filter(function (x) { return x.parent === l.category; });
        var out = line(l.category, l.baseAmount, actual.expense[l.category] || 0,
          isForeign(l.currency) ? "planned as " + fmtIn(l.amount, l.currency) : "monthly cap");
        // #4 — when a parent runs over, the breakdown says which line to cut
        if (mine.length) {
          var named = mine.reduce(function (t, x) { return t + x.baseAmount; }, 0);
          out += '<div class="row pocket" style="flex-direction:column;align-items:stretch;gap:0.3rem">' +
            mine.map(function (x) {
              return '<div style="display:flex;gap:0.6rem"><span class="row-sub" style="flex:1">' +
                esc(x.name) + "</span>" +
                '<span class="row-sub">' + fmt(x.baseAmount, { round: true }) + "</span></div>";
            }).join("") +
            (Math.abs(l.baseAmount - named) > 0.5
              ? '<div style="display:flex;gap:0.6rem"><span class="row-sub" style="flex:1;color:var(--faint)">' +
                (named > l.baseAmount ? "over the cap by" : "not itemised") + "</span>" +
                '<span class="row-sub" style="color:' + (named > l.baseAmount ? "var(--loss)" : "var(--faint)") + '">' +
                fmt(Math.abs(l.baseAmount - named), { round: true }) + "</span></div>"
              : "") +
            "</div>";
        }
        return out;
      }).join("") + subs.filter(function (x) {
        // a sub-budget whose parent is not itself budgeted still deserves showing
        return !tops.some(function (t) { return t.category === x.parent; });
      }).map(function (x) {
        return line(x.parent + " › " + x.name, x.baseAmount, actual.expense[x.parent] || 0,
          "under " + x.parent + ", which has no cap of its own");
      }).join(""), "");
    }
    if (income.length) {
      html += card("Income", "arrived against what was expected", income.map(function (l) {
        var expect = weighted(l);
        var full = monthlyEquivalent(l.baseAmount, l.frequency);
        return line(l.name, expect, actual.income[l.category] || 0,
          (FREQ_LABEL[l.frequency] || l.frequency) + " · " + l.category +
          (l.confidence != null ? " · " + l.confidence + "% likely, so counted as " +
            fmt(expect, { round: true }) + " of " + fmt(full, { round: true }) : "") +
          (isForeign(l.currency) ? " · planned as " + fmtIn(l.amount, l.currency) : ""), true);
      }).join(""), "");
    }
    if (commitments.length) {
      html += card("Commitments", "paid against what is due", commitments.map(function (l) {
        var expect = monthlyEquivalent(l.baseAmount, l.frequency);
        return line(l.name, expect, actual.expense[l.category] || 0,
          (FREQ_LABEL[l.frequency] || l.frequency) + " · " + l.category +
          (isForeign(l.currency) ? " · planned as " + fmtIn(l.amount, l.currency) : ""));
      }).join(""), "");
    }
    if (goals.length) {
      html += card("Goals", "saved against the target", goals.map(function (l) {
        var g = state.goals.filter(function (x) { return x.id === l.recordId || x.planKey === l.key; })[0];
        var saved = g ? goalSaved(g) : 0;
        var target = l.baseAmount;
        var sub;
        if (!l.date) sub = "no target date";
        else {
          var total = Math.max((parseISO(l.date) - parseISO(plan.importedAt)) / 86400000, 1);
          var gone = clamp((new Date() - parseISO(plan.importedAt)) / 86400000, 0, total);
          var due = target * (gone / total);
          sub = saved >= due
            ? "on pace — " + fmt(due, { round: true }) + " expected by now"
            : "behind by " + fmt(due - saved, { round: true }) + " against the pace for " + l.date;
        }
        return line(l.name, target, saved, sub, true, true);
      }).join(""), "");
    }

    html += '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>This plan</h3>' +
      '<span class="sub">' + (plan.lines || []).length + " lines</span></div><div class=\"card-body\">" +
      '<p class="hint">Re-importing an edited plan updates these same entries rather than making second copies, ' +
      "so it is safe to run again whenever the plan changes. Removing the plan leaves every budget, goal and " +
      "recurring item it created exactly where it is — only the scoring goes away.</p>" +
      '<div class="btn-row" style="margin-top:0.75rem">' +
      '<button class="btn primary" data-act="plan-import">Re-import or replace</button>' +
      '<button class="btn" data-act="plan-copy">Copy it back out</button>' +
      '<button class="btn danger" data-act="plan-remove">Remove the plan</button>' +
      "</div></div></div>";

    return html;
  }

  // Writing the plan back out as text it can read again. Round-tripping it is
  // the only honest way to let someone edit a plan they imported months ago.
  function planToText(plan) {
    var out = ["# Plan: " + plan.name];
    if (plan.from) out.push("covers: " + plan.from + (plan.to ? " to " + plan.to : ""));
    if (plan.reviewBy) out.push("review_by: " + plan.reviewBy);
    PLAN_SECTION_ORDER.forEach(function (sec) {
      var list = planSection(plan, sec);
      if (!list.length) return;
      out.push("", "## " + PLAN_SECTION_LABEL[sec]);
      list.forEach(function (l) {
        var label = l.parent ? l.parent + " > " + l.name : l.name;
        var s = "- " + label + ": " + l.amount + (isForeign(l.currency) ? " " + l.currency : "");
        if (l.confidence != null) s += " at " + l.confidence + "%";
        if (l.frequency && sec !== "budgets" && sec !== "grants") s += " " + l.frequency;
        if (l.accountLabel) s += (sec === "income" || sec === "grants" ? " into " : " from ") + l.accountLabel;
        if (l.date) s += (sec === "goals" ? " by " : " from ") + l.date;
        if (l.until) s += " until " + l.until;
        if (l.renews != null) s += " renews " + l.renews + "%";
        if (l.allowance && l.allowance.category) {
          s += " plus " + l.allowance.rate +
            (l.allowance.currency && l.allowance.currency !== baseCode() ? " " + l.allowance.currency : "") +
            " a day for " + l.allowance.category;
        }
        // the comma slot is the category everywhere but a grant, where it is
        // who the money came from
        var tail = sec === "grants" ? l.funder : (sec === "budgets" ? null : l.category);
        if (tail) s += ", " + tail;
        out.push(s);
      });
    });
    return out.join("\n") + "\n";
  }

  function goalsBody() {
    var pace = avgMonthlySaving(3);
    var html = "";

    if (!state.goals.length) {
      return html + '<div class="card"><div class="card-body"><p class="empty">' +
        "No goals yet. <strong>Name something you're saving for</strong> — an emergency fund, a deposit, a trip — with a target " +
        "amount and optionally a date. Coffer works out the monthly figure you need and compares it to what you're actually " +
        "putting aside.</p><button class=\"btn primary\" data-act=\"goal-add\">Add a goal</button></div></div>";
    }

    html += '<div class="stack">';
    state.goals.forEach(function (g) {
      var target = num(g.target), saved = goalSaved(g);
      var held = goalHolderLabel(g);
      var pct = target > 0 ? saved / target : 0;
      var left = Math.max(target - saved, 0);
      var done = left <= 0.005;

      var needLine, tone = "mute";
      var gn = goalNeed(g);
      if (done) { needLine = "Funded in full."; tone = "ok"; }
      else if (g.due) {
        if (gn.overdue) { needLine = "Target date has passed — " + fmt(left, { round: true }) + " still to go."; tone = "bad"; }
        else {
          var need = gn.need;
          var ok = pace >= need;
          needLine = "Needs <b>" + fmt(need, { round: true }) + "/mo</b> to land by " + esc(g.due) +
            (pace > 0
              ? ok ? " — your recent pace of " + fmt(pace, { round: true }) + "/mo covers it."
                   : " — you're currently keeping " + fmt(pace, { round: true }) + "/mo, so this is short by " +
                     fmt(need - pace, { round: true }) + "/mo."
              : ".");
          tone = pace > 0 ? (ok ? "ok" : "warn") : "mute";
        }
      } else if (pace > 0) {
        needLine = "At your recent pace of " + fmt(pace, { round: true }) + "/mo you'd get there in about <b>" +
          humanMonths(Math.ceil(left / pace)) + "</b>.";
      } else {
        needLine = fmt(left, { round: true }) + " still to go. Add a target date to see the monthly figure you need.";
      }

      html += '<div class="card"><div class="card-body">' +
        '<div style="display:flex;align-items:baseline;gap:0.6rem;flex-wrap:wrap">' +
        '<h3 style="font-size:1.05rem;flex:1">' + esc(g.name) + "</h3>" +
        (done ? '<span class="pill ok">reached</span>' : "") +
        '<button class="ibtn" data-act="goal-edit" data-id="' + g.id + '" aria-label="Edit goal" title="Edit">✎</button>' +
        '<button class="ibtn danger" data-act="goal-del" data-id="' + g.id + '" aria-label="Delete goal" title="Delete">✕</button>' +
        "</div>" +
        '<div style="display:flex;align-items:baseline;gap:0.5rem;margin:0.55rem 0 0.5rem">' +
        '<span class="fig" style="font-size:1.5rem;font-weight:650;font-family:var(--serif)">' + fmt(saved) + "</span>" +
        '<span style="color:var(--faint);font-size:0.85rem">of ' + fmt(target) + "</span>" +
        '<span style="margin-left:auto;font-weight:650;font-variant-numeric:tabular-nums">' + Math.round(pct * 100) + "%</span></div>" +
        meter(pct, done ? "var(--gain)" : "var(--c3)") +
        '<p style="font-size:0.85rem;color:var(--dim);line-height:1.55;margin:0.7rem 0 0">' + needLine + "</p>" +
        '<div class="btn-row" style="margin-top:0.85rem">' +
        (held
          ? '<span class="hint">follows ' + esc(held) + '</span>'
          : '<button class="btn sm primary" data-act="goal-fund" data-id="' + g.id + '">Add funds</button>' +
            (saved > 0 ? '<button class="btn sm" data-act="goal-withdraw" data-id="' + g.id + '">Take out</button>' : "")) +
        "</div></div></div>";
    });
    html += "</div>";
    return html;
  }

  /* ============================================================
     DEBTS
     ============================================================ */

  function debtsBody() {
    // Debts sit under Worth now, alongside accounts: both are positions, and
    // net worth is one minus the other. When there are none, this collapses to
    // a single quiet card rather than the empty tab it used to be.
    if (!state.debts.length) {
      return '<div class="sec-head"><span class="label">Debts</span>' +
        '<button class="btn sm quiet" data-act="debt-add">Add a debt</button></div>' +
        '<div class="card pad"><p class="empty" style="margin:0;padding:0">' +
        "Nothing tracked here — <strong>skip this if you're debt-free</strong>. Otherwise add each balance with its " +
        "APR and minimum payment, and Coffer will compare payoff strategies." +
        "</p></div>";
    }

    // Under Worth these tiles arrive below the accounts card, so they need to
    // say what they are counting.
    var html = '<div class="sec-head"><span class="label">Debts</span>' +
      '<span class="pair-sub" style="margin:0;color:var(--alert)">\u2212' + fmt(totalDebt()) + "</span></div>";

    var total = totalDebt();
    var monthlyInterest = state.debts.reduce(function (s, d) { return s + num(d.balance) * num(d.rate) / 100 / 12; }, 0);
    var minTotal = state.debts.reduce(function (s, d) { return s + num(d.minPayment); }, 0);
    var extra = num(state.extraDebtPayment);

    var base = simulatePayoff("minimum", 0);
    var avalanche = simulatePayoff("avalanche", extra);
    var snowball = simulatePayoff("snowball", extra);
    var chosen = debtStrategy === "snowball" ? snowball : debtStrategy === "minimum" ? base : avalanche;

    html += '<div class="triple">' +
      '<div class="card tile-sm"><span class="label">Owed</span>' +
      '<div class="tile-fig" style="color:var(--alert)">' + fmt(total, { round: true }) + "</div></div>" +
      '<div class="card tile-sm"><span class="label">Interest/mo</span>' +
      '<div class="tile-fig">' + fmt(monthlyInterest, { round: true }) + "</div></div>" +
      '<div class="card tile-sm"><span class="label">Minimums</span>' +
      '<div class="tile-fig">' + fmt(minTotal + extra, { round: true }) + "</div></div>" +
      "</div>";

    /* strategy comparison */
    html += '<div class="card pad"><div class="card-tophead">' +
      '<span class="label">Payoff strategy</span>' +
      '<button class="btn sm" data-act="debt-extra">Extra ' + fmt(extra, { round: true }) + "/mo</button></div>" +
      '<div style="margin-top:0.8rem">';

    if (base.stalled && avalanche.stalled) {
      html += '<p class="empty" style="color:var(--loss)">The minimum payments you\'ve entered don\'t cover the interest, so these ' +
        "balances would grow forever. Raise a minimum payment, or add an extra monthly amount, to see a real payoff date.</p>";
    } else {
      html += '<div class="seg" style="margin-bottom:1rem">' +
        [["avalanche", "Avalanche"], ["snowball", "Snowball"], ["minimum", "Minimums only"]].map(function (s) {
          return '<button data-act="debt-strategy" data-v="' + s[0] + '" aria-pressed="' + (debtStrategy === s[0]) + '">' + s[1] + "</button>";
        }).join("") + "</div>";

      var saved = (base.interest != null && chosen.interest != null) ? base.interest - chosen.interest : null;
      var faster = (base.months != null && chosen.months != null) ? base.months - chosen.months : null;

      // said as a sentence rather than as three tiles of wrapping prose
      html += '<p class="lead" style="margin:0 0 0.2rem">' +
        (chosen.months == null ? "These balances do not clear at this rate."
          : "Debt-free in <b>" + esc(humanMonths(chosen.months)) + "</b>, having paid " +
            fmt(chosen.interest, { round: true }) + " in interest.") + "</p>" +
        '<p class="pair-sub">' +
        (saved != null && saved > 0.5
          ? "That is " + fmt(saved, { round: true }) + " less than minimums only" +
            (faster > 0 ? ", and " + humanMonths(faster) + " sooner." : ".")
          : "The same as paying minimums only.") + "</p>";

      if (debtStrategy !== "minimum" && chosen.priority.length > 1) {
        html += '<p class="hint" style="margin-top:0.9rem">Pay every minimum, then send anything spare here first: ' +
          '<b style="color:var(--ink)">' + chosen.priority.map(function (n) { return esc(n); }).join(" → ") + "</b>" +
          (chosen.order.length > 1 && chosen.order.join("|") !== chosen.priority.join("|")
            ? '<br /><span style="color:var(--faint)">They\'ll actually clear in the order ' +
              chosen.order.map(function (n) { return esc(n); }).join(" → ") +
              ", since a small balance can finish on its minimum alone.</span>"
            : "") + "</p>";
      }
      html += '<p class="hint" style="margin-top:0.6rem">' +
        (debtStrategy === "avalanche"
          ? "Avalanche targets the highest interest rate first — mathematically the cheapest route."
          : debtStrategy === "snowball"
          ? "Snowball clears the smallest balance first — costs a little more, but each win arrives sooner, which is easier to stick to."
          : "Paying only the minimums, with no freed-up payment reallocated. This is the baseline the other two are measured against.") +
        "</p>";
    }
    html += "</div></div>";

    /* balances */
    var sorted = state.debts.slice().sort(function (a, b) { return num(b.rate) - num(a.rate); });
    html += '<div class="sec-head"><span class="label">What you owe</span>' +
      '<button class="btn sm primary" data-act="debt-add">Add a debt</button></div>' +
      '<div class="card pad"><div class="rows">' +
      sorted.map(function (d) {
        var mi = num(d.balance) * num(d.rate) / 100 / 12;
        var covers = num(d.minPayment) > mi;
        return '<div class="row stacked">' +
          '<div class="stack-top">' +
          '<span class="row-title">' + esc(d.name) + "</span>" +
          '<span class="row-fig" style="color:var(--alert)">' + fmt(d.balance) + "</span></div>" +
          '<div class="stack-foot">' +
          '<span class="row-sub">' + num(d.rate).toFixed(2) + "% APR · min " + fmt(d.minPayment, { round: true }) +
          "/mo · " + fmt(mi) + " interest this month" + (covers ? "" : " — minimum doesn't cover it") + "</span>" +
          (covers ? "" : '<span class="pill bad">growing</span>') +
          '<button class="btn sm" data-act="debt-pay" data-id="' + d.id + '">Log payment</button>' +
          '<button class="ibtn" data-act="debt-edit" data-id="' + d.id + '" aria-label="Edit" title="Edit">✎</button>' +
          '<button class="ibtn danger" data-act="debt-del" data-id="' + d.id + '" aria-label="Delete" title="Delete">✕</button>' +
          "</div></div>";
      }).join("") + "</div></div></div>";

    return html;
  }

  /* ============================================================
     INSIGHTS
     ============================================================ */

  function renderInsights() {
    var html = '<div class="dateline"><span>Insights</span>' + monthStepper() + "</div>";

    if (state.transactions.length < 2) {
      return html + '<div class="card pad"><p class="empty" style="margin:0;padding:0">' +
        "Not much to read yet. <strong>Log a few weeks of transactions</strong> and this screen will show trends, " +
        "category movement, and how long your balances would last.</p></div>";
    }

    var months = monthsWithData();
    var outflow = avgMonthlyExpense(BURN_LOOKBACK);
    var pace = avgMonthlySaving(BURN_LOOKBACK);
    var rw = runway();
    var owed = pendingRefundTotal();

    // The same runway band as Today, so the two screens that answer "how long
    // can I keep going" answer it in the same words.
    html += runwayBand();

    html += '<div class="card pad"><div class="pair">' +
      '<div><span class="label">Total out</span>' +
      '<div class="pair-fig">' + fmt(outflow, { round: true }) + "</div>" +
      '<div class="pair-sub">typical month, over ' + rw.basis.months + "</div></div>" +
      '<div class="pair-rule"></div>' +
      '<div><span class="label">True burn</span>' +
      '<div class="pair-fig emph">' + fmt(rw.burn, { round: true }) + "</div>" +
      '<div class="pair-sub">one-offs stripped out</div></div>' +
      "</div>" +
      '<p class="pair-sub" style="margin-top:0.7rem">' + (outflow - rw.burn > 0.5
        ? fmt(outflow - rw.burn, { round: true }) + " of a typical month was one-offs or money owed back."
        : "Nothing to strip out — a typical month here is all running cost.") + "</p></div>";

    html += '<div class="triple">' +
      '<div class="card tile-sm"><span class="label">Kept/mo</span><div class="tile-fig"' +
      (pace < 0 ? ' style="color:var(--alert)"' : "") + ">" + fmt(pace, { round: true, signed: true }) + "</div></div>" +
      '<div class="card tile-sm"><span class="label">Reachable</span><div class="tile-fig">' +
      fmt(rw.free, { round: true }) + "</div></div>" +
      '<div class="card tile-sm"><span class="label">On record</span><div class="tile-fig">' +
      months.length + "</div></div>" +
      "</div>";

    if (owed > 0.005 || committedTotal() > 0.005) {
      html += '<p class="band-sub" style="padding:0 0.35rem;margin:0 0 0.9rem">' +
        (owed > 0.005 ? "<b>" + fmt(owed, { round: true }) + "</b> is out as money you expect back. " : "") +
        (committedTotal() > 0.005
          ? "<b>" + fmt(committedTotal(), { round: true }) + "</b> sits in pockets marked as already spoken for, " +
            "so it is in your net worth but not in the runway above."
          : "") + "</p>";
    }

    html += '<div class="card pad"><div class="card-tophead"><span class="label">Everything worth noting</span>' +
      '<span class="sub">' + monthName(viewMonth, true) + "</span></div>" +
      '<div class="card-body flush">' + notesHtml(buildInsights(viewMonth), "Nothing stands out this month.") + "</div></div>";

    /* savings rate trend */
    var ratePts = dataWindow(12, viewMonth).map(function (mk) {
      var s = monthSummary(mk);
      var v = s.rate == null ? 0 : clamp(s.rate * 100, -100, 100);
      return { label: monthName(mk), value: v, tip: monthName(mk, true) + "\n" + (s.rate == null ? "no income" : Math.round(v) + "% kept") };
    });

    html += '<div class="cols-2" style="margin-top:1rem">' +
      whereItWentCard() +
      '<div class="card"><div class="card-head"><h3>Savings rate</h3><span class="sub">share of income kept, 12 months</span></div>' +
      '<div class="card-body">' + areaChart(ratePts, { cssHeight: 120, height: 40, color: "var(--c4)", aria: "Savings rate over 12 months" }) +
      axisRow([ratePts[0], ratePts[ratePts.length - 1]]) + "</div></div>" +
      "</div>";

    html += '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>In and out</h3>' +
      '<span class="sub">12 months</span></div>' +
      '<div class="card-body">' + cashflowChart(dataWindow(12, viewMonth).map(function (mk) { return monthSummary(mk); })) +
      "</div></div>";

    /* category league table */
    var totals = {}, monthsCounted = {};
    state.transactions.forEach(function (t) {
      // the monthly chart already leaves out money you are owed back; this
      // table counted it, so one flight was spending here and not there
      if (t.type !== "expense" || isPending(t)) return;
      txParts(t).forEach(function (pt) {
        totals[pt.category] = (totals[pt.category] || 0) + pt.base;
        monthsCounted[pt.category] = monthsCounted[pt.category] || {};
        monthsCounted[pt.category][monthOf(t.date)] = true;
      });
    });
    var league = Object.keys(totals).map(function (c) {
      var n = Object.keys(monthsCounted[c]).length;
      return { cat: c, total: totals[c], perMonth: totals[c] / Math.max(n, 1), months: n };
    }).sort(function (a, b) { return b.total - a.total; });
    var grand = league.reduce(function (s, r) { return s + r.total; }, 0);

    var thisM = spendByCategory(viewMonth);
    var lastM = spendByCategory(monthShift(viewMonth, -1));

    html += '<div class="card pad"><div class="card-tophead"><span class="label">Categories, all time</span>' +
      '<span class="sub">' + fmt(grand, { round: true }) + " total</span></div>" +
      '<div class="card-body flush"><div class="tscroll"><table>' +
      '<thead><tr><th>Category</th><th class="num">All time</th><th class="num">Share</th>' +
      '<th class="num">Per month</th><th class="num">' + monthName(viewMonth) + '</th><th class="num">vs prev</th></tr></thead><tbody>' +
      league.map(function (r) {
        var cm = thisM[r.cat] || 0, pm = lastM[r.cat] || 0;
        return "<tr><td><span class=\"cat-tag\"><span class=\"cat-dot\" style=\"background:" + catColor(r.cat) + '"></span>' + esc(r.cat) + "</span></td>" +
          '<td class="num">' + fmt(r.total, { round: true }) + "</td>" +
          '<td class="num" style="color:var(--dim)">' + Math.round(r.total / grand * 100) + "%</td>" +
          '<td class="num" style="color:var(--dim)">' + fmt(r.perMonth, { round: true }) + "</td>" +
          '<td class="num">' + fmt(cm, { round: true }) + "</td>" +
          '<td class="num">' + (pm > 0 || cm > 0 ? deltaBadge(cm, pm, { lowerIsBetter: true, asMoney: true }) : "—") + "</td></tr>";
      }).join("") + "</tbody></table></div></div></div>";

    /* biggest single expenses */
    var biggest = state.transactions.filter(function (t) { return t.type === "expense"; })
      .sort(function (a, b) { return txBase(b) - txBase(a); }).slice(0, 8);
    if (biggest.length) {
      html += '<div class="card pad"><span class="label">Largest expenses on record</span>' +
        '<div class="card-body flush"><div class="rows">' + biggest.map(function (t) {
          return '<div class="row"><div class="row-main"><div class="row-title">' + esc(t.desc || t.category) +
            (isPending(t) ? ' <span class="pill warn">owed back</span>' : "") + "</div>" +
            '<div class="row-sub">' + esc(t.date) + " · " + esc(t.category) + " · " + esc(accountName(t.accountId)) + "</div></div>" +
            '<span class="row-fig">' + fmt(txBase(t)) + "</span></div>";
        }).join("") + "</div></div></div>";
    }

    return html;
  }

  /* ============================================================
     SETTINGS
     ============================================================ */

  function bytesUsed() {
    try { return new Blob([localStorage.getItem(KEY) || ""]).size; } catch (e) { return 0; }
  }

  function renderSettings() {
    var html = pageHead("Settings", "Your data, your device.");

    html += '<div class="privacy"><span class="g">🔒</span><div>' +
      "<b>Nothing leaves this device.</b> Coffer has no server and makes no network requests — every figure lives in this " +
      "browser's local storage, on this computer or phone only. Open the file elsewhere and it starts empty there, so " +
      "<b>export a backup whenever the numbers matter</b>. The backup is plain readable JSON: keep it somewhere you'd be " +
      "comfortable keeping a bank statement." +
      "</div></div>";

    /* backup */
    /* which build is actually running */
    html += '<div class="card" style="margin-top:1rem"><div class="card-body">' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:0.6rem">' +
      '<span class="label">App version</span>' +
      '<span class="mono" style="font-size:0.8rem;color:var(--dim)">' + esc(BUILD) + "</span></div>" +
      '<p class="hint" style="margin-top:0.4rem">If this does not match what you were told to expect, the app is ' +
      'running an old copy. It now updates itself when you open it, but you can force it here.</p>' +
      '<button class="btn" style="margin-top:0.6rem" data-act="force-update">Check for an update</button>' +
      "</div></div>";

    html += '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>Backup and restore</h3>' +
      '<span class="sub">' + (bytesUsed() / 1024).toFixed(1) + " KB stored</span></div><div class=\"card-body\">" +
      '<div class="btn-row">' +
      '<button class="btn primary" data-act="export-json">Back up my data</button>' +
      '<button class="btn" data-act="export-csv">Export transactions (.csv)</button>' +
      '<button class="btn" data-act="import-json">Restore a backup</button>' +
      "</div><p class=\"hint\" style=\"margin-top:0.75rem\">Back up gives you the text and a file — copy the text if " +
      "your browser blocks downloads. Restoring replaces everything currently in this browser, after a confirmation.</p></div></div>";

    /* appearance */
    var dref = defaultAccountRef();
    html += '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>Where a quick log lands</h3>' +
      '<span class="sub">' + esc(dref ? accountName(parseRef(dref).accountId, parseRef(dref).pocketId) : "nothing yet") +
      "</span></div>" +
      '<div class="card-body"><p class="hint" style="margin-bottom:0.7rem">' +
      "The account the log bar and the one-tap buttons pick when what you typed does not say. " +
      (state.settings.defaultAccountRef
        ? "Pinned by you."
        : "Not pinned, so Coffer uses whichever you log to most.") + "</p>" +
      '<div class="field"><label class="label" for="defacc">Default</label><select id="defacc">' +
      '<option value="">\u2014 whichever I log to most \u2014</option>' +
      accountOptions(dref).map(function (o) {
        if (o.group) {
          return '<optgroup label="' + esc(o.group) + '">' + o.options.map(function (g) {
            return '<option value="' + esc(g.value) + '"' +
              (g.value === state.settings.defaultAccountRef ? " selected" : "") + ">" + esc(g.label) + "</option>";
          }).join("") + "</optgroup>";
        }
        return '<option value="' + esc(o.value) + '"' +
          (o.value === state.settings.defaultAccountRef ? " selected" : "") + ">" + esc(o.label) + "</option>";
      }).join("") + "</select></div></div></div>";

    html += '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>Your cushion</h3>' +
      '<span class="sub">' + floorMonths() + (floorMonths() === 1 ? " month" : " months") + "</span></div>" +
      '<div class="card-body"><p class="hint" style="margin-bottom:0.7rem">' +
      "How many months of running cost you refuse to go under. It is what " +
      "<b>Can I afford it?</b> holds back before calling anything spare \u2014 right now " +
      fmt(savingsFloor(), { round: true }) + " at " + fmt(burnRate().rate, { round: true }) + " a month.</p>" +
      '<div class="btn-row">' +
      [1, 2, 3, 6, 12].map(function (m) {
        return '<button class="btn sm' + (floorMonths() === m ? " primary" : "") +
          '" data-act="floor-set" data-v="' + m + '">' + m + " mo</button>";
      }).join("") + "</div></div></div>";

    html += '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>Appearance</h3>' +
      '<span class="sub">' + esc(currentTheme() === "system" ? "following your phone" : THEME_LABEL[currentTheme()].toLowerCase()) +
      "</span></div><div class=\"card-body\">" +
      '<div class="seg" style="max-width:420px">' + THEMES.map(function (t) {
        return '<button data-act="theme-set" data-v="' + t + '" aria-pressed="' + (currentTheme() === t) + '">' +
          esc(THEME_LABEL[t]) + "</button>";
      }).join("") + "</div>" +
      '<p class="hint" style="margin-top:0.6rem">Matching your phone follows its light and dark setting, ' +
      "including any automatic schedule it has. Picking one holds it there whatever the phone does.</p>" +
      "</div></div>";

    /* currency */
    html += '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>Currency</h3>' +
      '<span class="sub">everything totals in ' + esc(baseCode()) + '</span></div><div class="card-body">' +
      '<div class="fields" style="max-width:340px"><div class="field"><label class="label" for="cur_sel">Symbol</label>' +
      '<select id="cur_sel">' + ["$", "€", "£", "¥", "₹", "₩", "₪", "₺", "R$", "kr", "CHF", "A$", "C$"].map(function (c) {
        return '<option value="' + esc(c) + '"' + (c === state.settings.currency ? " selected" : "") + ">" + esc(c) + "</option>";
      }).join("") + "</select></div></div>" +
      '<p class="hint" style="margin-top:0.6rem">Amounts are formatted with your device\'s number conventions.</p></div></div>';

    /* exchange rates — yours, not the official ones */
    var rateCodes = CURRENCIES.filter(function (c) { return c !== baseCode(); });
    html += '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>Exchange rates</h3>' +
      '<button class="btn sm" data-act="rate-edit">Set a rate</button></div><div class="card-body">' +
      '<p class="hint" style="margin-bottom:0.75rem">How many of each currency you actually get for one ' +
      esc(baseCode()) + '. Use the rate you really trade at, not the official one. ' +
      '<b>Changing a rate only affects what you log next</b> — anything already recorded keeps the rate it ' +
      'was logged at, so your history never rewrites itself. Pick a currency and a typical rate is filled in ' +
      'for you to correct, so you are never staring at an empty box.</p>';

    var staleCodes = rateCodes.filter(rateIsStale);
    if (staleCodes.length) {
      html += '<p class="hint" style="color:var(--warn);margin-bottom:0.75rem">' +
        "<b>" + esc(staleCodes.join(", ")) + "</b> " + (staleCodes.length === 1 ? "was" : "were") +
        " set more than " + RATE_STALE_DAYS + " days ago. Anything you log today still converts at " +
        (staleCodes.length === 1 ? "that rate" : "those rates") + " until you update " +
        (staleCodes.length === 1 ? "it" : "them") + ".</p>";
    }

    var setRates = rateCodes.filter(function (c) { return rateNum(c) > 0; });
    if (!setRates.length) {
      html += '<p class="empty">No rates set. Everything is treated as ' + esc(baseCode()) + '.</p>';
    } else {
      html += '<div class="rows">' + setRates.map(function (c) {
        var r = rateNum(c);
        var age = rateAge(c), stale = rateIsStale(c);
        // In a currency that moves week to week, a rate set months ago is not a
        // rate — so each row says how old it is rather than letting a stale
        // number quietly convert everything you log today.
        var when = age == null ? "no date recorded"
          : age === 0 ? "set today"
          : age === 1 ? "set yesterday"
          : "set " + age + " days ago";
        return '<div class="row"><div class="row-main"><div class="row-title">' + esc(c) + "</div>" +
          '<div class="row-sub">1 ' + esc(baseCode()) + " = " + r.toLocaleString() + " " + esc(c) +
          " · " + esc(when) + "</div></div>" +
          '<div class="row-end">' +
          (stale ? '<span class="pill warn">check this</span>' : "") +
          '<button class="ibtn" data-act="rate-set" data-id="' + esc(c) + '" aria-label="Edit" title="Edit">✎</button>' +
          '<button class="ibtn danger" data-act="rate-del" data-id="' + esc(c) + '" aria-label="Remove" title="Remove">✕</button>' +
          "</div></div>";
      }).join("") + "</div>";
    }
    html += "</div></div>";

    /* receipts */
    html += '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>Receipts</h3>' +
      '<span class="sub" id="photo_stat">counting…</span></div><div class="card-body">' +
      '<p class="hint">Photos are stored separately from everything else, because one phone photo is bigger ' +
      'than this entire ledger and would break saving if it went in with the rest. ' +
      '<b>They are not included in a backup</b> — a backup stays small, readable JSON. Keep the photos by ' +
      'backing up your phone as you normally would.</p>' +
      '<div class="btn-row" style="margin-top:0.75rem">' +
      '<button class="btn" data-act="photo-tidy">Remove orphaned receipts</button>' +
      '<button class="btn danger" data-act="photo-wipe">Remove all receipts</button>' +
      "</div></div></div>";

    /* categories */
    html += '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>Categories</h3>' +
      '<div class="btn-row"><button class="btn sm" data-act="cat-add" data-kind="expense">Add expense</button>' +
      '<button class="btn sm" data-act="cat-add" data-kind="income">Add income</button></div></div><div class="card-body">' +
      '<span class="label">Expenses</span><div class="chips" style="margin:0.45rem 0 1rem">' +
      state.categories.expense.map(function (c) {
        return '<span class="chip"><span class="cat-dot" style="background:' + catColor(c) + '"></span>' + esc(c) +
          '<button data-act="cat-rename" data-kind="expense" data-cat="' + esc(c) + '" aria-label="Rename ' + esc(c) + '" title="Rename">\u270e</button>' +
          '<button data-act="cat-del" data-kind="expense" data-cat="' + esc(c) + '" aria-label="Remove ' + esc(c) + '">✕</button></span>';
      }).join("") + "</div>" +
      '<span class="label">Income</span><div class="chips" style="margin:0.45rem 0 0">' +
      state.categories.income.map(function (c) {
        return '<span class="chip">' + esc(c) +
          '<button data-act="cat-rename" data-kind="income" data-cat="' + esc(c) + '" aria-label="Rename ' + esc(c) + '" title="Rename">\u270e</button>' +
          '<button data-act="cat-del" data-kind="income" data-cat="' + esc(c) + '" aria-label="Remove ' + esc(c) + '">✕</button></span>';
      }).join("") + "</div>" +
      '<p class="hint" style="margin-top:0.8rem">Removing a category leaves past transactions untouched — they keep the ' +
      "name, it just stops being offered for new ones.</p></div></div>";

    /* lock */
    var locked = !!state.settings.lock;
    html += '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>Screen lock</h3>' +
      '<span class="sub">' + (locked ? "on" : "off") + "</span></div><div class=\"card-body\">" +
      '<p style="font-size:0.86rem;color:var(--dim);line-height:1.6;margin:0 0 0.9rem;max-width:60ch">' +
      "Ask for a PIN when Coffer opens. This keeps casual eyes off your figures — it is <b>not encryption</b>: the data " +
      "stays readable to anyone who can open this browser's storage directly, and a forgotten PIN can only be cleared by " +
      "erasing the data. Treat it like the lock screen on your phone, not a safe.</p>" +
      '<div class="btn-row">' +
      (locked
        ? '<button class="btn" data-act="lock-change">Change PIN</button><button class="btn danger" data-act="lock-off">Turn off</button>'
        : '<button class="btn primary" data-act="lock-on">Set a PIN</button>') +
      "</div></div></div>";

    /* danger */
    html += '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>Erase everything</h3></div><div class="card-body">' +
      '<p style="font-size:0.86rem;color:var(--dim);line-height:1.6;margin:0 0 0.9rem;max-width:60ch">' +
      "Removes every account, transaction, budget, goal, debt and recurring item from this browser. There is no undo and " +
      "no copy anywhere else — export a backup first if there's any doubt.</p>" +
      '<button class="btn danger" data-act="wipe">Erase all local data</button></div></div>';

    return html;
  }

  /* ============================================================
     Quick entry — the plain-text box plus one-tap buttons.
     ============================================================ */

  var omni = { text: "", touched: {} };

  function omniPreviewHtml() {
    var p = parseEntry(omni.text);
    if (!p) {
      return '<p class="hint" style="margin:0.55rem 0 0">' +
        "Type an amount and what it was for. Date words work too — " +
        "<b>today</b>, <b>yesterday</b>, <b>friday</b>, <b>3 aug</b>, <b>2 days ago</b>. " +
        "Start with <b>+</b> for money coming in.</p>";
    }
    if (!p.ok) {
      return '<p class="hint" style="margin:0.55rem 0 0;color:var(--warn)">' + esc(p.reason) + "</p>";
    }

    var cat = omni.touched.category || p.category;
    var acc = omni.touched.accountId || p.accountId;   // an acctRef
    var date = omni.touched.date || p.date;
    var cats = state.categories[p.type === "income" ? "income" : "expense"];
    if (cats.indexOf(cat) === -1) cat = p.category;
    /* The fastest way to log something could only ever log in base currency
       unless you happened to type the code, which for anyone paid in lira is
       most of what they log. Picking here wins over the text, because picking
       is the later and more deliberate of the two. */
    var codes = currencyCodes();
    var cur = omni.touched.currency || p.currency || baseCode();
    if (codes.indexOf(cur) === -1) cur = baseCode();
    var shown = toBase(p.amount, cur, rateFor(cur));

    return '<div id="omniPreview" style="margin-top:0.7rem;padding-top:0.7rem;border-top:1px solid var(--rule)">' +
      '<div style="display:flex;align-items:baseline;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.6rem">' +
      '<span class="pill ' + (p.type === "income" ? "ok" : "mute") + '">' + (p.type === "income" ? "money in" : "money out") + "</span>" +
      // this printed the raw figure with the base symbol, so 8,900,000 lira
      // read as eight and a half million dollars
      '<span style="font-size:1.25rem;font-weight:650;font-variant-numeric:tabular-nums">' +
      (p.type === "income" ? "+" : "−") + fmt(shown).replace("-", "") + "</span>" +
      (isForeign(cur) ? '<span class="hint">' + esc(fmtIn(p.amount, cur)) + "</span>" : "") +
      '<span style="font-size:0.92rem">' + esc(p.desc) + "</span>" +
      (p.why && !omni.touched.category
        ? '<span class="hint" style="margin-left:auto">' + esc(p.why) + "</span>" : "") +
      "</div>" +
      '<div class="fields">' +
      '<div class="field"><label class="label" for="omni_cat">Category</label><select id="omni_cat">' +
      cats.map(function (c) {
        return '<option value="' + esc(c) + '"' + (c === cat ? " selected" : "") + ">" + esc(c) + "</option>";
      }).join("") +
      '<option value="' + NEW_CAT + '">\uFF0B New category\u2026</option></select>' +
      '<input id="omni_cat_new" type="text" placeholder="Name it" autocomplete="off" ' +
      'aria-label="New category name" style="display:none;margin-top:0.4rem" /></div>' +
      // this listed accounts only — no pockets, and closed ones included — so
      // the fastest way to log something was the one way that could not file
      // it where it belonged
      '<div class="field"><label class="label" for="omni_acc">Account</label><select id="omni_acc">' +
      accountOptions(acc).map(function (o) {
        if (o.group) {
          return '<optgroup label="' + esc(o.group) + '">' + o.options.map(function (g) {
            return '<option value="' + esc(g.value) + '"' + (g.value === acc ? " selected" : "") +
              ">" + esc(g.label) + "</option>";
          }).join("") + "</optgroup>";
        }
        return '<option value="' + esc(o.value) + '"' + (o.value === acc ? " selected" : "") +
          ">" + esc(o.label) + "</option>";
      }).join("") + "</select></div>" +
      '<div class="field"><label class="label" for="omni_cur">Currency</label><select id="omni_cur">' +
      codes.map(function (c) {
        return '<option value="' + esc(c) + '"' + (c === cur ? " selected" : "") + ">" + esc(c) + "</option>";
      }).join("") + "</select>" +
      (isForeign(cur)
        ? '<span class="hint">at ' + esc(fmtRate(rateFor(cur))) + " to the " + esc(baseCode()) +
          ", frozen onto this entry</span>"
        : "") + "</div>" +
      '<div class="field"><label class="label" for="omni_date">Date</label>' +
      '<input id="omni_date" type="date" value="' + esc(date) + '" /></div>' +
      "</div>" +
      '<div class="btn-row" style="margin-top:0.75rem">' +
      '<button class="btn primary" data-act="omni-commit">Add ' +
        (isForeign(cur)
          ? esc(fmtIn(p.amount, cur)) + " (" + fmt(shown).replace("-", "") + ")"
          : fmt(shown).replace("-", "")) + "</button>" +
      '<button class="btn quiet" data-act="omni-clear">Clear</button>' +
      "</div></div>";
  }

  /* The bar at the bottom of every screen is the control used more than all
     the others together, and it used to parse what you typed and WRITE IT —
     showing a preview only when parsing failed. So the category was whatever
     guessCategory decided and the account was whatever came first. Now the
     same preview the Ledger has appears as a sheet, and nothing is written
     until you press Log. One tap when the guess is right; one tap to correct
     it when it is not. */
  function openOmniSheet() {
    closeModal();
    overlay.innerHTML = '<div class="scrim" data-scrim="1">' +
      '<div class="modal" role="dialog" aria-modal="true" aria-label="Log this">' +
      '<div class="modal-head"><h3>Log this</h3>' +
      "<p>Change anything that is not right \u2014 nothing is written until you press Log.</p></div>" +
      '<div class="modal-body" id="omniSheet">' + omniPreviewHtml() + "</div></div></div>";
    wireOmniPreview();
    overlay.querySelector("[data-scrim]").addEventListener("mousedown", function (ev) {
      if (ev.target === ev.currentTarget) closeModal();
    });
  }

  function quickChipsHtml() {
    if (!state.quick.length) {
      return '<p class="hint" style="margin:0">No one-tap buttons yet. Good for anything you pay often at no fixed time — ' +
        "a taxi, a coffee, the corner shop.</p>";
    }
    return '<div class="chips">' + state.quick.map(function (q) {
      var amt = num(q.amount);
      return '<button class="chip quick" data-act="quick-log" data-id="' + q.id + '" ' +
        'title="' + esc(q.label + " · " + q.category +
          (amt > 0 ? " · " + (isForeign(q.currency) ? fmtIn(amt, q.currency) : fmt(amt)) : " · asks for the amount")) + '">' +
        '<span class="cat-dot" style="background:' + catColor(q.category) + '"></span>' +
        "<b>" + esc(q.label) + "</b>" +
        '<span style="color:var(--faint);font-variant-numeric:tabular-nums">' +
        (amt > 0 ? fmt(amt, { round: true }) : "…") + "</span></button>";
    }).join("") + "</div>";
  }

  function quickAddCard() {
    if (!state.accounts.length) return "";
    return '<div class="card"><div class="card-head"><h3>Add something</h3>' +
      '<div class="btn-row"><button class="btn sm quiet" data-act="omni-bulk">Paste a list</button>' +
      '<button class="btn sm quiet" data-act="quick-manage">One-tap buttons</button></div></div>' +
      '<div class="card-body">' +
      '<input id="omniBox" type="text" value="' + esc(omni.text) + '" autocomplete="off" ' +
      'placeholder="10$ potato   ·   taxi 8 yesterday   ·   +2500 salary" ' +
      'style="font-size:1rem;padding:0.6rem 0.7rem" aria-label="Describe what you paid" />' +
      '<div id="omniZone">' + omniPreviewHtml() + "</div>" +
      '<div style="margin-top:0.9rem;padding-top:0.8rem;border-top:1px solid var(--rule)">' +
      '<span class="label" style="display:block;margin-bottom:0.5rem">One tap</span>' +
      quickChipsHtml() + "</div></div></div>";
  }

  // Refresh only the preview strip so typing never rebuilds the screen.
  function refreshOmni() {
    var zone = document.getElementById("omniZone");
    if (!zone) return;
    zone.innerHTML = omniPreviewHtml();
    wireOmniPreview();
  }

  /* The Ledger card and the log-bar sheet render the SAME preview, so with the
     sheet open there are two copies of every control in the document and
     getElementById hands back the first — the one under the scrim. Nothing you
     changed in the sheet was ever wired, which is why picking a category there
     did nothing. Every lookup goes through the visible copy instead. */
  function omniRoot() {
    return document.getElementById("omniSheet") || document.getElementById("omniZone") || document;
  }
  function omniEl(id) {
    var r = omniRoot();
    return r === document ? document.getElementById(id) : r.querySelector("#" + id);
  }

  function wireOmniPreview() {
    var c = omniEl("omni_cat");
    var cNew = omniEl("omni_cat_new");
    if (c) c.addEventListener("change", function () {
      if (c.value === NEW_CAT) {
        // keep the typed name out of touched.category until it's committed
        if (cNew) { cNew.style.display = ""; cNew.focus(); }
      } else {
        if (cNew) cNew.style.display = "none";
        omni.touched.category = c.value;
      }
    });
    var a = omniEl("omni_acc");
    if (a) a.addEventListener("change", function () { omni.touched.accountId = a.value; });
    var d = omniEl("omni_date");
    if (d) d.addEventListener("change", function () { omni.touched.date = d.value; });
    var u = omniEl("omni_cur");
    if (u) u.addEventListener("change", function () {
      omni.touched.currency = u.value;
      // the figure and the button both restate in the currency just picked
      var zone = omniRoot();
      if (zone && zone !== document) { zone.innerHTML = omniPreviewHtml(); wireOmniPreview(); }
    });
  }

  var omniTimer = null;
  function wireOmni() {
    var box = document.getElementById("omniBox");
    if (!box) return;
    box.addEventListener("input", function () {
      omni.text = box.value;
      clearTimeout(omniTimer);
      omniTimer = setTimeout(refreshOmni, 120);
    });
    box.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); clearTimeout(omniTimer); omni.text = box.value; commitOmni(); }
    });
    wireOmniPreview();
  }

  // returns false when nothing was written, so the sheet stays open on it
  function commitOmni() {
    var p = parseEntry(omni.text);
    if (!p || !p.ok) { toast(p && p.reason ? p.reason : "Type an amount and what it was for."); return false; }
    var kind = p.type === "income" ? "income" : "expense";
    var cats = state.categories[kind];
    var cat = omni.touched.category && cats.indexOf(omni.touched.category) >= 0 ? omni.touched.category : p.category;

    // a category typed into the quick box joins the list for good
    var sel = omniEl("omni_cat");
    var box = omniEl("omni_cat_new");
    if (sel && sel.value === NEW_CAT) {
      var typed = (box ? box.value : "").trim();
      if (!typed) { toast("Type a name for the new category."); return false; }
      var clash = cats.filter(function (c) { return c.toLowerCase() === typed.toLowerCase(); })[0];
      if (clash) { cat = clash; }
      else { cats.push(typed); cat = typed; toast("\u201C" + typed + "\u201D added to your " + kind + " categories."); }
    }
    // the picker hands back an acctRef, which may name a pocket
    var ref = parseRef(omni.touched.accountId || p.accountId || "");
    var cur = omni.touched.currency || p.currency || baseCode();
    if (currencyCodes().indexOf(cur) === -1) cur = baseCode();
    var tx = {
      id: uid(),
      date: omni.touched.date || p.date,
      desc: p.desc,
      type: p.type,
      category: cat,
      accountId: ref.accountId,
      pocketId: ref.pocketId || null,
      amount: p.amount,
      currency: cur,
      rate: rateFor(cur)
    };
    if (!tx.accountId) { toast("Add an account first."); return false; }
    state.transactions.push(tx);
    omni = { text: "", touched: {} };
    save();
    render();
    // named apart from the new-category box above it: one `var box` for two
    // different elements in one function is a hoisting trap waiting to happen
    var typeBox = document.getElementById("omniBox");
    if (typeBox) typeBox.focus();
    toast(esc0(tx.desc) + " · " + (isForeign(tx.currency) ? fmtIn(tx.amount, tx.currency) + " = " : "") +
      fmt(txBase(tx)) + " logged to " + accountName(tx.accountId, tx.pocketId) + ".", function () {
      state.transactions = state.transactions.filter(function (t) { return t.id !== tx.id; });
    });
    return true;
  }

  // toast() escapes for us; this just trims very long descriptions
  function forgetPhoto(id) { if (hasPhoto(id)) { photoDel(id); markPhoto(id, false); } }

  function esc0(s) { return String(s).length > 40 ? String(s).slice(0, 38) + "…" : String(s); }

  /* ============================================================
     Actions — every button routes through here by data-act.
     Nothing depends on form submission or native dialogs.
     ============================================================ */

  // keepRef is whatever the field is already set to. A closed account stays
  // out of every picker so nothing new can land in it — except on the entry
  // that is already filed there, which would otherwise be silently reassigned
  // to some other account the moment you opened the edit dialog.
  /* One picker, nineteen call sites. It always offered the whole account —
     `{ value: a.id }` before each pocket — but as a bare "Bank" one line above
     "Bank \u203a Savings", "Bank \u203a Cyprus" and "Bank \u203a Balamand". In a flat
     native select that is invisible in the sense that matters: you cannot tell
     which line is the account and which are parts of it. Grouped, with the
     account named as the whole thing and its pockets reduced to their own
     names, the difference is unmissable. */
  /* Where a quick log lands when the text does not say. This was
     `state.accounts[0]` — literally first in the array, not a choice anyone
     made and not even the first OPEN one. Now: what you picked, or failing
     that the account you actually log to most, which lands on the right one
     without anyone configuring anything. */
  function mostUsedAccountRef() {
    var since = iso(new Date(Date.now() - 90 * 86400000));
    var count = {}, best = null, bestN = 0;
    state.transactions.forEach(function (t) {
      if (t.type === "transfer" || t.date < since || !t.accountId) return;
      var k = acctRef(t.accountId, t.pocketId);
      count[k] = (count[k] || 0) + 1;
      if (count[k] > bestN) { bestN = count[k]; best = k; }
    });
    return best;
  }
  function defaultAccountRef() {
    var pick = state.settings.defaultAccountRef;
    if (pick) {
      var r = parseRef(pick), a = accountById(r.accountId);
      // a default pointing at something deleted or closed is not a default
      if (a && !a.closed && (!r.pocketId || pocketById(a, r.pocketId))) return pick;
    }
    var used = mostUsedAccountRef();
    if (used) {
      var u = parseRef(used), ua = accountById(u.accountId);
      if (ua && !ua.closed && (!u.pocketId || pocketById(ua, u.pocketId))) return used;
    }
    var open = openAccounts()[0];
    return open ? open.id : null;
  }

  /* Paying from the WHOLE account draws on the part that is not in a pocket,
     so a payment larger than that quietly pushes "Not allocated" negative and
     is really coming out of what you set aside. Said out loud rather than
     left to be discovered on the Worth screen. */
  function warnIfOverAllocated(ref, type, base) {
    if (type !== "expense" || !(base > 0)) return;
    var r = parseRef(ref || "");
    if (!r.accountId || r.pocketId) return;            // a pocket pays for itself
    var a = accountById(r.accountId);
    if (!a || !pocketsOf(a).length) return;
    var loose = unallocatedOf(a);
    if (base <= loose + 0.005) return;
    toast(fmt(base - loose, { round: true }) + " more than " + a.name +
      " holds outside its pockets — it comes out of what you have set aside.");
  }

  function accountOptions(keepRef) {
    var keepId = keepRef ? parseRef(keepRef).accountId : null;
    var out = [];
    state.accounts.forEach(function (a) {
      if (a.closed && a.id !== keepId) return;
      var pockets = pocketsOf(a);
      if (!pockets.length) {
        out.push({ value: a.id, label: a.name + (a.closed ? " (closed)" : "") });
        return;
      }
      out.push({
        group: a.name + (a.closed ? " (closed)" : ""),
        options: [{ value: a.id, label: a.name + " \u2014 the whole account" }].concat(
          pockets.map(function (pk) {
            return { value: acctRef(a.id, pk.id), label: pk.name };
          }))
      });
    });
    return out;
  }
  /* The grouped list is for pickers. Anything that needs a FLAT list — a first
     entry to default to, a hand-rolled <select> — takes this instead: a group
     object carries no `value`, and reading one off it silently produced
     `<option value="undefined">` and a debt payment that quietly logged
     nothing because its default resolved to the "don't log it" row. */
  function accountOptionsFlat(keepRef) {
    var out = [];
    accountOptions(keepRef).forEach(function (o) {
      if (!o.group) { out.push(o); return; }
      o.options.forEach(function (g) {
        out.push({
          value: g.value,
          label: parseRef(g.value).pocketId ? o.group + " \u203a " + g.label : g.label
        });
      });
    });
    return out;
  }
  // Only offered once at least one rate exists, so a single-currency book
  // never sees it.
  // Always shown. It used to hide itself until a rate existed, which meant the
  // whole feature was invisible to anyone who had not already found the
  // Exchange rates card — you cannot discover a currency picker that only
  // appears once you have configured a currency.
  function currencyField(value) {
    var codes = Object.keys(state.settings.rates || {}).filter(function (c) {
      return c !== baseCode() && rateNum(c) > 0;
    });
    return [{
      key: "currency", label: "Currency", type: "select",
      options: [baseCode()].concat(codes),
      value: value || baseCode(),
      hint: codes.length
        ? "kept at today's rate, so this entry never re-values later"
        : "only " + baseCode() + " so far — add rates under Settings \u203a Exchange rates to log in another currency"
    }];
  }

  /* ---- the far side of an exchange ----------------------------------------
     A transfer used to carry one amount and one currency and use it for both
     sides, so changing 30,000,000 LBP into dollars credited exactly what it
     debited, at the rate stored in Settings. The rate you actually got at the
     changer, and the spread you paid for it, existed nowhere — which for
     someone converting lira every month is the ledger quietly telling you a
     story. A transfer now carries `toAmount`, `toCurrency` and `toRate`, left
     off entirely when both sides match so every transfer already written
     behaves exactly as it did. */

  function currencyCodes() {
    return [baseCode()].concat(Object.keys(state.settings.rates || {}).filter(function (c) {
      return c !== baseCode() && rateNum(c) > 0;
    }));
  }

  /* Stated in whichever direction reads as a number above one: 90,909 lira to
     the dollar is a rate you recognise, 0.000011 dollars to the lira is not. */
  function impliedRate(outAmt, outCur, inAmt, inCur) {
    if (!(outAmt > 0) || !(inAmt > 0) || outCur === inCur) return null;
    var a = outAmt / inAmt;
    return a >= 1 ? { n: a, of: outCur, per: inCur } : { n: inAmt / outAmt, of: inCur, per: outCur };
  }
  function fmtRate(n) {
    var d = n >= 1000 ? 0 : n >= 10 ? 2 : 4;
    return num(n).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  // the spread, in base: what left, less what landed
  function exchangeCost(outAmt, outCur, inAmt, inCur) {
    return toBase(outAmt, outCur, rateFor(outCur)) - toBase(inAmt, inCur, rateFor(inCur));
  }

  /* What the dialog says under "Amount received" while you type. It never
     fills a figure in for you: with the currency changed and nothing entered
     it refuses, because the number it would have to guess with is the stored
     rate, and the stored rate is exactly what turned out to be wrong. */
  function exchangeLine(outAmt, outCur, inAmt, inCur) {
    if (outCur === inCur) {
      if (!(inAmt > 0) || Math.abs(inAmt - outAmt) < 0.005) return "leave blank unless the currency changed";
      var fee = exchangeCost(outAmt, outCur, inAmt, inCur);
      return fee > 0
        ? fmt(fee) + " of it did not arrive \u2014 a fee, not a rate."
        : fmt(-fee) + " more arrived than left.";
    }
    if (!(outAmt > 0) || !(inAmt > 0)) return "Say how much arrived in " + inCur + " \u2014 Coffer will not invent a rate.";
    var got = impliedRate(outAmt, outCur, inAmt, inCur);
    var stored = rateFor(got.of) / rateFor(got.per);
    var line = fmtRate(got.n) + " " + got.of + " to the " + got.per + ", against " + fmtRate(stored) + " stored";
    if (rateIsStale(got.of) || rateIsStale(got.per)) line += ", which is over a month old";
    var spread = exchangeCost(outAmt, outCur, inAmt, inCur);
    if (Math.abs(spread) < 0.005) return line + " \u2014 the same rate.";
    return line + (spread > 0
      ? " \u2014 the exchange cost " + fmt(spread) + "."
      : " \u2014 " + fmt(-spread) + " better than stored.");
  }

  /* The two fields, wired so the line above restates on every keystroke.
     Passed the transaction when editing, nothing when adding. */
  function transferSideFields(t) {
    function restate(_v, el, setHint) {
      if (!el("toAmount")) return;
      setHint("toAmount", exchangeLine(
        num(el("amount").value), el("currency").value || baseCode(),
        num(el("toAmount").value), el("toCurrency").value || baseCode()));
    }
    /* A transfer is not an exchange until you say it is. Changing the currency
       you are sending carries the received side with it while the received box
       is still empty, so moving $50 into an account you happen to keep in lira
       stays one plain move — it was briefly demanding a lira figure for it,
       which is friction in the way of the common case. Once you have typed a
       received figure, nothing overwrites it. */
    function mirror(v, el, setHint) {
      var box = el("toAmount"), sel = el("toCurrency");
      if (box && sel && !(num(box.value) > 0)) sel.value = v || baseCode();
      restate(v, el, setHint);
    }
    return {
      restate: restate,
      mirror: mirror,
      fields: [
        { key: "toAmount", label: "Amount received", type: "number", min: 0,
          value: t && t.toAmount != null ? t.toAmount : "",
          hint: "leave blank unless the currency changed", onChange: restate },
        { key: "toCurrency", label: "Received in", type: "select", options: currencyCodes(),
          value: (t && t.toCurrency) || (t && t.currency) || baseCode(), onChange: restate }
      ]
    };
  }

  function transferSideProblem(v) {
    var cur = v.currency || baseCode(), inCur = v.toCurrency || cur;
    if (inCur !== cur && !(v.toAmount > 0)) {
      return "Say how much arrived in " + inCur + " \u2014 Coffer will not invent a rate.";
    }
    if (v.toAmount < 0) return "The amount received cannot be negative.";
    return null;
  }

  /* Written onto the transfer only when the far side actually differs, so a
     same-currency move keeps the exact shape it has always had. */
  function setTransferSide(t, outAmt, outCur, inAmt, inCur) {
    inCur = inCur || outCur;
    if (inCur === outCur && (!(inAmt > 0) || Math.abs(inAmt - outAmt) < 0.005)) {
      delete t.toAmount; delete t.toCurrency; delete t.toRate;
      return;
    }
    t.toAmount = inAmt;
    t.toCurrency = inCur;
    t.toRate = rateFor(inCur);
  }

  // Places accounts are held — whatever you have already used, so the list
  // grows with you instead of being fixed by me.
  function groupOptions() {
    var seen = {}, out = [];
    state.accounts.forEach(function (a) {
      if (a.group && !seen[a.group.toLowerCase()]) { seen[a.group.toLowerCase()] = 1; out.push(a.group); }
    });
    out.sort();
    // a blank option reads as a glitch; name the "not filed anywhere" case
    return out.map(function (g) { return { value: g, label: g }; })
              .concat([{ value: "", label: "Elsewhere" }]);
  }
  function typeOptions(extra) {
    var seen = {}, out = [];
    ACCOUNT_TYPES.concat(state.accounts.map(function (a) { return a.type; }))
      .concat(extra ? [extra] : [])
      .forEach(function (t) {
        if (t && !seen[t.toLowerCase()]) { seen[t.toLowerCase()] = 1; out.push(t); }
      });
    return out;
  }

  function catOptions(kind) {
    return state.categories[kind === "income" ? "income" : "expense"].slice();
  }

  function needAccount() {
    if (openAccounts().length) return false;
    toast(state.accounts.length ? "Every account is closed \u2014 reopen one first." : "Add an account first.");
    return true;
  }

  var ACTIONS = {

    /* ---- navigation ---- */
    "go-insights": function () { view = "insights"; render(); },

    "floor-set": function (id, el) {
      state.settings.floorMonths = num(el.getAttribute("data-v"));
      save(); render();
      toast("Cushion set to " + floorMonths() + " months of running cost.");
    },

    "theme-set": function (id, el) {
      state.settings.theme = el.getAttribute("data-v");
      save(); applyTheme(); render();
    },
    "plan-tab": function (id) { planTab = id; view = "plan"; render(); },

    /* ---- outlook ---- */
    "afford-open": function () {
      var cats = Object.keys(state.budgets);
      // every pocket you could raid, named by account so two "Savings" are
      // telling apart
      openModal({
        title: "Can I afford it?",
        message: "Nothing here is logged \u2014 it runs your projection again with the purchase in it " +
          "and shows you what each way of paying costs.",
        confirmLabel: "Work it out",
        fields: [
          { key: "label", label: "What is it", type: "text", placeholder: "A used car", span: true },
          { key: "amount", label: "Price", type: "number", min: 0, value: "" }
        ].concat(currencyField()).concat([
          { key: "date", label: "When", type: "date", value: monthShift(thisMonth(), 1) + "-01",
            hint: "the month you would buy it in" },
          { key: "months", label: "Spread over", type: "number", min: 2, step: "1", value: 6,
            hint: "months, if you paid in instalments" },
          { key: "markup", label: "Instalment markup", type: "number", min: 0, value: 0,
            hint: "% added by the plan \u2014 0 if it is interest free" }
        ]).concat(cats.length ? [{
          key: "budgetCat", label: "Trim which budget", type: "select",
          options: [{ value: "", label: "\u2014 none \u2014" }].concat(cats.map(function (c) {
            return { value: c, label: c + " (" + fmt(num(state.budgets[c]), { round: true }) + "/mo)" };
          })), value: ""
        }, {
          key: "budgetCut", label: "Trim it by", type: "number", min: 0, value: 0,
          hint: "per month"
        }] : []),
        validate: function (v) {
          if (!(v.amount > 0)) return "Enter what it costs.";
          if (v.budgetCat && !(v.budgetCut > 0)) return "Say how much a month you would trim from " + v.budgetCat + ".";
        },
        onConfirm: function (v) {
          var cur = v.currency || baseCode();
          afford = {
            label: (v.label || "").trim() || "That purchase",
            amount: v.amount, currency: cur, rate: rateFor(cur),
            base: toBase(v.amount, cur, rateFor(cur)),
            date: v.date || today(),
            months: v.months, markup: v.markup,
            budgetCat: v.budgetCat || null, budgetCut: v.budgetCut,
            route: null
          };
          planTab = "outlook"; view = "plan";
          render();
          window.scrollTo({ top: 0, behavior: "auto" });
        }
      });
    },
    "afford-route": function (id) { if (afford) { afford.route = id; render(); } },
    "afford-clear": function () { afford = null; render(); },

    "outlook-toggle": function (id) {
      if (outlookOff[id]) delete outlookOff[id]; else outlookOff[id] = true;
      render();
    },
    "month-prev": function () { viewMonth = monthShift(viewMonth, -1); render(); },
    "month-next": function () { if (viewMonth < thisMonth()) { viewMonth = monthShift(viewMonth, 1); render(); } },
    "month-today": function () { viewMonth = thisMonth(); render(); },

    /* ---- accounts ---- */
    "account-add": function () {
      openModal({
        title: "Add an account",
        message: "The opening balance is what this account held before any transaction you log here.",
        fields: [
          { key: "name", label: "Name", placeholder: "e.g. Everyday current", span: true },
          { key: "group", label: "Held at", type: "select", options: groupOptions(), catKind: "free",
            // "" is the Elsewhere option. Defaulting to the first real place
            // would file every new account under whichever bank sorts first.
            newLabel: "New place\u2026", newPlaceholder: "e.g. Bank of Cyprus", value: "",
            hint: "the bank, wallet or place this sits in" },
          { key: "type", label: "Type", type: "select", options: typeOptions(), catKind: "free",
            newLabel: "New type\u2026", newPlaceholder: "e.g. Joint, Pension", value: "Checking" },
          { key: "opening", label: "Opening balance", type: "number", value: 0 }
        ].concat(currencyField()),
        confirmLabel: "Add account",
        validate: function (v) { if (!v.name.trim()) return "Give the account a name."; },
        onConfirm: function (v) {
          state.accounts.push({ id: uid(), name: v.name.trim(), group: (v.group || "").trim() || null,
            type: v.type, opening: v.opening,
            currency: v.currency || baseCode(), rate: rateFor(v.currency || baseCode()) });
          save(); render();
          toast(v.name.trim() + " added.");
        }
      });
    },

    "account-edit": function (id) {
      var a = accountById(id);
      if (!a) return;
      openModal({
        title: "Edit account",
        message: "Current balance is " + fmt(balanceOf(a)) + ", derived from the opening figure plus every transaction.",
        fields: [
          { key: "name", label: "Name", value: a.name, span: true },
          { key: "group", label: "Held at", type: "select", options: groupOptions(), catKind: "free",
            newLabel: "New place\u2026", newPlaceholder: "e.g. Bank of Cyprus", value: a.group || "" },
          { key: "type", label: "Type", type: "select", options: typeOptions(a.type), catKind: "free",
            newLabel: "New type\u2026", newPlaceholder: "e.g. Joint, Pension", value: a.type },
          { key: "opening", label: "Opening balance", type: "number", value: a.opening }
        ].concat(currencyField(a.currency)),
        validate: function (v) { if (!v.name.trim()) return "Give the account a name."; },
        onConfirm: function (v) {
          a.name = v.name.trim(); a.type = v.type; a.opening = v.opening;
          a.group = (v.group || "").trim() || null;   // was dropped on every edit
          var wasCur = a.currency || baseCode(), nowCur = v.currency || baseCode();
          a.currency = nowCur;
          if (nowCur !== wasCur || !(num(a.rate) > 0)) a.rate = rateFor(nowCur);
          save(); render(); toast("Account updated.");
        }
      });
    },

    // Closing is what you want when an account is finished but the money that
    // ran through it is not: you stopped using the card, moved banks, emptied
    // the wallet. Delete throws the history away; this keeps all of it and
    // just gets the account out of your way.
    "account-close": function (id) {
      var a = accountById(id);
      if (!a) return;
      var bal = balanceOf(a);
      var held = Math.abs(bal) > 0.005;
      var kept = state.transactions.filter(function (t) {
        return t.accountId === id || t.toAccountId === id;
      }).length;
      var recur = state.recurring.filter(function (r) { return r.accountId === id; }).length;
      // moving to a pocket is fine; moving to another spot in the same account
      // is not, so the whole account is filtered out rather than just its row
      var elsewhere = accountOptions().filter(function (o) {
        // a group holds the account and its pockets, so it is judged by what
