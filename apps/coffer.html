      "</div>";

    /* donut + cashflow */
    var byCat = spendByCategory(viewMonth);
    var donut = donutChart(byCat, cur.expense);
    html += '<div class="cols-2" style="margin-top:1rem">' +
      '<div class="card"><div class="card-head"><h3>Where it went</h3><span class="sub">' + monthName(viewMonth, true) + "</span></div>" +
      '<div class="card-body">' + (donut || '<p class="empty">No spending logged for ' + monthName(viewMonth, true) + " yet.</p>") + "</div></div>" +
      '<div class="card"><div class="card-head"><h3>In and out</h3><span class="sub">last 6 months</span></div>' +
      '<div class="card-body">' + cashflowChart(dataWindow(6, viewMonth).map(function (mk) { return monthSummary(mk); })) + "</div></div>" +
      "</div>";

    /* insights */
    var notes = buildInsights(viewMonth);
    html += '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>What stands out</h3>' +
      '<button class="btn sm quiet" data-act="go-insights">All insights →</button></div>' +
      '<div class="card-body flush">' + notesHtml(notes.slice(0, 5), "Log a few transactions and observations will appear here.") + "</div></div>";

    /* accounts + bills */
    html += '<div class="cols-2" style="margin-top:1rem">' + accountsCard() + billsCard() + "</div>";

    return html;
  }

  function accountsCard() {
    var rows = state.accounts.length
      ? '<div class="rows">' + state.accounts.map(function (a) {
          var bal = balanceOf(a);
          return '<div class="row"><div class="row-main">' +
            '<div class="row-title">' + esc(a.name) + "</div>" +
            '<div class="row-sub">' + esc(a.type) + "</div></div>" +
            '<div class="row-end"><span class="row-fig' + (bal < 0 ? " loss" : "") + '">' + fmt(bal) + "</span>" +
            '<button class="ibtn" data-act="account-edit" data-id="' + a.id + '" aria-label="Edit ' + esc(a.name) + '" title="Edit">✎</button>' +
            '<button class="ibtn danger" data-act="account-del" data-id="' + a.id + '" aria-label="Delete ' + esc(a.name) + '" title="Delete">✕</button>' +
            "</div></div>";
        }).join("") + "</div>"
      : '<p class="empty">No accounts yet.</p>';

    return '<div class="card"><div class="card-head"><h3>Accounts</h3>' +
      '<div class="btn-row"><button class="btn sm" data-act="transfer-add">Transfer</button>' +
      '<button class="btn sm primary" data-act="account-add">Add</button></div></div>' +
      '<div class="card-body flush">' + rows + "</div></div>";
  }

  function billsCard() {
    var up = upcomingBills(14);
    var load = recurringMonthlyLoad();
    var body = up.length
      ? '<div class="rows">' + up.map(function (r) {
          var d = daysUntil(r.nextDate);
          var tone = d < 0 ? "bad" : d <= 3 ? "warn" : "mute";
          var when = d < 0 ? Math.abs(d) + "d overdue" : d === 0 ? "today" : "in " + d + "d";
          return '<div class="row"><div class="row-main">' +
            '<div class="row-title">' + esc(r.name) + "</div>" +
            '<div class="row-sub">' + esc(r.category) + " · " + esc(r.frequency) + " · " + esc(accountName(r.accountId)) + "</div></div>" +
            '<div class="row-end"><span class="row-fig ' + (r.type === "income" ? "gain" : "") + '">' +
            (r.type === "income" ? "+" : "−") + fmt(r.amount).replace("-", "") + "</span>" +
            '<span class="pill ' + tone + '">' + when + "</span>" +
            '<button class="btn sm" data-act="recur-pay" data-id="' + r.id + '">Log</button>' +
            "</div></div>";
        }).join("") + "</div>"
      : '<p class="empty">Nothing due in the next two weeks.' +
        (state.recurring.length ? "" : " <strong>Add your rent, subscriptions and bills</strong> to see them tracked here.") + "</p>";

    return '<div class="card"><div class="card-head"><h3>Due soon</h3>' +
      '<span class="sub">' + (load.expense > 0 ? fmt(load.expense, { round: true }) + "/mo committed" : "next 14 days") + "</span></div>" +
      '<div class="card-body flush">' + body + "</div></div>";
  }

  /* ============================================================
     LEDGER
     ============================================================ */

  function filteredTx() {
    return state.transactions.filter(function (t) {
      if (filters.type !== "all" && t.type !== filters.type) return false;
      if (filters.category !== "all" && t.category !== filters.category) return false;
      if (filters.account !== "all" && t.accountId !== filters.account && t.toAccountId !== filters.account) return false;
      if (filters.from && t.date < filters.from) return false;
      if (filters.to && t.date > filters.to) return false;
      if (filters.text) {
        var q = filters.text.toLowerCase();
        if ((t.desc || "").toLowerCase().indexOf(q) === -1 &&
            (t.category || "").toLowerCase().indexOf(q) === -1) return false;
      }
      return true;
    }).sort(function (a, b) { return b.date.localeCompare(a.date) || b.id.localeCompare(a.id); });
  }

  // Summary line and table are separate so the search box can refresh just
  // the rows without rebuilding (and re-parsing) the whole screen.
  function ledgerSummaryHtml(rows) {
    var shownIn = rows.reduce(function (s, t) { return t.type === "income" ? s + num(t.amount) : s; }, 0);
    var shownOut = rows.reduce(function (s, t) { return t.type === "expense" ? s + num(t.amount) : s; }, 0);
    return "In " + fmt(shownIn, { round: true }) +
      " · Out " + fmt(shownOut, { round: true }) +
      " · Net " + fmt(shownIn - shownOut, { round: true, signed: true }) +
      " · " + rows.length + " of " + state.transactions.length + " shown";
  }

  function ledgerTableHtml() {
    var rows = filteredTx();
    var page = rows.slice(0, ledgerLimit);

    var html = '<div class="tscroll"><table>' +
      "<thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Account</th>" +
      '<th class="num">Amount</th><th></th></tr></thead><tbody>';

    if (!rows.length) {
      html += '<tr><td colspan="6"><p class="empty">' +
        (state.transactions.length ? "Nothing matches these filters." : "No transactions yet — add your first one above.") +
        "</p></td></tr>";
    } else {
      html += page.map(function (t) {
        var isTransfer = t.type === "transfer";
        var acc = isTransfer
          ? esc(accountName(t.accountId)) + " → " + esc(accountName(t.toAccountId))
          : esc(accountName(t.accountId));
        var amt = isTransfer ? fmt(t.amount) : (t.type === "income" ? "+" : "−") + fmt(t.amount).replace("-", "");
        return '<tr><td style="white-space:nowrap;font-variant-numeric:tabular-nums">' + esc(t.date) + "</td>" +
          "<td>" + esc(t.desc || "—") + "</td>" +
          "<td>" + (isTransfer
            ? '<span class="pill mute">Transfer</span>'
            : '<span class="cat-tag"><span class="cat-dot" style="background:' + catColor(t.category) + '"></span>' + esc(t.category) + "</span>") + "</td>" +
          "<td>" + acc + "</td>" +
          '<td class="num' + (t.type === "income" ? " gain" : "") + '">' + amt + "</td>" +
          '<td><span style="display:flex;gap:0.1rem;justify-content:flex-end">' +
          '<button class="ibtn" data-act="tx-edit" data-id="' + t.id + '" aria-label="Edit transaction" title="Edit">✎</button>' +
          '<button class="ibtn danger" data-act="tx-del" data-id="' + t.id + '" aria-label="Delete transaction" title="Delete">✕</button>' +
          "</span></td></tr>";
      }).join("");
    }
    html += "</tbody></table></div>";

    if (rows.length > page.length) {
      var more = Math.min(LEDGER_PAGE, rows.length - page.length);
      html += '<div class="btn-row" style="margin-top:0.85rem;justify-content:center">' +
        '<button class="btn sm" data-act="ledger-more">Show ' + more + " more</button>" +
        '<span class="hint" style="align-self:center">' + page.length + " of " + rows.length + "</span></div>";
    }
    return html;
  }

  function renderLedger() {
    var rows = filteredTx();
    var allCats = state.categories.expense.concat(state.categories.income);

    var html = pageHead("Ledger", "Every deposit, expense and transfer.",
      '<div class="btn-row">' +
      '<button class="btn" data-act="transfer-add">Transfer</button>' +
      '<button class="btn primary" data-act="tx-add">Add transaction</button></div>');

    if (!state.accounts.length) {
      return html + '<div class="card"><div class="card-body"><p class="empty">' +
        "You need an account before you can log anything. " +
        "<strong>Add one from the Overview screen.</strong></p>" +
        '<button class="btn primary" data-act="account-add">Add an account</button></div></div>';
    }

    html += quickAddCard() + '<div style="height:1rem"></div>';

    /* filters */
    html += '<div class="card"><div class="card-body"><div class="fields">' +
      '<div class="field wide"><label class="label" for="f_text">Search</label>' +
      '<input id="f_text" type="text" value="' + esc(filters.text) + '" placeholder="Description or category…" autocomplete="off" /></div>' +
      '<div class="field"><label class="label" for="f_type">Type</label><select id="f_type">' +
      ["all", "expense", "income", "transfer"].map(function (v) {
        return '<option value="' + v + '"' + (filters.type === v ? " selected" : "") + ">" +
          (v === "all" ? "All types" : v.charAt(0).toUpperCase() + v.slice(1)) + "</option>";
      }).join("") + "</select></div>" +
      '<div class="field"><label class="label" for="f_cat">Category</label><select id="f_cat">' +
      '<option value="all">All categories</option>' + allCats.map(function (c) {
        return '<option value="' + esc(c) + '"' + (filters.category === c ? " selected" : "") + ">" + esc(c) + "</option>";
      }).join("") + "</select></div>" +
      '<div class="field"><label class="label" for="f_acc">Account</label><select id="f_acc">' +
      '<option value="all">All accounts</option>' + state.accounts.map(function (a) {
        return '<option value="' + a.id + '"' + (filters.account === a.id ? " selected" : "") + ">" + esc(a.name) + "</option>";
      }).join("") + "</select></div>" +
      '<div class="field"><label class="label" for="f_from">From</label><input id="f_from" type="date" value="' + esc(filters.from) + '" /></div>' +
      '<div class="field"><label class="label" for="f_to">To</label><input id="f_to" type="date" value="' + esc(filters.to) + '" /></div>' +
      "</div>" +
      '<div class="btn-row" style="margin-top:0.85rem;align-items:center">' +
      '<button class="btn sm quiet" data-act="filter-clear">Clear filters</button>' +
      '<button class="btn sm" data-act="export-csv">Export CSV</button>' +
      '<span class="hint" style="margin-left:auto" id="txSummary">' + ledgerSummaryHtml(rows) + "</span>" +
      "</div></div></div>";

    /* table — id lets the search box refresh only this block */
    html += '<div class="card" style="margin-top:1rem"><div class="card-body flush" id="txTable">' +
      ledgerTableHtml() + "</div></div>";

    return html;
  }

  /* ============================================================
     BUDGETS (+ recurring commitments)
     ============================================================ */

  function renderBudgets() {
    var rows = budgetRows(viewMonth);
    var progress = monthProgress(viewMonth);
    var totalLimit = rows.reduce(function (s, b) { return s + b.limit; }, 0);
    var totalSpent = rows.reduce(function (s, b) { return s + b.spent; }, 0);
    var cur = monthSummary(viewMonth);
    var unbudgeted = cur.expense - totalSpent;

    var html = pageHead("Budgets", "Monthly limits per category. The marker on each bar shows how far through the month you are — " +
      "a bar past its marker is running hot.", monthStepper());

    html += '<div class="tiles" style="grid-template-columns:repeat(3,minmax(0,1fr))">' +
      '<div class="tile"><span class="label">Budgeted</span><div class="tile-fig">' + fmt(totalLimit, { round: true }) + "</div>" +
      '<div class="tile-foot">' + rows.length + (rows.length === 1 ? " category" : " categories") + "</div></div>" +
      '<div class="tile"><span class="label">Spent against it</span><div class="tile-fig">' + fmt(totalSpent, { round: true }) + "</div>" +
      '<div class="tile-foot">' + (totalLimit > 0 ? Math.round(totalSpent / totalLimit * 100) + "% of budget · " : "") +
      Math.round(progress * 100) + "% through the month</div></div>" +
      '<div class="tile"><span class="label">Outside any budget</span><div class="tile-fig">' + fmt(unbudgeted, { round: true }) + "</div>" +
      '<div class="tile-foot">' + (unbudgeted > 0.005 ? "spending in uncapped categories" : "everything is covered") + "</div></div>" +
      "</div>";

    html += '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>Category limits</h3>' +
      '<span class="sub">limits carry over every month</span>' +
      '<button class="btn sm primary" data-act="budget-set">Set a budget</button></div><div class="card-body flush">';

    if (!rows.length) {
      html += '<p class="empty">No budgets yet. <strong>Pick a category and a monthly limit</strong> — Coffer tracks it against ' +
        "what you actually log, and warns you when you're on pace to pass it.</p>";
    } else {
      html += '<div class="rows">' + rows.map(function (b) {
        var over = b.pct >= 1;
        var hot = !over && progress > 0.15 && (b.spent / progress) > b.limit;
        var color = over ? "var(--loss)" : hot ? "var(--warn)" : "var(--gain)";
        var pill = over ? '<span class="pill bad">over by ' + fmt(-b.left, { round: true }) + "</span>"
          : hot ? '<span class="pill warn">on pace to pass</span>'
          : '<span class="pill ok">' + fmt(b.left, { round: true }) + " left</span>";
        return '<div class="row" style="align-items:stretch;flex-direction:column;gap:0.45rem">' +
          '<div style="display:flex;align-items:center;gap:0.6rem">' +
          '<span class="cat-dot" style="background:' + catColor(b.category) + '"></span>' +
          '<span class="row-title" style="flex:1">' + esc(b.category) + "</span>" +
          '<span class="row-fig">' + fmt(b.spent, { round: true }) + ' <span style="color:var(--faint);font-weight:400">/ ' +
          fmt(b.limit, { round: true }) + "</span></span>" +
          '<button class="ibtn" data-act="budget-edit" data-cat="' + esc(b.category) + '" aria-label="Edit budget" title="Edit">✎</button>' +
          '<button class="ibtn danger" data-act="budget-del" data-cat="' + esc(b.category) + '" aria-label="Remove budget" title="Remove">✕</button>' +
          "</div>" +
          meter(b.pct, color, progress) +
          '<div style="display:flex;justify-content:space-between;align-items:center">' +
          '<span class="hint">' + Math.round(b.pct * 100) + "% used</span>" + pill + "</div>" +
          "</div>";
      }).join("") + "</div>";
    }
    html += "</div></div>";

    /* recurring */
    var load = recurringMonthlyLoad();
    html += '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>Recurring commitments</h3>' +
      '<div class="btn-row">' +
      (load.expense > 0 ? '<span class="pill mute">' + fmt(load.expense, { round: true }) + "/mo out</span>" : "") +
      (load.income > 0 ? '<span class="pill ok">' + fmt(load.income, { round: true }) + "/mo in</span>" : "") +
      '<button class="btn sm primary" data-act="recur-add">Add</button></div></div><div class="card-body flush">';

    if (!state.recurring.length) {
      html += '<p class="empty">Nothing scheduled. <strong>Add rent, subscriptions, salary</strong> — anything on a repeating ' +
        "cycle. Coffer counts the monthly cost, warns you before each is due, and logs it to the ledger when you mark it paid.</p>";
    } else {
      html += '<div class="rows">' + state.recurring.slice().sort(function (a, b) {
        return a.nextDate.localeCompare(b.nextDate);
      }).map(function (r) {
        var d = daysUntil(r.nextDate);
        var tone = d < 0 ? "bad" : d <= 3 ? "warn" : "mute";
        var when = d < 0 ? Math.abs(d) + "d overdue" : d === 0 ? "due today" : "in " + d + "d";
        var permo = monthlyEquivalent(num(r.amount), r.frequency);
        return '<div class="row"><div class="row-main">' +
          '<div class="row-title">' + esc(r.name) + "</div>" +
          '<div class="row-sub">' + esc(r.category) + " · " + esc(r.frequency) +
          (r.frequency !== "monthly" ? " (" + fmt(permo, { round: true }) + "/mo)" : "") +
          " · " + esc(accountName(r.accountId)) + " · next " + esc(r.nextDate) + "</div></div>" +
          '<div class="row-end"><span class="row-fig ' + (r.type === "income" ? "gain" : "") + '">' +
          (r.type === "income" ? "+" : "−") + fmt(r.amount).replace("-", "") + "</span>" +
          '<span class="pill ' + tone + '">' + when + "</span>" +
          '<button class="btn sm" data-act="recur-pay" data-id="' + r.id + '">Log</button>' +
          '<button class="ibtn" data-act="recur-edit" data-id="' + r.id + '" aria-label="Edit" title="Edit">✎</button>' +
          '<button class="ibtn danger" data-act="recur-del" data-id="' + r.id + '" aria-label="Delete" title="Delete">✕</button>' +
          "</div></div>";
      }).join("") + "</div>";
    }
    html += "</div></div>";
    return html;
  }

  /* ============================================================
     GOALS
     ============================================================ */

  function renderGoals() {
    var pace = avgMonthlySaving(3);
    var html = pageHead("Goals", "What you're saving toward, and whether your current pace gets you there.",
      '<button class="btn primary" data-act="goal-add">Add a goal</button>');

    if (!state.goals.length) {
      return html + '<div class="card"><div class="card-body"><p class="empty">' +
        "No goals yet. <strong>Name something you're saving for</strong> — an emergency fund, a deposit, a trip — with a target " +
        "amount and optionally a date. Coffer works out the monthly figure you need and compares it to what you're actually " +
        "putting aside.</p><button class=\"btn primary\" data-act=\"goal-add\">Add a goal</button></div></div>";
    }

    html += '<div class="stack">';
    state.goals.forEach(function (g) {
      var target = num(g.target), saved = num(g.saved);
      var pct = target > 0 ? saved / target : 0;
      var left = Math.max(target - saved, 0);
      var done = left <= 0.005;

      var needLine, tone = "mute";
      if (done) { needLine = "Funded in full."; tone = "ok"; }
      else if (g.due) {
        var dLeft = daysUntil(g.due);
        var monthsLeft = Math.max(dLeft / 30.44, 0);
        if (dLeft < 0) { needLine = "Target date has passed — " + fmt(left, { round: true }) + " still to go."; tone = "bad"; }
        else {
          var need = left / Math.max(monthsLeft, 0.5);
          var ok = pace >= need;
          needLine = "Needs <b>" + fmt(need, { round: true }) + "/mo</b> to land by " + esc(g.due) +
            (pace > 0
              ? ok ? " — your recent pace of " + fmt(pace, { round: true }) + "/mo covers it."
                   : " — you're currently keeping " + fmt(pace, { round: true }) + "/mo, so this is short by " +
                     fmt(need - pace, { round: true }) + "/mo."
              : ".");
          tone = pace > 0 ? (ok ? "ok" : "warn") : "mute";
        }
      } else if (pace > 0) {
        needLine = "At your recent pace of " + fmt(pace, { round: true }) + "/mo you'd get there in about <b>" +
          humanMonths(Math.ceil(left / pace)) + "</b>.";
      } else {
        needLine = fmt(left, { round: true }) + " still to go. Add a target date to see the monthly figure you need.";
      }

      html += '<div class="card"><div class="card-body">' +
        '<div style="display:flex;align-items:baseline;gap:0.6rem;flex-wrap:wrap">' +
        '<h3 style="font-size:1.05rem;flex:1">' + esc(g.name) + "</h3>" +
        (done ? '<span class="pill ok">reached</span>' : "") +
        '<button class="ibtn" data-act="goal-edit" data-id="' + g.id + '" aria-label="Edit goal" title="Edit">✎</button>' +
        '<button class="ibtn danger" data-act="goal-del" data-id="' + g.id + '" aria-label="Delete goal" title="Delete">✕</button>' +
        "</div>" +
        '<div style="display:flex;align-items:baseline;gap:0.5rem;margin:0.55rem 0 0.5rem">' +
        '<span class="fig" style="font-size:1.5rem;font-weight:650;font-family:var(--serif)">' + fmt(saved) + "</span>" +
        '<span style="color:var(--faint);font-size:0.85rem">of ' + fmt(target) + "</span>" +
        '<span style="margin-left:auto;font-weight:650;font-variant-numeric:tabular-nums">' + Math.round(pct * 100) + "%</span></div>" +
        meter(pct, done ? "var(--gain)" : "var(--c3)") +
        '<p style="font-size:0.85rem;color:var(--dim);line-height:1.55;margin:0.7rem 0 0">' + needLine + "</p>" +
        '<div class="btn-row" style="margin-top:0.85rem">' +
        '<button class="btn sm primary" data-act="goal-fund" data-id="' + g.id + '">Add funds</button>' +
        (saved > 0 ? '<button class="btn sm" data-act="goal-withdraw" data-id="' + g.id + '">Take out</button>' : "") +
        "</div></div></div>";
    });
    html += "</div>";
    return html;
  }

  /* ============================================================
     DEBTS
     ============================================================ */

  function renderDebts() {
    var html = pageHead("Debts", "What you owe, and the cheapest order to clear it.",
      '<button class="btn primary" data-act="debt-add">Add a debt</button>');

    if (!state.debts.length) {
      return html + '<div class="card"><div class="card-body"><p class="empty">' +
        "Nothing tracked here — <strong>skip this screen if you're debt-free</strong>. Otherwise add each balance with its APR " +
        "and minimum payment, and Coffer will compare payoff strategies and show what the interest is really costing you." +
        '</p><button class="btn primary" data-act="debt-add">Add a debt</button></div></div>';
    }

    var total = totalDebt();
    var monthlyInterest = state.debts.reduce(function (s, d) { return s + num(d.balance) * num(d.rate) / 100 / 12; }, 0);
    var minTotal = state.debts.reduce(function (s, d) { return s + num(d.minPayment); }, 0);
    var extra = num(state.extraDebtPayment);

    var base = simulatePayoff("minimum", 0);
    var avalanche = simulatePayoff("avalanche", extra);
    var snowball = simulatePayoff("snowball", extra);
    var chosen = debtStrategy === "snowball" ? snowball : debtStrategy === "minimum" ? base : avalanche;

    html += '<div class="tiles" style="grid-template-columns:repeat(3,minmax(0,1fr))">' +
      '<div class="tile"><span class="label">Total owed</span><div class="tile-fig" style="color:var(--loss)">' + fmt(total) + "</div>" +
      '<div class="tile-foot">' + state.debts.length + (state.debts.length === 1 ? " balance" : " balances") + "</div></div>" +
      '<div class="tile"><span class="label">Interest per month</span><div class="tile-fig">' + fmt(monthlyInterest) + "</div>" +
      '<div class="tile-foot">before any principal comes off</div></div>' +
      '<div class="tile"><span class="label">Minimums</span><div class="tile-fig">' + fmt(minTotal) + "</div>" +
      '<div class="tile-foot">' + (extra > 0 ? "plus " + fmt(extra, { round: true }) + " extra = " + fmt(minTotal + extra, { round: true }) + "/mo" : "per month") + "</div></div>" +
      "</div>";

    /* strategy comparison */
    html += '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>Payoff strategy</h3>' +
      '<button class="btn sm" data-act="debt-extra">Extra payment: ' + fmt(extra, { round: true }) + "/mo</button></div>" +
      '<div class="card-body">';

    if (base.stalled && avalanche.stalled) {
      html += '<p class="empty" style="color:var(--loss)">The minimum payments you\'ve entered don\'t cover the interest, so these ' +
        "balances would grow forever. Raise a minimum payment, or add an extra monthly amount, to see a real payoff date.</p>";
    } else {
      html += '<div class="seg" style="max-width:420px;margin-bottom:1rem">' +
        [["avalanche", "Avalanche"], ["snowball", "Snowball"], ["minimum", "Minimums only"]].map(function (s) {
          return '<button data-act="debt-strategy" data-v="' + s[0] + '" aria-pressed="' + (debtStrategy === s[0]) + '">' + s[1] + "</button>";
        }).join("") + "</div>";

      var saved = (base.interest != null && chosen.interest != null) ? base.interest - chosen.interest : null;
      var faster = (base.months != null && chosen.months != null) ? base.months - chosen.months : null;

      html += '<div class="tiles" style="grid-template-columns:repeat(3,minmax(0,1fr));gap:0.7rem">' +
        '<div class="tile" style="box-shadow:none"><span class="label">Debt-free in</span>' +
        '<div class="tile-fig">' + humanMonths(chosen.months) + "</div></div>" +
        '<div class="tile" style="box-shadow:none"><span class="label">Total interest</span>' +
        '<div class="tile-fig">' + (chosen.interest == null ? "—" : fmt(chosen.interest)) + "</div></div>" +
        '<div class="tile" style="box-shadow:none"><span class="label">Versus minimums only</span>' +
        '<div class="tile-fig" style="color:' + (saved > 0.5 ? "var(--gain)" : "inherit") + '">' +
        (saved == null ? "—" : saved > 0.5 ? fmt(saved) + " saved" : "no change") + "</div>" +
        '<div class="tile-foot">' + (faster > 0 ? humanMonths(faster) + " sooner" : "same timeline") + "</div></div>" +
        "</div>";

      if (debtStrategy !== "minimum" && chosen.priority.length > 1) {
        html += '<p class="hint" style="margin-top:0.9rem">Pay every minimum, then send anything spare here first: ' +
          '<b style="color:var(--ink)">' + chosen.priority.map(function (n) { return esc(n); }).join(" → ") + "</b>" +
          (chosen.order.length > 1 && chosen.order.join("|") !== chosen.priority.join("|")
            ? '<br /><span style="color:var(--faint)">They\'ll actually clear in the order ' +
              chosen.order.map(function (n) { return esc(n); }).join(" → ") +
              ", since a small balance can finish on its minimum alone.</span>"
            : "") + "</p>";
      }
      html += '<p class="hint" style="margin-top:0.6rem">' +
        (debtStrategy === "avalanche"
          ? "Avalanche targets the highest interest rate first — mathematically the cheapest route."
          : debtStrategy === "snowball"
          ? "Snowball clears the smallest balance first — costs a little more, but each win arrives sooner, which is easier to stick to."
          : "Paying only the minimums, with no freed-up payment reallocated. This is the baseline the other two are measured against.") +
        "</p>";
    }
    html += "</div></div>";

    /* balances */
    var sorted = state.debts.slice().sort(function (a, b) { return num(b.rate) - num(a.rate); });
    html += '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>Balances</h3>' +
      '<span class="sub">highest rate first</span></div><div class="card-body flush"><div class="rows">' +
      sorted.map(function (d) {
        var mi = num(d.balance) * num(d.rate) / 100 / 12;
        var covers = num(d.minPayment) > mi;
        return '<div class="row"><div class="row-main">' +
          '<div class="row-title">' + esc(d.name) + "</div>" +
          '<div class="row-sub">' + num(d.rate).toFixed(2) + "% APR · min " + fmt(d.minPayment, { round: true }) +
          "/mo · " + fmt(mi) + " interest this month" + (covers ? "" : " — minimum doesn't cover it") + "</div></div>" +
          '<div class="row-end"><span class="row-fig loss">' + fmt(d.balance) + "</span>" +
          (covers ? "" : '<span class="pill bad">growing</span>') +
          '<button class="btn sm" data-act="debt-pay" data-id="' + d.id + '">Log payment</button>' +
          '<button class="ibtn" data-act="debt-edit" data-id="' + d.id + '" aria-label="Edit" title="Edit">✎</button>' +
          '<button class="ibtn danger" data-act="debt-del" data-id="' + d.id + '" aria-label="Delete" title="Delete">✕</button>' +
          "</div></div>";
      }).join("") + "</div></div></div>";

    return html;
  }

  /* ============================================================
     INSIGHTS
     ============================================================ */

  function renderInsights() {
    var html = pageHead("Insights", "Patterns across your whole ledger, not just this month.", monthStepper());

    if (state.transactions.length < 2) {
      return html + '<div class="card"><div class="card-body"><p class="empty">' +
        "Not much to read yet. <strong>Log a few weeks of transactions</strong> and this screen will show trends, " +
        "category movement, and how long your balances would last.</p></div></div>";
    }

    var months = monthsWithData();
    var burn = avgMonthlyExpense(3);
    var pace = avgMonthlySaving(3);
    var runway = burn > 0 ? totalAssets() / burn : null;

    html += '<div class="tiles">' +
      '<div class="tile"><span class="label">Typical month out</span><div class="tile-fig">' + fmt(burn, { round: true }) + "</div>" +
      '<div class="tile-foot">3-month average</div></div>' +
      '<div class="tile"><span class="label">Typical month kept</span><div class="tile-fig" style="color:' +
      (pace >= 0 ? "var(--gain)" : "var(--loss)") + '">' + fmt(pace, { round: true, signed: true }) + "</div>" +
      '<div class="tile-foot">3-month average</div></div>' +
      '<div class="tile"><span class="label">Runway</span><div class="tile-fig">' +
      (runway == null ? "—" : runway.toFixed(1) + " mo") + "</div>" +
      '<div class="tile-foot">balances ÷ typical spending</div></div>' +
      '<div class="tile"><span class="label">Months on record</span><div class="tile-fig">' + months.length + "</div>" +
      '<div class="tile-foot">' + state.transactions.length + " transactions</div></div>" +
      "</div>";

    html += '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>Everything worth noting</h3>' +
      '<span class="sub">' + monthName(viewMonth, true) + "</span></div>" +
      '<div class="card-body flush">' + notesHtml(buildInsights(viewMonth), "Nothing stands out this month.") + "</div></div>";

    /* savings rate trend */
    var ratePts = dataWindow(12, viewMonth).map(function (mk) {
      var s = monthSummary(mk);
      var v = s.rate == null ? 0 : clamp(s.rate * 100, -100, 100);
      return { label: monthName(mk), value: v, tip: monthName(mk, true) + "\n" + (s.rate == null ? "no income" : Math.round(v) + "% kept") };
    });

    html += '<div class="cols-2" style="margin-top:1rem">' +
      '<div class="card"><div class="card-head"><h3>Savings rate</h3><span class="sub">share of income kept, 12 months</span></div>' +
      '<div class="card-body">' + areaChart(ratePts, { cssHeight: 120, height: 40, color: "var(--c4)", aria: "Savings rate over 12 months" }) +
      axisRow([ratePts[0], ratePts[ratePts.length - 1]]) + "</div></div>" +
      '<div class="card"><div class="card-head"><h3>In and out</h3><span class="sub">12 months</span></div>' +
      '<div class="card-body">' + cashflowChart(dataWindow(12, viewMonth).map(function (mk) { return monthSummary(mk); })) + "</div></div>" +
      "</div>";

    /* category league table */
    var totals = {}, monthsCounted = {};
    state.transactions.forEach(function (t) {
      if (t.type !== "expense") return;
      totals[t.category] = (totals[t.category] || 0) + num(t.amount);
      monthsCounted[t.category] = monthsCounted[t.category] || {};
      monthsCounted[t.category][monthOf(t.date)] = true;
    });
    var league = Object.keys(totals).map(function (c) {
      var n = Object.keys(monthsCounted[c]).length;
      return { cat: c, total: totals[c], perMonth: totals[c] / Math.max(n, 1), months: n };
    }).sort(function (a, b) { return b.total - a.total; });
    var grand = league.reduce(function (s, r) { return s + r.total; }, 0);

    var thisM = spendByCategory(viewMonth);
    var lastM = spendByCategory(monthShift(viewMonth, -1));

    html += '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>Categories, all time</h3>' +
      '<span class="sub">' + fmt(grand, { round: true }) + " total</span></div>" +
      '<div class="card-body flush"><div class="tscroll"><table>' +
      '<thead><tr><th>Category</th><th class="num">All time</th><th class="num">Share</th>' +
      '<th class="num">Per month</th><th class="num">' + monthName(viewMonth) + '</th><th class="num">vs prev</th></tr></thead><tbody>' +
      league.map(function (r) {
        var cm = thisM[r.cat] || 0, pm = lastM[r.cat] || 0;
        return "<tr><td><span class=\"cat-tag\"><span class=\"cat-dot\" style=\"background:" + catColor(r.cat) + '"></span>' + esc(r.cat) + "</span></td>" +
          '<td class="num">' + fmt(r.total, { round: true }) + "</td>" +
          '<td class="num" style="color:var(--dim)">' + Math.round(r.total / grand * 100) + "%</td>" +
          '<td class="num" style="color:var(--dim)">' + fmt(r.perMonth, { round: true }) + "</td>" +
          '<td class="num">' + fmt(cm, { round: true }) + "</td>" +
          '<td class="num">' + (pm > 0 || cm > 0 ? deltaBadge(cm, pm, { lowerIsBetter: true, asMoney: true }) : "—") + "</td></tr>";
      }).join("") + "</tbody></table></div></div></div>";

    /* biggest single expenses */
    var biggest = state.transactions.filter(function (t) { return t.type === "expense"; })
      .sort(function (a, b) { return b.amount - a.amount; }).slice(0, 8);
    if (biggest.length) {
      html += '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>Largest expenses on record</h3></div>' +
        '<div class="card-body flush"><div class="rows">' + biggest.map(function (t) {
          return '<div class="row"><div class="row-main"><div class="row-title">' + esc(t.desc || t.category) + "</div>" +
            '<div class="row-sub">' + esc(t.date) + " · " + esc(t.category) + " · " + esc(accountName(t.accountId)) + "</div></div>" +
            '<span class="row-fig">' + fmt(t.amount) + "</span></div>";
        }).join("") + "</div></div></div>";
    }

    return html;
  }

  /* ============================================================
     SETTINGS
     ============================================================ */

  function bytesUsed() {
    try { return new Blob([localStorage.getItem(KEY) || ""]).size; } catch (e) { return 0; }
  }

  function renderSettings() {
    var html = pageHead("Settings", "Your data, your device.");

    html += '<div class="privacy"><span class="g">🔒</span><div>' +
      "<b>Nothing leaves this device.</b> Coffer has no server and makes no network requests — every figure lives in this " +
      "browser's local storage, on this computer or phone only. Open the file elsewhere and it starts empty there, so " +
      "<b>export a backup whenever the numbers matter</b>. The backup is plain readable JSON: keep it somewhere you'd be " +
      "comfortable keeping a bank statement." +
      "</div></div>";

    /* backup */
    html += '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>Backup and restore</h3>' +
      '<span class="sub">' + (bytesUsed() / 1024).toFixed(1) + " KB stored</span></div><div class=\"card-body\">" +
      '<div class="btn-row">' +
      '<button class="btn primary" data-act="export-json">Export backup (.json)</button>' +
      '<button class="btn" data-act="export-csv">Export transactions (.csv)</button>' +
      '<button class="btn" data-act="import-json">Import a backup</button>' +
      "</div><p class=\"hint\" style=\"margin-top:0.75rem\">Importing replaces everything currently in this browser. " +
      "You'll be asked to confirm first.</p></div></div>";

    /* currency */
    html += '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>Currency</h3></div><div class="card-body">' +
      '<div class="fields" style="max-width:340px"><div class="field"><label class="label" for="cur_sel">Symbol</label>' +
      '<select id="cur_sel">' + ["$", "€", "£", "¥", "₹", "₩", "₪", "₺", "R$", "kr", "CHF", "A$", "C$"].map(function (c) {
        return '<option value="' + esc(c) + '"' + (c === state.settings.currency ? " selected" : "") + ">" + esc(c) + "</option>";
      }).join("") + "</select></div></div>" +
      '<p class="hint" style="margin-top:0.6rem">Amounts are formatted with your device\'s number conventions.</p></div></div>';

    /* categories */
    html += '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>Categories</h3>' +
      '<div class="btn-row"><button class="btn sm" data-act="cat-add" data-kind="expense">Add expense</button>' +
      '<button class="btn sm" data-act="cat-add" data-kind="income">Add income</button></div></div><div class="card-body">' +
      '<span class="label">Expenses</span><div class="chips" style="margin:0.45rem 0 1rem">' +
      state.categories.expense.map(function (c) {
        return '<span class="chip"><span class="cat-dot" style="background:' + catColor(c) + '"></span>' + esc(c) +
          '<button data-act="cat-del" data-kind="expense" data-cat="' + esc(c) + '" aria-label="Remove ' + esc(c) + '">✕</button></span>';
      }).join("") + "</div>" +
      '<span class="label">Income</span><div class="chips" style="margin:0.45rem 0 0">' +
      state.categories.income.map(function (c) {
        return '<span class="chip">' + esc(c) +
          '<button data-act="cat-del" data-kind="income" data-cat="' + esc(c) + '" aria-label="Remove ' + esc(c) + '">✕</button></span>';
      }).join("") + "</div>" +
      '<p class="hint" style="margin-top:0.8rem">Removing a category leaves past transactions untouched — they keep the ' +
      "name, it just stops being offered for new ones.</p></div></div>";

    /* lock */
    var locked = !!state.settings.lock;
    html += '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>Screen lock</h3>' +
      '<span class="sub">' + (locked ? "on" : "off") + "</span></div><div class=\"card-body\">" +
      '<p style="font-size:0.86rem;color:var(--dim);line-height:1.6;margin:0 0 0.9rem;max-width:60ch">' +
      "Ask for a PIN when Coffer opens. This keeps casual eyes off your figures — it is <b>not encryption</b>: the data " +
      "stays readable to anyone who can open this browser's storage directly, and a forgotten PIN can only be cleared by " +
      "erasing the data. Treat it like the lock screen on your phone, not a safe.</p>" +
      '<div class="btn-row">' +
      (locked
        ? '<button class="btn" data-act="lock-change">Change PIN</button><button class="btn danger" data-act="lock-off">Turn off</button>'
        : '<button class="btn primary" data-act="lock-on">Set a PIN</button>') +
      "</div></div></div>";

    /* danger */
    html += '<div class="card" style="margin-top:1rem"><div class="card-head"><h3>Erase everything</h3></div><div class="card-body">' +
      '<p style="font-size:0.86rem;color:var(--dim);line-height:1.6;margin:0 0 0.9rem;max-width:60ch">' +
      "Removes every account, transaction, budget, goal, debt and recurring item from this browser. There is no undo and " +
      "no copy anywhere else — export a backup first if there's any doubt.</p>" +
      '<button class="btn danger" data-act="wipe">Erase all local data</button></div></div>';

    return html;
  }

  /* ============================================================
     Quick entry — the plain-text box plus one-tap buttons.
     ============================================================ */

  var omni = { text: "", touched: {} };

  function omniPreviewHtml() {
    var p = parseEntry(omni.text);
    if (!p) {
      return '<p class="hint" style="margin:0.55rem 0 0">' +
        "Type an amount and what it was for. Date words work too — " +
        "<b>today</b>, <b>yesterday</b>, <b>friday</b>, <b>3 aug</b>, <b>2 days ago</b>. " +
        "Start with <b>+</b> for money coming in.</p>";
    }
    if (!p.ok) {
      return '<p class="hint" style="margin:0.55rem 0 0;color:var(--warn)">' + esc(p.reason) + "</p>";
    }

    var cat = omni.touched.category || p.category;
    var acc = omni.touched.accountId || p.accountId;
    var date = omni.touched.date || p.date;
    var cats = state.categories[p.type === "income" ? "income" : "expense"];
    if (cats.indexOf(cat) === -1) cat = p.category;

    return '<div id="omniPreview" style="margin-top:0.7rem;padding-top:0.7rem;border-top:1px solid var(--rule)">' +
      '<div style="display:flex;align-items:baseline;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.6rem">' +
      '<span class="pill ' + (p.type === "income" ? "ok" : "mute") + '">' + (p.type === "income" ? "money in" : "money out") + "</span>" +
      '<span style="font-size:1.25rem;font-weight:650;font-variant-numeric:tabular-nums">' +
      (p.type === "income" ? "+" : "−") + fmt(p.amount).replace("-", "") + "</span>" +
      '<span style="font-size:0.92rem">' + esc(p.desc) + "</span>" +
      (p.why && !omni.touched.category
        ? '<span class="hint" style="margin-left:auto">' + esc(p.why) + "</span>" : "") +
      "</div>" +
      '<div class="fields">' +
      '<div class="field"><label class="label" for="omni_cat">Category</label><select id="omni_cat">' +
      cats.map(function (c) {
        return '<option value="' + esc(c) + '"' + (c === cat ? " selected" : "") + ">" + esc(c) + "</option>";
      }).join("") + "</select></div>" +
      '<div class="field"><label class="label" for="omni_acc">Account</label><select id="omni_acc">' +
      state.accounts.map(function (a) {
        return '<option value="' + a.id + '"' + (a.id === acc ? " selected" : "") + ">" + esc(a.name) + "</option>";
      }).join("") + "</select></div>" +
      '<div class="field"><label class="label" for="omni_date">Date</label>' +
      '<input id="omni_date" type="date" value="' + esc(date) + '" /></div>' +
      "</div>" +
      '<div class="btn-row" style="margin-top:0.75rem">' +
      '<button class="btn primary" data-act="omni-commit">Add ' + fmt(p.amount).replace("-", "") + "</button>" +
      '<button class="btn quiet" data-act="omni-clear">Clear</button>' +
      "</div></div>";
  }

  function quickChipsHtml() {
    if (!state.quick.length) {
      return '<p class="hint" style="margin:0">No one-tap buttons yet. Good for anything you pay often at no fixed time — ' +
        "a taxi, a coffee, the corner shop.</p>";
    }
    return '<div class="chips">' + state.quick.map(function (q) {
      var amt = num(q.amount);
      return '<button class="chip quick" data-act="quick-log" data-id="' + q.id + '" ' +
        'title="' + esc(q.label + " · " + q.category + (amt > 0 ? " · " + fmt(amt) : " · asks for the amount")) + '">' +
        '<span class="cat-dot" style="background:' + catColor(q.category) + '"></span>' +
        "<b>" + esc(q.label) + "</b>" +
        '<span style="color:var(--faint);font-variant-numeric:tabular-nums">' +
        (amt > 0 ? fmt(amt, { round: true }) : "…") + "</span></button>";
    }).join("") + "</div>";
  }

  function quickAddCard() {
    if (!state.accounts.length) return "";
    return '<div class="card"><div class="card-head"><h3>Add something</h3>' +
      '<div class="btn-row"><button class="btn sm quiet" data-act="omni-bulk">Paste a list</button>' +
      '<button class="btn sm quiet" data-act="quick-manage">One-tap buttons</button></div></div>' +
      '<div class="card-body">' +
      '<input id="omniBox" type="text" value="' + esc(omni.text) + '" autocomplete="off" ' +
      'placeholder="10$ potato   ·   taxi 8 yesterday   ·   +2500 salary" ' +
      'style="font-size:1rem;padding:0.6rem 0.7rem" aria-label="Describe what you paid" />' +
      '<div id="omniZone">' + omniPreviewHtml() + "</div>" +
      '<div style="margin-top:0.9rem;padding-top:0.8rem;border-top:1px solid var(--rule)">' +
      '<span class="label" style="display:block;margin-bottom:0.5rem">One tap</span>' +
      quickChipsHtml() + "</div></div></div>";
  }

  // Refresh only the preview strip so typing never rebuilds the screen.
  function refreshOmni() {
    var zone = document.getElementById("omniZone");
    if (!zone) return;
    zone.innerHTML = omniPreviewHtml();
    wireOmniPreview();
  }

  function wireOmniPreview() {
    var c = document.getElementById("omni_cat");
    if (c) c.addEventListener("change", function () { omni.touched.category = c.value; });
    var a = document.getElementById("omni_acc");
    if (a) a.addEventListener("change", function () { omni.touched.accountId = a.value; });
    var d = document.getElementById("omni_date");
    if (d) d.addEventListener("change", function () { omni.touched.date = d.value; });
  }

  var omniTimer = null;
  function wireOmni() {
    var box = document.getElementById("omniBox");
    if (!box) return;
    box.addEventListener("input", function () {
      omni.text = box.value;
      clearTimeout(omniTimer);
      omniTimer = setTimeout(refreshOmni, 120);
    });
    box.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); clearTimeout(omniTimer); omni.text = box.value; commitOmni(); }
    });
    wireOmniPreview();
  }

  function commitOmni() {
    var p = parseEntry(omni.text);
    if (!p || !p.ok) { toast(p && p.reason ? p.reason : "Type an amount and what it was for."); return; }
    var cats = state.categories[p.type === "income" ? "income" : "expense"];
    var cat = omni.touched.category && cats.indexOf(omni.touched.category) >= 0 ? omni.touched.category : p.category;
    var tx = {
      id: uid(),
      date: omni.touched.date || p.date,
      desc: p.desc,
      type: p.type,
      category: cat,
      accountId: omni.touched.accountId || p.accountId,
      amount: p.amount
    };
    if (!tx.accountId) { toast("Add an account first."); return; }
    state.transactions.push(tx);
    omni = { text: "", touched: {} };
    save();
    render();
    var box = document.getElementById("omniBox");
    if (box) box.focus();
    toast(esc0(tx.desc) + " · " + fmt(tx.amount) + " logged to " + accountName(tx.accountId) + ".", function () {
      state.transactions = state.transactions.filter(function (t) { return t.id !== tx.id; });
    });
  }

  // toast() escapes for us; this just trims very long descriptions
  function esc0(s) { return String(s).length > 40 ? String(s).slice(0, 38) + "…" : String(s); }

  /* ============================================================
     Actions — every button routes through here by data-act.
     Nothing depends on form submission or native dialogs.
     ============================================================ */

  function accountOptions() {
    return state.accounts.map(function (a) { return { value: a.id, label: a.name }; });
  }
  function catOptions(kind) {
    return state.categories[kind === "income" ? "income" : "expense"].slice();
  }

  function needAccount() {
    if (state.accounts.length) return false;
    toast("Add an account first.");
    return true;
  }

  var ACTIONS = {

    /* ---- navigation ---- */
    "go-insights": function () { view = "insights"; render(); },
    "month-prev": function () { viewMonth = monthShift(viewMonth, -1); render(); },
    "month-next": function () { if (viewMonth < thisMonth()) { viewMonth = monthShift(viewMonth, 1); render(); } },
    "month-today": function () { viewMonth = thisMonth(); render(); },

    /* ---- accounts ---- */
    "account-add": function () {
      openModal({
        title: "Add an account",
        message: "The opening balance is what this account held before any transaction you log here.",
        fields: [
          { key: "name", label: "Name", placeholder: "e.g. Everyday current", span: true },
          { key: "type", label: "Type", type: "select", options: ACCOUNT_TYPES, value: "Checking" },
          { key: "opening", label: "Opening balance", type: "number", value: 0 }
        ],
        confirmLabel: "Add account",
        validate: function (v) { if (!v.name.trim()) return "Give the account a name."; },
        onConfirm: function (v) {
          state.accounts.push({ id: uid(), name: v.name.trim(), type: v.type, opening: v.opening });
          save(); render();
          toast(v.name.trim() + " added.");
        }
      });
    },

    "account-edit": function (id) {
      var a = accountById(id);
      if (!a) return;
      openModal({
        title: "Edit account",
        message: "Current balance is " + fmt(balanceOf(a)) + ", derived from the opening figure plus every transaction.",
        fields: [
          { key: "name", label: "Name", value: a.name, span: true },
          { key: "type", label: "Type", type: "select", options: ACCOUNT_TYPES, value: a.type },
          { key: "opening", label: "Opening balance", type: "number", value: a.opening }
        ],
        validate: function (v) { if (!v.name.trim()) return "Give the account a name."; },
        onConfirm: function (v) {
          a.name = v.name.trim(); a.type = v.type; a.opening = v.opening;
          save(); render(); toast("Account updated.");
        }
      });
    },

    "account-del": function (id) {
      var a = accountById(id);
      if (!a) return;
      var linked = state.transactions.filter(function (t) {
        return t.accountId === id || t.toAccountId === id;
      });
      var linkedRecur = state.recurring.filter(function (r) { return r.accountId === id; });

      var msg = linked.length || linkedRecur.length
        ? "This will also remove <b>" + linked.length + (linked.length === 1 ? " transaction" : " transactions") + "</b>" +
          (linkedRecur.length ? " and <b>" + linkedRecur.length + " recurring " + (linkedRecur.length === 1 ? "item" : "items") + "</b>" : "") +
          " attached to it. You can undo this straight afterwards."
        : "Nothing is attached to this account.";

      confirmAction({
        title: "Delete " + a.name + "?",
        message: msg,
        confirmLabel: "Delete account"
      }, function () {
        var snapAcc = state.accounts.slice();
        var snapTx = state.transactions.slice();
        var snapRec = state.recurring.slice();
        state.accounts = state.accounts.filter(function (x) { return x.id !== id; });
        state.transactions = state.transactions.filter(function (t) { return t.accountId !== id && t.toAccountId !== id; });
        state.recurring = state.recurring.filter(function (r) { return r.accountId !== id; });
        if (filters.account === id) filters.account = "all";
        save(); render();
        toast(a.name + " deleted.", function () {
          state.accounts = snapAcc; state.transactions = snapTx; state.recurring = snapRec;
        });
      });
    },

    /* ---- transactions ---- */
    "tx-add": function () {
      if (needAccount()) return;
      var kind = "expense";
      function fieldsFor(k) {
        return [
          { key: "type", label: "Type", type: "select", options: ["expense", "income"], value: k },
          { key: "date", label: "Date", type: "date", value: today() },
          { key: "desc", label: "Description", placeholder: "e.g. Weekly shop", span: true },
          { key: "category", label: "Category", type: "select", options: catOptions(k) },
          { key: "account", label: "Account", type: "select", options: accountOptions() },
          { key: "amount", label: "Amount", type: "number", min: 0 }
        ];
      }
      function open(k) {
        openModal({
          title: "Add transaction",
          fields: fieldsFor(k),
          confirmLabel: "Add",
          validate: function (v) {
            if (v.amount <= 0) return "Enter an amount above zero.";
            // switching type needs the matching category list
            if (v.type !== k) { reopen(v.type); return " "; }
          },
          onConfirm: function (v) {
            state.transactions.push({
              id: uid(), date: v.date || today(), desc: v.desc.trim(),
              type: v.type, category: v.category, accountId: v.account, amount: v.amount
            });
            save(); render(); toast("Transaction added.");
          }
        });
        // reflect a type change immediately by reopening with the right categories
        var sel = document.getElementById("mf_type");
        if (sel) sel.addEventListener("change", function () { reopen(sel.value); });
      }
      function reopen(k) {
        var keep = {};
        ["date", "desc", "amount", "account"].forEach(function (key) {
          var el = document.getElementById("mf_" + key);
          if (el) keep[key] = el.value;
        });
        closeModal();
        open(k);
        Object.keys(keep).forEach(function (key) {
          var el = document.getElementById("mf_" + key);
          if (el && keep[key]) el.value = keep[key];
        });
      }
      open(kind);
    },

    "tx-edit": function (id) {
      var t = null;
      for (var i = 0; i < state.transactions.length; i++) if (state.transactions[i].id === id) t = state.transactions[i];
      if (!t) return;

      if (t.type === "transfer") {
        openModal({
          title: "Edit transfer",
          fields: [
            { key: "date", label: "Date", type: "date", value: t.date },
            { key: "amount", label: "Amount", type: "number", value: t.amount, min: 0 },
            { key: "from", label: "From", type: "select", options: accountOptions(), value: t.accountId },
            { key: "to", label: "To", type: "select", options: accountOptions(), value: t.toAccountId },
            { key: "desc", label: "Note", value: t.desc, span: true }
          ],
          validate: function (v) {
            if (v.amount <= 0) return "Enter an amount above zero.";
            if (v.from === v.to) return "Pick two different accounts.";
          },
          onConfirm: function (v) {
            t.date = v.date; t.amount = v.amount; t.accountId = v.from; t.toAccountId = v.to; t.desc = v.desc.trim();
            save(); render(); toast("Transfer updated.");
          }
        });
        return;
      }

      openModal({
        title: "Edit transaction",
        fields: [
          { key: "type", label: "Type", type: "select", options: ["expense", "income"], value: t.type },
          { key: "date", label: "Date", type: "date", value: t.date },
          { key: "desc", label: "Description", value: t.desc, span: true },
          { key: "category", label: "Category", type: "select", options: catOptions(t.type).concat(
              catOptions(t.type).indexOf(t.category) === -1 ? [t.category] : []), value: t.category },
          { key: "account", label: "Account", type: "select", options: accountOptions(), value: t.accountId },
          { key: "amount", label: "Amount", type: "number", value: t.amount, min: 0 }
        ],
        validate: function (v) { if (v.amount <= 0) return "Enter an amount above zero."; },
        onConfirm: function (v) {
          t.type = v.type; t.date = v.date || t.date; t.desc = v.desc.trim();
          t.category = v.category; t.accountId = v.account; t.amount = v.amount;
          save(); render(); toast("Transaction updated.");
        }
      });
    },

    "tx-del": function (id) {
      var idx = -1;
      for (var i = 0; i < state.transactions.length; i++) if (state.transactions[i].id === id) idx = i;
      if (idx < 0) return;
      var removed = state.transactions[idx];
      state.transactions.splice(idx, 1);
      save(); render();
      toast("Deleted " + (removed.desc || removed.category || "transaction") + ".", function () {
        state.transactions.splice(idx, 0, removed);
      });

      if (!r) return;
      var tx = {
        id: uid(), date: r.nextDate, desc: r.name, type: r.type,
        category: r.category, accountId: r.accountId, amount: num(r.amount)
      };
      var prevDate = r.nextDate;

        confirmLabel: "Take out",
        validate: function (v) {

    "debt-pay": function (id) {
      var d = state.debts.filter(function (x) { return x.id === id; })[0];
      if (!d) return;
      var opts = accountOptions();
      openModal({
        title: "Log a payment to " + d.name,
        message: "Reduces the balance by the amount you paid. Pick an account to also record it in your ledger.",
        fields: [
          { key: "amount", label: "Amount paid", type: "number", value: num(d.minPayment) || "", min: 0 },
          { key: "date", label: "Date", type: "date", value: today() },
          { key: "account", label: "Paid from", type: "select",
            options: [{ value: "", label: "— don't log a transaction —" }].concat(opts), value: opts.length ? opts[0].value : "" }
        ],
        confirmLabel: "Log payment",
        validate: function (v) { if (v.amount <= 0) return "Enter an amount above zero."; },
        onConfirm: function (v) {
          var before = num(d.balance);
          d.balance = Math.max(before - v.amount, 0);
          var tx = null;
          if (v.account) {
            tx = {
              id: uid(), date: v.date || today(), desc: d.name + " payment", type: "expense",
              category: state.categories.expense.indexOf("Other") >= 0 ? "Other" : state.categories.expense[0],
              accountId: v.account, amount: v.amount
            };
            state.transactions.push(tx);
          }
          save(); render();
          toast(fmt(v.amount) + " paid — " + d.name + " now " + fmt(d.balance) + ".", function () {
            d.balance = before;
            if (tx) state.transactions = state.transactions.filter(function (t) { return t.id !== tx.id; });
          });
        }
      });
    },

      var kind = el.getAttribute("data-kind");
      var cat = el.getAttribute("data-cat");
      if (state.categories[kind].length <= 1) { toast("Keep at least one category."); return; }
      var used = state.transactions.filter(function (t) { return t.category === cat; }).length;
      var idx = state.categories[kind].indexOf(cat);
      var hadBudget = state.budgets[cat];
      state.categories[kind].splice(idx, 1);
      delete state.budgets[cat];
      save(); render();
      toast(cat + " removed" + (used ? " — " + used + " past " + (used === 1 ? "transaction keeps" : "transactions keep") + " the name." : "."),

          state.categories[kind].splice(idx, 0, cat);
          if (hadBudget != null) state.budgets[cat] = hadBudget;
        });

    "export-json": function () {
      download("coffer-backup-" + today() + ".json", JSON.stringify(state, null, 2), "application/json");
      toast("Backup downloaded.");
    },

    "export-csv": function () {
      var rows = [["Date", "Description", "Type", "Category", "Account", "To account", "Amount"]];
      filteredTx().forEach(function (t) {
        rows.push([t.date, t.desc, t.type, t.category, accountName(t.accountId),
          t.toAccountId ? accountName(t.toAccountId) : "", num(t.amount).toFixed(2)]);
      });
      var csv = rows.map(function (r) {
        return r.map(function (c) {
          var s = String(c == null ? "" : c).replace(/"/g, '""');
          return /[",\n]/.test(s) ? '"' + s + '"' : s;
        }).join(",");
      }).join("\n");
      download("coffer-transactions-" + today() + ".csv", csv, "text/csv");
      toast(rows.length - 1 + " transactions exported.");
    },

    "import-json": function () {
      var inp = document.createElement("input");
      inp.type = "file";
      inp.accept = "application/json,.json";
      inp.addEventListener("change", function () {
        var file = inp.files && inp.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          var parsed;
          try { parsed = JSON.parse(reader.result); }
          catch (e) { toast("That file isn't valid JSON."); return; }
          if (!parsed || typeof parsed !== "object" || (!parsed.accounts && !parsed.transactions)) {
            toast("That doesn't look like a Coffer backup.");
            return;
          }
          var counts = (parsed.accounts || []).length + " accounts, " + (parsed.transactions || []).length + " transactions";
          confirmAction({
            title: "Replace everything with this backup?",
            message: "The file holds <b>" + counts + "</b>. Everything currently in this browser will be replaced. This can't be undone.",
            confirmLabel: "Replace my data"
          }, function () {
            var incoming = parsed.version === 2 || parsed.categories ? parsed : migrateV1(parsed);
            var fresh = blank();
            if (incoming.settings) {
              fresh.settings.currency = incoming.settings.currency || "$";
              fresh.settings.lock = incoming.settings.lock || null;
            }
            if (incoming.categories) {
              if (Array.isArray(incoming.categories.expense) && incoming.categories.expense.length) fresh.categories.expense = incoming.categories.expense;
              if (Array.isArray(incoming.categories.income) && incoming.categories.income.length) fresh.categories.income = incoming.categories.income;
            }
            ["accounts", "transactions", "goals", "debts", "recurring", "quick"].forEach(function (k) {
              if (Array.isArray(incoming[k])) fresh[k] = incoming[k];
            });
            if (incoming.budgets && typeof incoming.budgets === "object") fresh.budgets = incoming.budgets;
            fresh.extraDebtPayment = num(incoming.extraDebtPayment);
            state = fresh;
            viewMonth = thisMonth();
            save(); render();
            toast("Backup restored.");
          });
        };
        reader.readAsText(file);
      });
      inp.click();
    },

    "wipe": function () {

  function download(name, content, mime) {
    try {
      var blob = new Blob([content], { type: mime });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = name;
      a.rel = "noopener";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    } catch (e) {
      toast("This browser blocked the download. Try opening the file directly rather than in a preview frame.");
    }
  }

  /* ---------------- screen lock (obfuscation, not encryption) ---------------- */

  function hashPin(pin, salt) {
    // A deliberately simple iterated hash. This is a convenience lock; it is
    // NOT cryptography and the UI says so plainly.
    var h = 2166136261;
    var input = salt + "|" + pin;
    for (var round = 0; round < 5000; round++) {
      for (var i = 0; i < input.length; i++) {
        h ^= input.charCodeAt(i);
        h = (h * 16777619) >>> 0;
      }
      h = (h ^ round) >>> 0;
    }
    return h.toString(16);
  }
  function makeLock(pin) {
    var salt = uid() + uid();
    return { salt: salt, hash: hashPin(pin, salt) };
  }
  function checkLock(pin) {
    var l = state.settings.lock;
    return !!l && hashPin(pin, l.salt) === l.hash;
  }

  function showLockScreen(onPass) {
    var el = document.createElement("div");
    el.className = "lockscreen";
    el.innerHTML = '<div class="lockbox">' +
      '<div class="brand-mark">C</div>' +
      "<h2>Coffer is locked</h2>" +
      "<p>Enter your PIN to see your figures.</p>" +
      '<input id="lock_pin" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN" />' +
      '<div class="lock-err" id="lock_err" role="alert"></div>' +
      '<button class="btn primary" id="lock_go" style="width:100%;margin-top:0.5rem">Unlock</button>' +
      "</div>";
    document.body.appendChild(el);
    var inp = el.querySelector("#lock_pin");
    var err = el.querySelector("#lock_err");
    function attempt() {
      if (checkLock(inp.value)) {
        document.body.removeChild(el);
        onPass();
      } else {
        err.textContent = "That PIN is not right.";
        inp.value = "";
        inp.focus();
      }
    }
    el.querySelector("#lock_go").addEventListener("click", attempt);
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") attempt(); });
    inp.focus();
  }

      { id: uid(), name: "Salary", type: "income", category: "Salary", accountId: current.id, amount: 3450, frequency: "monthly", nextDate: nextRecur(25) },

  // next occurrence of a day-of-month, from today forward
  function nextRecur(day) {
    var mk = thisMonth();
    if (new Date().getDate() > day) mk = monthShift(mk, 1);
    return mk + "-" + String(Math.min(day, daysInMonth(mk))).padStart(2, "0");
  }

  /* ============================================================
     Render + wiring
     ============================================================ */

  var viewEl = document.getElementById("view");

  function renderNav() {
    document.getElementById("nav").innerHTML = TABS.map(function (t) {
      return '<button class="tab" data-tab="' + t.id + '"' + (t.id === view ? ' aria-current="page"' : "") + ">" +
        '<span class="ico">' + t.ico + "</span><span>" + t.label + "</span></button>";
    }).join("");
  }

  function render() {
    resetMemo();
    renderNav();
    var html;
    if (view === "overview") html = renderOverview();
    else if (view === "ledger") html = renderLedger();
    else if (view === "budgets") html = renderBudgets();
    else if (view === "goals") html = renderGoals();
    else if (view === "debts") html = renderDebts();
    else if (view === "insights") html = renderInsights();
    else html = renderSettings();
    viewEl.innerHTML = html;
    wireInputs();
    wireOmni();
    wireHovers();
  }

  var searchTimer = null;

  // Filters and the currency picker update state as you type/change.
  function wireInputs() {
    function bindChange(id, apply) {
      var el = document.getElementById(id);
      if (!el) return;
      el.addEventListener("change", function () {
        apply(el.value);
        ledgerLimit = LEDGER_PAGE;
        render();
      });
    }

    var search = document.getElementById("f_text");
    if (search) {
      // Debounced, and it refreshes only the rows — so typing stays smooth and
      // the caret never jumps, however long the ledger is.
      search.addEventListener("input", function () {
        filters.text = search.value;
        ledgerLimit = LEDGER_PAGE;
        clearTimeout(searchTimer);
        searchTimer = setTimeout(refreshLedgerTable, 130);
      });
    }

    bindChange("f_type", function (v) { filters.type = v; });
    bindChange("f_cat", function (v) { filters.category = v; });
    bindChange("f_acc", function (v) { filters.account = v; });
    bindChange("f_from", function (v) { filters.from = v; });
    bindChange("f_to", function (v) { filters.to = v; });

    var cur = document.getElementById("cur_sel");
    if (cur) cur.addEventListener("change", function () {
      state.settings.currency = cur.value;
      save();
      render();
    });
  }

  // Swap in just the rows and the summary line.
  function refreshLedgerTable() {
    var host = document.getElementById("txTable");
    if (view !== "ledger" || !host) { render(); return; }
    resetMemo();
    host.innerHTML = ledgerTableHtml();
    var sum = document.getElementById("txSummary");
    if (sum) sum.textContent = ledgerSummaryHtml(filteredTx());
    wireHovers();
  }

  function wireHovers() {
    viewEl.querySelectorAll("[data-tip]").forEach(function (el) {
      el.addEventListener("mousemove", function (e) { showTip(el.getAttribute("data-tip"), e.clientX, e.clientY); });
      el.addEventListener("mouseleave", hideTip);
    });
  }

  document.addEventListener("click", function (e) {
    var tab = e.target.closest("[data-tab]");
    if (tab) {
      view = tab.getAttribute("data-tab");
      ledgerLimit = LEDGER_PAGE;
      omni = { text: "", touched: {} };
      hideTip();
      render();
      window.scrollTo({ top: 0, behavior: "auto" });
      return;
    }
    var act = e.target.closest("[data-act]");
    if (!act) return;
    var name = act.getAttribute("data-act");
    if (ACTIONS[name]) {
      hideTip();
      ACTIONS[name](act.getAttribute("data-id"), act);
    }
  });

  function boot() {
    render();
    // roll any overdue recurring reminder into view rather than silently passing
    var overdue = state.recurring.filter(function (r) { return daysUntil(r.nextDate) < 0; });
    if (overdue.length) {
      toast(overdue.length === 1
        ? overdue[0].name + " is overdue — log it from Budgets."
        : overdue.length + " recurring items are overdue.");
    }
  }

  if (state.settings.lock) showLockScreen(boot);
  else boot();
})();
</script>
