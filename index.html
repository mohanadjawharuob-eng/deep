<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Deep AR Brochure</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
      .instructions {
        position: fixed; bottom: 30px; left: 0; width: 100%;
        text-align: center; color: white; background: rgba(0,0,0,0.7);
        padding: 15px; z-index: 100; font-size: 18px;
      }
    </style>
  </head>
  <body>
    <div class="instructions" id="instructions">
      🔍 Point your camera at the brochure
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">
      <a-assets>
        <video id="brochure-video" src="ethno-3.mp4" preload="auto" loop muted playsinline></video>
      </a-assets>
      <a-camera static></a-camera>
      <a-nft type="nft" url="pattern-223.patt" smooth="true">
        <a-plane rotation="-90 0 0" width="1.33" height="1" material="shader: flat; src: #brochure-video;"></a-plane>
      </a-nft>
    </a-scene>

    <script>
      const video = document.getElementById('brochure-video');
      document.querySelector('a-scene').addEventListener('nftmarkerfound', () => {
        video.play();
        document.getElementById('instructions').innerHTML = '✅ Video playing!';
      });
      document.querySelector('a-scene').addEventListener('nftmarkerlost', () => {
        video.pause();
        document.getElementById('instructions').innerHTML = '🔍 Point at brochure again';
      });
    </script>
  </body>
</html>
