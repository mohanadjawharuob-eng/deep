<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Brochure – Debug</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #status {
      position: fixed; top: 20px; left: 20px; right: 20px;
      background: rgba(0,0,0,0.8); color: white; padding: 15px;
      border-radius: 10px; z-index: 1000; font-family: monospace;
      white-space: pre-wrap; word-break: break-word;
    }
  </style>
</head>
<body>
  <div id="status">Initializing...</div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: false;"
    arjs-log="console"
  >
    <a-assets>
      <!-- Public test video (replace with your own later) -->
      <video id="brochure-video"
             src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
             preload="auto"
             loop
             muted
             playsinline
             crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera static></a-camera>

    <!-- Use your marker file – make sure the path is correct -->
    <a-nft type="nft" url="brochure.patt" smooth="true">
      <a-plane
        rotation="-90 0 0"
        width="1.33"
        height="1"
        position="0 0 0"
        material="shader: flat; src: #brochure-video; opacity: 0;"
        scale="0 0 0"
        animation__slide="property: scale; to: 1 1 1; dur: 500; easing: easeOutElastic; startEvents: markerFound"
        animation__fade="property: material.opacity; to: 1; dur: 300; startEvents: markerFound">
      </a-plane>
    </a-nft>
  </a-scene>

  <script>
    const statusDiv = document.getElementById('status');
    
    // Show messages
    window.onerror = function(msg, url, line) {
      statusDiv.innerHTML += `\n❌ ERROR: ${msg} at line ${line}`;
    };

    // Log AR events
    document.querySelector('a-scene').addEventListener('nftmarkerfound', () => {
      statusDiv.innerHTML = '✅ Marker found! Video should play.';
      document.getElementById('brochure-video').play().catch(e => {
        statusDiv.innerHTML += `\n⚠️ Video play error: ${e.message}`;
      });
    });

    document.querySelector('a-scene').addEventListener('nftmarkerlost', () => {
      statusDiv.innerHTML = '🔍 Marker lost';
    });

    document.querySelector('a-scene').addEventListener('camera-error', (e) => {
      statusDiv.innerHTML = `❌ Camera error: ${e.detail.error}`;
    });

    // Check if camera access is granted
    navigator.mediaDevices.getUserMedia({ video: true })
      .then(() => statusDiv.innerHTML = '📷 Camera access granted. Looking for marker...')
      .catch(err => statusDiv.innerHTML = `❌ Camera permission denied: ${err.message}`);
  </script>
</body>
</html>
