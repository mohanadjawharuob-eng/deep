<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Brochure – Ready to Use</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    .instructions {
      position: fixed; bottom: 30px; left: 0; width: 100%;
      text-align: center; color: white; background: rgba(0,0,0,0.7);
      padding: 15px; z-index: 100; font-size: 18px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="instructions" id="instructions">
    🔍 Point your camera at the <strong>HIRO marker</strong>
  </div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
    vr-mode-ui="enabled: false"
  >
    <a-assets>
      <!-- Sample video from a reliable CDN (Big Buck Bunny) -->
      <video id="sample-video"
             src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
             preload="auto"
             loop
             muted
             playsinline
             crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera static></a-camera>

    <!-- Hiro marker – no .patt file needed! -->
    <a-marker type="hiro" preset="hiro">
      <!-- Video plane that appears on the marker -->
      <a-plane
        rotation="-90 0 0"
        width="1.6"
        height="0.9"
        position="0 0 0"
        material="shader: flat; src: #sample-video; transparent: true;"
      ></a-plane>
    </a-marker>
  </a-scene>

  <script>
    const video = document.getElementById('sample-video');
    const instructions = document.getElementById('instructions');

    document.querySelector('a-scene').addEventListener('markerFound', () => {
      video.play().catch(e => console.log('Autoplay failed:', e));
      instructions.innerHTML = '✅ Video playing!';
      instructions.style.background = 'rgba(0,100,0,0.7)';
    });

    document.querySelector('a-scene').addEventListener('markerLost', () => {
      video.pause();
      instructions.innerHTML = '🔍 Hiro marker lost – point again';
      instructions.style.background = 'rgba(0,0,0,0.7)';
    });

    // Fallback for autoplay restrictions
    document.body.addEventListener('click', () => {
      if (video.paused) video.play().catch(e => console.log(e));
    });
  </script>
</body>
</html>
