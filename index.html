<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Brochure – Hiro Test</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    .instructions {
      position: fixed; bottom: 30px; left: 0; width: 100%;
      text-align: center; color: white; background: rgba(0,0,0,0.7);
      padding: 15px; z-index: 100; font-size: 18px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="instructions" id="instructions">
    🔍 Point at the HIRO marker
  </div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
    vr-mode-ui="enabled: false"
  >
    <a-assets>
      <!-- YOUR VIDEO: Make sure the file name matches exactly -->
      <video id="brochure-video"
             src="ethno-3.mp4"
             preload="auto"
             loop
             muted
             playsinline
             crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera static></a-camera>

    <!-- HIRO marker – no .patt file needed -->
    <a-marker type="hiro" preset="hiro">
      <!-- Video plane with slide & fade animations -->
      <a-plane
        rotation="-90 0 0"
        width="1.6"
        height="0.9"
        position="0 0 0"
        material="shader: flat; src: #brochure-video; opacity: 0;"
        scale="0 0 0"
        animation__slide="property: scale; to: 1 1 1; dur: 500; easing: easeOutElastic; startEvents: markerFound"
        animation__fade="property: material.opacity; to: 1; dur: 300; startEvents: markerFound"
      ></a-plane>
    </a-marker>
  </a-scene>

  <script>
    const video = document.getElementById('brochure-video');
    const instructions = document.getElementById('instructions');

    document.querySelector('a-scene').addEventListener('markerFound', () => {
      video.play().catch(e => {
        instructions.innerHTML = '⚠️ Video play error: ' + e.message;
        console.error(e);
      });
      instructions.innerHTML = '✅ Video sliding in!';
      instructions.style.background = 'rgba(0,100,0,0.7)';
    });

    document.querySelector('a-scene').addEventListener('markerLost', () => {
      video.pause();
      instructions.innerHTML = '🔍 Hiro marker lost – point again';
      instructions.style.background = 'rgba(0,0,0,0.7)';
    });

    // Fallback for autoplay restrictions (tap screen)
    document.body.addEventListener('click', () => {
      if (video.paused) video.play().catch(e => console.log(e));
    });
  </script>
</body>
</html>
