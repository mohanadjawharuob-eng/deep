[project]
name = "archeo-backend"
version = "0.1.0"
description = "Backend API for the Archaeological Research & Heritage Management Platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:app.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
]
ignore = [
    "B008",  # FastAPI's Depends() in defaults is the documented idiom
    "E501",  # long lines are caught by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Settings fields are UPPER_CASE because they mirror environment variable
# names. Ruff reads an upper-case attribute as a constant, so it flags every
# `settings.FIELD == expected` as a Yoda condition, which it is not.
"tests/test_config.py" = ["S101", "SIM300"]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*"]
